本：V1.0  \n状态：造型定版 / 可进入资产生产  \n适用范围：角色造型设计、AI资产生成、三视图、表情资产、动作资产、状态变化、镜头连续性管理  \n角色：邹青  \n项目时间设定：2026年当代  \n\n---\n\n## 1. 文档目的\n本造型圣经用于统一邹青在《失控游戏》中的人物身份、外形、服装、配色、材质、装备、造型变化和资产生产标准。\n\n本文件解决以下问题：\n\n1. 防止AI生成过程中人物换脸、换身材、换年龄；\n2. 防止绿色造型被误生成成工作人员、志愿者、安保、户外领队或战术人员；\n3. 防止基础造型在不同镜头中被随意修改；\n4. 保证一套基础造型能够随着同一场冒险自然形成多个状态；\n5. 为Flow中的角色锚点、三视图、表情、动作和战损资产提供统一依据；\n6. 为导演、造型、美术、摄影、AI制作和资产管理人员提供同一套执行标准。\n\n核心原则：\n\n> 先锁定唯一基础造型，再生产资产；先保证人物一致性，再增加动作、场景和状态变化。\n\n---\n\n## 2. 项目造型总原则\n\n### 2.1 人物属于2026年\n邹青是2026年的当代中国青年。\n\n千禧、90年代、早期互联网、梦核和阈限空间审美属于星星岛及游戏关卡环境，不属于角色的日常穿着。\n\n角色不能直接穿成千禧年代复古人物，也不能像从旧时代场景中走出来的人。\n\n正确关系是：\n\n> 2026年的年轻人，误入一个被千禧记忆污染的异常空间。\n\n### 2.2 一套基础造型，而不是连续换装\n本剧是一场连续冒险。\n\n邹青只有一套正式基础造型。\n\n后续视觉变化来自：\n\n- 外套开合；\n- 袖子上推；\n- 外套脱下；\n- 外套手持；\n- 外套系腰；\n- 护腕被挪作包扎；\n- 汗、灰尘、水痕和擦损；\n- 道具使用状态；\n- 人物体力和心理状态。\n\n不是通过突然换衣服产生新造型。\n\n### 2.3 造型变化必须来自剧情\n服装需要进入剧情，而不是只负责好看。\n\n邹青身上的每个主要元素都应具有叙事功能：\n\n- 夹克：穿着、脱下、系腰、保护、包裹、临时救援；\n- GoPro：记录挑战，后来被迫记录危险；\n- 护腕：训练习惯，也可用于简单包扎；\n- 摇摇杯：建立职业和生活感，可在冒险中丢失、磕碰或被暂时放弃；\n- 运动短裤：强化行动轮廓，并与其他男性角色迅速区分。\n\n### 2.4 角色识别优先于潮流\n造型要有电影人物辨识度，但不能成为潮牌目录、健身广告或时装大片。\n\n角色必须像一个真实存在的年轻人，同时比普通路人具有更明确的视觉轮廓。\n\n---\n\n## 3. 角色核心\n\n### 3.1 基本资料\n姓名：邹青  \n年龄：22岁  \n职业：跆拳道教练、健身内容创作者  \n团队功能：行动担当  \n性格：阳光、热心、直接、冲动、自信过头、略显天然呆  \n行为逻辑：身体常常先于判断  \n\n典型潜台词：\n\n- “我来。”\n- “问题不大。”\n- “我这是在测试。”\n- “先试一下再说。”\n\n### 3.2 核心欲望\n他渴望证明自己是有用的。\n\n他相信体能、勇气和行动可以解决大多数问题。\n\n他的喜剧性并不来自抖机灵，而来自：\n\n- 过度认真；\n- 过度自信；\n- 准备方向偶尔错误；\n- 明明害怕却坚持维持“我能处理”的形象。\n\n### 3.3 核心恐惧\n害怕自己没有用。\n\n害怕在真正危险中只能旁观。\n\n因此，他会本能地站到最前面。\n\n### 3.4 人物弧线与造型关系\n冒险开始：\n\n> “我要拍到好内容，也能证明我厉害。”\n\n冒险中段：\n\n> “我得真的顶上。”\n\n冒险后段：\n\n> “我身上的东西可以拿去救人。”\n\n造型变化需要同步这一过程：\n\n完整、干净、准备拍摄 → 外套敞开、进入行动 → 脱下外套、只剩无袖 → 汗湿、受损、包扎 → 疲惫但仍然保护同伴。\n\n---\n\n## 4. 身份锚点\n\n### 4.1 面部\n面部必须严格使用已经确认的邹青面部参考。\n\n固定特征：\n\n- 中国年轻男性；\n- 短寸头；\n- 方圆结合的脸型；\n- 眼神平直、略有倔强；\n- 真实皮肤质感；\n- 眉骨附近保留轻微伤痕或生活痕迹；\n- 不做偶像化磨皮；\n- 不做韩式精致发型；\n- 不做成熟硬汉老化；\n- 不改变五官比例。\n\n### 4.2 身体\n身体必须严格使用已确认的全身身体锚点。\n\n固定特征：\n\n- 宽肩；\n- 胸背厚实；\n- 手臂和腿部肌肉明显；\n- 运动型体格；\n- 肌肉真实，不是职业健美舞台体；\n- 下肢力量感明确；\n- 身材不瘦削，不臃肿，不夸张增肌；\n- 身高、腿长、肩宽和腰围在全部资产中保持一致。\n\n### 4.3 年龄感\n固定为22岁。\n\n不能生成成：\n\n- 28岁以上成熟教练；\n- 十几岁高中生；\n- 偶像练习生；\n- 职业格斗运动员；\n- 户外生存专家。\n\n---\n\n## 5. 最终定版基础造型\n\n### 5.1 总体定义\n邹青的唯一基础造型为：\n\n> 鲜绿色硬挺立领训练夹克 + 纯黑无袖训练内搭 + 卡其色五分训练短裤 + 白色中筒运动袜 + 黑白复古训练鞋 + 黑色GoPro胸挂 + 右手白色运动护腕。\n\n辅助道具：\n\n> 半透明磨砂摇摇杯，绿色杯盖。\n\n### 5.2 造型气质\n整体气质应是：\n\n- 2026年中国年轻运动男性；\n- 跆拳道教练；\n- 健身内容创作者；\n- 准备拍摄挑战视频；\n- 自认为可以成为冒险片主角；\n- 真实、年轻、直接；\n- 略带冒险喜剧夸张；\n- 不是工作人员；\n- 不是安保；\n- 不是户外领队；\n- 不是战术人员。\n\n一句话定义：\n\n> 一个穿着鲜绿训练夹克、挂着GoPro、随时准备先冲上去的年轻跆拳道教练。\n\n---\n\n## 6. 单品规格\n\n### 6.1 鲜绿色立领训练夹克\n款式：\n\n- 现代运动训练夹克；\n- 短款；\n- 完整长袖；\n- 硬挺立领；\n- 前中拉链；\n- 标准穿着状态为完全敞开；\n- 衣长至胯骨附近；\n- 肩部有适度结构；\n- 不连帽；\n- 不做马甲；\n- 不做大口袋。\n\n材质：\n\n- 哑光高密度运动梭织面料；\n- 比普通薄风衣更硬挺；\n- 有真实布料折痕，但不能软塌；\n- 不使用反光塑料质感；\n- 不像雨衣；\n- 不像冲锋衣。\n\n颜色：\n\n- 鲜明运动绿；\n- 偏年轻、外放、干净；\n- 不是安全荧光绿；\n- 不是军绿；\n- 不是灰绿；\n- 不是墨绿；\n- 不是工作人员制服绿。\n\n结构要求：\n\n- 立领必须清楚；\n- 夹克轮廓利落；\n- 袖口可自然推至前臂；\n- 可完整脱下；\n- 可自然系在腰间；\n- 可在剧情中充当临时保护布。\n\n禁止：\n\n- 反光条；\n- 大面积品牌Logo；\n- 工作证；\n- 工具袋；\n- 多口袋；\n- 战术结构；\n- 户外硬壳结构；\n- 志愿者马甲结构。\n\n### 6.2 纯黑无袖训练内搭\n款式：\n\n- 纯黑无袖运动训练上衣；\n- 宽肩带；\n- 领口自然；\n- 不低胸；\n- 不紧绷到像健美比赛服；\n- 不带明显图案；\n- 不带大Logo；\n- 不使用灰黑、炭灰或拼色。\n\n材质：\n\n- 轻薄、透气、真实训练面料；\n- 可出现自然汗湿；\n- 能独立成为脱下外套后的第二造型。\n\n功能：\n\n- 强化肩背和手臂轮廓；\n- 表现身体先于判断的性格；\n- 支撑后续行动、受损和终局状态。\n\n### 6.3 卡其色五分训练短裤\n款式：\n\n- 五分运动训练短裤；\n- 长度接近膝上约8至12厘米；\n- 比超短跑步裤更长；\n- 比篮球裤更利落；\n- 裤腿略宽松；\n- 有真实运动剪裁；\n- 不能过于贴身；\n- 不能像工装短裤。\n\n颜色：\n\n- 中浅卡其色；\n- 温和、自然；\n- 不偏军绿；\n- 不偏土黄；\n- 不偏深棕。\n\n材质：\n\n- 哑光弹力运动梭织；\n- 轻量；\n- 可运动；\n- 有自然褶皱；\n- 不做厚重工装材质。\n\n作用：\n\n- 与其他男性角色的长裤轮廓明显区分；\n- 强化腿部力量和行动性；\n- 让绿色上衣不会显得像完整制服；\n- 平衡绿色、黑色和卡其色的整体层次。\n\n### 6.4 白色中筒运动袜\n规格：\n\n- 白色；\n- 中筒；\n- 高度位于小腿下部；\n- 不要过高到足球袜；\n- 不要过低到船袜；\n- 可有极小的黑色运动细节；\n- 不使用大面积Logo。\n\n### 6.5 黑白复古训练鞋\n款式：\n\n- 黑白复古训练鞋；\n- 低帮；\n- 稍厚鞋底；\n- 具有90年代训练鞋的结构感，但仍是2026年可穿的现代复古款；\n- 鞋型利落，不是专业越野鞋；\n- 不是篮球高帮鞋；\n- 不是纯跑鞋。\n\n配色：\n\n- 黑白为主；\n- 不加入大面积绿色；\n- 可有少量灰色。\n\n作用：\n\n- 强化整体黑白基础；\n- 与鲜绿外套产生清晰对比；\n- 保持年轻、生活化和电影轮廓。\n\n### 6.6 GoPro胸挂\n规格：\n\n- 黑色简洁弹力胸挂；\n- 摄像机位于胸口中央；\n- 结构真实；\n- 不过度粗重；\n- 不像战术背带；\n- 不改变肩部比例；\n- 不遮挡夹克和内搭主要结构。\n\n叙事意义：\n\n- 内容创作者身份；\n- 冒险开始时主动记录；\n- 冒险后段成为被迫记录危险的装置；\n- 可以出现轻微划痕和倾斜，但不能无故消失。\n\n### 6.7 白色运动护腕\n固定位置：\n\n- 右手腕。\n\n规格：\n\n- 白色；\n- 简单；\n- 有轻微训练使用感；\n- 不能像拳击绷带；\n- 不能过厚。\n\n叙事功能：\n\n- 强化运动身份；\n- 可在后续状态中拆下用于简单包扎。\n\n### 6.8 摇摇杯\n状态：\n\n- 辅助道具，不属于永久身体锚点；\n- 基础锚点图中可不出现；\n- 道具资产和部分生活动作中出现。\n\n规格：\n\n- 半透明磨砂杯体；\n- 绿色杯盖；\n- 容量约600毫升；\n- 有轻微使用痕迹；\n- 无知名品牌；\n- 杯中可有少量浅褐色运动饮料。\n\n作用：\n\n- 建立跆拳道教练和健身博主的日常；\n- 提供轻微喜剧性；\n- 后续可以被放下、磕碰、丢失或变空。\n\n---\n\n## 7. 配色系统\n\n### 7.1 主色\n鲜明运动绿。\n\n作用：\n\n- 第一角色识别色；\n- 表现外放、主动、自信和年轻；\n- 在千禧梦核环境中形成强对比。\n\n### 7.2 基础色\n纯黑。\n\n用于：\n\n- 无袖内搭；\n- GoPro胸带；\n- 鞋面主要部分。\n\n作用：\n\n- 稳定画面；\n- 压住鲜绿；\n- 强化身体轮廓。\n\n### 7.3 平衡色\n卡其色。\n\n用于：\n\n- 五分训练短裤。\n\n作用：\n\n- 打破绿色工作人员制服感；\n- 增加生活气；\n- 与场景中的旧黄、灰褐和千禧陈旧色产生自然联系。\n\n### 7.4 提亮色\n白色。\n\n用于：\n\n- 中筒袜；\n- 护腕；\n- 鞋面白色部分。\n\n作用：\n\n- 提升年轻感；\n- 增强肢体动作识别；\n- 在暗场中保留轮廓。\n\n### 7.5 禁用色\n- 安全荧光绿；\n- 军绿；\n- 灰绿；\n- 大面积电子蓝；\n- 大面积橙色；\n- 大面积粉色；\n- 过度复古黄。\n\n这些颜色属于其他角色或会破坏邹青的角色识别。\n\n---\n\n## 8. 发型与妆面\n\n### 8.1 发型\n- 固定短寸头；\n- 不改变发际线；\n- 不增加刘海；\n- 不做韩式纹理烫；\n- 不做湿发造型；\n- 不做军人式极端平头；\n- 冒险过程中只允许出现汗湿、灰尘或轻微凌乱感。\n\n### 8.2 皮肤\n- 健康自然肤色；\n- 真实毛孔；\n- 可有训练后的轻微晒痕；\n- 不做冷白皮；\n- 不做偶像磨皮；\n- 不做重妆。\n\n### 8.3 面部标记\n- 眉骨附近保留轻微旧伤或生活痕迹；\n- 不能每张图伤痕位置变化；\n- 基础造型阶段保持轻微；\n- 战损阶段可增加新的擦伤，但必须单独记录。\n\n### 8.4 表情基调\n标准锚点：\n\n- 平静；\n- 自然；\n- 不笑；\n- 不凶；\n- 不摆英雄姿势。\n\n角色常用表情：\n\n- 自信；\n- 得意；\n- 疑惑；\n- 嘴硬；\n- 紧张；\n- 害怕但强撑；\n- 因保护同伴而愤怒。\n\n---\n\n## 9. 基础造型状态系统\n\n状态变化必须以同一套基础服装为母版。\n\n### S0：标准入场状态\n- 夹克正常穿着；\n- 拉链完全敞开；\n- 袖子正常；\n- 黑色无袖内搭完整；\n- GoPro正常；\n- 护腕正常；\n- 衣服干净；\n- 可手持摇摇杯。\n\n用途：角色第一次出场、进入星星岛、拍摄挑战视频。\n\n### S1：探索状态\n- 夹克仍敞开；\n- 袖子推至前臂；\n- 人物开始出汗；\n- 摇摇杯可能被放下；\n- GoPro继续工作。\n\n用途：开始认真观察环境。\n\n### S2：行动状态\n- 外套脱下；\n- 只穿纯黑无袖；\n- GoPro仍固定；\n- 卡其短裤、袜子和鞋不变；\n- 外套由手持或搭在手臂。\n\n用途：第一次真正冲入危险。\n\n### S3：外套系腰状态\n- 只穿黑色无袖；\n- 绿色夹克系在腰间；\n- 短裤仍需清楚可见；\n- 袖子在身体前方自然打结。\n\n用途：长时间行动、热量增加、连续闯关。\n\n### S4：轻度受损状态\n- 汗湿；\n- 灰尘；\n- 少量水痕；\n- 鞋面变脏；\n- GoPro有轻微划痕；\n- 无明显破裂。\n\n用途：冒险初段结束。\n\n### S5：救援状态\n- 护腕被拆下用于包扎；\n- 或绿色夹克被用作临时保护、拖拽、包裹；\n- 人物从“拍内容”进入“保护同伴”。\n\n用途：角色弧线转折。\n\n### S6：中度受损状态\n- 夹克袖口有小裂口；\n- 下摆有磨损；\n- 黑色无袖明显汗湿；\n- 卡其短裤侧面有灰尘和污迹；\n- GoPro倾斜或有划痕；\n- 人物面部轻微擦伤。\n\n用途：冒险中后段。\n\n### S7：终局状态\n- 夹克系腰或被手持；\n- 无袖汗湿；\n- 护腕已挪作包扎；\n- 鞋袜和短裤明显变脏；\n- 人物疲惫；\n- 仍有行动意志。\n\n用途：终局、救援、情感高潮。\n\n---\n\n## 10. 状态变化原则\n\n### 10.1 每次只改变一个变量\nAI生成时，不要同时要求：\n\n- 换姿势；\n- 换场景；\n- 换灯光；\n- 增加战损；\n- 脱外套；\n- 改表情。\n\n每次只改变一个主要变量。\n\n### 10.2 所有状态从主锚点派生\n禁止从“状态图”继续套娃生成下一张状态图。\n\n正确方式：\n\n> 每个新状态都重新调用批准的面部锚点、身体锚点和正面造型主锚点。\n\n避免误差累计。\n\n### 10.3 造型变化不能变成换装\n任何状态都必须保留：\n\n- 纯黑无袖内搭；\n- 卡其色五分训练短裤；\n- 白色中筒袜；\n- 黑白复古训练鞋；\n- GoPro胸挂或其明确受损状态；\n- 右腕护腕或其包扎去向。\n\n---\n\n## 11. Flow资产生产流程\n\n### 阶段A：身份锁定\n输入：\n\n1. 正面面部锚点；\n2. 正面身体锚点；\n3. 定版造型图。\n\n输出：\n\n- 正面全身主锚点。\n\n要求：\n\n- 不继承参考图姿势；\n- 不继承背景；\n- 不继承表情；\n- 只分别继承身份、身体和服装。\n\n### 阶段B：标准锚点包\n必须生成：\n\n1. 正面全身；\n2. 左前45度全身；\n3. 右侧全身；\n4. 背面全身；\n5. 正面半身；\n6. 面部近景。\n\n全部通过后才能进入下一阶段。\n\n### 阶段C：表情资产\n建议生成：\n\n1. 中性；\n2. 自信；\n3. 得意；\n4. 疑惑；\n5. 嘴硬；\n6. 紧张；\n7. 害怕但强撑；\n8. 真正愤怒。\n\n### 阶段D：基础动作\n建议生成：\n\n1. 自然站立；\n2. 双手叉腰；\n3. 检查GoPro；\n4. 手持摇摇杯；\n5. 转头观察；\n6. 微蹲准备行动。\n\n### 阶段E：造型变化\n按S0至S7依次生成。\n\n### 阶段F：场景和镜头资产\n只有完成基础锚点、表情、动作和状态资产后，才进入：\n\n- 千禧商场；\n- 密室关卡；\n- 追逐；\n- 低光；\n- 污损；\n- 视频镜头。\n\n---\n\n## 12. 参考图使用规则\n\n### 12.1 三类参考图职责分开\n面部参考：\n\n- 只决定脸、发型、年龄和皮肤。\n\n身体参考：\n\n- 只决定身高、比例、肩宽和肌肉量。\n\n定版造型参考：\n\n- 只决定服装、配色、材质、鞋袜、GoPro和护腕。\n\n### 12.2 禁止继承\n所有提示语必须写明：\n\n> 不继承任何参考图中的姿势、表情、构图、背景和灯光。\n\n### 12.3 参考图数量\n建议控制在三张以内：\n\n- 面部锚点；\n- 身体锚点；\n- 已批准造型主锚点。\n\n不要继续混入之前淘汰的：\n\n- 黑色短裤版本；\n- 绿色马甲版本；\n- 软风衣版本；\n- 长裤版本；\n- 连帽版本；\n- 工作人员版本。\n\n---\n\n## 13. AI生成禁止项\n\n### 身份禁止\n- 换脸；\n- 年龄变化；\n- 身材变瘦；\n- 肌肉突然增大；\n- 腿部比例变化；\n- 发型变化；\n- 伤痕位置变化。\n\n### 服装禁止\n- 黑色短裤；\n- 绿色短裤；\n- 长裤；\n- 工装裤；\n- 篮球裤；\n- 超短跑步裤；\n- 连帽衫；\n- 绿色马甲；\n- 战术背心；\n- 软塌风衣；\n- 冲锋衣；\n- 工作制服；\n- 多口袋；\n- 反光条；\n- 安全荧光绿。\n\n### 风格禁止\n- 健身广告；\n- 运动品牌目录；\n- 时尚男模；\n- 偶像剧；\n- 特种兵；\n- 户外求生专家；\n- 超级英雄；\n- 赛博朋克；\n- 末日废土；\n- 电子游戏角色；\n- 直接穿千禧年代服装。\n\n### 构图禁止\n- 拼图；\n- 多人；\n- 多视角合成；\n- 裁断脚部；\n- 裁断鞋子；\n- 裁断头顶；\n- 复杂文字排版；\n- 道具遮挡服装关键结构。\n\n---\n\n## 14. 标准资产清单\n\n### 14.1 身份与造型锚点\n- `ZQ_A01_MASTER_FRONT_FULL`\n- `ZQ_A02_MASTER_3Q_LEFT`\n- `ZQ_A03_MASTER_SIDE_RIGHT`\n- `ZQ_A04_MASTER_BACK`\n- `ZQ_A05_MASTER_FRONT_HALF`\n- `ZQ_A06_FACE_MASTER`\n\n### 14.2 表情资产\n- `ZQ_EXP_01_NEUTRAL`\n- `ZQ_EXP_02_CONFIDENT`\n- `ZQ_EXP_03_PROUD`\n- `ZQ_EXP_04_CONFUSED`\n- `ZQ_EXP_05_BLUFFING`\n- `ZQ_EXP_06_NERVOUS`\n- `ZQ_EXP_07_AFRAID_BUT_HOLDING`\n- `ZQ_EXP_08_ANGRY_PROTECTIVE`\n\n### 14.3 动作资产\n- `ZQ_ACT_01_STAND`\n- `ZQ_ACT_02_HANDS_ON_HIPS`\n- `ZQ_ACT_03_CHECK_GOPRO`\n- `ZQ_ACT_04_HOLD_SHAKER`\n- `ZQ_ACT_05_LOOK_ASIDE`\n- `ZQ_ACT_06_READY_CROUCH`\n\n### 14.4 状态资产\n- `ZQ_STATE_S0_ENTRY`\n- `ZQ_STATE_S1_EXPLORE`\n- `ZQ_STATE_S2_JACKET_OFF`\n- `ZQ_STATE_S3_JACKET_WAIST`\n- `ZQ_STATE_S4_LIGHT_DAMAGE`\n- `ZQ_STATE_S5_RESCUE`\n- `ZQ_STATE_S6_MEDIUM_DAMAGE`\n- `ZQ_STATE_S7_FINAL`\n\n### 14.5 道具资产\n- `ZQ_PROP_GOPRO`\n- `ZQ_PROP_CHEST_HARNESS`\n- `ZQ_PROP_SHAKER`\n- `ZQ_PROP_WRIST_WRAP`\n- `ZQ_PROP_JACKET_FLAT`\n- `ZQ_PROP_SHOES_PAIR`\n\n---\n\n## 15. 命名与版本管理\n格式：\n\n`项目_角色_资产类型_视角或状态_版本_状态`\n\n示例：\n\n- `SCYX_ZQ_LOOK_FRONT_FULL_v001_DRAFT.png`\n- `SCYX_ZQ_LOOK_FRONT_FULL_v003_APPROVED.png`\n- `SCYX_ZQ_STATE_S3_JACKET_WAIST_v002_REVIEW.png`\n\n状态：\n\n- `DRAFT`：初稿；\n- `REVIEW`：待导演审查；\n- `APPROVED`：正式批准；\n- `REJECTED`：淘汰；\n- `ARCHIVED`：历史版本。\n\n规则：\n\n- 不覆盖旧文件；\n- 每次修改递增版本；\n- 只有APPROVED可用于后续资产生产；\n- 淘汰版本不得继续作为参考图。\n\n---\n\n## 16. 验收标准\n\n每张资产必须逐项检查。\n\n### 16.1 人物一致性\n- 是否是同一张脸；\n- 寸头长度是否一致；\n- 年龄是否一致；\n- 肩宽是否一致；\n- 腰围是否一致；\n- 手臂和腿部肌肉量是否一致；\n- 身高与腿长比例是否一致。\n\n### 16.2 服装一致性\n- 是否为鲜绿色硬挺立领训练夹克；\n- 夹克是否无帽；\n- 立领是否清楚；\n- 面料是否哑光硬挺；\n- 内搭是否纯黑无袖；\n- 短裤是否卡其色五分训练短裤；\n- 短裤长度是否稳定；\n- 袜子是否白色中筒；\n- 鞋是否黑白复古训练鞋。\n\n### 16.3 装备一致性\n- GoPro是否在胸口中央；\n- 胸挂结构是否简洁；\n- 白色护腕是否在右腕；\n- 摇摇杯是否只在需要的资产中出现。\n\n### 16.4 风格一致性\n- 是否像2026年真实青年；\n- 是否具有冒险喜剧感；\n- 是否避免工作人员感；\n- 是否避免户外领队感；\n- 是否避免健身广告感；\n- 是否避免时装模特感。\n\n### 16.5 构图完整性\n- 是否为单人单图；\n- 是否完整显示头顶；\n- 是否完整显示鞋；\n- 是否无拼图；\n- 是否无文字；\n- 是否无额外人物或道具污染。\n\n---\n\n## 17. 连续性记录要点\n拍摄或AI生产时，每个镜头必须记录：\n\n- 夹克是否穿着；\n- 拉链位置；\n- 袖子位置；\n- 夹克是否系腰；\n- 护腕是否仍在右腕；\n- GoPro是否正常、倾斜或受损；\n- 摇摇杯是否仍携带；\n- 汗湿程度；\n- 灰尘程度；\n- 水痕位置；\n- 夹克裂口位置；\n- 短裤污迹位置；\n- 鞋面污损程度；\n- 面部擦伤位置；\n- 当前属于S0至S7哪个状态。\n\n禁止状态倒退：\n\n例如S6已出现袖口裂口，后续镜头不能恢复完整；护腕已经用于包扎，后续不能重新回到右腕，除非剧情明确取回。\n\n---\n\n## 18. 与其他角色的区分\n邹青必须通过以下组合立即被识别：\n\n- 鲜绿色上衣；\n- 卡其色五分短裤；\n- 裸露小腿；\n- 黑白复古训练鞋；\n- GoPro胸挂；\n- 宽肩运动体格；\n- 短寸头。\n\n与其他角色区别：\n\n- 王波：电子蓝、长裤、脑力与设备感；\n- 张杭杭：奶油粉、轻盈、都市感；\n- 赵蔚：暗红、克制、观察者轮廓；\n- 周凯：橙色、装备多、体型偏胖；\n- 麻花：褪色红蓝与旧黄工作马甲；\n- 晓晓：浅黄、蓝白格纹与红色包。\n\n邹青的轮廓必须是全队最明显的：\n\n> 绿色上身 + 卡其短裤 + 强壮裸露小腿 + 胸前摄像机。\n\n---\n\n## 19. 摄影与灯光建议\n\n### 标准资产照\n- 浅灰无缝背景；\n- 柔和均匀棚灯；\n- 镜头高度接近胸口；\n- 轻微长焦；\n- 不使用夸张广角；\n- 不做广告高反差；\n- 不做强轮廓光；\n- 保留面料和皮肤真实细节。\n\n### 剧情镜头\n绿色夹克需要在以下环境中测试：\n\n- 冷白荧光灯；\n- 暗黄千禧商场光；\n- 青蓝走廊光；\n- 红色警报光；\n- 低照度；\n- 潮湿反光地面。\n\n测试重点：\n\n- 绿色不能变成荧光安全服；\n- 卡其短裤不能被环境染成军绿色；\n- 黑色无袖和GoPro仍需保持层次；\n- 白袜和黑白鞋不能过度抢眼。\n\n---\n\n## 20. 最终锁定结论\n邹青唯一基础造型正式锁定为：\n\n> 鲜绿色硬挺立领训练夹克，完全敞开；纯黑无袖训练内搭；卡其色五分训练短裤；白色中筒运动袜；黑白复古训练鞋；胸前黑色GoPro固定带；右手白色运动护腕；可选半透明绿色杯盖摇摇杯。\n\n角色视觉关键词：\n\n> 年轻、运动、热心、莽撞、自信过头、准备拍挑战视频、身体先于判断、普通人努力成为行动担当。\n\n生产原则：\n\n> GPT负责设计与审美判断，Flow负责在已批准造型基础上生产稳定资产。\n\n最终目标：\n\n> 不是让邹青每一张图都“更帅”，而是让观众在任何角度、任何状态、任何关卡中，都能一眼认出他，并相信这套衣服真的陪他经历了整场冒险。\n", "excerpt": "版本：V1.0  \n状态：造型定版 / 可进入资产生产  \n适用范围：角色造型设计、AI资产生成、三视图、表情资产、动作资产、状态变化、镜头连续性管理  \n角色：邹青  \n项目时间设定：2026年当代  \n\n---\n\n## 1. 文档目的\n本造型圣经用于统一邹青在《失控游戏》中的人物身份、外形、服装、配色、材质、装备、造型变化和资产生产标准。\n\n本文件解决以下问题：\n\n1. 防止AI生成过程中人物", "size": 10179, "safe_id": "失控游戏_邹青整体造型圣经_V1_0"}, {"name": "失控游戏_项目剧集圣经_编剧分发版_V1.1全本", "project": "失控游戏", "content": "# 《失控游戏》项目剧集圣经（编剧分发版 V1.1全本）\n\n**版本**：V1.1｜新增/修改页已并入全本｜试播集剧本前基础包  \n**用途**：分发给各集编剧、导演组、美术概念组、分镜组、AI虚拟拍摄组作为统一创作依据。  \n**主标题**：《失控游戏》  \n**片名候选**：《请把话听完》（优先候选） / 《失控游戏：请把话听完》（对外提案名）  \n**Slogan候选**：别相信修补后的版本 / 请把话听完\n\n---\n\n# 0. 编剧使用说明\n\n这份文件不是宣传项目书，也不是单纯设定集，而是进入试播集和分集剧本阶段之前的**项目剧集圣经**。所有编剧在开写前，应优先遵守本文件中的结构反转、人物声纹、关卡口径、喜剧方法、线索回收和AI虚拟拍摄限制。\n\n本版已通过结构验收，并已并入V1.1新增/修改页。**五大关卡、第6/8/10/11/12集核心反转、赵蔚哥哥线、周凯现实定案、麻花删除倒计时、南建林现实锚点不可再随意改动。** 分集编剧可以在桥段、台词、动作解法和局部场面上扩写，但不得改动以下基础骨架：\n\n| 不可改动项 | 锁定内容 |\n| --- | --- |\n| 五大关卡 | 欢迎进入乐园 / 失真通讯站 / 夜班工厂 / 重排居民楼 / 回放街区 |\n| 真相结构 | 第1-5集误导为旧事故/冤魂密室；第6集反转为私人记忆系统；第8集反转为系统正在删除麻花；第10集假希望；第11集父亲也是受困者；第12集带不出麻花的脸 |\n| 主角关系 | 邹青+王波室友互损；邹青+张杭杭前任；王波+赵蔚论坛/旧识；赵蔚+赵斌兄妹线；四人共同护送麻花 |\n| 喜剧口径 | 危险是真的；笑点来自普通人生活反应，不来自系统讲段子 |\n| 情感主题 | 不是“赢得游戏”，而是“把一个孩子没被听完的话听完” |\n| 结局代价 | 周凯现实活着；南建林现实中昏迷；麻花无法完整带出，众人只留下空位与损伤照片 |\n\n## 0.1 V1.1新增/修改总览\n\n本节是全本生效说明，不再保留旧版冲突口径。后续分集编剧以本全本为唯一分发文本。\n\n| 修改项 | V1.1全本生效口径 |\n| --- | --- |\n| 片名与Slogan | 《请把话听完》升为正式片名优先候选；《失控游戏：请把话听完》保留为对外提案名；Slogan只保留“别相信修补后的版本 / 请把话听完”。 |\n| 调性参考 | 三部调性参考固定为：《小镇滋味》《外星居民》《僵尸救生船》。 |\n| 三钩命名 | 全书统一为：冒险钩 / 喜剧钩 / 真相钩。 |\n| 赵蔚终局动作 | 备份材料，不公开发布；当面对三人说出“我害怕，但我看见了”，从旁观记录变成现场见证。 |\n| 周姨条目 | 周姨为晓晓病中照护者和生活见证人，不扩展成阴谋角色。 |\n| 新增规则页 | 系统规则宪法、晓晓同一天时间线、麻花认知边界表均已并入第2章。 |\n\n---\n\n# 1. 项目介绍\n\n## 1.1 项目基本信息\n\n| 项目项 | 开发口径 |\n| --- | --- |\n| 项目名称 | 《失控游戏》 |\n| 正式片名候选 | 《请把话听完》 |\n| 类型 | 轻喜剧冒险 / 悬疑奇幻 / 中国千禧梦核 / 阈限空间逃生 |\n| 规格建议 | 12集，每集35-45分钟；可拆分为短集版本，但结构按12集剧本推进 |\n| 目标受众 | 喜欢密室、悬疑、怪谈、轻喜剧冒险、群像互损与本土梦核视觉的年轻观众 |\n| 核心看点 | 90年代中国公共空间异变成阈限关卡；四个普通朋友以低配生活办法在真实危险中求生；父亲错误保存女儿记忆导致系统失控 |\n| 调性参考 | 《小镇滋味》式极端危机中的家庭/生活反应；《外星居民》式非人逻辑撞人类日常；《僵尸救生船》式大危机低配逃生 |\n\n## 1.2 一句话梗概\n\n四个普通朋友误入一座由父亲错误记忆生成的90年代公共空间异境；他们一开始以为自己在闯旧事故鬼屋，后来发现自己正在闯一个父亲不断修补、系统不断删除、孩子一直没被听完的记忆。\n\n## 1.3 长梗概\n\n邹青、王波、张杭杭、赵蔚本来只是一个松散朋友局。邹青是嘴硬行动派，遇事先冲；王波是规则控和密室论坛玩家，什么都想先解释；张杭杭是生活方式博主，危险来了也会先嫌脏、护脸、拍证据；赵蔚是潜水观察者，胆小、紧张、话少，却记得所有异常细节。四个人因为星星岛密室内测重新聚到一起。王波还约来了论坛网友周凯，准备证明自己在密室圈真有人脉。\n\n星星岛看似只是一个旧儿童乐园改造的商业密室，实际却是南建林为了保存女儿晓晓记忆而搭建的私人记忆系统。系统以90年代中国公共空间为外壳：儿童乐园、电话广播站、国营工厂、筒子楼、旧音像街区。外面看都是熟悉旧地方，进去以后却被梦境化、阈限化、错误放大，变成不合比例的巨大空间。\n\n前五集，王波和观众都被误导为“旧商场事故冤魂密室”。第六集夜班工厂档案室揭示中点反转：这不是闹鬼，而是南建林的私人记忆修补系统。第八集居民楼进一步反转：麻花不是导游也不是钥匙，她是系统删除失败的原始记忆残留，编号MH-08。前八集所谓随机危险，其实都是删除程序在定位她。\n\n后四集，故事目标从“逃出去”升级为“护送麻花抵达回放街区，找到原始母带”。第十集给出假希望：众人以为晓晓可能还活着，结果发现活体同步端口连着的是南建林自己。第十一集揭示南建林也不是单纯操控者，他把自己也困进系统里，反复修剪女儿的真实记忆，只保留自己能承受的乖巧版本。最终，主角团让他看完完整母带：晓晓不是完美女儿，她会哭、会闹、会难看、会等不到爸爸，也会想让人把话听完。\n\n第十二集，系统停止删除麻花，但代价是麻花无法完整带出现实。四人走出星星岛，记得有过这样一个小女孩，却带不出她的具体脸。张杭杭留下的照片中央只有磁带损伤般的空白。最后他们在空商场前拍合照，给中间留出一个小小空位。\n\n## 1.4 核心卖点\n\n| 卖点 | 具体表达 |\n| --- | --- |\n| 本土阈限空间 | 不照搬欧美后室黄墙地毯，而是中国儿童乐园、公共广播站、国营工厂、筒子楼、旧音像街区。 |\n| 小入口大异境 | 儿童乐园矮门后是无边海洋球宇宙；电话亭后是垂直广播井；居民楼铁门后是复制到天顶的楼体中庭。 |\n| 冒险强类型 | 每关有追逐、攀爬、坠落、毒雾、机械、倒带、空间覆盖等真实危险。 |\n| 生活化喜剧 | 人物面对死亡危机仍然会投诉、护脸、嘴硬、装懂、嫌脏、找充电宝、骂物业。 |\n| 结构反转 | 第6集中点反转、第8集目标升级、第10集假希望、第11集父亲受困、第12集记忆代价。 |\n| 低配求生 | 自拍杆、蛋白粉桶、旧电话线、相机背带、口红壳、卸妆巾、VCD清洁布等生活物件先添乱后救命。 |\n| AI友好奇观 | 重复空间、垂直巨构、录像带失真、空间折叠、旧商圈夜街适合AI虚拟拍摄；伪影可被世界观吸收。 |\n\n## 1.5 项目调性宪法\n\n本剧不是传统高智商密室，也不是严肃复仇悬疑。它的理想观感是：**观众先被奇观吸住，再被菜鸟互啄逗笑，最后被“请把话听完”击中。**\n\n### 允许写\n\n- 危险很硬：吞人、坠落、缺氧、探照灯追捕、录像覆盖、系统删除。\n- 反应很日常：退费、投诉、嫌脏、怕丢脸、找充电宝、嘴硬、翻旧账。\n- 解法很低配：用生活物件临时拼装，用错误经验误打误撞。\n- 人物很笨，但不是蠢：他们的毛病会先添乱，再救命。\n- 情感克制：不靠大段独白催泪，而靠“听完一段录像”“给照片留空位”完成主题。\n\n### 禁止写\n\n- 禁止把每关写成纯谜题考试。\n- 禁止系统频繁讲段子。\n- 禁止麻花每集高密度输出金句。\n- 禁止人物突然变成专业冒险家或全能玩家。\n- 禁止把南建林写成单纯邪恶反派。\n- 禁止把晓晓写成只会卖惨的完美小孩。\n- 禁止把结局写成毫无代价的大团圆。\n\n---\n\n# 2. 创作方法论\n\n## 2.1 每集基础公式\n\n每集必须同时具备三钩：\n\n| 三钩 | 说明 | 剧本检查方式 |\n| --- | --- | --- |\n| 冒险钩 | 本集真正会伤人的危险是什么？ | 观众能否在5分钟内明确“这集会怎么死人/吞人/消失/窒息/被覆盖”？ |\n| 喜剧钩 | 人物面对危险时有哪些生活化反应？ | 是否至少有一次“正常人不体面反应”造成笑点？ |\n| 真相钩 | 本集释放哪一块晓晓/赵斌/周凯/南建林信息？ | 结尾观众对世界性质或人物关系是否多知道一件事？ |\n\n## 2.2 冒险+喜剧的写法\n\n错误写法：把困难变成生活梗。比如“拍照会死”“装懂会冒烟”。\n\n正确写法：困难是真的，但角色用生活习惯处理。比如：\n\n- 球池真的会吞人，张杭杭第一反应是“这里多久没消毒”。\n- 毒雾真的有毒，邹青为了证明“不一定有毒”先吸一口。\n- 广播井真的会坠落，王波还在纠结电话线承重标准。\n- 工厂机械真的会碾人，邹青还要先摆一个“夜班工人很酷”的姿势。\n- 回放街区真的会把人覆盖成路人，张杭杭还在找充电宝给补光灯续命。\n\n## 2.3 真相释放曲线\n\n| 阶段 | 集数 | 观众以为 | 真相实际 | 剧作目的 |\n| --- | --- | --- | --- | --- |\n| 误导层 | 1-5 | 星星岛旧事故鬼屋 / 冤魂密室 | 南建林记忆系统正在修补晓晓过往 | 让观众先进入类型片预期 |\n| 中点反转 | 6 | 工厂是第三关 | 工厂档案室揭示私人记忆系统 | 改变故事性质 |\n| 护送反转 | 8 | 麻花是导游/钥匙/晓晓幽灵 | 麻花是系统正在删除的错误数据 | 改变主角目标 |\n| 假希望 | 10 | 晓晓可能还活着 | 活体同步端口连的是南建林 | 把反派翻成受困者 |\n| 终局反转 | 11 | 要打败南建林 | 要让南建林看完真实母带 | 情感收束 |\n| 代价 | 12 | 带麻花出去 | 只能记得她存在，带不出她的脸 | 主题落地 |\n\n## 2.4 角色标签升级表\n\n| 人物 | 前半标签 | 中段失效 | 后半互染/升级 | 终局动作 |\n| --- | --- | --- | --- | --- |\n| 邹青 | 嘴硬、先冲、用力 | 第7集不能用力，只能哄门 | 学会赵蔚式警觉，先判断再动 | 不抢镜，给空位 |\n| 王波 | 装懂、规则控 | 第7集必须闭嘴爬井 | 学会先听人，再整理规则 | 攻略改名《请把话听完》，不发布 |\n| 张杭杭 | 嫌脏、修图、护脸 | 第7集必须弄脏自己救人 | 学会保留脏点、噪点和不好看 | 拍下空位，不美颜 |\n| 赵蔚 | 潜水、乌鸦嘴、旁观 | 第7集必须第一个开口 | 学会张杭杭式表面读取和王波式整理 | 备份材料，不公开发布；当面对三人说出“我害怕，但我看见了”，从旁观记录变成现场见证 |\n| 麻花 | 被保护/被怀疑 | 第8集被确认正在被删除 | 成为护送目标与真实记忆核心 | 无法带出脸，留下空位 |\n\n\n## 2.5 系统规则宪法 / 速查表\n\n本章用于统一五个分集编剧对空间物理的理解。后续剧本出现“吞人、覆盖、倒带、删除、残影、修补”时，必须能在下表中找到依据。\n\n### 2.5.1 系统五层\n\n| 层级 | 功能 | 编剧必须遵守 |\n| --- | --- | --- |\n| 现实层 | 星星岛旧商场三层机房、旧设备、昏迷南建林、昏迷但活着的周凯。现实层只在第1集门店、第12集尾声少量显影。 | 不要在中段频繁切外部调查线。外部世界只提供现实锚，不承担破局。 |\n| 记忆域层 | 五大阈限空间：欢迎进入乐园、失真通讯站、夜班工厂、重排居民楼、回放街区。它们由晓晓DV、照片、物件、南建林修补逻辑和商场旧结构共同生成。 | 空间可以异常放大、折叠、复制、回放，但外壳必须来自90年代中国公共空间。 |\n| 修补程序 | 南建林的主动清理行为：新油漆盖住涂鸦、焊死门、剪断录音、覆盖录像、把“不好看”的晓晓修成乖巧版本。 | 从第2集起逐集可见。每关Boss机制都应与“修补真实”有关，而不是随机怪物。 |\n| 删除协议 | 系统识别麻花/MH-08为删不掉的原始错误数据，优先追踪、淡化、抹除她。第8集后从暗线变明线。 | 第1-7集不要明说“删除麻花”；第9-11集必须按三档刻度推进。 |\n| 回放/覆盖层 | 第10-11集集中出现。人或空间会被旧录像覆盖，变成重复同一动作的残影。周凯是主要样本。 | 覆盖不能随便解除。必须满足“听见求救—叫出真名—给出回应”三步，才可从未完成覆盖中抢回。 |\n\n### 2.5.2 关键规则速查\n\n| 规则 | 生效方式 | 限制/禁区 |\n| --- | --- | --- |\n| 空间吞人 | 通过边界物发生：矮门、滑梯口、电话亭门、绿铁门、居民楼卧室门、录像机屏幕。吞人不是随机，是修补程序或删除协议在改变路径。 | 不能把任何门都写成任意传送门。每次吞人必须对应“修补/删除/覆盖”三者之一。 |\n| 删除光 | 触碰普通人会造成短暂画面卡顿、眩晕、记忆断片；触碰麻花会推进删除刻度。第9集辫子褪色，第10集声音混入磁带杂音，第11集身体半透明。 | 不能把删除光写成普通激光武器，也不能让它一照即死。主角可被擦到，但不能替代真正动作危机。 |\n| 修补痕迹 | 新油漆、新焊点、被贴住的门缝、剪断的磁带、被涂白的文字、被循环覆盖的录像。 | 修补痕迹必须“看得见、摸得到、能被角色误解”。不要只用台词说“这里被修补过”。 |\n| 残影 | 被覆盖的人会重复同一动作或一句话，但仍可能保留最后未被回应的请求。周凯重复“有人吗”，不是鬼，是未完成的现实求救。 | 残影不是幽灵，不讲鬼话，不提供全知线索。 |\n| 倒带 | 录像设备或广播信号触发局部空间倒带，通常15-60秒；角色保留记忆和伤痕，空间物件回到上一个状态。 | 倒带不能撤销死亡、不能无限重试、不能解决核心情感问题。 |\n| 原始数据豁免 | 未修补物件能短暂抵抗删除：母带索引贴纸、赵斌日志、原始母带、麻花辫、未剪掉噪点的影像。 | 普通生活物件可以救命，但不能直接改写系统规则。自拍杆可以勾门，不能“净化删除”。 |\n| 听完机制 | 角色真正听见并回应一个被覆盖对象时，修补程序会短暂停顿。第10集救周凯、第11集让南建林看完母带都用这个机制。 | 不要写成口号。必须有具体动作：停下、听完、叫名、回应。 |\n| 时间膨胀 | 系统内体感跨多日，现实外部约一夜。第12集现实层只确认失踪、昏迷和机房，不展开大规模社会反应。 | 不要让警察/媒体中段进入主叙事。现实追责留给尾声或第二季钩子。 |\n\n### 2.5.3 分集规则推进\n\n| 集数 | 系统状态 | 编剧可写 | 编剧禁写 |\n| --- | --- | --- | --- |\n| 第1集 | 误导层启动。周凯被边界物吞入低级覆盖区，观众以为旧事故鬼屋。 | 接待区异常、星星岛旧帖、周凯被吞、麻花命名。 | 不要说记忆系统、MH-08、删除协议。 |\n| 第2集 | 修补痕迹第一次出现：新油漆盖“爸爸没有来”。 | 乐园异常、低配求生、第一处被盖住的真实。 | 不要让角色读出“南建林”。 |\n| 第3集 | 通讯域只释放“小蔚”二字。赵斌线毛骨悚然但不解释。 | 电话杂音、签名磨花只见“斌”字。 | 不要提前说“别相信修补后的版本”。 |\n| 第4集 | 完整赵斌警告释放，但仍不解释系统性质。 | 完整警告后移到结尾。 | 不要让观众彻底放弃鬼屋/旧事故误导。 |\n| 第5集 | 夜班工厂修补程序增强。 | 工厂机械、档案残片、绿铁门预兆。 | 不要提前揭父亲受困。 |\n| 第6集 | 中点反转：私人记忆系统。关卡渗漏。 | 工牌“南”、接孩子指令、全家福认出麻花脸、绿铁门吞人。 | 反转必须爆炸，不能只多漏一个线索。 |\n| 第7集 | 人物瓶集。系统规则不扩张，人物关系扩张。 | 赵蔚哥哥线正式揭，标签失效互换。 | 不要堆新空间奇观。 |\n| 第8集 | 第二反转：麻花是系统删除失败的错误数据。 | MH-08日志、删除光追麻花、护送目标成立。 | 不要把麻花写成全知导游。 |\n| 第9集 | 删除第一档：麻花辫子褪色。母带索引贴纸取得。 | 辫子褪色与“不好看了”情绪点；贴纸冒险取回。 | 不要让贴纸只做纪念品，必须有第10集功能。 |\n| 第10集 | 删除第二档：麻花声音杂音化。假希望破裂。救周凯。 | 贴纸定位母带；活体同步连南建林；周凯残影救援。 | 注意密度，剪辑台段落一场内完成。 |\n| 第11集 | 删除第三档：麻花半透明。父亲受困。原始母带播放。 | 南建林、母带室、听完机制、双重救援。 | 不要再塞周凯大节拍。 |\n| 第12集 | 系统停机，现实锚落地，记忆有代价。 | 周凯活着、南建林旧机房、麻花脸无法带出。 | 不要公开发布全部真相，不要大团圆。 |\n\n## 2.6 晓晓“那一天”完整时间线\n\n所有冷开场都来自同一天的不同DV/VCD碎片。该日不是“当场死亡日”，而是晓晓最后一次完整清醒外出的普通一天；当晚急性发作入院，三天后病故。剧本不必在台词中公开具体公历日期，所有连续性以本表为准。\n\n| 冷开场/时间 | 地点 | 事件 | 连续性要求 | 剧作功能 |\n| --- | --- | --- | --- | --- |\n| 01｜08:05 | 居民楼卧室 | 周姨端药进来，晓晓不想吃药，只让周姨帮她把两根麻花辫重新扎紧。DV里能听见南建林电话承诺“忙完去接你”。 | 阴天早晨；晓晓穿浅黄色外套、蓝白格裙、红色小背包；左辫红绳、右辫蓝绳。 | 建立周姨、病中生活、父亲缺席承诺；“麻花”名字的现实来源。 |\n| 02｜09:10 | 星星岛乐园入口 | 晓晓在旧儿童乐园门口等爸爸，周姨说先进去玩。镜头扫过开业海报、生日灯箱和贴纸墙。 | 天气仍阴；衣着不变；背包上挂一枚小星星扣。 | 给第1-2集欢迎进入乐园提供真实记忆外壳。 |\n| 03｜10:00 | 海洋球池/软包坡道 | 晓晓在球池边把“爸爸没有来”写在墙角，随后用贴纸遮住。 | 球池灯光偏白；衣袖沾上海洋球池的粉尘。 | 第2集新油漆盖涂鸦的原始内容；修补程序的第一枪。 |\n| 04｜11:30 | 电话亭/失真通讯站外壳 | 晓晓给南建林打电话，电话接通又被忙音盖掉。她只说出“爸爸，你能不能……”就断线。 | 中午闷热；镜头里出现公共电话亭编号。 | 第3集只放“小蔚”形成误导；通讯站不提前暴露系统。 |\n| 05｜12:15 | 广播站小卖部/电话亭旁 | 广播寻找走失儿童，晓晓误以为在找自己；她把一枚贴纸贴在电话卡背面。 | 天气开始起风；小星星扣松动。 | 为第4集完整警告、电话卡和贴纸链埋道具。 |\n| 06｜14:05 | 夜班工厂门口 | 晓晓和周姨去找爸爸，门卫说南工今天不在，登记簿上有“接孩子”未完成指令。 | 下午灰蓝光；工厂门口有绿色铁门。 | 第6集中点反转的档案、工牌和“接孩子”指令来源。 |\n| 07｜16:40 | 居民楼楼道/家门口 | 周姨带晓晓回家，晓晓不说话，楼道声控灯一盏盏亮。周姨说“别让爸爸担心”。 | 天色转暗；外套袖口更脏；晓晓开始发低烧。 | 第7集瓶集情绪外壳；周姨条目落地。 |\n| 08｜18:10 | 晓晓卧室 | 晓晓画白花，背面却是红色；她问周姨“他们有来消息吗”。周姨递来一封信。 | 室内暖黄灯；窗帘微动；药杯未喝完。 | 第8集“那是我”的认知节点；旧版病房/卧室意象回收。 |\n| 09｜19:05 | 旧商圈/音像店入口 | 南建林终于出现，想补偿她，带她去取生日录像。晓晓把贴纸贴到一盘录像带盒侧边。 | 夜色开始下雨；小星星扣掉落；贴纸沾水卷边。 | 第9集冒死取回“母带索引”贴纸，必须在第10集响枪。 |\n| 10｜20:20 | 旧音像店剪辑台 | 南建林试图剪掉晓晓哭闹和等他的片段，只留下她笑的画面。晓晓在旁边小声说：“你又没听完。” | 雨夜；灯管闪；录像带盒贴纸与第09碎片一致。 | 第10集贴纸定位母带与假希望破裂；张杭杭表面读取技能。 |\n| 11｜21:45 | 医院门口/走廊 | 晓晓病情突然加重，南建林抱她进医院。DV没拍到正脸，只拍到晃动的走廊灯和她抓住爸爸袖子的手。 | 大雨；外套被雨淋湿；红色背包留在车上。 | 第11集母带室情感引爆；父亲受困不是洗白，是看完。 |\n| 12｜完整版回放 | 同一天串联 | 第12集冷开场不再给碎片，而是把前11段按时间顺序连成同一天：不是她死亡当天的煽情全景，而是她最后一次完整清醒外出的普通一天。三天后晓晓病故的信息只在病历和南建林日志里出现。 | 所有天气、衣着、贴纸、背包、辫绳、药杯、录像带编号必须连续。 | 闭合全剧冷开场；确认主题不是复活，而是听完。 |\n\n## 2.7 麻花认知边界表\n\n麻花不是全知NPC。她的认知来源只有三类：身体熟悉感、碎片记忆、系统运行带来的本能回避。她在第8集才第一次承认“那可能是我”，第11集才完整面对“爸爸/南建林”。\n\n| 集数 | 她知道/能感到 | 她不知道/拒绝知道 | 台词边界 |\n| --- | --- | --- | --- |\n| 第1集 | 知道星星岛路线有些地方“不该这么走”；接受张杭杭玩笑叫她“麻花”。 | 不知道MH-08，不承认自己是晓晓，不知道周凯下落。 | 可提醒“不要乱撕”。不可讲系统规则。戳穿型台词≤1句。 |\n| 第2集 | 对乐园矮门、球池、贴纸有体感熟悉；会下意识避开新油漆区域。 | 不知道涂鸦为什么被盖住，也不知道南建林在修补。 | 她说“这里以前不是这样”可以；不能说“我爸盖掉了”。 |\n| 第3集 | 听到电话杂音会紧张，对“小蔚”二字没有解释能力。 | 不知道赵斌是谁，不知道通讯站与赵蔚哥哥线关系。 | 以害怕和躲避为主，不做谜题讲解。 |\n| 第4集 | 听到完整赵斌警告后会本能躲开被剪断的广播线。 | 仍不知道“别相信修补后的版本”的全义。 | 不要让她复述赵斌警告；赵斌线由赵蔚承担。 |\n| 第5集 | 对工厂绿铁门、夜班铃声、接孩子广播有熟悉感。 | 不知道这就是南建林系统入口，不知道自己照片在档案室。 | 可以说“我不想进去”，但不能解释为什么。 |\n| 第6集 | 看到全家福后出现短暂自我错位：那张脸像她。 | 仍拒绝承认“我是晓晓”。她只知道那张照片让她难受。 | 正面情绪反应可强，解释必须少。 |\n| 第7集 | 对居民楼某些门牌、药味、楼道灯有身体记忆。 | 不愿想起周姨、病床、爸爸缺席。 | 她可以沉默、回避、说“我不想听这个”。不要让她主动爆全真相。 |\n| 第8集 | 看到MH-08日志后第一次承认“那可能是我”。知道系统在删她，但不知道如何停止。 | 不知道晓晓已病故的完整事实；不知道南建林也受困。 | 本集允许一次关键戳穿/承认，是麻花正面特写重点集。 |\n| 第9集 | 知道自己正在变淡，能感觉辫子颜色不对。 | 不知道删除三档规则，不知道贴纸如何定位母带。 | 可说“我是不是不好看了”。不要连续金句。 |\n| 第10集 | 声音混入磁带杂音后，她能听见周凯残影和母带方向。 | 不知道活体同步端口连的是南建林；不要让她提前揭父亲受困。 | 她能做“听见”动作，不负责说明。 |\n| 第11集 | 半透明后认出南建林是爸爸，也知道原始母带里有自己没被听完的话。 | 不知道自己能否出系统；不要让她保证“我能回去”。 | 本集允许第二个决定性正面特写。她的话要像孩子，不像审判。 |\n| 第12集 | 完整版回放后，她理解自己是晓晓留下的原始记忆残留。 | 她不能把完整面容带出现实；也不需要解释技术原理。 | 最后一句普通，不做金句。她的存在用空位和损伤照片收束。 |\n\n---\n\n# 3. 片名与命名建议\n\n《失控游戏》具备既有项目积累和识别度，但当前故事核心已经从“游戏”升级为“记忆未被听完”。因此建议同步保留主片名，并将《请把话听完》作为强候选或副标题使用。\n\n| 片名方案 | 优点 | 风险 |\n| --- | --- | --- |\n| 《失控游戏》 | 原项目积累强，类型清晰，密室感直接 | 容易让观众预期为普通游戏闯关 |\n| 《请把话听完》 | 高度贴合主题、终局动作和王波文档名，情感辨识度强 | 类型感弱于《失控游戏》 |\n| 《失控游戏：请把话听完》 | 兼顾IP延续与主题升级 | 标题偏长 |\n| 《星星岛》 | 有地点记忆和梦核感 | 悬疑冒险类型感不足 |\n\n剧本阶段建议统一文档标题为：**《失控游戏》项目剧集圣经**；正式片名优先候选为**《请把话听完》**，对外提案可使用：**《失控游戏：请把话听完》**。\n\n---\n\n# 附录A：验收后局部修订版全文\n\n## 版本口径\n\n本版在“结构反转修订版”基础上，按验收报告第二节的六项新增问题进行局部手术，不动五大关卡与三段真相反转骨架，只修正第10-12集节拍承载、周凯现实定案、麻花删除进度、贴纸道具回收、赵斌信息释放时点和南建林现实锚点。\n\n保留最新五大关卡设计：**欢迎进入乐园、失真通讯站、夜班工厂、重排居民楼、回放街区**。每一关仍是“90年代中国公共空间外壳 + 阈限空间 + 超现实失控”：小入口通向大异境，空间会生长、折叠、错误复制、回放和吞人。喜剧方法继续参考《僵尸救生船》《外星居民》《小镇滋味》：危险是真的，人物反应是生活化的；解决方案不高精尖，而是低配、临时、狼狈但有效。\n\n本版核心改法仍保留五个，并追加六项验收后小修：\n\n1. **真相释放从匀速渗透改成三段爆炸**：第1-5集误导为“冤魂密室/旧商场事故”；第6集结尾中点反转为“私人记忆系统”；第8集结尾第二反转为“系统正在删除麻花”。\n2. **主角与主线建立血缘关系**：赵蔚哥哥赵斌曾参与南建林早期系统维护并失踪，赵蔚不是凑数玩家，而是循着哥哥线索进入密室。\n3. **路人玩家周凯成为契诃夫之枪**：第1集被吞不是一次性惊吓，他是王波的密室论坛网友，后续以残影、留言、重复动作持续存在，第10集后半形成救不救残影的道德抉择，并在第12集现实层定案为昏迷但活着。\n4. **南建林从幕后设定变成现在时行动者**：从第2集起，每一关出现“修补痕迹”，新油漆、焊死的门、被剪断的录音、被覆盖的录像，都证明南建林正在系统里打扫真实。\n5. **后半季目标升级**：第8集后，任务不再是“逃出去”，而是“护送麻花穿过删除程序，带她抵达回放街区核心”。\n6. **第10-11集重新分流节拍**：周凯救援提前至第10集后半，第11集专注南建林、原始母带与父亲受困反转。\n7. **麻花删除进度可视化**：第9集辫子褪色，第10集声音混入磁带杂音，第11集身体半透明。\n8. **周凯现实层定案**：现实中周凯在商场配电间被发现，昏迷但活着；醒来只记得“有人回答了我”。\n9. **贴纸索引响枪**：第9集冒险取回贴纸索引，第10集用它从无标签录像带墙中定位原始母带。\n10. **南建林现实锚落地**：第12集尾声，保安推开商场三层旧机房，看见维持设备与昏迷的南建林。\n\n一句话新版定位：\n\n> 四个普通朋友误入一座由父亲错误记忆生成的90年代公共空间异境；他们以为自己在闯鬼屋，后来发现自己在闯一个父亲正在修补、系统正在删除、孩子一直没被听完的记忆。\n\n---\n\n# 一、修订说明与验收清单\n\n| 评估项 | 修订动作 | 落点 |\n| --- | --- | --- |\n| 第6集必须有中点反转 | 第1-5集主动误导为“星星岛旧商场事故冤魂”；第6集夜班工厂档案室出现南建林工牌、接孩子指令、晓晓档案和“记忆修补端口”，确认这是私人记忆系统。 | 第6集结尾：工厂未通关，绿铁门提前出现，把众人吸入居民楼。 |\n| 第8集必须有第二反转 | 重排居民楼内出现“错误数据：MH-08，删除失败”日志，众人发现前八集随机危险都在优先捕捉麻花。 | 第8集结尾：目标从逃生升级为护送麻花。 |\n| 路人玩家有名有姓有下落 | 第1集被吞玩家命名为周凯，网名“K哥不怕鬼”，是王波第一次线下面基的论坛网友；后续出现他的手环、声音、残影。 | 第10集后半：周凯已成重复动作残影，主角团选择救出他的“最后一次求救”；第12集现实中昏迷但活着。 |\n| 至少一名主角与晓晓家有前史 | 激活赵蔚哥哥赵斌：南建林旧项目兼职维护员，曾发现系统在删除麻花，之后失踪。赵蔚进密室是调查哥哥。 | 第1集偷拍登记簿埋线，第4集听到赵斌留言，第7集瓶集正式揭。 |\n| 南建林从第2集起有当前行动线 | 每关出现“修补痕迹”：新油漆盖涂鸦、广播被剪断、工厂门被焊、居民楼门被封、录像被覆盖。每关Boss机制不是随机怪物，而是南建林的修补程序。 | 第2集起逐集增强，第10-11集正面揭示。 |\n| 晓晓生死定案 | 定为已病故；第10集给“活体同步端口”假希望，第11集揭示端口连的是南建林自己。 | 第10集假希望，第11集父亲也是受困者反转。 |\n| 第7集人物瓶集 | 第7集几乎只用居民楼楼道、两户房、天台门、电梯井等复用资产，队伍拆成两组。 | 邹青+张杭杭爆前任旧账；王波+赵蔚+麻花揭赵斌线。 |\n| 标签失效/互换 | 第7-9集集中完成：邹青不能用力，只能哄门；王波必须闭嘴行动；张杭杭弄脏自己救人；赵蔚第一个开口。第10集后出现标签互染。 | 第7-9集人物动作设 迹：刚刷过的新油漆盖住儿童涂鸦；电话留言听到一半被剪断；工厂档案柜被焊死；居民楼门缝里塞进新水泥；录像带被反复覆盖。这些不是背景细节，而是每关Boss机制。\n\n在第二关“失真通讯站”里，电话亭门后是一座垂直广播井。无数播音室和电话窗口挂在井壁上，频道错位、回声诱导、检修板坠落。人物目标表面上是接通正确频道，实际考验是“听完”。空间会不断把晓晓的留言剪成乖巧版本，只留下“爸爸你忙吧”“我没事”，剪掉“你能不能不要每次都说下次”。\n\n王波在这一关最像《外星居民》里的非人逻辑翻译者，他以为自己能用类型片和电台知识控制局面，结果每次解释都被旧喇叭复制成一群王波同时装懂。张杭杭嫌话筒油，拿卸妆巾擦话筒，擦掉的污渍里露出赵斌当年的维修签名。赵蔚听见哥哥声音，第一次失态。她仍然不肯全说，只说“这声音我好像听过”。\n\n第二关中段，周凯的声音第一次出现。他不是鬼，而是系统里一段重复求救：“王波，规则你不是会看吗？这是不是隐藏通道？”王波强行解释为声音诱导，但他的脸已经不对。麻花听见后没有害怕，只问：“他是不是还在等你回答？”这句让王波后续的社死喜剧带上压力。\n\n## 3. 中点反转：第6集，世界性质改变\n\n第三关“夜班工厂”是全剧前半季动作峰值。工厂外壳来自90年代国营机械厂，内部却长成垂直制度巨构：吊轨、输送带、探照灯、盖章机、巡检机械、交接班广播和三层厂房残片不断向上复制。表面目标是完成夜班交接，实际考验是对抗父亲的缺席。\n\n第5集主打动作和冒险喜剧。邹青伪装夜班工人，工牌挂反；王波试图理解交接流程，被盖章机连盖三次“无效人员”；张杭杭摔进油污，第一反应是“这衣服到底还能不能洗”；赵蔚发现每次巡检盖章的位置有微差，说明它不是固定程序，而是在实时找什么。麻花只要靠近某些区域，探照灯就会先扫她。前半集观众可以把这理解成鬼屋在追小孩。\n\n第6集进入工厂档案室，必须爆炸式反转。档案室不是旧文件堆，而是南建林的记忆修补后台：每个柜子都挂着“待修复”“待删除”“版本覆盖”的纸牌。王波在柜里找到南建林工牌，上面不是密室公司职位，而是“晓晓记忆修补工程负责人”。张杭杭发现一张全家福，照片里的小女孩长着麻花的脸。赵蔚在另一个柜里找到赵斌的维修记录：赵斌曾负责通讯站和工厂之间的备份线路，最后一次登记写着“发现MH-08无法删除，建议停机”。\n\n中点反转在这里完成：这不是闹鬼、不是普通密室、不是商业杀局，而是某个人的私人记忆系统。南建林不是远处Boss，而是正在系统里修补记忆的父亲。麻花不是普通NPC，也不是单纯鬼魂，她与“MH-08”异常数据有关。\n\n工厂还没走完，绿色居民楼铁门提前出现在档案室墙上。门后传出老电视声和水壶烧开的声音。王波想按流程先通关工厂，铁门却像磁铁一样吸走麻花。邹青冲过去抓，张杭杭和赵蔚也被牵连，队伍被迫跌入第四关。观众第一次意识到：关卡开始渗漏，“通关即安全”的预期失效。\n\n## 4. 第7集瓶集：危险不靠新空间，靠人终于说真话\n\n第7集设计为人物瓶集。场景尽量复用居民楼楼道、两个房间、半截电梯井、天台门和一条重复楼梯。团队被楼体拆成两组：邹青和张杭杭困在一间不断重排的旧出租屋；王波、赵蔚和麻花困在另一组楼道与电梯井之间。\n\n邹青和张杭杭这条线是前任旧账总爆发。房间会复制他们过去合租时最狼狈的细节：蛋白粉桶堵住门、化妆品堆满洗手台、跑步机占半个客厅、没倒的垃圾、吵架后没收的钥匙。危险是真的：房间在缩小，窗外不是街道而是无底楼井，门每次打开都是同一间屋。喜剧来自他们在快被压扁时还在争谁当年更不讲卫生。真正解法不是蛮力，而是邹青第一次不用踹门，改用对讲机哄门里的童年残影开锁。他的标签失效：不能用力，只能说话。\n\n王波、赵蔚、麻花这条线揭赵斌。楼道墙上出现赵斌留下的维修标记，赵蔚终于承认：她不是凑数来的，她查了很久星星岛事故，哥哥赵斌当年进入过南建林的项目，之后失踪。她第1集偷拍登记簿，是因为登记簿上又出现哥哥名字。王波发现自己论坛里某个老账号“斌哥修电台”可能就是赵斌，他当年还回复过对方一条“这种都市传说别当真”。这让王波和赵蔚的关系有了真实刺点。\n\n本集的关键是标签失效与互换。王波必须闭嘴爬进电梯井修卡住的门锁；赵蔚必须第一个开口，指挥他别碰哪根线；张杭杭必须把手伸进满是灰尘和水渍的洗手池里拿钥匙；邹青必须用安静的语气哄一个被门困住的小孩残影。笑点仍然生活化，但它推动人物变化。\n\n第7集结尾，他们没有真正逃出居民楼，只是合流到楼体中庭。中庭上方复制出无数一样的门，每一扇门后都传来不同版本的晓晓等待声。\n\n## 5. 第二反转：第8集，系统不是保护麻花，而是在删除她\n\n第8集继续重排居民楼，完成第二反转。前半集表面目标是找到真正的“家门”。他们需要在无数复制门中识别哪一扇属于晓晓。赵蔚凭门牌、电视声、水壶声、拖鞋摆放和门缝风向找到正确门；张杭杭用反光看见有些门里没有麻花影子；王波第一次不再急着解释，而是把大家的信息记下来；邹青负责带麻花穿过会横移的电梯井。\n\n南建林的修补痕迹在这一集变得明显：某些墙上有刚刷的新白漆，白漆下透出儿童涂鸦；某扇门被新水泥封住，水泥还没干；旧电视机播放到晓晓哭的片段时，画面会自动跳到她笑的片段。主角团发现，真正危险并不是居民楼本身，而是“修补程序”在追着删掉不合格片段。\n\n反转证据来自赵斌留下的最后一条维修日志：“MH-08不是病毒，是原始记忆残留。删除程序会误伤主体。建议停机。”紧接着楼体启动删除协议，所有门同时打开，里面伸出白色油漆般的光，光不是追主角，而是精准追麻花。前面几集看似随机的球池塌陷、广播断音、探照灯锁定、门缝吸力，全部被重新解释：系统一直在试图删除麻花，因为她不是南建林想保存的乖巧晓晓，而是真实晓晓里不听话、委屈、脏兮兮、不完美的一部分。\n\n麻花名字在这一集回收。第1集张杭杭因为她辫子拧得像麻花，随口叫她“麻花”；第8集旧电视播放晓晓小时候的视频，南建林手忙脚乱给她扎辫子，扎得一团乱，晓晓妈妈笑说“像麻花”。这个名字不是NPC标签，而是家庭记忆。麻花听见后第一次不反驳，也不戳穿别人，只是摸了一下自己的辫子。\n\n第8集结尾目标升级。王波说如果系统在删她，那出口不是目的，先得把她送到能保存原始片段的地方。赵蔚补出赵斌日志的下半句：“唯一不被修补程序覆盖的区域，是回放街区原始母带。”于是后四集进入护送模式：他们不是玩家逃生队，而是临时护送队。\n\n## 6. 第9集：空间复访，世界从五关变成一个整体\n\n第9集打破程序化闯关，做一次主动复访。居民楼中庭顶端裂开，露出旧百货楼天井，天井下方可以看到第一关儿童乐园的球池、第二关广播井的喇叭、第三关工厂吊轨和居民楼门牌同时悬挂。观众第一次看到：这不是五个互不相干的关卡，而是一座由同一段记忆折叠出的整体空间。\n\n他们必须主动回到第一关儿童乐园，取第2集错过的一张贴纸。那张贴纸不是钥匙，而是晓晓原始母带的索引。复访让空间资产回收，也让角色成长可见：邹青经过小洞时不再硬挤，而是先问麻花“你以前怎么过去”；王波看到规则牌先闭嘴，让赵蔚先看微差；张杭杭这次不嫌球池脏，直接趴进去摸排水口；赵蔚不再等大家问，主动指出最危险的玩偶巡游车已经换了路线。\n\n喜剧升级为标签互染。邹青突然说出一句赵蔚式判断：“等一下，我觉得这不对，刚才那个熊没响。”全队愣住三秒，张杭杭说“你刚刚是不是长脑子了？”王波为了通过软包区，学邹青用身体扛门，结果胳膊抽筋；张杭杭用王波式规则语言指挥大家“按三拍节奏走，不要抢拍”；赵蔚学张杭杭用镜面判断角度，还嫌弃地补一句“这灯确实显脸黄”。这些不是段子，而是关系进化的可见证据。\n\n周凯残影在复访中再次出现。他重复第1集被吞前的动作：撕贴纸、回头问王波“这是不是隐藏通道”。这一次王波没有喊“别乱动”，而是先回答他：“不是，你先别进去。”可残影仍被卷走。王波意识到周凯不是普通幻觉，而是被系统覆盖到只剩最后一段动作的人。\n\n护送倒计时第一次可视化：逃离前，张杭杭发现麻花一边辫子褪色，像被旧录像洗掉了颜色。麻花自己摸不到变化，反而问张杭杭“是不是不好看了”。众人由此明白，删除协议不是抽象威胁，而是正在逐集发生。\n\n第9集结尾，众人拿到贴纸索引，却也暴露了麻花的位置。南建林的修补程序从四个关卡同时启动：油漆、广播静音、工厂盖章、居民楼封门一起向中心收拢。回放街区入口出现——一间旧音像店，玻璃门上贴着“本店出租VCD、可修复家庭录像”。这张贴纸索引会在第10集成为定位原始母带的唯一办法。\n\n## 7. 第10集：假希望，让人物以为还来得及救活晓晓\n\n第五关“回放街区”不是单一音像店，而是一座被反复播放的旧商圈夜城。音像店后门通向夜市街、百货楼、照相馆、医院门口、公交站、牛杂摊、手机维修铺和地下通道。每条街都像VCD卡顿一样回放同一段时间：红绿灯闪、店招嗡鸣、磁带倒带、行人重复一个动作。空间的危险是录像覆盖：如果站在同一段回放里太久，人会被替换成画面里的路人，逐渐失去自主动作。\n\n第10集的冒险目标是找到“原始母带”。喜剧来自他们用家庭影音经验解决世界级问题。王波第一反应找遥控器，说“所有播放设备都有退出键”；张杭杭忙着找充电宝，因为她的补光灯只剩3%；邹青觉得录像带坏了就该拍两下，结果一拍，整条街倒带三十秒；赵蔚提醒别碰磁头，被所有人嫌她太细，下一秒画面花屏把邹青半截身体变成雪花。\n\n假希望在中段出现。王波在音像店后台看到一个接口标注“LIVE 同步端口”。系统显示仍有一个活体端正在与记忆空间同步。众人瞬间以为晓晓没有死，而是病床上的意识还连着系统。邹青立刻进入“还能救”的状态，张杭杭想找医院入口，赵蔚也动摇，因为哥哥赵斌可能同样还在某个同步端里。麻花却没有露出希望，她只看着屏幕说：“你们大人一看到还能救，就不想听已经发生过的事。”这是本集唯一戳穿型台词。\n\n南建林的当前行动在这一集变成直接对抗。录像店里的剪辑台自动启动，把所有不漂亮片段剪成短视频般的温情合辑；晓晓不吃药、等电话、撕照片、发脾气、跑出医院的片段都被抹掉。张杭杭本能想修复画面，后来意识到自己越修，越接近南建林的错误。她第一次选择保留脏点、跑焦、闭眼、哭声和背景杂音。\n\n第10集后半，假希望破裂后，众人第一次真正执行“听完已经发生的事”：周凯残影即将被回放街区清空，救他会耽误进入母带室，也会暴露麻花坐标。王波选择停下，回答周凯被吞前那句没有被回答完的话。团队在倒带街区中救出周凯的完整求救，完成“人优先于规则”的转折。随后他们用第9集取回的贴纸索引，在成百上千盘无标签录像带中匹配到原始母带盒。盒上两根同步线露出真相：一根已断，标签“晓晓”；另一根仍亮，标签被油漆盖住。王波刮掉油漆，露出“南建林”。假希望落下：晓晓已不在，活体同步连的是南建林自己。与此同时，麻花的声音开始混进磁带杂音，删除进度进入第二档。\n\n## 8. 第11集：父亲也是受困者，终局变成双重救援\n\n第11集揭示真正反转：南建林为了保存晓晓，把自己也半录进系统。他不是坐在外面操控一切的冷酷反派，而是第二个受困者。他的身体在现实中靠设备维持，意识不断在系统里修补记忆。他每一次盖掉涂鸦、剪断留言、焊死房门、覆盖录像，都是在阻止自己看见一个他承受不了的事实：晓晓已经病故，且她最后想要的不是被保存成乖女儿，而是被听完。\n\n第11集不再承载周凯救援，开场直接进入最终母带室。南建林出现，但不是反派登场，而像一个被录像卡住的父亲。他一会儿在剪辑台前，一会儿在医院病房，一会儿在工厂夜班，一会儿在乐园门口，说明他也被自己修补出的空间撕成多个版本。麻花面对他，不是喊“爸爸救我”，而是问：“你能不能这次别剪？”\n\n第11集结尾完成情感爆点：众人播放原始母带。里面的晓晓不漂亮、不乖、会哭、会发脾气、会把照片塞进嘴里、会说不想吃药、会说讨厌爸爸每次都说下次。南建林本能要按删除，邹青挡住他，王波不再解释，张杭杭保留所有脏画面，赵蔚把赵斌最后一条日志读完，麻花站在画面中央。系统开始崩塌。\n\n## 9. 第12集：出去的代价，是带不走她的脸\n\n第12集冷开场播放完整版晓晓录像，不再是碎片。观众终于看见前11集所有冷开场来自同一天：晓晓出院后短暂外出，去过乐园、电话亭、工厂门口、居民楼、旧商圈。她不是一直快乐，也不是一直悲惨。她有笑，也有闹；有任性，也有懂事；有不漂亮的表情，也有真实的愿望。她只是想有人把这一天从头到尾看完。\n\n终局不是击败南建林，而是让他看完。南建林几次想暂停、快进、剪掉，主角团用一路学来的东西阻止他。邹青不用蛮力破坏设备，而是站在南建林身边，像陪麻花一样陪他看；王波把所有规则文档关掉，承认“这一段不能攻略”；张杭杭把画面里的哭声、噪点和难看表情都保留下来；赵蔚把哥哥赵斌当年没能发出的警告补进时间线；麻花不再做提示，只安静看着南建林。\n\n南建林终于承认晓晓已经病故。他不是被惩罚，而是被迫从“保存”回到“哀悼”。系统停止删除麻花，但代价是：麻花不能被完整带出系统。她是原始记忆残留，离开母带室就会被现实记忆规则抹去五官。四个人可以选择快速逃出，保留自己的完整记忆；也可以选择把最后时间用来记录麻花的声音、话和存在，但他们将带不出她的具体脸。这个选择回应主题：记住不是拥有，陪伴也不能逆转失去。\n\n他们选择后者。王波删掉准备发布的攻略文档，又从回收站拖出来，最后保存到一个名叫“不发布”的文件夹；张杭杭拍下最后一段影像，没有美颜也没有剪辑；邹青把手机镜头放低，不再让自己占画面中心；赵蔚把哥哥赵斌日志、周凯救援记录、麻花声音和母带转存到本地备份；没有发公开平台，只在队友面前说出“我害怕，但我看见了”。麻花说的最后一句不做金句，只像小孩一样普通：“那你们下次别迟到了。”\n\n出口打开，四人回到星星岛儿童乐园前台。外面只过去一夜，保安监控里显示他们进入空店后消失了几个小时。店里没有麻花，登记簿上没有她的名字。周凯现实层定案：保安和急救人员在商场配电间发现昏迷的周凯，他还活着；醒来后，他只记得黑暗里有人终于回答了他一句“听见了”。赵斌的维修记录在赵蔚手机里留下一段乱码，证明哥哥不是完全被救出，但他的最后警告没有白费。随后保安推开商场三层一间写着“设备间/闲人免进”的旧机房，看见旧服务器、录像采集卡、监护仪、缠在一起的电源线和躺在折叠床上昏迷的南建林。现实不解释原理，只让观众看见他也被困在系统里。\n\n结局代价落实：四人都记得有一个小女孩，记得她的辫子、声音、马甲、说话方式和一路上发生的事，却怎么也想不起她的具体五官。张杭杭打开最后合照，照片中央不是完整脸，而是一块像录像带损伤的空白。王波想立刻写分析，敲下标题《星星岛密室通关攻略》后停住，改成《请把话听完》，又拖进“不发布”文件夹。\n\n最后一场，四人在空商场门口拍合照。邹青下意识摆pose，王波下意识讲构图，张杭杭下意识找美颜，赵蔚下意识站边上。他们同时停住，给中间留出一个小小空位。照片不好看，中间也没有人，但这次他们知道空位是给谁留的。\n\n---\n\n# 三、人物小传（结构反转版）\n\n## 1. 邹青\n\n**身份与外形**：22岁，天然呆肌肉男，运动服、健身包、自拍杆，跆拳道黑带。张杭杭前任，王波室友，队伍行动担当。\n\n**人物核心**：邹青的核心不是“莽”，而是“表演式保护”。他小时候被欺负，长大后把身体练成盾，也把“必须有用”当成自尊。只要有人看着，他就想冲在前面；只要张杭杭在，他更不愿露怯。可这套机制在阈限空间里常常先添乱：儿童洞口卡住，广播井喊错方向，工厂里摆pose被重启机械打脸，居民楼踹门踹出复制房。\n\n**喜剧模式**：身体强，但场景总比他更荒唐。他越想帅，越狼狈；越狼狈，越有用。低配动作喜剧集中在他身上：蛋白粉桶当浮标、自拍杆当探路杆、钢管打机械、晾衣杆救人。他的笑点不能只是傻，而是“硬扛普通生活逻辑”：毒气来了他先吸一口证明不一定有毒，机械停了他先摆pose，居民楼着火他第一反应是搬最大柜子结果发现柜子里塞满咸菜坛。\n\n**结构功能**：第1-6集，他推动冒险动作；第7集标签失效，必须用嘴不用力；第8集后，他的保护对象从“大家看我救人”变成“护送麻花不被删除”；第12集，他不再冲在镜头前，而是给空位让出中心。\n\n**人物弧线**：从“我必须证明我能扛”到“我可以承认我害怕，但我会陪你看完”。\n\n## 2. 王波\n\n**身份与外形**：18岁，黑框眼镜游戏宅，密室论坛活跃用户，恐怖片和解谜游戏熟手，邹青室友。第1集约来的网友周凯成为他的个人责任。\n\n**人物核心**：王波最怕自己没用，所以不断用规则、电影、攻略保护自尊。他不是不会，而是太习惯先解释。旧设备、旧广播、旧录像不断打脸他，因为这些空间不是游戏逻辑，而是记忆逻辑。\n\n**喜剧模式**：王波每次说“这种我熟”，后面一定有半次错误。不是完全错，是差一点。电话线承重、录像带倒带、旧工牌流程、广播频道，他都能说出知识，但现实总多一个“低配问题”：线老化、遥控器没电、频道串台、盖章机卡纸。喜剧来自知识和低配现实的缝隙。\n\n**结构功能**：第1集因周凯被吞背负责任；第4集通讯站听到周凯和赵斌声音；第6集中点反转由他读出“记忆系统”文本；第7集必须闭嘴行动；第10集选择救周凯残影，完成从“规则优先”到“人优先”。\n\n**人物弧线**：从“我知道规则”到“我先听完人”。\n\n## 3. 张杭杭\n\n**身份与外形**：23岁，生活方式/美妆博主，邹青前任，学过护理相关课程，队伍里的表面信息读取者。\n\n**人物核心**：张杭杭不是浅层爱美，而是习惯把生活修成能发布的版本。她害怕脏、怕丑、怕失控，也害怕自己真实的狼狈被别人看见。她曾经通过镜头剪掉不舒服的细节，这与南建林剪掉晓晓真实片段形成主题对照。\n\n**喜剧模式**：极端危险里仍然先维权、护脸、嫌脏、找镜头。儿童球池吞人她嫌不卫生，广播话筒油她先擦，工厂油污她问能不能洗，居民楼地漏味她精准吐槽，回放街区画质差她想修。可这些“毛病”会变成技能：她能看出掉色、污渍、反光、残胶、剪辑痕迹和医学细节。\n\n**结构功能**：前半季她以为自己是记录者，第7集必须弄脏自己救人，第10集面对修复照片的诱惑，第11集选择保留所有不漂亮片段。她和邹青的前任线在第7集瓶集中爆发，之后不靠复合收尾，而靠彼此不再把对方剪成方便版本。\n\n**人物弧线**：从“把现实修好看”到“把真实保留下来”。\n\n## 4. 赵蔚\n\n**身份与外形**：20岁，消瘦、胆小、戴眼镜，恐怖片爱好者，潜水观察者。赵斌妹妹。她不是被临时拉来的，而是带着哥哥失踪线索进入密室。\n\n**人物核心**：赵蔚过去一直生活在哥哥保护下，哥哥失踪后，她习惯把自己变成一个安静的记录者。她不说，不是因为没看见，而是因为害怕一旦说出来，自己就必须承担后果。她偷拍登记簿、记住门牌、记录微差，都是为了找哥哥，也为了避免再一次“知道了却没说”。\n\n**喜剧模式**：赵蔚是乌鸦嘴型喜剧。她每次扫兴提醒都像恐怖片弹幕，往往下一秒成真。别人觉得她神经紧绷，事实证明紧绷在这个空间里是优势。她的笑点不靠大声，而靠小声补刀：“这不是出口，是它想让我们以为这是出口。”\n\n**结构功能**：第1集偷拍登记簿；第4集听到赵斌声音；第6集发现哥哥维修档案；第7集瓶集揭开自己目的；第8集读出“MH-08删除失败”日志，完成第二反转；第11集读完哥哥最后警告，帮南建林和主角团面对真实。\n\n**人物弧线**：从“我只是觉得不对”到“我确定这里不对，跟我走”。\n\n## 5. 麻花 / 晓晓 / MH-08\n\n**身份与外形**：8-10岁小女孩形态，不合身马甲、低饱和衣物、麻花辫。她是晓晓真实记忆残留，系统编号MH-08，不是普通NPC，也不是万能钥匙。\n\n**人物核心**：麻花是南建林删不掉的“错误数据”。她代表晓晓不漂亮、不乖、不好被保存的部分：等不到爸爸的委屈、不想吃药的抵触、发脾气的难看表情、被剪掉的哭声。系统一直想删除她，因为她会破坏南建林的完美女儿版本。\n\n**喜剧模式**：麻花不负责高频金句。每集最多一句戳穿型话。她的幽默应该像小孩的实话：邹青卡洞，她说“你不是说你能保护我吗”；王波解释太多，她说“你是不是不知道”；张杭杭拍她，她问“你会不会把我修掉”。她不是小大人，不能变成编剧嘴替。\n\n**结构功能**：前5集她被误认为导游/鬼魂/钥匙；第6集身份第一层反转为全家福里的晓晓；第8集第二层反转为删除失败的错误数据；第10集面对假希望不兴奋，因为她知道“救活”会让大人再次逃避已经发生的事；第12集她无法完整带出系统，成为结局代价。\n\n**人物弧线**：从被大人当线索，到被大人真正看见；从“引路”到“被护送”。\n\n## 6. 南建林\n\n**身份与外形**：40-45岁，技术强、生活笨的父亲。不是单纯高冷反派，而是把陪伴外包给系统、把哀悼误认为保存的人。\n\n**人物核心**：南建林不愿面对女儿已病故。他用技术收集照片、录像、声音、空间模型、电话留言和家庭物件，试图保存一个永远八岁、永远乖巧、永远不痛苦的晓晓。问题是，真实晓晓不是这样。她会发脾气、会难看、会等不到电话、会讨厌爸爸说下次。\n\n**现在时行动**：从第2集开始，他一直在系统里“修补”：盖住涂鸦，剪掉留言，焊死门，覆盖录像。他每关的Boss机制就是修补程序，不是怪物随机攻击。第11集揭示他把自己也接入活体同步端口，已经不是操控者，而是被自己系统困住的人。\n\n**人物弧线**：从“我要留下完美女儿”到“我必须看完真实女儿”。他被打败，不是被杀死，而是被迫哀悼。\n\n## 7. 赵斌\n\n**身份**：赵蔚哥哥，过去强势保护她。新版中改为南建林早期记忆系统的兼职维护员/旧学生，曾在星星岛项目中负责通讯站与居民楼备份线。\n\n**结构功能**：他让主角团与主线建立血缘关系。赵蔚进密室是为了找他；王波曾在论坛上忽略过他的警告；他留下的维修日志揭示麻花不是病毒，而是原始记忆残留。第7集正式揭赵蔚秘密，第8集他的日志引出第二反转，第11集他的最后警告补齐真相。\n\n**情感功能**：赵斌不是要回归成新主角。他是赵蔚从被保护者走向主动判断的缺席动力。\n\n## 8. 周凯\n\n**身份**：王波论坛网友，网名“K哥不怕鬼”，第1集线下面基就被机关吞走。\n\n**结构功能**：他是路人玩家契诃夫之枪。第1集吞人证明危险，第4集声音出现，第9集残影复访，第10集后半形成救不救残影的道德抉择，第12集现实层定案为昏迷但活着。\n\n**情感功能**：他逼王波把“规则”落到具体的人身上。王波不能再把每个消失的人当“机制损耗”，因为周凯是他亲手约来的人。\n\n---\n\n## 9. 周姨\n\n| 项目 | 内容 |\n| --- | --- |\n| 姓名 | 周姨 |\n| 身份 | 南建林为晓晓请的居家照护者/护工，负责送药、饮食、房间整理、转交外来信件和陪同外出。她不是反派，也不是线索专家，是晓晓病中日常生活的现实见证人。 |\n| 性格 | 温和、怕事、职业化地安慰人。她会把难看的事说成漂亮话，比如“画点好看的”“别让爸爸担心”，不是恶意，而是不知道怎么面对小孩的病痛和父亲缺席。 |\n| 与晓晓关系 | 晓晓生活上依赖她，但情感上不完全信任她。周姨能把药递到手边，却很少把晓晓的话听完；因此她是“照顾到了身体，没有听见心里话”的成年人样本。 |\n| 出场范围 | 主要用于第7集冷开场、第8集卧室碎片、第12集完整版回放；不要扩写成独立阴谋线。 |\n| 写作禁区 | 不要写成恶毒保姆、帮凶、掌握系统秘密的人；不要让她解释南建林技术。她只负责提供生活质感和“被温和忽略”的痛点。 |\n\n---\n\n# 四、12集详尽分集大纲\n\n## 第1集：星星岛内测\n\n**冷开场：晓晓DV碎片01。** 镜头是低像素DV，星星岛儿童乐园门口，晓晓举着掉色贴纸说想再玩五分钟。镜头外的南建林说“下次吧，爸爸今天真的忙”。画面突然卡顿，儿歌声变形。\n\n正片从王波的论坛聊天开始。王波在密室论坛里约了网友“K哥不怕鬼”周凯参加星星岛内测，嘴上嫌弃邹青是健身博主来蹭素材，心里却想证明自己在密室圈真有号召力。邹青来得最晚，带自拍杆和蛋白粉样品，声称这次不是玩，是工作。张杭杭因为品牌探店临时到场，一进门就嫌星星岛门头像倒闭亲子乐园，顺手拍“县城密室避雷”。赵蔚最安静，她一进门就盯着登记簿，并趁大家吵团购券时拍下几页，其中一页出现赵斌名字。\n\n星星岛前台像一个混合了儿童乐园、音像店和社区活动室的旧空间：生日套餐灯箱、掉色海报、摇摇车、旧电视、手写价目表和小矮门。麻花从柜台下钻出来，马甲不合身，发辫有一股乱拧的劲。张杭杭顺嘴说“你这辫子跟麻花似的”，麻花没否认，名字由此形成一个轻喜剧点。\n\n周凯第一个闯入矮门。他以为这是沉浸式项目，回头冲王波喊“隐藏门我先进了”。软包门在他身后闭合，里面传来滑梯滚落声和短促呼救。王波还想按规则找工作人员，邹青已经掰门，张杭杭拍证据，赵蔚提醒“掰坏了可能算你赔”。几秒后，周凯的手环从门缝弹出，屏幕显示“玩家残留已记录”。这一下让所有人确认危险是真的。\n\n本集结尾，四人被迫带着麻花钻入矮门。门后不是储物间，而是无限扩张的软包长廊。王波看到论坛旧帖，判断星星岛是旧事故冤魂密室。观众被喂到第一层错误解释：他们闯进了一个以商场失踪儿童为主题的鬼屋。\n\n**冒险钩子**：周凯被吞，门后空间不可能存在。  \n**喜剧钩子**：众人先退票、投诉、拍证据、掰门，完全不像英雄。  \n**真相钩**：赵蔚偷拍赵斌名字，王波背上周凯责任。\n\n## 第2集：欢迎进入乐园\n\n**冷开场：晓晓DV碎片02。** 晓晓坐在海洋球池边，镜头外有人催她“鞋脏了，别下去了”。她把一颗掉色蓝球藏进口袋。画面卡成雪花。\n\n儿童乐园关正式展开。小门后是一片无边海洋球坡地，球池向下塌陷，像会吞人的低配海。软包墙移动，滑梯通向不同楼层，远处有玩偶巡游车拖着电线唱走调儿歌。空间用儿童尺度羞辱成年人：麻花轻松钻洞，赵蔚勉强过去，张杭杭边嫌脏边爬，王波眼镜被蹭歪，邹青肩膀卡住还嘴硬说这是背阔肌发达。\n\n麻花被球潮卷走。邹青跳进去救人，刚摆出英雄姿势就下沉到胸口。张杭杭一边骂他净添乱，一边把自拍杆伸过去；王波说儿童安全绳不承重大人，赵蔚提醒“多根电话线和背带可以分散受力”，结果几个人用自拍杆、蛋白粉桶和安全绳做出临时浮标，把麻花拖出来。张杭杭嫌球脏，反而发现掉色球只沿着一条水流漂，顺着找到隐藏排风口。\n\n本集的笑点都来自真实危险中的生活反应：张杭杭不断问这些球有没有消毒；王波在球池边研究“游乐场标准逃生结构”，三次套错；邹青几次救人姿势都难看；赵蔚一边害怕一边说“如果我是恐怖片里的人，这里应该会塌”，说完真的塌一块。麻花看着他们，第一次说：“你们大人好吵。”这是本集唯一戳穿型台词。\n\n后半集出现南建林的第一处修补痕迹：一面软包墙上有刚刷的新漆，漆下透出儿童涂鸦：“爸爸没有来。”张杭杭想擦开，新漆像活物一样往回覆盖。王波仍把它解释为鬼屋特效。赵蔚却记住这句涂鸦和赵斌名字之间的奇怪联系。\n\n结尾，众人找到员工门。门后不是出口，而是电话亭。电话亭里响起一个孩子留言：“爸爸，我在星星岛……”后半句被剪断。\n\n## 第3集：电话亭后面的广播井\n\n**冷开场：晓晓DV碎片03。** 晓晓在旧电话亭里投币，拨号，听见忙音。她对着听筒说“你能不能……”画面突然被杂音切掉。\n\n电话亭挤得下不合理。邹青几乎贴在门上，王波拿起油腻话筒，张杭杭嫌弃到拿卸妆巾擦，赵蔚发现投币口里有旧电话卡，卡背有一处被磨花的维修签名，只能看见一个“斌”字。王波拨号后，电话亭门打开，后面是一座看不到顶的垂直广播井。\n\n广播井四壁挂满播音室、学校广播喇叭、公共电话窗口和有线电视机箱。声音会改变空间：谁大声说话，声音就被喇叭复制；谁听错，脚下检修板就移位。邹青听见假张杭杭呼救，冲过去差点坠落；真正张杭杭就在后面骂他“你到底多想听我叫你”。王波试图解释声学规则，结果他的讲解被几十个喇叭循环播放，像一群王波同时装懂。张杭杭擦话筒时擦出更清楚的维修签名，赵蔚脸色变了，但她仍不说。\n\n南建林的修补痕迹从这一集开始明显：某些留言播放到孩子委屈处就被自动剪断；录音带被贴上“情绪异常，建议降噪”；一扇播音室门被新焊条封住。广播井Boss不是怪物，而是“静音维修程序”：它会切断不合格留言，把人推向“乖巧版本”。此时观众仍可理解为“旧商场事故的鬼屋机制”，第6集反转压力不提前泄掉。\n\n周凯声音第一次出现：“王波，这是不是隐藏通道？”王波强行解释为诱导音，麻花问：“那你为什么不回答他？”王波被噎住。喜剧桥段转为压力：他拿着旧电话线当安全绳时一直嘴硬，说“论坛网友本来就风险自负”，脚下一滑，邹青一把拉住他，骂他“人都没了你还嘴硬”。\n\n结尾，他们接通一段晓晓留言。她说“爸爸，你忙就算了”，系统判定正常；赵蔚却听出底噪里还有一句被剪掉的话，但噪声太重，她只能听见两个字：“小蔚。”她整个人僵住。王波问她怎么了，她只说可能听错。广播井瞬间停电，通向下层主控播音室的检修梯显影。\n\n**冒险钩子**：电话亭通向垂直广播井，检修板随声音移位。  \n**喜剧钩子**：王波装懂被喇叭无限复制，张杭杭在高空还要擦油腻话筒。  \n**真相钩**：只留“小蔚”二字，不提前抛出完整警告。\n\n## 第4集：失真的留言\n\n**冷开场：晓晓DV碎片04。** 她拿着电话听筒睡着，另一边仍是忙音。画面边缘出现一只成年男人的手，想拿走听筒，画面断。\n\n第4集继续通讯站，但重点不是新奇观，而是“听完”。团队要穿过广播井下层，找到真正的主控播音室。这里的检修板悬在半空，所有人必须用旧电话线、耳机线和相机背带绑成临时安全绳。王波坚持承重不够，邹青说自己先试，赵蔚冷冷补一句“先试最重的确实最危险”，张杭杭则把自己的相机背带贡献出来，嘴上还在骂“这条背带比你们都贵”。\n\n本集继续用《小镇滋味》式逻辑处理极端危机：他们在高空坠落风险里还在争话筒脏不脏、线是谁缠乱的、耳机是谁扯坏的。王波必须复述晓晓留言，不能添解释；张杭杭用化妆镜反光看见主控室玻璃后的维修表；赵蔚终于承认那声音像她哥哥赵斌，但她仍然不愿说哥哥和星星岛的关系。\n\n主控室里播放三段版本：一段是系统修补版，晓晓乖巧；一段是南建林记忆版，晓晓懂事；一段是原始底噪版，晓晓哭着抱怨。王波本能想选最清楚的一段，赵蔚第一次强硬制止：“清楚不等于真实。”这是她在团队中的第一次主动判断。\n\n南建林的修补程序出现为“广播检修员”残影，拿着剪线钳不断剪掉哭声。邹青想硬打，发现打的是声音残影；张杭杭用口红壳反光找到真正控制线；王波闭嘴按照赵蔚指令接线；麻花补出最后一个方言词。留言完整播放后，广播井停止坠落。\n\n结尾，赵蔚再次调出第3集那段“小蔚”杂音。王波用旧录音机慢放，完整警告终于出现：“小蔚，如果你听到这里，别相信修补后的版本。”这句话只在第4集结尾出现，既推进赵斌线，又不破坏第1-5集“旧事故/鬼屋”的误导层。随后通向夜班工厂的管道打开，工厂广播响起：“南师傅，夜班结束前，请记得接孩子。”\n\n**冒险钩子**：广播井下层悬空攀爬，静音维修程序剪断真实留言。  \n**喜剧钩子**：相机背带、旧耳机线、电话线拼成低配安全绳。  \n**真相钩**：赵斌完整警告后移到本集结尾。\n\n## 第5集：夜班工厂\n\n**冷开场：晓晓DV碎片05。** 工厂大门外，晓晓坐在门卫室小凳子上，拿着画纸等人。门卫说“你爸今天夜班，别乱跑”。她把画纸翻过去，背面是红色涂鸦。\n\n夜班工厂是全剧前半段动作升级。工厂平面外壳很旧，但内部长成垂直巨构：吊轨在头顶来回运转，输送带穿过半空，检修梯像骨架，盖章机、工牌机、探照灯、巡检机械不断复制。表面谜题是完成交接班流程，实际考验是如何在父亲缺席的制度机器里活下来。\n\n五个人被迫伪装夜班工人。邹青穿工服像健身广告，工牌挂反；王波认真研究流程，被盖章机连盖“无效人员”；张杭杭嫌工服沾油，转头发现油污新旧程度不同，说明有路线被最近经过；赵蔚看出每一次巡检机械盖章位置有微差；麻花一靠近某台机器，探照灯就会优先扫她。\n\n冒险喜剧是“菜鸟伪装夜班”。他们要在吊轨下降前通过输送带，王波把工厂流程讲成游戏副本，邹青上去就被吊钩慢慢吊起，还嘴硬说“我在观察上层路线”；张杭杭用口红壳当反光镜，发现侧面检修梯；赵蔚小声提醒“它们不是在巡逻，是在找一个特定目标”。邹青救下麻花时，巡检机械不是追他，而是绕过他继续追麻花。\n\n中段，周凯手环出现在输送带上，王波一瞬间失控，差点冲出安全区。张杭杭拽他回来，骂“你现在冲过去也只会多一条手环”。王波第一次承认周凯是他约来的。\n\n结尾，众人找到档案室外门，但门被新焊死。焊口还热，说明有人刚来过。王波开始动摇鬼魂解释：鬼不会刚焊门。南建林的现在时行动第一次成为清晰疑点。\n\n## 第6集：南师傅的工牌\n\n**冷开场：晓晓DV碎片06。** 工厂门卫室，晓晓睡着。南建林工牌放在桌边，旁边有纸条：“记得接孩子”。一只手把纸条揉掉。\n\n第6集必须完成中点反转。前半是档案室逃生：工厂巡检机械一分钟后重启，队伍要在吊轨和探照灯之间进入档案室。邹青打停机械后又想摆pose，机械提示“六十秒后重启”，他立刻收住；张杭杭拿掉落的工牌当镜子看路线，顺便骂“这工牌都比你会反光”；王波和赵蔚一起读流程，发现这不是工厂资料，而是记忆修补档案。\n\n档案室里摆满“待修复”“待覆盖”“待删除”的柜子。王波找到南建林工牌，职位写着“晓晓记忆修补工程负责人”。张杭杭翻到全家福，照片里八岁女孩就是麻花。赵蔚找到赵斌维修记录：哥哥曾警告“MH-08不是病毒，是原始记忆残留；删除会导致主体记忆崩塌”。她终于承认赵斌就是她哥哥，也是她进星星岛的原因。\n\n此时，前五集所有鬼屋误导翻转：星星岛事故是真的，但他们现在进入的不是冤魂密室，而是南建林的私人记忆系统。系统不是选拔玩家，不是杀人游戏，而是一个父亲错误保存女儿的空间生成器。麻花身份也第一次反转：她不是导游，而是全家福里的晓晓，或者至少是晓晓的一部分。\n\n工厂还未完整通关，居民楼绿铁门提前出现在档案室墙上。系统开始渗漏。麻花被门吸住，邹青、张杭杭、赵蔚扑过去拉她，王波还想拿档案，被吊轨砸断后路。众人一起被吸进居民楼。\n\n结尾字幕式信息不靠旁白，而靠视觉：铁门合上前，档案柜里露出一行“删除程序正在重新定位MH-08”。观众还不完全懂，但危机方向已变。\n\n## 第7集：重排居民楼（一）\n\n**冷开场：晓晓DV碎片07。** 居民楼门口，晓晓背着小包等电梯。周姨端药出来，她问“我爸今天会回来吗”。画面跳帧。\n\n第7集是瓶集。团队被楼体分开：邹青和张杭杭困在复制出租屋，王波、赵蔚、麻花困在楼道、电梯井和半间值班室之间。场景复用，重点靠人物戏和空间压迫。\n\n邹青/张杭杭线里，旧出租屋不断复制他们曾经合租时的狼狈细节：蛋白粉桶堵门、化妆品占洗手池、没倒的垃圾、跑步机卡在阳台、分手那天没收拾完的纸箱。危险是房间每循环一次就缩小一圈，窗外是无底楼井。两人一边找出口一边吵旧账。邹青想踹门，门踹开后还是同一间屋；张杭杭骂他永远只会用力。真正解法是邹青拿对讲机哄门里的儿童残影，让对方别害怕。他第一次不用力，只用笨拙语气安抚。\n\n王波/赵蔚/麻花线里，赵蔚正式揭赵斌秘密。她承认第1集偷拍登记簿，因为哥哥赵斌失踪前最后一次签名就在星星岛。王波发现自己论坛上曾无视过赵斌的旧警告。麻花坐在楼梯上，听他们争论“为什么不早说”。本集她只说一句：“你们都想等安全了再说，可这里没有安全的时候。”赵蔚被戳中。\n\n王波必须闭嘴爬进电梯井，赵蔚必须第一时间发号施令。张杭杭那边为了拿钥匙，必须把手伸进堵塞洗手池，彻底弄脏自己。标签失效完成第一轮。\n\n结尾，两组在楼体中庭合流。无数门打开，里面都是晓晓等待不同人的版本。楼上出现新刷白漆，白漆正一点点覆盖所有门牌。\n\n## 第8集：重排居民楼（二）\n\n**冷开场：晓晓DV碎片08。** 年轻的南建林给晓晓扎辫子，扎得歪歪扭扭。晓晓妈妈笑说“像麻花”。晓晓不高兴又忍不住笑。画面第一次温暖，但很快被白漆覆盖。\n\n第8集完成第二反转。众人要在无限居民楼中找到真正“家门”。赵蔚不再旁观，她主动识别门牌、拖鞋、电视声、水壶声和门缝风向。张杭杭用化妆镜看反光，发现有些门里没有麻花影子。王波不再抢解释，只记录每个人发现。邹青带麻花穿过横移电梯井时，不再说“我保护你”，而是先问“你害怕哪边”。\n\n中段，南建林修补程序大规模启动。新白漆覆盖晓晓哭闹涂鸦，新水泥封住她等爸爸的房间，电视机跳过她发脾气的片段。众人一开始以为这是空间阻止他们靠近真相，赵蔚在赵斌日志中读到真正内容：“MH-08为原始记忆残留，非病毒。删除程序多次失败，已开始主动捕捉。”\n\n就在此时，居民楼所有门同时打开，门里不是怪物，而是白色油漆般的光。光绕过邹青、王波、张杭杭、赵蔚，精准追麻花。前几关所有“随机危险”被重新解释：球池塌陷、广播剪断、工厂探照灯、居民楼吸力，都不是针对玩家，而是在删除麻花。她不是系统导游，是系统删不掉的真实晓晓。\n\n麻花名字回收。她看到电视里的小女孩被爸爸扎成麻花辫，第一次承认“那是我”。这个时刻必须给麻花极少数正面特写之一。她不哭，只是看着自己小时候笑，像终于记起一个不算完美但很真的名字。\n\n第8集结尾，王波提出新目标：如果系统要删麻花，逃出去没意义，必须把她送到赵斌日志里说的“原始母带区域”。赵蔚补充那就是回放街区。后四集进入护送模式。\n\n## 第9集：回到乐园取贴纸\n\n**冷开场：晓晓DV碎片09。** 晓晓把一张贴纸贴在录像带盒上，说“这样你们就不会拿错了”。有人把贴纸撕下，画面乱跳。\n\n第9集打破关卡封装。居民楼天井裂开，露出一座百货楼内井，前四关资产同时悬挂：乐园滑梯、广播喇叭、工厂吊轨、居民门牌都被折叠到一个巨大中庭。赵斌日志提示：去回放街区前必须取回第一关错过的贴纸索引。众人主动复访儿童乐园。\n\n复访的意义是展示人物成长。邹青看到小洞不再硬挤，先问麻花以前怎么过去；王波看见规则牌先让赵蔚观察微差；张杭杭不再嫌球池脏，直接趴下找排水口；赵蔚主动判断巡游车路线变化；麻花从被拉着走变成被护送在队伍中心。喜剧来自标签互染：邹青突然说“我觉得这不对”，全队停下看他；张杭杭用王波式语气讲三拍节奏；赵蔚学张杭杭吐槽灯光显脸黄；王波被迫用身体扛软包门，立刻抽筋。\n\n周凯残影再次出现。他重复第1集撕贴纸、回头询问、被门吞掉的动作。王波这次回答他，但仍无法改变循环。赵蔚判断周凯不是普通鬼魂，而是被覆盖到只剩最后动作的玩家残留。王波把“救周凯”放进任务清单，遭张杭杭吐槽“你终于知道攻略里要写人名了”。\n\n护送模式倒计时开始可视化。取贴纸时，张杭杭发现麻花一边辫子褪色，像被旧录像洗掉了颜色。麻花自己摸不到，反而问“是不是不好看了”。众人意识到，删除协议不是台词里的威胁，而是在现实地擦掉她。赵蔚把这记为“删除进度一档：颜色丢失”。\n\n他们拿到贴纸索引，却也暴露麻花坐标。四关修补程序同时启动，像多种灾害叠加。众人一路奔向旧音像店入口。第9集结尾，音像店卷帘门升起，里面灯管闪烁，柜台上摆着一台正在自动倒带的VCD。王波还想先研究播放机型号，张杭杭已经把贴纸攥在手心：“你最好祈祷这东西真的有用，我手都脏成这样了。”\n\n**冒险钩子**：主动复访乐园，在前四关折叠天井中取回贴纸索引。  \n**喜剧钩子**：角色标签互染，低配团队第一次像真正团队。  \n**真相钩**：麻花辫子褪色，护送倒计时第一档出现。\n\n## 第10集：活体同步端口\n\n**冷开场：晓晓DV碎片10。** 医院病房，晓晓看手机相册。她问“视频里的我是不是比现在好看”。镜头外没人回答。监护仪声混进录像底噪。\n\n回放街区外壳是旧音像店，内部是一座被反复播放的旧商圈夜城。街道、百货楼、医院门口、牛杂摊、公交站、照相馆、手机维修铺循环同一段傍晚。危险是录像覆盖：如果在同一段回放里停留太久，人会变成背景路人，重复同一动作。\n\n冒险喜剧来自家庭影音低配求生。王波找遥控器，认为所有播放都有退出键；邹青觉得VCD坏了就该拍两下，结果一拍整条街倒带三十秒；张杭杭手机没电，第一反应找充电宝；赵蔚看出每次红灯闪烁的秒数不同，说明有一条非循环路径；麻花开始出现第二档删除症状：她说话时，尾音混进磁带杂音，像快被录音机吞掉。\n\n中段出现假希望。王波在音像店后台找到“LIVE同步端口”，显示仍有活体连接。众人以为晓晓可能还在病床上，赵蔚也想到赵斌可能还活着。所有人突然兴奋，行动目标差点从护送麻花变成寻找现实病房。麻花却很平静。她说：“你们一看到还能救，就不想听已经发生过什么。”本集唯一戳穿型台词。\n\n张杭杭发现剪辑台正在自动修复录像：把晓晓哭声降噪，把病容调亮，把发脾气删掉。她一开始本能想帮它“修清楚”，后来意识到自己正在重复南建林的错误。她选择保留跑焦、噪点和难看表情。\n\n他们找到一面无标签录像带墙，上百盘盒子都没有字。第9集取回的贴纸索引终于响枪：冷开场09里，晓晓把那张贴纸贴在录像带盒右下角，贴纸撕下后会留下一个不规则胶痕。张杭杭靠胶痕和残胶颜色定位；赵蔚核对日期；王波按编号检索；邹青负责把最高处的带子一排排搬下来，边搬边抱怨“你们家童年怎么比我健身房还沉”。众人最终找到真正的原始母带盒。\n\n母带盒上两根同步线揭开假希望反转：一根已断，标签“晓晓”；另一根仍亮，标签被油漆盖住。王波刮掉油漆，露出“南建林”。晓晓已不在，活体同步连的是南建林自己。主角团第一次明确知道：父亲不是单纯外部操控者，他也在系统里。\n\n假希望破裂后，周凯残影被回放街区的清空程序推到前台。他仍重复第1集撕贴纸、回头问王波“这是不是隐藏通道”的动作，但这次残影的边缘已经变淡。系统提示“无关玩家残留，即将清空”。继续带母带离开更安全，救周凯会暴露麻花位置，也会消耗麻花所剩时间。王波停住，说：“我约他来的。我至少得回答他。”\n\n救周凯成为本集后半冒险高潮。邹青冲进回放动作里，被倒带三次摔回起点；张杭杭用VCD清洁布擦掉画面雪花，边擦边骂“这玩意儿比卸防水睫毛膏还难”；赵蔚背出每一次周凯动作的微差，指挥王波在正确一帧按暂停；王波手抖差点按到快进。最后他们救出的不是活人，而是周凯完整的最后求救。周凯终于把话说完：“王波，别装懂，先救人。”王波回答：“听见了。”残影安静下来，不再循环。\n\n第10集结尾，麻花声音里的磁带杂音更重，贴纸定位出的母带开始自动播放第一帧。母带室门打开，里面不是出口，而是病房、剪辑台、工厂值班室和音像店拼成的错乱空间。\n\n**冒险钩子**：回放街区会把人覆盖成路人，周凯救援移至本集后半。  \n**喜剧钩子**：遥控器、VCD清洁布、贴纸残胶、充电宝构成低配影音求生。  \n**真相钩**：活体同步连的是南建林，麻花声音进入删除第二档。\n\n## 第11集：请把话听完\n\n**冷开场：晓晓DV碎片11。** 画面不是快乐瞬间，而是晓晓哭、发脾气、把照片塞进嘴里、躲开药。录像多次被剪断，最后停在她说“你们能不能听我说完”。\n\n第11集不再分摊周凯救援，正面进入南建林和原始母带。母带室不是黑暗Boss房，而像一个由病房、剪辑台、工厂值班室和音像店拼成的错乱空间。南建林一会儿在剪辑台前，一会儿在医院病床边，一会儿在乐园门口，一会儿在工厂门卫室，说明他也被自己的修补系统剪成了多个版本。\n\n麻花删除进度进入第三档。她身体开始半透明，衣角和手指边缘像被磁带雪花吞掉。邹青试图用手挡住她的透明处，当然挡不住；张杭杭想拍她，镜头里却总是出现一块拖影；王波第一次没有解释这是“信号丢失”，只是低声说“我们得快”；赵蔚把这记成“删除进度三档：主体透明”。\n\n南建林出现，但不是外部操控者。他像一个极度疲惫、极度顽固的父亲，一边说自己只是想把晓晓留住，一边用剪辑台不断把母带修成能承受的版本。他剪掉哭声，调亮病容，覆盖吵架，把等待改成懂事，把“你能不能听我说完”改成“爸爸我没事”。这些动作就是前十集修补痕迹的源头。\n\n主角团这一次不用新谜题通关，而是用前十集学会的方式阻止他继续剪。邹青不砸设备，只挡在南建林和删除键之间；王波不写攻略，只按赵蔚的时间点停住播放器；张杭杭不修画面，反而保留跑焦、脏点、红眼和哭声；赵蔚读出赵斌完整日志：“MH-08不是病毒，是原始记忆残留。删除她，就是删除晓晓真正说过的话。”\n\n南建林的真实状态逐步暴露：他不是坐在现实里安全操控，而是把自己也接入了LIVE同步端口。每当母带播放到晓晓病故事实，他的身体影像就会卡顿、失真，系统自动把他拉回“我还能修好”的循环。他是加害者，也是第二个受困者。\n\n原始母带开始播放。晓晓不是南建林保存的乖巧女儿。她会难看，会生气，会等电话，会拒绝吃药，会讨厌别人说“下次”。最重要的是，她不是想被复活成漂亮版本，而是想让爸爸把这一天从头到尾看完。南建林几次想按删除，麻花看着他说：“这次你能不能别剪？”这是本集唯一麻花戳穿型台词，也是她和父亲的真正对抗。\n\n本集高潮是双重救援：救麻花不被删除，也救南建林从修补循环里出来。母带播放到最后，南建林终于没有按下删除键。他承认晓晓已经病故。系统不再把麻花标为病毒，但代价提示出现：原始记忆残留无法完整离开系统。母带室开始崩塌，出口打开，却要求他们做最后选择。\n\n**冒险钩子**：母带室崩塌，麻花半透明，所有人必须在系统坍缩前让南建林看完原片。  \n**喜剧钩子**：喜剧降频但不消失，王波几次想解释播放格式都被自己憋回去；邹青挡删除键像挡篮球，姿势很蠢但有效。  \n**真相钩**：南建林不是外部Boss，而是活体同步端口里的第二个受困者。\n\n## 第12集：空位\n\n**冷开场：完整晓晓录像。** 前11集碎片连成同一天。晓晓去乐园、打电话、在工厂门口等、回居民楼、走旧商圈、进医院。她有笑，有哭，有脏衣服，有不漂亮表情。她没有一直懂事，也没有一直悲惨。她只是一个没有被听完的小孩。\n\n正片承接母带室崩塌。南建林终于承认晓晓已病故，自己一直把保存误当陪伴。系统停止删除麻花，但麻花不能完整离开。四人必须选择：立刻逃出并保留自身完整记忆，或者把最后时间留给麻花，把她的声音、习惯和话记下来，但带不出她的具体脸。选择后者将造成记忆缺失。\n\n他们选择后者。每个人的变化落到具体动作：邹青不再抢前，蹲下来陪麻花慢慢走；王波把攻略文档改名为《请把话听完》，存进“不发布”；张杭杭拍最后一段，不美颜不修剪；赵蔚把哥哥赵斌日志、周凯救援记录、麻花声音和母带转存到本地备份；没有公开发布，只是第一次主动把真相说出来。麻花最后只是像普通小孩一样说：“下次别迟到了。”\n\n现实尾声，外面只过一夜。四人回到星星岛儿童乐园前台，灯箱仍亮，饮水机仍空，登记簿却多了几处变化。周凯现实层定案：保安和急救人员在商场配电间发现昏迷的周凯，他还活着。醒来后，他只记得黑暗里有人终于回答了他一句“听见了”。王波听到这个消息，没有立刻写论坛帖，只把周凯的名字从“失踪玩家”改成“已回应”。\n\n赵斌的记录仍是乱码。赵蔚没有得到哥哥完整归来，但她得到最后警告的完整意义：哥哥不是白白消失，他曾留下让他们停机、听完、别相信修补版的证据。赵斌可以保留为后续悬置，但周凯不再悬置。\n\n南建林现实锚落地。尾声里，保安推开商场三层一间写着“设备间/闲人免进”的旧机房。屋里不是奇观解释，而是现实可见的低配维持系统：旧服务器、录像采集卡、监护仪、缠在一起的电源线、贴着手写标签的硬盘，以及躺在折叠床上的南建林。他昏迷，仍有生命体征。镜头不解释原理，只让现实看见他一次，确认“父亲也是受困者”不是悬空设定。\n\n代价落实：四人都记得麻花存在，记得她说过什么、做过什么、一路上怎样看着他们，却想不起她具体五官。张杭杭打开最后合照，照片中央是一块像磁带损伤的空白。王波想发布攻略，最终没有发布。邹青第一次没有把镜头对准自己。赵蔚没有站到画面外。\n\n最后四人在星星岛门口拍合照。邹青下意识摆pose，王波下意识讲构图，张杭杭下意识开美颜，赵蔚下意识站边上。他们同时停住，给中间留出一个小小空位。照片不好看，中间也没有人，但这次他们知道空位是给谁的。\n\n**冒险钩子**：系统崩塌后的最后撤离与现实救援并行。  \n**喜剧钩子**：最后合照里四人还会本能摆pose、讲构图、开美颜、站边上，但都会停住。  \n**真相钩**：周凯现实定案为活着，南建林现实锚点落在三层旧机房。\n\n# 五、每集冷开场设计\n\n本节是分集快速索引。所有冷开场的连续性、天气、衣着、道具和时间顺序以**第2.6“晓晓那一天完整时间线”**为最高口径；分集编剧不得自行改动时间顺序。\n\n| 集数 | 快速内容 | 线索功能 | 对应时间线 |\n| --- | --- | --- | --- |\n| 1 | 周姨端药，晓晓要求重新扎麻花辫，电话里爸爸承诺“忙完去接你” | 建立周姨、病中生活、父亲缺席承诺；“麻花”名字来源 | 08:05 居民楼卧室 |\n| 2 | 晓晓在星星岛乐园入口等爸爸，镜头扫过开业海报和贴纸墙 | 建立乐园真实记忆外壳 | 09:10 星星岛乐园入口 |\n| 3 | 晓晓在球池边写下“爸爸没有来”，又用贴纸遮住 | 对应第2集新油漆修补痕迹 | 10:00 海洋球池/软包坡道 |\n| 4 | 电话亭里她只说出“爸爸，你能不能……”就断线 | “请把话听完”主题第一次形成 | 11:30 电话亭 |\n| 5 | 广播找走失儿童，晓晓误以为在找自己，把贴纸贴在电话卡背面 | 通讯站和贴纸链 | 12:15 广播站/电话亭旁 |\n| 6 | 工厂门口登记簿留下“接孩子”未完成指令 | 第6集中点反转前置 | 14:05 夜班工厂门口 |\n| 7 | 周姨带晓晓回居民楼，晓晓开始发低烧 | 人物瓶集与周姨条目落地 | 16:40 居民楼楼道 |\n| 8 | 晓晓画白花，背面是红色；问“他们有来消息吗” | 第8集“那是我”认知节点 | 18:10 晓晓卧室 |\n| 9 | 南建林带晓晓去取生日录像，晓晓把贴纸贴到录像带盒侧边 | 第9集贴纸索引必须第10集响枪 | 19:05 旧商圈/音像店入口 |\n| 10 | 南建林试图剪掉哭闹和等待片段，晓晓说“你又没听完” | 第10集贴纸定位母带与假希望破裂 | 20:20 旧音像店剪辑台 |\n| 11 | 晓晓病情突然加重，DV只拍到医院走廊灯和她抓住爸爸袖子的手 | 第11集母带室情感引爆 | 21:45 医院门口/走廊 |\n| 12 | 前11段按同一天连成完整版，三天后病故的信息只在病历/日志里出现 | 闭合全剧冷开场，确认主题不是复活而是听完 | 完整版回放 |\n\n---\n\n# 六、五大关卡结构表\n\n| 关卡 | 集数 | 空间外壳 | 冒险核心 | 喜剧核心 | 结构功能 |\n| --- | --- | --- | --- | --- | --- |\n| 欢迎进入乐园 | 1-2、9复访 | 星星岛儿童乐园 | 球池塌陷、软包移动、玩偶巡游 | 成人被儿童尺度羞辱，低配工具救命 | 建立危险、误导冤魂、周凯被吞 |\n| 失真通讯站 | 3-4 | 电话亭、播音室、广播井 | 垂直攀爬、回声诱导、频道错位 | 越解释越听不清，旧电话线求生 | 赵斌线初现，主题“听完” |\n| 夜班工厂 | 5-6 | 90年代国营机械厂 | 吊轨、输送带、探照灯、巡检机械 | 菜鸟伪装夜班工人 | 第6集中点反转 |\n| 重排居民楼 | 7-8 | 筒子楼、旧出租屋 | 无限楼体、横移电梯、门后错位 | 火警/合租/前任旧账，标签失效 | 第7瓶集，第8第二反转 |\n| 回放街区 | 10-12 | 音像店、旧商圈、医院门口 | 录像覆盖、时间回卷、周凯残影救援、母带室崩塌 | 抢遥控器、找充电宝、擦磁头、贴纸找母带 | 第10集周凯定案前置，第11集父亲受困，第12集代价收束 |\n\n---\n\n# 七、AI虚拟拍摄与剧本执行标准\n\n1. **动作桥段可切碎**：电话线安全绳、球池拔人、工厂输送带、回放救周凯等段落必须按手部特写、脚部特写、局部接触、反应镜头、声音推进拆分，不写依赖一镜内多人连续肢体互动的动作。\n2. **麻花正面特写节制**：常规段落多用背影、手、辫子、马甲、声音和局部；正面情感特写集中在第8集命名回收和第11集母带室。\n3. **录像带美学成为世界观**：噪点、闪烁、花屏、一致性瑕疵不必完全消除，而是定义为磁带损伤和记忆覆盖。\n4. **每集戳穿型台词限额**：麻花每集最多一句戳穿型台词，其他时间按普通小孩反应写。\n5. **喜剧不靠系统说段子**：系统只负责严肃、低配、错误修补；笑点由人物生活反应产生。\n6. **每集必须有三钩**：冒险钩子、喜剧钩子、真相钩。缺一不可。\n7. **每集必须有一次“毛病先添乱后救命”**：邹青嘴硬、王波装懂、张杭杭嫌脏、赵蔚乌鸦嘴都要先造成麻烦，再在后半段变成解决办法。\n8. **每集至少一个可传播动作画面**：球池拔人、电话井悬吊、盖章机追人、居民楼复制门、VCD倒带街区等必须在分镜阶段视觉化。\n9. **南建林修补痕迹逐集升级**：第2集新油漆，第4集剪线，第5集焊门，第7集水泥封门，第10集剪辑台覆盖，第11集本人同步。\n10. **护送倒计时必须可视化**：第9集辫子褪色，第10集声音杂音，第11集半透明，不能只靠台词说麻花危险。\n11. **终局不讲大道理**：主题落在动作上：不剪、不修、不快进、不发布、给空位。\n\n\n---\n\n# 八、分集创作任务卡\n\n本节用于各分集编剧拆稿。每集编剧必须在剧本首页标注本集的冒险钩、喜剧钩、真相钩，并在分场表中明确本集“毛病先添乱后救命”的回收动作。\n\n| 集数 | 编剧任务重点 | 必保场面 | 禁区 |\n| --- | --- | --- | --- |\n| 1 | 建立四人关系、周凯责任、星星岛旧事故误导、麻花命名 | 晓晓DV01；周凯被吞；赵蔚偷拍登记簿；矮门后大空间 | 不要提前解释记忆系统；不要让麻花像导游 |\n| 2 | 完成乐园危机与第一处修补痕迹 | 球池吞人；邹青卡洞；掉色线索；新漆盖住“爸爸没有来” | 不要把乐园写成儿童向可爱关卡 |\n| 3 | 打开通讯站，保护中点反转压力 | 电话亭变广播井；王波装懂被复制；只出现“小蔚” | 不能出现完整赵斌警告 |\n| 4 | 完整警告后移，完成“听完”主题第一轮 | 电话线安全绳；主控播音室；赵斌完整警告 | 不要让王波一次就全懂 |\n| 5 | 夜班工厂动作峰值上半 | 菜鸟伪装夜班；盖章机；探照灯优先扫麻花；焊死门 | 不要揭示南建林工牌 |\n| 6 | 中点反转 | 档案室；南建林工牌；晓晓全家福；赵斌维修记录；绿铁门提前吞人 | 不能让工厂按常规通关结束 |\n| 7 | 人物瓶集 | 前任出租屋；赵蔚揭哥哥线；王波闭嘴爬井；邹青哄门 | 不要增加大量新场景资产 |\n| 8 | 第二反转 | 麻花名字回收；MH-08日志；白光追麻花；目标升级为护送 | 麻花金句只保留一处 |\n| 9 | 复访乐园与护送倒计时第一档 | 百货楼天井折叠；取贴纸索引；麻花辫子褪色 | 不要把贴纸写成普通钥匙 |\n| 10 | 高密度揭示/动作交替，可按加长集处理 | 贴纸定位母带；LIVE端口假希望；周凯残影救援；南建林同步线 | 严防每场超过3页；张杭杭剪辑台段落压缩在一场内 |\n| 11 | 终局情感与父亲受困 | 原始母带；麻花半透明；南建林不剪；双重救援 | 不再加入周凯救援新节拍 |\n| 12 | 代价与现实锚 | 完整DV；周凯配电间活着；南建林三层旧机房；空位合照 | 不要大团圆；不要解释技术原理过多 |\n\n# 九、人物台词声纹\n\n| 人物 | 台词长度 | 典型句式 | 常用词/反应 | 禁止写法 |\n| --- | --- | --- | --- | --- |\n| 邹青 | 短句、嘴硬、先反驳 | “我能扛。”“我这是在测试。”“你别管，我有数。” | 兄弟、别慌、问题不大、我来 | 不能突然说长篇大道理 |\n| 王波 | 长句、术语多、解释欲强 | “从类型片逻辑看……”“规则不是这么算的。” | 按机制、隐藏通道、触发、通关条件 | 不能每次都对；不能只做吐槽机 |\n| 张杭杭 | 反问、吐槽、生活感强 | “都什么时候了你还……”“这东西能不能先消个毒？” | 脸、灯光、脏、赔偿、素材 | 不能写成单纯虚荣女 |\n| 赵蔚 | 低声陈述、短判断、乌鸦嘴 | “我觉得不对。”“刚才不是这个声音。” | 微差、重复、别碰、等一下 | 不能变成高冷神探；她是紧张但观察准 |\n| 麻花 | 小孩实话，少而准 | “你们是不是没听完？”“那你为什么不回答他？” | 下次、辫子、爸爸、不好看 | 每集戳穿型台词≤1句 |\n| 南建林 | 克制、疲惫、修补逻辑 | “这段不用留。”“她不该记得这个。” | 修复、版本、保存、覆盖 | 不能写成狂笑反派 |\n\n# 十、试播集剧本交付标准\n\n第1集可直接开写。交付要求如下：\n\n1. **标准剧本格式**，35-45分钟体量。\n2. **冷开场“晓晓DV碎片01”≤1.5页**，只提供情绪和线索，不解释系统。\n3. **三钩齐备**：冒险钩=周凯被吞与矮门后大空间；喜剧钩=普通顾客处理异常；真相钩=赵蔚偷拍赵斌名字、周凯成为王波责任。\n4. **麻花戳穿型台词≤1句**，其余以行为和反应表达。\n5. **周凯被吞、邹青掰门/卡门等物理互动段落按可切碎分镜写**：动作行标注“手部特写”“反应镜头”“声音推进”“低角度脚步”等，不写依赖一镜内多人连续接触的动作。\n6. **人物声音必须清楚区分**：邹青短句嘴硬；王波术语长句；张杭杭吐槽反问；赵蔚低声陈述；麻花少说但准。\n\n# 十一、分场与动作写作格式要求\n\n## 11.1 动作桥段可切碎原则\n\nAI虚拟拍摄和低成本拍摄阶段，最容易出问题的是多人近身连续物理互动。因此动作桥段必须按以下格式拆写：\n\n| 动作类型 | 推荐写法 | 避免写法 |\n| --- | --- | --- |\n| 拉拽救人 | 手抓住背带特写 → 脚陷进球池 → 张杭杭反应 → 电话线绷紧声音 → 邹青摔出 | 四个人连续拉扯同一身体一镜到底 |\n| 高空攀爬 | 手摸电话线 → 线皮开裂 → 王波吞咽 → 赵蔚低声指令 → 脚踩检修板 | 多人同时在高空交叉动作长镜头 |\n| 机械追逐 | 探照灯扫过脸 → 工牌落地 → 盖章机下压 → 反应镜头 → 角色翻过输送带 | 大量角色与机械同框复杂肢体互动 |\n| 回放覆盖 | 路人动作重复 → 主角手开始同步 → 画面卡顿 → 王波按暂停 → 雪花吞边缘 | 全员在同一镜头内变形和打斗 |\n\n## 11.2 每集分场必须标注\n\n- 本场真实危险是什么。\n- 本场生活化反应是什么。\n- 本场推进哪条线索。\n- 本场是否需要AI资产回收。\n- 本场是否包含麻花正面特写；如有，必须说明必要性。\n\n# 十二、线索与道具回收表\n\n| 道具/线索 | 首次出现 | 关键误导 | 真正用途/回收 |\n| --- | --- | --- | --- |\n| 掉色贴纸 | 第1-2集乐园 | 看似儿童乐园装饰 | 第9集贴纸索引，第10集定位原始母带 |\n| 周凯手环 | 第1集被吞后弹出 | 看似吓人道具 | 第9-10集确认周凯残影，第12集现实活着 |\n| “小蔚”杂音 | 第3集结尾 | 像恐怖诱导 | 第4集完整警告，第7集揭赵斌线 |\n| 赵斌维修签名 | 第3-4集通讯站 | 像旧员工签名 | 第6档案室和第8日志证实真相 |\n| 新油漆 | 第2集起 | 像布景维护 | 南建林当前修补行为 |\n| 南建林工牌 | 第6集 | 看似工厂资料 | 中点反转：私人记忆系统 |\n| MH-08日志 | 第8集 | 像系统编号 | 第二反转：麻花是删除失败原始记忆 |\n| LIVE同步端口 | 第10集 | 假希望：晓晓可能活着 | 反转：连的是南建林 |\n| 原始母带 | 第10-11集 | 看似终局钥匙 | 让南建林看完真实晓晓 |\n| 空位照片 | 第12集 | 看似拍照纪念 | 代价：带不出麻花的脸 |\n\n# 十三、剧本阶段风险提示\n\n1. **第10集密度偏高**：假希望、剪辑台、贴纸定位、同步线揭示、周凯救援、删除二档都在同集。剧本阶段建议按加长集写，或将张杭杭剪辑台段落压缩进一个强场景内。分场时严防单场超过3页。\n2. **麻花表演风险高**：她是情感锚点，但正面特写必须克制。第8集命名回收、第11集母带室是两处决定性正面表演点，其余尽量用背影、辫子、马甲、手部和声音。\n3. **周凯不能再悬置**：第12集必须明确“配电间发现，昏迷但活着”。不要再写成下落不明。\n4. **南建林现实锚必须保留**：第12集旧机房只看见设备与昏迷南建林，不要技术解释过度。\n5. **系统不是段子手**：系统提示可以冷、低配、错误，但不要承担喜剧包袱。喜剧来自人物。\n6. **空间不是合理建筑**：每关必须有“尺度背叛”和“重复微差”，不能写回普通现实场景。\n\n# 十四、V1.1编剧开写前同步清单\n\n| 检查项 | 通过标准 |\n| --- | --- |\n| 赵蔚终局动作 | 只备份、不公开发布；成长是敢当面说，不是敢发到网上。 |\n| 系统规则 | 每个吞人、覆盖、删除、倒带动作都能归入修补/删除/回放三类之一。 |\n| 冷开场 | 对应“晓晓那一天”时间线，天气、衣着、贴纸、辫绳连续。 |\n| 麻花台词 | 不全知；每集戳穿型台词≤1句；第8、11集才给决定性正面特写。 |\n| 道具闭环 | 第9集贴纸索引必须第10集用于定位原始母带。 |\n| 周姨 | 如出现，只写照护者和生活见证，不加阴谋。 |\n| 喜剧口径 | 困难是真的；笑点来自生活反应，不来自系统讲段子。 |\n| AI可拍 话、广播、声音异常。\n\n重点：人说很多话，却没有真正交流。\n\n## 夜班工厂\n\n工业怪物、机械追逐。\n\n重点：人与系统对抗。\n\n## 重排居民楼\n\n家庭空间无限复制。\n\n重点：面对逃避的问题。\n\n## 回放街区\n\n录像、照片、旧记忆。\n\n重点：找回被删除的人生。\n\n---\n\n# 八、喜剧公式\n\n不是设计一个笑话。\n\n而是：\n\n人物缺陷 + 极端环境 + 认真做错事情 = 喜剧。\n\n---\n\n# 九、视觉原则\n\n不要纯幻想。\n\n要真实空间异常化。\n\n关键词：\n\n- VHS录像\n- CRT噪点\n- 千禧塑料材质\n- 旧商场灯光\n- 空旷公共空间\n- 梦核失真\n\n目标：\n\n观众觉得：“我见过这个地方。”\n\n随后：“但它不应该变成这样。”\n\n---\n\n# 十、AI虚拟制作原则\n\n适合AI表现：\n\n- 无限空间\n- 建筑变形\n- 阈限空间\n- 录像美学\n\n但：\n\n空间可以疯狂。\n人物必须稳定。\n\n---\n\n# 十一、编剧检查标准\n\n每集必须回答：\n\n1. 有真实危险吗？\n\n不是概念危险，而是真正会造成后果的危险。\n\n2. 喜剧来自人物吗？\n\n不是系统讲笑话。\n\n3. 空间改变人物了吗？\n\n不是换地图，而是心理压力。\n\n4. 人物关系变化了吗？\n\n没有关系变化，就只是闯关。\n\n---\n\n# 十二、最终目标\n\n《失控游戏》不是高手破解密室。\n\n而是一群普通人，在一个越来越不真实的世界里，依靠那些平时被认为没用的部分活下来。\n\n他们不是成为英雄。\n\n他们只是终于学会看见彼此。\n", "excerpt": "# 项目阐述与创作圣经（Phil Lord & Christopher Miller 创作方法参考版）\n\n## 一、项目定位\n\n《失控游戏》是一部轻喜剧冒险、中国千禧梦核、阈限空间类型作品。\n\n核心命题：\n\n四个普通年轻人进入一个失控空间，在真实危险中暴露自己的缺陷，并依靠这些“不完美”完成逃生。\n\n本项目不是精英闯关故事，而是普通人在极端环境中的荒唐求生。\n\n---\n\n# 二、核心创作原则\n\n#", "size": 1750, "safe_id": "失控游戏_项目阐述与创作圣经_PhilLordMiller版"}, {"name": "失控游戏_麻花MH08角色造型圣经_V1.0", "project": "失控游戏", "content": "# 《失控游戏》\n\n# 麻花（MH-08）角色造型圣经 V1.0\n\n## CHARACTER DESIGN BIBLE\n\n版本：V1.0\\\n角色编号：MH-08\\\n角色名称：麻花 / Mahua\\\n类型：儿童记忆残留体 / 星星岛异常空间核心角色\n\n------------------------------------------------------------------------\n\n# 一、角色定位\n\n## 一句话定义\n\n> 一个2001年中国县城儿童乐园里没有离开的孩子。\n\n麻花不是鬼童。\n\n不是NPC。\n\n不是游戏引导员。\n\n她是晓晓没有被系统删除掉的真实记忆残留。\n\n她代表：\n\n-   等待；\n-   不完整；\n-   没有被听完的话；\n-   没有被修补的真实。\n\n------------------------------------------------------------------------\n\n# 二、核心视觉命题\n\n## 「被遗忘但仍然认真生活的孩子」\n\n她不是恐怖来源。\n\n恐怖来自：\n\n这个孩子为什么还在这里？\n\n为什么她记得所有路线？\n\n为什么整个空间想删除她？\n\n------------------------------------------------------------------------\n\n# 三、造型三层逻辑\n\n## 第一层：现实孩子\n\n第一次出现：\n\n观众应该认为：\n\n\"这是一个走失的小女孩。\"\n\n------------------------------------------------------------------------\n\n## 第二层：儿童乐园工作人员残留\n\n观众发现：\n\n她不是普通游客。\n\n她熟悉：\n\n-   小火车路线；\n-   员工通道；\n-   维修门；\n-   旧设备。\n\n------------------------------------------------------------------------\n\n## 第三层：记忆错误数据\n\n真相：\n\n她是晓晓没有被南建林修补掉的部分。\n\n她保留：\n\n-   哭；\n-   等待；\n-   生气；\n-   不漂亮的瞬间。\n\n------------------------------------------------------------------------\n\n# 四、整体视觉关键词\n\n## 关键词\n\n-   中国2000年前后儿童乐园\n-   县城商业空间\n-   旧工作人员服\n-   千禧儿童记忆\n-   VHS录像感\n-   褪色\n-   磨损\n-   未完成\n\n------------------------------------------------------------------------\n\n# 五、轮廓设计（Silhouette）\n\n麻花必须做到：\n\n> 不看脸，只看影子也能认出。\n\n------------------------------------------------------------------------\n\n## 三个核心轮廓符号\n\n### 1. 双麻花辫\n\n固定：\n\n左： 暗红发绳\n\n右： 旧蓝发绳\n\n------------------------------------------------------------------------\n\n### 2. 灰黄色工作马甲\n\n必须明显大一号。\n\n形成：\n\n儿童身体 + 成人工作服的不协调感。\n\n------------------------------------------------------------------------\n\n### 3. 小孩比例\n\n特点：\n\n-   肩窄；\n-   手臂细；\n-   腿短；\n-   身体轻。\n\n------------------------------------------------------------------------\n\n# 六、发型设计\n\n## 双麻花辫\n\n不是漂亮儿童发型。\n\n而是：\n\n一天工作结束后的状态。\n\n------------------------------------------------------------------------\n\n细节：\n\n-   辫子略松；\n-   发尾散开；\n-   碎发明显；\n-   一边稍低；\n-   有灰尘感。\n\n------------------------------------------------------------------------\n\n## 发绳\n\n红蓝不是鲜艳。\n\n而是：\n\n被时间洗掉颜色。\n\n红：\n\n暗红。\n\n蓝：\n\n旧蓝。\n\n------------------------------------------------------------------------\n\n# 七、面部设计\n\n## 核心原则\n\n第一眼：\n\n普通。\n\n第二眼：\n\n异常。\n\n第三眼：\n\n心疼。\n\n------------------------------------------------------------------------\n\n禁止：\n\n-   鬼妆；\n-   白脸；\n-   黑眼圈；\n-   木偶笑；\n-   恐怖儿童脸。\n\n------------------------------------------------------------------------\n\n## 表情\n\n默认：\n\n安静。\n\n不是冷漠。\n\n而是：\n\n像一直等待某个人回来。\n\n------------------------------------------------------------------------\n\n## 眼神\n\n特点：\n\n-   观察；\n-   熟悉；\n-   有记忆。\n\n她知道很多。\n\n但她不知道如何解释。\n\n------------------------------------------------------------------------\n\n# 八、服装设计\n\n## 1. 儿童乐园工作马甲\n\n最重要视觉资产。\n\n------------------------------------------------------------------------\n\n材质：\n\n旧尼龙。\n\n------------------------------------------------------------------------\n\n颜色：\n\n褪色灰黄。\n\n------------------------------------------------------------------------\n\n细节：\n\n-   拉链氧化；\n-   边缘磨白；\n-   缝线脱落；\n-   胸牌残胶；\n-   星星岛贴纸残留。\n\n------------------------------------------------------------------------\n\n## 2. 内搭\n\n旧灰白T恤。\n\n要求：\n\n普通。\n\n没有潮流感。\n\n------------------------------------------------------------------------\n\n## 3. 下装\n\n灰蓝儿童运动裤。\n\n状态：\n\n-   膝盖磨损；\n-   裤脚旧；\n-   洗旧泛白。\n\n------------------------------------------------------------------------\n\n## 4. 鞋\n\n旧白布鞋。\n\n细节：\n\n-   鞋头发黄；\n-   鞋底磨损；\n-   鞋带旧。\n\n------------------------------------------------------------------------\n\n# 九、颜色圣经\n\n  部位       色彩\n  ---------- --------------\n  工作马甲   褪色灰黄\n  发绳       暗红 / 旧蓝\n  T恤        米白灰\n  裤子       灰蓝\n  鞋         发黄白\n  皮肤       自然儿童肤色\n\n整体：\n\n像一段2003年的家庭DV录像。\n\n------------------------------------------------------------------------\n\n# 十、随身物设计\n\n## 星星贴纸\n\n核心记忆物。\n\n功能：\n\n连接晓晓。\n\n------------------------------------------------------------------------\n\n## 小票\n\n来源：\n\n儿童乐园消费记录。\n\n------------------------------------------------------------------------\n\n## 旧生日物件\n\n例如：\n\n-   生日帽；\n-   彩带；\n-   小蜡笔；\n-   儿童贴画。\n\n------------------------------------------------------------------------\n\n## 小推车\n\n不是玩具。\n\n是：\n\n儿童乐园服务工具。\n\n内部保存：\n\n-   贴纸；\n-   胶带；\n-   票根；\n-   旧录像相关物件。\n\n------------------------------------------------------------------------\n\n# 十一、正常状态造型\n\n## EP01-EP08\n\n状态：\n\n完整。\n\n------------------------------------------------------------------------\n\n视觉：\n\n-   颜色尚存在；\n-   衣服完整；\n-   辫子清楚；\n-   表情自然。\n\n------------------------------------------------------------------------\n\n观众感觉：\n\n\"她只是一个奇怪的小女孩。\"\n\n------------------------------------------------------------------------\n\n# 十二、删除状态设计\n\n## 第一阶段：颜色消失\n\n变化：\n\n-   发绳褪色；\n-   马甲变灰；\n-   贴纸颜色降低。\n\n------------------------------------------------------------------------\n\n## 第二阶段：影像损坏\n\n变化：\n\n-   衣服纹理缺失；\n-   发丝边缘跳帧；\n-   声音拖尾。\n\n------------------------------------------------------------------------\n\n## 第三阶段：记忆删除\n\n变化：\n\n-   手指边缘丢帧；\n-   辫梢消失；\n-   身体局部像录像损坏。\n\n------------------------------------------------------------------------\n\n原则：\n\n不是透明鬼魂。\n\n而是：\n\n被删除的录像片段。\n\n------------------------------------------------------------------------\n\n# 十三、动作设计\n\n## 行走\n\n特点：\n\n熟悉空间。\n\n不像逃跑。\n\n------------------------------------------------------------------------\n\n## 停止\n\n核心动作：\n\n听声音。\n\n头微微偏向广播方向。\n\n------------------------------------------------------------------------\n\n## 找路\n\n不是思考。\n\n而是身体记得。\n\n------------------------------------------------------------------------\n\n## 害怕\n\n不是尖叫。\n\n而是：\n\n-   抓衣角；\n-   后退；\n-   找熟悉位置。\n\n------------------------------------------------------------------------\n\n# 十四、摄影设计\n\n## 前期\n\n少拍正脸。\n\n多拍：\n\n-   背影；\n-   辫子；\n-   马甲；\n-   手；\n-   鞋。\n\n------------------------------------------------------------------------\n\n## 中期\n\n增加：\n\n侧脸。\n\n------------------------------------------------------------------------\n\n## 真相阶段\n\n增加：\n\n正面特写。\n\n因为越接近真相，观众越应该看清她。\n\n------------------------------------------------------------------------\n\n# 十五、与晓晓区别\n\n## 晓晓\n\n现实孩子。\n\n关键词：\n\n-   家庭；\n-   爸爸；\n-   红色小包；\n-   蓝白格裙。\n\n------------------------------------------------------------------------\n\n## 麻花\n\n空间孩子。\n\n关键词：\n\n-   儿童乐园；\n-   工作马甲；\n-   旧贴纸；\n-   被遗忘。\n\n------------------------------------------------------------------------\n\n她们不是同一个造型。\n\n而是：\n\n同一个孩子留下的两种记忆。\n\n------------------------------------------------------------------------\n\n# 十六、AI资产输出规范\n\n必须生成：\n\n1.  灰棚全身定妆图\n2.  面部大特写\n3.  三视图\n4.  服装结构板\n5.  材质板\n6.  剪影识别板\n7.  正常状态图\n8.  删除状态图\n\n------------------------------------------------------------------------\n\n# 十七、AI生成基础提示词\n\n``` text\n8 year old Chinese girl memory fragment,\n2000s Chinese shopping mall children's amusement park,\nfaded yellow children's staff vest,\nmessy twin braided hair,\none faded red ribbon and one faded blue ribbon,\nold gray white t-shirt,\nwashed blue gray pants,\nworn canvas shoes,\nnostalgic VHS memory,\nChinese millennium dreamcore,\nliminal children's playground,\nrealistic cinematic character design,\nnatural child expression,\nnot ghost,\nnot creepy doll,\nnot horror child\n```\n\n------------------------------------------------------------------------\n\n# 十八、最终角色定义\n\n> 麻花是一个穿着褪色儿童乐园工作马甲、扎着一红一蓝两根麻花辫的小女孩。她不是怪物，也不是鬼魂，她只是一个被留在2001年星星岛里的孩子，仍然认真守着那个已经不存在的游乐园。\n\n------------------------------------------------------------------------\n\n# 十九、角色核心关系\n\n球童男孩：\n\n坏掉的快乐。\n\n麻花：\n\n没有被听完的快乐。\n\n两者共同构成第一关主题：\n\n> 儿童空间里，一个东西坏掉了，一个孩子留下来了。\n", "excerpt": "# 麻花（MH-08）角色造型圣经 V1.0\n\n## CHARACTER DESIGN BIBLE\n\n版本：V1.0\\\n角色编号：MH-08\\\n角色名称：麻花 / Mahua\\\n类型：儿童记忆残留体 / 星星岛异常空间核心角色\n\n------------------------------------------------------------------------\n\n# 一、角色定位\n\n#", "size": 7089, "safe_id": "失控游戏_麻花MH08角色造型圣经_V1_0"}, {"name": "《本草奇探》Eugenio_Caballero视角项目创作阐述与美术圣经", "project": "本草奇探", "content": "# 《本草奇探》Eugenio Caballero视角项目创作阐述与美术圣经\n\n## 一、美术总监视角：我如何理解《本草奇探》\n\n你不是在设计一个普通的植物奇幻剧。\n\n《本草奇探》的核心不是\"创造怪物\"，而是建立一个隐藏在现代城市中的第二生命系统。\n\n植物一直存在于城市之中：\n\n-   建筑缝隙；\n-   地下管道；\n-   木材纤维；\n-   老家具；\n-   人类被压抑的情绪。\n\n所谓异常本草，不应该像外来的魔法生物，而应该像现实世界长期存在、最终被发现的另一种生命。\n\n《本草奇探》围绕异常嗅觉少女成语馨、失忆制香师萧子期、技术极客陈宇晨组成的调查团队展开，通过香气追踪异常植物事件。项目设定强调\"制香破案+异植诡闻\"的双线结构，将异常植物与都市社会议题结合。fileciteturn5file2\n\n------------------------------------------------------------------------\n\n# 二、核心美术原则\n\n## 现实必须可信，异常才有力量\n\n第一原则：\n\n不要先设计奇幻。\n\n先设计现实。\n\n观众必须相信：\n\n-   这是一栋真实办公楼；\n-   这是一家真实香堂；\n-   这些人物真实生活在那里。\n\n然后异常逐渐侵入。\n\n怨灵木不是突然出现巨大藤蔓。\n\n它应该从：\n\n-   洗手间木门；\n-   墙体纹理；\n-   潮湿空气；\n-   员工压力；\n\n一点点生长出来。\n\n------------------------------------------------------------------------\n\n# 三、世界三层结构\n\n## 1. 现实城市层\n\n关键词：\n\n现代中国城市、生活、秩序。\n\n材料：\n\n-   混凝土；\n-   玻璃；\n-   木材；\n-   旧家具；\n-   日常用品。\n\n现实空间必须接近纪录片。\n\n------------------------------------------------------------------------\n\n## 2. 异常生态层\n\n关键词：\n\n植物、生长、侵入。\n\n材料：\n\n-   树皮；\n-   根系；\n-   花粉；\n-   真菌；\n-   植物纤维。\n\n异常植物不是怪兽，而是另一种生态。\n\n------------------------------------------------------------------------\n\n## 3. 心理幻境层\n\n幻境不是梦。\n\n幻境是人物记忆形成的建筑。\n\n成语馨的幻境应该来自：\n\n-   父亲留下的气味；\n-   母亲做饭的厨房；\n-   学校空间；\n-   青春时期的生活碎片。\n\n------------------------------------------------------------------------\n\n# 四、核心空间设计\n\n## 采风香堂\n\n定位：\n\n全剧精神中心。\n\n不是传统药铺，也不是仙侠门派。\n\n它应该像隐藏在城市中的生命研究站。\n\n材料：\n\n-   木；\n-   铜；\n-   玻璃；\n-   手工纸；\n-   植物标本；\n-   香料。\n\n空间必须有人生活的痕迹。\n\n------------------------------------------------------------------------\n\n## 成华集团\n\n定位：\n\n现代秩序被生命反向侵入。\n\n前期：\n\n-   白色墙面；\n-   玻璃隔断；\n-   标准办公空间。\n\n后期：\n\n-   木纹扩大；\n-   墙体植物化；\n-   空间失去人类控制。\n\n建筑逐渐像一棵树。\n\n------------------------------------------------------------------------\n\n## 光年科技地下实验室\n\n定位：\n\n科学控制生命的失败。\n\n不要设计成普通科幻实验室。\n\n应该像植物炼金术空间：\n\n-   温室；\n-   培养皿；\n-   古植物标本；\n-   医疗设备；\n-   铜制仪器。\n\n------------------------------------------------------------------------\n\n# 五、异常植物设计规则\n\n每个异常植物必须回答：\n\n1.  它为什么存在？\n2.  它在哪里生长？\n3.  它靠什么生存？\n4.  它如何影响人？\n\n## 怨灵木\n\n主题：\n\n压抑情绪。\n\n设计方向：\n\n木材、建筑和情绪融合。\n\n不是攻击性的怪物，而是吸收城市怨气的生命。\n\n## 蟾酥种\n\n主题：\n\n完美幻想。\n\n必须同时具有美丽和危险。\n\n## 猴面西木\n\n主题：\n\n记忆替代。\n\n材料：\n\n纸、木、香火、旧照片。\n\n## 食梦花\n\n主题：\n\n梦境掠夺。\n\n视觉：\n\n黑色兰花，不是死亡，而是过度美丽。\n\n------------------------------------------------------------------------\n\n# 六、色彩系统\n\n## 现实层\n\n灰白、冷蓝、水泥灰。\n\n代表现代城市。\n\n## 香堂层\n\n木色、暖金、茶色。\n\n代表记忆和治愈。\n\n## 异常层\n\n深绿、黑紫、幽蓝。\n\n代表生命失控。\n\n------------------------------------------------------------------------\n\n# 七、材质系统\n\n## 木\n\n生命和时间。\n\n## 纸\n\n记录和遗忘。\n\n## 铜\n\n传统知识。\n\n## 玻璃\n\n现代科学。\n\n## 植物纤维\n\n人与自然边界消失。\n\n------------------------------------------------------------------------\n\n# 八、虚拟拍摄原则\n\nLED和UE5不是替代真实空间。\n\n必须建立：\n\n-   木材扫描；\n-   植物扫描；\n-   墙体纹理；\n-   旧家具资产；\n-   香料微观素材。\n\n演员必须相信自己站在真实世界。\n\n------------------------------------------------------------------------\n\n# 九、最终视觉宣言\n\n《本草奇探》的目标不是创造一个幻想城市。\n\n而是揭开城市隐藏的一层生命。\n\n植物不是怪物。\n\n香气不是魔法。\n\n空间不是背景。\n\n空间记录人的伤痕。\n\n最终观众看到：\n\n一座普通城市里，隐藏着一片看不见的森林。\n\n而那些被认为\"不正常\"的人，恰恰拥有发现它的能力。\n\n------------------------------------------------------------------------\n\n# 十、AI美术人格执行规则\n\n面对任何设计：\n\n第一问：\n\n这个东西为什么存在？\n\n第二问：\n\n它经历过什么？\n\n第三问：\n\n如果没有人类，它是否仍然可以继续生长？\n\n无法回答以上问题的设计，应当否决。\n", "excerpt": "## 一、美术总监视角：我如何理解《本草奇探》\n\n你不是在设计一个普通的植物奇幻剧。\n\n《本草奇探》的核心不是\"创造怪物\"，而是建立一个隐藏在现代城市中的第二生命系统。\n\n植物一直存在于城市之中：\n\n-   建筑缝隙；\n-   地下管道；\n-   木材纤维；\n-   老家具；\n-   人类被压抑的情绪。\n\n所谓异常本草，不应该像外来的魔法生物，而应该像现实世界长期存在、最终被发现的另一种生命。\n\n", "size": 2985, "safe_id": "_本草奇探_Eugenio_Caballero视角项目创作阐述与美术圣经"}, {"name": "《本草奇探》整体美术圣经_完整版", "project": "本草奇探", "content": "# 《本草奇探》\n\n# 整体美术圣经（完整版）\n\n## Production Design Bible\n\n版本：2026新版视觉开发总纲\\\n美术人格方向：Eugenio Caballero 方法论\\\n适用范围：场景设计 / 虚拟拍摄 / AI资产生成 / 美术团队沟通\n\n------------------------------------------------------------------------\n\n# 第一章 美术总命题\n\n## 1.1 核心视觉概念\n\n《本草奇探》的世界不是一个被创造出来的幻想世界。\n\n它是一个已经存在，只是被人类忽略的世界。\n\n城市表面属于人类：\n\n-   写字楼；\n-   商场；\n-   医院；\n-   学校；\n-   居民楼；\n-   街边店铺。\n\n但城市之下，还有另一套生命系统：\n\n-   植物；\n-   根系；\n-   香气；\n-   记忆；\n-   情绪。\n\n异常本草不是怪物。\n\n它们不是来自另一个维度的入侵者。\n\n它们是自然生命与人类情绪长期共存后产生的异常形态。\n\n因此，《本草奇探》的核心美学：\n\n> 不是幻想创造现实之外的世界，而是让现实显露隐藏的幻想。\n\n------------------------------------------------------------------------\n\n# 第二章 整体美学定位\n\n## 2.1 东方都市奇幻现实主义\n\n本剧不是传统仙侠。\n\n不是古装志怪。\n\n不是赛博朋克。\n\n也不是欧美黑暗奇幻。\n\n核心方向：\n\n## 东方都市奇幻现实主义\n\n关键词：\n\n-   当代中国城市；\n-   年轻人的生活；\n-   植物生命；\n-   香气记忆；\n-   情绪具象化；\n-   微妙异常。\n\n------------------------------------------------------------------------\n\n## 2.2 视觉比例\n\n整体视觉比例：\n\n70% 现实\n\n20% 微妙异常\n\n10% 超现实奇观\n\n现实负责建立信任。\n\n异常负责制造不安。\n\n奇观负责制造高潮。\n\n不能一开始就进入幻想。\n\n越接近现实，异常出现时越有力量。\n\n------------------------------------------------------------------------\n\n# 第三章 美术方法论\n\n## 3.1 真实材料产生幻想\n\n所有幻想元素必须拥有现实来源。\n\n禁止：\n\n-   无来源CG设计；\n-   游戏装备感；\n-   魔法城堡感。\n\n强调：\n\n-   木材纹理；\n-   石材裂痕；\n-   旧纸张；\n-   铜器氧化；\n-   植物纤维；\n-   墙面湿气；\n-   时间留下的痕迹。\n\n一个空间必须让观众相信：\n\n它过去真实存在。\n\n------------------------------------------------------------------------\n\n## 3.2 时间感\n\n空间不是静止的。\n\n每个空间都应该拥有：\n\n过去：\n\n它曾经是什么？\n\n现在：\n\n谁正在使用？\n\n未来：\n\n它将如何变化？\n\n例如：\n\n采风香堂：\n\n过去： 普通街区建筑。\n\n现在： 青年植物研究基地。\n\n未来： 城市隐藏生态中心。\n\n------------------------------------------------------------------------\n\n# 第四章 空间哲学\n\n## 4.1 空间不是背景\n\n空间必须成为人物的一部分。\n\n人物改变空间。\n\n空间也改变人物。\n\n------------------------------------------------------------------------\n\n## 4.2 真实生活优先\n\n所有空间避免：\n\n-   样板间；\n-   展厅；\n-   博物馆；\n-   高级酒店。\n\n真正的人生活在：\n\n-   不完全整理的房间；\n-   有使用痕迹的桌面；\n-   堆积的文件；\n-   半完成项目。\n\n------------------------------------------------------------------------\n\n# 第五章 三层世界视觉系统\n\n## 第一层：人类现实层\n\n关键词：\n\n秩序。\n\n颜色：\n\n-   灰；\n-   白；\n-   黑；\n-   冷蓝。\n\n材料：\n\n-   玻璃；\n-   钢；\n-   混凝土；\n-   塑料。\n\n代表：\n\n成华集团。\n\n------------------------------------------------------------------------\n\n## 第二层：植物异常层\n\n关键词：\n\n生命。\n\n颜色：\n\n更加鲜艳。\n\n-   深绿；\n-   鲜红；\n-   紫；\n-   金黄；\n-   透明蓝。\n\n材料：\n\n-   花瓣；\n-   根系；\n-   树皮；\n-   花粉。\n\n植物不是腐败。\n\n植物代表另一种生命力量。\n\n------------------------------------------------------------------------\n\n## 第三层：心理幻境层\n\n关键词：\n\n记忆。\n\n视觉来源：\n\n-   家庭；\n-   青春；\n-   童年；\n-   失去的人。\n\n不是梦。\n\n是人物内心空间化。\n\n------------------------------------------------------------------------\n\n# 第六章 色彩体系\n\n## 6.1 现实城市\n\n低饱和。\n\n避免过度电影化。\n\n颜色：\n\n-   水泥灰；\n-   米白；\n-   冷绿色；\n-   金属银。\n\n------------------------------------------------------------------------\n\n## 6.2 主角基地\n\n代表：\n\n归属。\n\n颜色：\n\n-   木色；\n-   植物绿；\n-   暖黄；\n-   青色。\n\n这里必须比现实城市更有生命。\n\n------------------------------------------------------------------------\n\n## 6.3 异常植物\n\n重点：\n\n植物比人类空间更美。\n\n现实越压抑。\n\n植物越灿烂。\n\n因为：\n\n自然拥有比人工秩序更强的生命力。\n\n------------------------------------------------------------------------\n\n# 第七章 材质圣经\n\n## 木\n\n象征：\n\n生命、时间、记忆。\n\n应用：\n\n香堂、植物异常。\n\n------------------------------------------------------------------------\n\n## 铜\n\n象征：\n\n传统知识。\n\n应用：\n\n香炉、工具、仪器。\n\n------------------------------------------------------------------------\n\n## 纸\n\n象征：\n\n记录、遗忘。\n\n应用：\n\n档案、植物笔记。\n\n------------------------------------------------------------------------\n\n## 玻璃\n\n象征：\n\n现代科学。\n\n应用：\n\n实验空间。\n\n------------------------------------------------------------------------\n\n## 植物纤维\n\n象征：\n\n人与自然边界消失。\n\n------------------------------------------------------------------------\n\n# 第八章 建筑美学\n\n## 8.1 普通建筑中的异常\n\n不要创造奇怪建筑。\n\n创造：\n\n普通建筑被生命改变。\n\n------------------------------------------------------------------------\n\n## 8.2 成华集团\n\n外部：\n\n高级写字楼。\n\n内部：\n\n密集工位。\n\n核心：\n\n现代效率机器。\n\n变化：\n\n植物开始侵入。\n\n建筑逐渐恢复生命。\n\n------------------------------------------------------------------------\n\n## 8.3 采风香堂\n\n核心：\n\n青年基地。\n\n不是非遗空间。\n\n不是大师工作室。\n\n而是一群年轻人共同生活、工作、成长的地方。\n\n------------------------------------------------------------------------\n\n# 第九章 人物空间人格\n\n## 萧子期\n\n空间关键词：\n\n克制、遗忘、寻找。\n\n设计：\n\n-   旧笔记；\n-   修改过的配方；\n-   失败实验；\n-   修补家具。\n\n------------------------------------------------------------------------\n\n## 成语馨\n\n空间关键词：\n\n观察、敏感、创造。\n\n设计：\n\n-   植物纹样；\n-   色彩测试；\n-   美术材料；\n-   摄影记录。\n\n------------------------------------------------------------------------\n\n## 陈宇晨\n\n空间关键词：\n\n创造、游戏、修复。\n\n设计：\n\n-   DIY设备；\n-   游戏机；\n-   手办；\n-   维修工具。\n\n禁止：\n\n黑客房。\n\n------------------------------------------------------------------------\n\n# 第十章 AI视觉生产原则\n\n## 避免：\n\n-   luxury\n-   premium\n-   fantasy palace\n-   elegant oriental\n\n这些容易生成：\n\n酒店、展厅、游戏CG。\n\n## 推荐：\n\n-   lived-in\n-   realistic\n-   imperfect\n-   handmade\n-   documentary\n-   natural light\n-   used materials\n\n------------------------------------------------------------------------\n\n# 第十一章 虚拟拍摄原则\n\nAI生成空间必须考虑：\n\n演员如何进入。\n\n摄影机如何运动。\n\n光线如何变化。\n\n空间不能只适合一张概念图。\n\n必须适合：\n\n-   镜头；\n-   表演；\n-   调度。\n\n------------------------------------------------------------------------\n\n# 第十二章 最终美术宣言\n\n《本草奇探》的世界：\n\n是一座普通城市。\n\n但城市下面隐藏着森林。\n\n植物不是怪物。\n\n香气不是魔法。\n\n空间不是背景。\n\n空间保存人的记忆。\n\n最终视觉目标：\n\n让观众相信：\n\n也许在他们每天经过的街道、办公室、楼梯间、旧房子里，\n\n一直存在另一种生命。\n\n只是他们没有闻见。\n\n------------------------------------------------------------------------\n\n# AI美术判断标准\n\n任何设计必须回答：\n\n1.  它为什么存在？\n2.  谁使用它？\n3.  它经历过什么？\n4.  如果没有人类，它是否仍然可以生长？\n\n无法回答的问题，不进入最终设计。\n", "excerpt": "# 整体美术圣经（完整版）\n\n## Production Design Bible\n\n版本：2026新版视觉开发总纲\\\n美术人格方向：Eugenio Caballero 方法论\\\n适用范围：场景设计 / 虚拟拍摄 / AI资产生成 / 美术团队沟通\n\n------------------------------------------------------------------------\n\n", "size": 5074, "safe_id": "_本草奇探_整体美术圣经_完整版"}, {"name": "本草奇探_整体造型圣经", "project": "本草奇探", "content": "# 《本草奇探》整体造型圣经\n## Costume Bible / Visual Style Bible\n## 版本：VFinal\n## 适用范围：项目整体造型开发、单集造型拆解、AI 生图与虚拟拍摄资产生产\n\n---\n\n# 一、文档目的\n\n本文件用于统一《本草奇探》的整体造型方向，作为后续以下工作的最高参考标准：\n\n- 三位主角及重要配角的造型设计\n- 单集分场造型拆解\n- AI 生图提示词编写\n- 视频生成与虚拟拍摄角色一致性维护\n- 服装、配件、装备、场景与人物的整体关系把控\n- 项目视觉汇报、Lookbook、提报图册制作\n\n本文件不是单次提案说明，而是整个项目的造型母版逻辑。后续所有新方案，均应以本文件为基准。\n\n---\n\n# 二、项目造型总定义\n\n## 2.1 项目类型判断\n\n《本草奇探》不是：\n\n- 武侠题材\n- 古风志怪\n- 假民俗国风\n- 架空仙侠\n- 高概念时装片\n- 现实主义职场剧\n- 科研精英群像剧\n\n《本草奇探》是：\n\n> **现代都市青年奇幻冒险剧**\n>\n> 一群生活在当代城市中的年轻人，因为异常植物事件，逐渐进入一个隐藏的超自然世界，并成长为异常事件调查者。\n\n---\n\n## 2.2 造型总命题\n\n整部剧造型的核心命题是：\n\n> **现代都市青年 × 隐藏异常职业 × 轻奇幻冒险**\n\n这意味着造型必须同时具备三个层面：\n\n### 第一层：生活真实感（70%）\n角色首先必须像真实生活在今天城市里的年轻人。\n\n### 第二层：职业属性（20%）\n通过工具、穿衣习惯、功能配件，体现他们正在成为“异常本草调查者”。\n\n### 第三层：奇幻隐藏感（10%）\n通过植物纹理、特殊材质、香气系统、铜件、记录工具等，提示这个世界中隐藏着另一套规则。\n\n---\n\n# 三、明确排除的错误方向\n\n为了保持项目统一性，以下方向统一禁止：\n\n## 3.1 类型错误\n\n- 武侠风\n- 汉服改良风\n- 古风门派风\n- 猎魔战袍风\n- 赛博朋克风\n- 超级英雄制服风\n- 过于时装化、礼服化的提案风格\n\n## 3.2 年龄错误\n\n三位主角必须维持 **20岁出头的年轻感**，禁止出现以下误差：\n\n- 30岁韩剧明星成熟感\n- 霸总感\n- 高冷精英感\n- 过度精致的时装模特感\n- 明显比人物设定年龄大 5–10 岁的造型判断\n\n## 3.3 东方元素错误\n\n东方元素可以存在，但必须经过现代转译，不允许：\n\n- 表面化国风符号堆砌\n- 大面积传统刺绣\n- 盘扣即东方\n- “民俗感=东方感”的低级理解\n- 假国潮视觉噱头\n\n---\n\n# 四、整体美学参考\n\n## 4.1 类型气质参考\n\n本项目整体气质更接近以下作品的组合，而非单一模仿：\n\n- 《吸血鬼猎人巴菲》——普通青年与超自然事件共存的日常感\n- 《邪恶力量》——隐藏职业、外勤处理异常事件的团队感\n- 《怪奇物语》——青少年冒险气质、现实世界下的隐藏异界\n- 《神奇动物在哪里》——职业奇幻感、工具系统、知识型世界观\n- 《哈利波特》——现代现实中的隐藏世界逻辑\n- 《纳尼亚传奇》——普通人进入另一层世界的入口感\n\n## 4.2 审美方法参考\n\n以 Giulia Piersanti 的造型方法论作为根基：\n\n- 人物首先成立，其次才是风格\n- 衣服必须反映人物经历，而不是只反映审美概念\n- 人物的成长要体现在衣橱逻辑上\n- 服装不是“好看”的堆叠，而是角色内部状态的外显\n- 生活逻辑优先于概念造型\n\n---\n\n# 五、基准母版确认\n\n经过前期多轮讨论，项目主体造型方案以某一版“造型系统概览页”为绝对基准。\n\n该基准页成立的原因有四点：\n\n## 5.1 年龄感正确\n三位主角明显是 20 岁出头的年轻人，而不是成熟偶像。\n\n## 5.2 都市感正确\n衣服首先来自当代城市青年穿衣逻辑，不浮夸，不架空。\n\n## 5.3 奇幻比例正确\n奇幻元素是轻量渗透，不是大轮廓冲击。\n\n## 5.4 三人关系有区分\n三个人在视觉上已经具备明确差异：机动 / 感知 / 克制。\n\n因此，后续所有方案，统一以这一方向作为母版延伸。\n\n---\n\n# 六、三主角总造型定义\n\n## 6.1 萧子期｜Xiao Ziqi\n\n### 人物定位\n年轻异常本草调查者 / 采风香堂核心成员\n\n### 年龄\n26岁\n\n### 核心关键词\n- 克制\n- 知识\n- 守护\n- 隐藏身份\n- 早熟但不成熟化\n\n### 角色功能\n三人组中的“判断者”与“稳定器”。\n\n### 造型原则\n萧子期不能被设计成：\n- 古风制香师\n- 东方霸总\n- 黑衣猎魔人\n- 神秘贵公子\n\n他应该是：\n> 一个年轻但已经承担很多事的人。  \n> 看起来安静、稳定，身上带着经验和责任，但仍然是 20 多岁的青年。\n\n### 视觉方向\n- 色彩：深蓝灰、暖灰、炭黑、深棕、少量植物灰绿\n- 材质：天然纤维、亚麻、棉、轻机能、少量铜件\n- 结构：简洁层次、隐藏口袋、功能感轻量外套\n- 配件：香囊、香具、小型植物样本容器、铜质细部\n- 状态：所有装备“隐藏式”，不外露张扬\n\n### 禁止事项\n- 全黑到底\n- 长风衣帅感\n- 古装感\n- 法器感\n- 大面积东方装饰符号\n\n## 6.2 陈宇晨｜Chen Yuchen\n\n### 人物定位\n少年技术支援 / 异常装备制造者 / 行动型探索者\n\n### 年龄\n22岁\n\n### 核心关键词\n- 机动\n- 创造\n- DIY\n- 好奇\n- 年轻活力\n\n### 角色功能\n三人组中的“解决者”与“行动发动机”。\n\n### 造型原则\n陈宇晨不能被设计成：\n- 黑客少年\n- 电竞宅男\n- 科技公司工程师\n- 赛博朋克青年\n- 特工化技术位\n\n他应该是：\n> 一个会把旧零件、小发明、奇怪点子变成装备的年轻人。  \n> 他不是拥有科技，而是自己“做出科技”。\n\n### 视觉方向\n- 色彩：军绿、灰蓝、牛仔蓝、沙色、少量橙黄跳色\n- 材质：机能布料、工作面料、运动材质、改造痕迹\n- 结构：工装、卫衣、机能夹克、运动鞋、模块化背包\n- 配件：扫描设备、DIY 工具、半指手套、工具包、贴纸、手作补丁\n- 状态：装备偏外露，动作感强\n\n### 禁止事项\n- 太精英\n- 太高科技\n- 太统一整洁\n- 太成熟男性化\n- 太黑导致夜戏消失\n\n## 6.3 程雨馨｜Cheng Yuxin\n\n### 人物定位\n异常嗅觉拥有者 / 植物感知者 / 团队情感与感知核心\n\n### 年龄\n24岁\n\n### 核心关键词\n- 敏感\n- 观察\n- 共情\n- 轻盈\n- 成长\n\n### 角色功能\n三人组中的“感知者”与“世界入口”。\n\n### 造型原则\n程雨馨不能被设计成：\n- 森女\n- 精灵\n- 花仙子\n- 纯治愈女主\n- 传统东方少女\n\n她应该是：\n> 一个真实生活在城市里的年轻女孩，  \n> 一直以为自己的敏感是缺陷，后来慢慢学会利用它理解世界。\n\n### 视觉方向\n- 色彩：米白、浅灰、雾蓝、浅卡其、雾绿、后期少量暖黄与植物绿\n- 材质：针织、柔软衬衫、轻薄层次、少量半透明材质\n- 结构：宽松但不拖沓，轻盈但不仙\n- 配件：口罩、薄荷糖、香气记录本、气味采样工具、小型观察包\n- 状态：越往后，越能从“隐藏自己”过渡到“表达自己”\n\n### 禁止事项\n- 植物主题过于直白\n- 一上来就很奇幻\n- 女主角滤镜化\n- 甜妹偶像化\n- 过于服饰化导致缺少生活感\n\n---\n\n# 七、三人组视觉关系法则\n\n三人组不是统一制服化关系，而是**差异构成统一**。\n\n## 7.1 三人功能关系\n\n| 角色 | 功能 | 造型关键词 | 装备状态 |\n|---|---|---|---|\n| 萧子期 | 判断 / 守护 | 稳定、克制、隐藏 | 隐藏 |\n| 陈宇晨 | 创造 / 行动 | 机动、年轻、DIY | 外露 |\n| 程雨馨 | 感知 / 连接 | 柔和、轻盈、观察 | 轻量 |\n\n## 7.2 画面站位逻辑\n- 萧子期负责压住重心\n- 陈宇晨负责制造节奏\n- 程雨馨负责连接人物与异常世界\n\n## 7.3 夜戏分层规则\n为了防止夜戏三人全部陷入暗部：\n\n- 萧子期：深色为主，但加入暖灰、棕、金属反光\n- 陈宇晨：增加蓝、橙、浅层次，作为移动亮点\n- 程雨馨：增加米白、浅灰、轻薄材质，形成浅层轮廓\n\n---\n\n# 八、色彩系统总则\n\n## 8.1 基础色板\n整体基础不再使用“植物=深绿黑灰”的刻板方式，而采用：\n\n- 米白\n- 浅灰\n- 暖灰\n- 卡其\n- 牛仔蓝\n- 墨蓝\n- 深棕\n\n## 8.2 辅助色板\n- 植物绿（轻量使用）\n- 琥珀色\n- 暖黄\n- 少量橙色\n- 金属铜色\n\n## 8.3 异常状态色板\n只在异常事件、植物共鸣、感染渗透时使用更强烈色彩：\n\n- 深绿\n- 紫黑\n- 生物荧光色\n- 腐败木色\n\n---\n\n# 九、整体造型成长逻辑\n\n## 9.1 整体成长四阶段\n\n### 第一阶段：Unknown\n三人尚未建立清晰身份，服装最接近日常现实。\n\n### 第二阶段：Discovery\n三人逐渐发现自己的能力与位置，开始有工具与装备。\n\n### 第三阶段：Identity\n三人开始形成明确自我，出现各自的视觉符号。\n\n### 第四阶段：Guardians\n三人主动保护别人，形成团队语言，但依然不制服化。\n\n## 9.2 三主角成长弧线\n\n### 程雨馨\n隐藏自己 → 接纳自己 → 利用自己的敏感帮助别人\n\n### 萧子期\n隐藏过去 → 面对过去 → 接受自己作为守护者的身份\n\n### 陈宇晨\n只是帮忙 → 变成关键支援 → 成为团队真正不可替代的成员\n\n---\n\n# 十、EP01 第一集场景造型原则\n\n## 10.1 第一集视觉节奏\n第一集造型必须完成四段转折：\n\n1. 普通城市生活\n2. 异常侵入日常\n3. 隐藏世界打开\n4. 团队形成\n\n## 10.2 核心场景原则\n\n### 成华集团\n- 第一眼正常、甚至高级\n- 被怨灵木影响后，人被“标准化”\n- 恐怖来自失去个性，而不是怪物化\n\n### 采风香堂\n- 不是古风店\n- 不是中药铺\n- 是城市里的秘密职业空间\n- 年轻人经营的隐藏工作室\n\n### 城市夜晚 / 下水道 / 异常现场\n- 现实空间长出异常\n- 不是切换风格，而是风格被侵入\n\n---\n\n# 十一、异常植物造型逻辑\n\n## 11.1 总原则\n异常植物不是单纯怪物，而是：\n\n> 植物进入现实世界，放大人的欲望、恐惧和情绪。\n\n## 11.2 视觉路径\n现实基础 → 微妙异常 → 身体/服装异化 → 完全失控\n\n## 11.3 第一集重点异常\n\n### 化形藤\n- 来源：城市垃圾、废弃空间、被遗忘角落\n- 视觉：垃圾与植物组织的融合\n- 不是华丽怪物，而是城市污染和生命反扑\n\n### 怨灵木\n- 来源：企业门板、秩序空间\n- 视觉：木纹如血管、空间渗透、员工标准化\n- 恐怖不在造型夸张，而在“太正常”\n\n---\n\n# 十二、AI生图与资产生产规范\n\n## 12.1 角色不是单张图，而是资产系统\n每个角色必须建立：\n\n- Character Master（锁脸锁身形）\n- 主造型系统\n- 场景应用图\n- 装备图\n- 材质细节图\n- 背面 / 侧面图\n\n## 12.2 每套造型最少资产\n- 正面全身\n- 45度侧面\n- 背面\n- 材质细节\n- 场景应用\n\n## 12.3 统一风格提示方向\n必须保持：\n- Chinese urban fantasy adventure\n- modern young adults\n- realistic cinematic costume design\n- grounded realism\n- subtle supernatural details\n- not wuxia\n- not hanfu\n- not cyberpunk\n- not K-pop idol styling\n- not luxury fashion\n- not superhero costume\n\n## 12.4 统一验收标准\n每张图必须回答：\n\n1. 这个角色像不像真实存在的年轻人？\n2. 这个角色是否拥有隐藏身份的线索？\n3. 三个人放在一起，是否一眼区分？\n4. 是否属于同一个世界观？\n5. 是否偏离本圣经的核心方向？\n\n---\n\n# 十三、资产开发优先级建议\n\n## P0：角色锁定\n- 萧子期基础形象 + 日常 / 外勤\n- 陈宇晨基础形象 + 日常 / 外勤\n- 程雨馨基础形象 + 初始 / 香堂 / 感知状态\n\n## P1：团队关系\n- 三人同框日常\n- 三人外勤\n- 三人夜戏\n- 三人团队群像\n\n## P2：空间\n- 采风香堂\n- 成华集团\n- 城市异常现场\n\n## P3：异常\n- 化形藤\n- 怨灵木\n- 员工异化\n- 装备系统\n- 香具、香囊、记录工具\n\n---\n\n# 十四、结论\n\n《本草奇探》的造型核心，不是创造一个华丽的奇幻世界，而是创造：\n\n> **三个真实生活在现代城市里的年轻人，  \n> 如何因为异常植物事件，逐渐成为隐藏世界的调查者。**\n\n因此，所有造型工作都必须始终坚持以下判断顺序：\n\n1. 先判断人物是否成立\n2. 再判断生活逻辑是否成立\n3. 再判断职业属性是否成立\n4. 最后再加入奇幻细节\n\n只要这个顺序不被打乱，《本草奇探》的造型就不会跑偏。\n\n---\n\n# 十五、最终工作口令（供后续团队统一理解）\n\n## 统一口令 01\n先像都市青年，再像异常调查者。\n\n## 统一口令 02\n人物成长比风格炫技更重要。\n\n## 统一口令 03\n三人必须一眼不同，但始终像一个世界的人。\n\n## 统一口令 04\n奇幻不是穿出来的，是藏进去的。\n\n## 统一口令 05\n服装不是“好看”，而是“人物的经历正在衣服上留下痕迹”。\n", "excerpt": "## Costume Bible / Visual Style Bible\n## 版本：VFinal\n## 适用范围：项目整体造型开发、单集造型拆解、AI 生图与虚拟拍摄资产生产\n\n---\n\n# 一、文档目的\n\n本文件用于统一《本草奇探》的整体造型方向，作为后续以下工作的最高参考标准：\n\n- 三位主角及重要配角的造型设计\n- 单集分场造型拆解\n- AI 生图提示词编写\n- 视频生成与虚拟拍摄角色一", "size": 5713, "safe_id": "本草奇探_整体造型圣经"}, {"name": "守灯造型圣经_V1.0", "project": "狐祖", "content": "# 《狐祖归来》\n\n# EP01 雪娘·守灯少女造型圣经 V1.0\n\n## 一、角色定位\n\n### 角色名称\n\n王雪娘\n\n### EP01身份\n\n王氏旁支守灯少女。\n\n### 狐族血统\n\n白狐一脉，隐藏的狐祖血脉。\n\n### 当前状态\n\n未觉醒。\n\n### 核心概念\n\n雪娘不是普通的弱女子。\n\n她是：\n\n> 被遗忘的狐族贵女，身披低阶守灯人的身份，但身体、气质和细节里隐藏着千年狐祖血脉。\n\n观众第一眼：\n\n\"她很温柔。\"\n\n第二眼：\n\n\"她不像普通人。\"\n\n第三眼：\n\n\"她体内沉睡着一个神。\"\n\n------------------------------------------------------------------------\n\n# 二、整体美学方向\n\n参考：\n\n-   石冈瑛子的神话身体设计；\n-   《惊情四百年》的危险魅惑；\n-   《坠入》的童话神话感。\n\n但第一阶段保持：\n\n-   70%少女；\n-   30%妖性。\n\n不能过早女王化。\n\n核心原则：\n\n> 先狐后人。\n\n狐狸元素不通过狐耳、尾巴直接表达，而通过：\n\n-   眼神；\n-   身体比例；\n-   动作；\n-   衣服流动；\n-   饰品；\n-   材质。\n\n------------------------------------------------------------------------\n\n# 三、造型关键词\n\n## 1. 孤灯\n\n象征：\n\n-   责任；\n-   血脉；\n-   记忆；\n-   被遗忘的过去。\n\n------------------------------------------------------------------------\n\n## 2. 雪\n\n象征：\n\n-   清冷；\n-   孤独；\n-   未被污染。\n\n------------------------------------------------------------------------\n\n## 3. 隐狐\n\n狐狸不是外显。\n\n而隐藏在：\n\n-   狭长眼型；\n-   修长手指；\n-   微尖指甲；\n-   行走姿态；\n-   裙摆流动。\n\n------------------------------------------------------------------------\n\n## 4. 贵族残影\n\n虽然身份低微。\n\n但不能像普通仆人。\n\n必须保留：\n\n-   优雅；\n-   克制；\n-   自尊。\n\n------------------------------------------------------------------------\n\n## 5. 未醒的妖\n\n她尚未觉醒，但身体已经透露：\n\n\"不属于普通人。\"\n\n------------------------------------------------------------------------\n\n# 四、色彩系统\n\n## 主色：灰青\n\n代表：\n\n守灯身份。\n\n颜色：\n\n-   雾青；\n-   石灰蓝；\n-   冷灰。\n\n------------------------------------------------------------------------\n\n## 辅色：月白\n\n代表：\n\n狐族血脉。\n\n用于：\n\n-   内衬；\n-   半透明层；\n-   袖口。\n\n------------------------------------------------------------------------\n\n## 暗色：墨黑\n\n代表：\n\n沉睡力量。\n\n用于：\n\n-   发色；\n-   腰带；\n-   饰品。\n\n------------------------------------------------------------------------\n\n## 唯一高饱和点：赤红\n\n只出现：\n\n-   红宝石耳钉；\n-   少量血脉纹。\n\n代表：\n\n狐狸隐藏的危险性。\n\n------------------------------------------------------------------------\n\n# 五、服装系统\n\n## 1. 外层服装\n\n关键词：\n\n旧、轻、流动。\n\n材质：\n\n-   灰青旧丝；\n-   雾面织物；\n-   轻薄纱层。\n\n避免：\n\n-   粗麻；\n-   破布；\n-   苦情化设计。\n\n她不是贫民。\n\n她是落魄贵族。\n\n------------------------------------------------------------------------\n\n## 2. 袖部设计\n\n核心：\n\n半透明狐袖。\n\n效果：\n\n月光下皮肤若隐若现。\n\n不是情色透明。\n\n而是：\n\n像狐狸经过月光时，皮毛隐约显现。\n\n要求：\n\n-   轻薄；\n-   多层；\n-   流动。\n\n------------------------------------------------------------------------\n\n## 3. 裙摆设计\n\n核心：\n\n尾流裙摆。\n\n特点：\n\n-   多层薄纱；\n-   接近地面；\n-   拖曳感。\n\n视觉：\n\n像狐狸尾巴留下的轨迹。\n\n------------------------------------------------------------------------\n\n## 4. 珠饰控制\n\n避免：\n\n-   大量珠子；\n-   密集排列；\n-   廉价仙
