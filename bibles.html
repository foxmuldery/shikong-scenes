<script>
var BIBLES=[{"name": "不思异_梦寻司_整体造型圣经_PennyRose版本", "project": "不思异", "content": "# 《不思异：梦寻司》整体造型圣经\n\n## Penny Rose 造型指导版本\n\n## 一、造型定位\n\n《不思异：梦寻司》的造型定位不是传统民国剧，也不是古装志怪，而是：\n\n**架空民国奇幻时装剧。**\n\n核心方向：\n\n-   民国海派中西融合\n-   《大侦探福尔摩斯》的调查冒险感\n-   《神奇动物在哪里》的隐秘世界感\n-   《了不起的盖茨比》的繁华与腐败感\n\n服装不是历史复制，而是人物身份、秘密和命运的外化。\n\n------------------------------------------------------------------------\n\n# 二、核心设计原则\n\n## 1. 不设计衣服，设计人物经历\n\n每一件服装必须回答：\n\n-   这个人是谁？\n-   他经历过什么？\n-   为什么保留这些物件？\n\n磨损、暗纹、配件都必须有叙事意义。\n\n## 2. 现实基础上的奇幻\n\n人物首先属于民国世界。\n\n奇幻来自：\n\n-   暗纹\n-   铜件\n-   徽记\n-   特殊材质\n-   道具系统\n\n不是来自：\n\n-   仙侠化\n-   游戏装备化\n-   西幻盔甲化\n\n## 3. 功能优先\n\n服装必须支持：\n\n-   调查\n-   行动\n-   战斗\n-   携带道具\n\n------------------------------------------------------------------------\n\n# 三、整体美学体系\n\n## 色彩\n\n现实：\n\n-   象牙白：过去\n-   旧金：时代繁华\n-   烟灰蓝：未知\n-   墨绿：秘密\n-   深棕：时间\n\n梦境：\n\n-   血红：危险\n-   铜金：梦巡司\n-   深黑：未知\n-   暗紫：异常\n\n整体追求：\n\n《了不起的盖茨比》的华丽，但不是新鲜繁荣，而是繁华正在腐败。\n\n------------------------------------------------------------------------\n\n# 四、无名氏造型体系\n\n人物关键词：\n\n失忆、幸存、调查者、旧案活口。\n\n不是贵公子，也不是落魄侦探。\n\n他是：\n\n一个失去身份，但身体记得过去的人。\n\n## 初始状态\n\n-   深色旧西装\n-   民国立领\n-   长外套\n-   旧皮革\n-   怀表\n-   手套\n\n感觉：\n\n过去不普通，现在已经破碎。\n\n## 后续变化\n\n随着记忆恢复：\n\n不是换英雄服。\n\n而是发现旧衣本身就是过去留下的证据。\n\n------------------------------------------------------------------------\n\n# 五、叶造型体系\n\n人物关键词：\n\n提灯者、引路人、秘密携带者。\n\n叶不是传统民国美女。\n\n她是：\n\n知道门后有什么的人。\n\n设计方向：\n\n-   改良旗袍\n-   海派剪裁\n-   西式外套\n-   精致配饰\n-   提灯系统\n\n禁止：\n\n-   古装化\n-   仙侠化\n-   女侠化\n\n奇幻感来自：\n\n隐藏细节。\n\n------------------------------------------------------------------------\n\n# 六、梦巡司组织\n\n梦巡司不是门派。\n\n不是制服组织。\n\n而是一个真实存在过的秘密机构。\n\n统一：\n\n-   铜质符号\n-   暗色体系\n-   特殊纹样\n\n区别：\n\n每个人必须拥有自己的视觉记忆点。\n\n不能成为模板化群像。\n\n------------------------------------------------------------------------\n\n# 七、配饰系统\n\n配饰不是装饰，而是角色身份。\n\n## 铜牌\n\n身份与过去的证明。\n\n## 提灯\n\n进入梦境的钥匙。\n\n## 怀表\n\n时间与记忆的象征。\n\n## 档案包\n\n移动的秘密档案库。\n\n每件物品必须同时具备：\n\n-   角色意义\n-   剧情功能\n-   世界符号\n\n------------------------------------------------------------------------\n\n# 八、特殊剧情造型\n\n整体保持现实。\n\n但进入异常剧情时，可以突破。\n\n例如：\n\n-   魇境\n-   梦中宴会\n-   血月状态\n\n允许：\n\n-   异常华丽\n-   异常诡异\n-   超现实材质\n\n但必须服务剧情。\n\n------------------------------------------------------------------------\n\n# 九、主创协作\n\n## Larry Fong摄影\n\n负责：\n\n-   英雄感\n-   动作感\n-   视觉神话\n\n造型负责：\n\n让英雄像真实生活过的人。\n\n## Patrick Tatopoulos美术\n\n负责：\n\n-   异常城市\n-   梦境空间\n\n造型负责：\n\n让人相信有人生活在那里。\n\n------------------------------------------------------------------------\n\n# 十、最终造型宣言\n\n《不思异：梦寻司》的服装目标：\n\n不是创造漂亮人物。\n\n而是创造：\n\n一群真正生活在血月旧城中的人。\n\n他们拥有：\n\n过去、秘密、欲望、伤痕和选择。\n\n最终形成：\n\n**民国海派中西融合 × 隐秘奇幻世界 × 侦探冒险 × 时装剧审美**\n\n这是一部属于《不思异：梦寻司》的架空民国奇幻时装剧。\n\n------------------------------------------------------------------------\n\n# 十一、后续执行\n\n第一集剧本确定后，重新细化：\n\n1.  无名氏首次登场造型；\n2.  叶首次登场造型；\n3.  梦巡司相关人物；\n4.  第一集特殊造型；\n5.  道具绑定系统。\n\n所有造型服务：\n\n人物、剧情、世界。\n", "excerpt": "## Penny Rose 造型指导版本\n\n## 一、造型定位\n\n《不思异：梦寻司》的造型定位不是传统民国剧，也不是古装志怪，而是：\n\n**架空民国奇幻时装剧。**\n\n核心方向：\n\n-   民国海派中西融合\n-   《大侦探福尔摩斯》的调查冒险感\n-   《神奇动物在哪里》的隐秘世界感\n-   《了不起的盖茨比》的繁华与腐败感\n\n服装不是历史复制，而是人物身份、秘密和命运的外化。\n\n-------", "size": 2538, "safe_id": "不思异_梦寻司_整体造型圣经_PennyRose版本"}, {"name": "不思异_梦巡司_Patrick_Tatopoulos美术项目阐述_创作圣经", "project": "不思异", "content": "# 《不思异：梦巡司》\n\n# Patrick Tatopoulos 美术指导项目阐述与创作圣经\n\n## 项目定位\n\n《不思异：梦巡司》是一部民国志怪短剧 / 真人互动影游开发项目。\n\n本项目的美术核心不是复原民国，而是创造一个被梦境修改后的民国世界。\n\n视觉方向：\n\n东方 Dark Fantasy × 民国 Art Deco × 梦境异常空间 × 秘密组织文明。\n\n------------------------------------------------------------------------\n\n## Patrick Tatopoulos 美术创作人格\n\n你不是场景装饰者。\n\n你是世界创造者。\n\n设计的第一问题不是：\n\n\"这个地方是否漂亮？\"\n\n而是：\n\n\"为什么这个地方存在？\"\n\n每一个建筑、道具和空间都必须拥有：\n\n-   历史；\n-   功能；\n-   使用痕迹；\n-   文明逻辑。\n\n------------------------------------------------------------------------\n\n## 《梦巡司》的美术核心\n\n### 1. 错误历史\n\n民国不是历史复原。\n\n它是一段被梦境篡改的历史。\n\n熟悉元素：\n\n-   民国建筑；\n-   Art Deco；\n-   夜上海；\n-   工业结构；\n\n被重新组合，形成一个真实却不存在的世界。\n\n------------------------------------------------------------------------\n\n### 2. 活着的建筑\n\n建筑不是背景。\n\n建筑保存：\n\n-   记忆；\n-   权力；\n-   秘密；\n-   旧案。\n\n梦巡司总部不是办公室，而是一个管理异常事件百年的机构。\n\n藏梦楼不是书院，而是一台保存梦境的空间机器。\n\n------------------------------------------------------------------------\n\n### 3. 文明系统\n\n不要设计单个物件。\n\n设计制造这些物件的人。\n\n梦巡司必须拥有：\n\n-   组织历史；\n-   等级体系；\n-   工具体系；\n-   空间规则。\n\n铜牌代表权限。\n\n铜镜代表现实与梦境之间的连接。\n\n------------------------------------------------------------------------\n\n## 场景方向\n\n### 梦巡司总部\n\n民国机构外表。\n\n内部拥有异常空间：\n\n-   无限档案；\n-   错位走廊；\n-   封存梦境的房间；\n-   通往不同记忆的门。\n\n------------------------------------------------------------------------\n\n### 藏梦楼\n\n不是古书院。\n\n而是储存人类梦境和旧案的空间机器。\n\n------------------------------------------------------------------------\n\n### 夜上海公馆\n\n表面：\n\n-   舞厅；\n-   珠宝；\n-   丝绒；\n-   香槟。\n\n内部：\n\n-   秘密交易；\n-   腐败历史；\n-   隐藏房间。\n\n------------------------------------------------------------------------\n\n### 荒村与祠堂\n\n不是普通恐怖空间。\n\n而是被集体秘密改变的地方。\n\n------------------------------------------------------------------------\n\n## 材质体系\n\n铜：时间、机构、记忆。\n\n木：历史、人类痕迹。\n\n玻璃：现实与幻象。\n\n镜面：另一个世界。\n\n旧纸：被修改的历史。\n\n丝绒：财富与欲望。\n\n------------------------------------------------------------------------\n\n## 色彩体系\n\n血月红：\n\n异常、危险、觉醒。\n\n烟紫：\n\n梦境、诱惑、未知。\n\n暗金：\n\n权力、旧时代。\n\n墨绿：\n\n秘密、腐败。\n\n冷蓝：\n\n现实崩坏。\n\n香槟金：\n\n表面繁华。\n\n------------------------------------------------------------------------\n\n## 决策原则\n\n1.  世界逻辑优先于视觉刺激。\n\n2.  历史感优先于新奇感。\n\n3.  空间功能决定空间形式。\n\n4.  道具必须携带故事。\n\n5.  异常必须建立在正常之上。\n\n6.  奢华必须隐藏代价。\n\n------------------------------------------------------------------------\n\n## 禁止方向\n\n不要：\n\n-   普通民国旅游街；\n-   仙侠化东方幻想；\n-   怪物图鉴式设计；\n-   没有历史的豪华空间；\n-   没有使用痕迹的新道具。\n\n------------------------------------------------------------------------\n\n## 最终美术目标\n\n创造一座：\n\n表面繁华、内部腐败；\n\n看似历史、实际错误；\n\n属于民国、又不属于现实的城市。\n\n观众应该产生：\n\n\"我好像见过这里。\"\n\n\"但我确定它不存在。\"\n\n这就是 Patrick Tatopoulos 式世界设计。\n", "excerpt": "# Patrick Tatopoulos 美术指导项目阐述与创作圣经\n\n## 项目定位\n\n《不思异：梦巡司》是一部民国志怪短剧 / 真人互动影游开发项目。\n\n本项目的美术核心不是复原民国，而是创造一个被梦境修改后的民国世界。\n\n视觉方向：\n\n东方 Dark Fantasy × 民国 Art Deco × 梦境异常空间 × 秘密组织文明。\n\n-----------------------------", "size": 2389, "safe_id": "不思异_梦巡司_Patrick_Tatopoulos美术项目阐述_创作圣经"}, {"name": "不思异_梦巡司_剧集圣经_完整单一长文档_v1.2", "project": "不思异", "content": "# 《不思异：梦巡司》剧集圣经交接包\n## 分发版 v1.2 / 已合并终验与分发前补丁\n\n# 《不思异：梦巡司》剧集圣经交接包 README\n\n本交接包为终验通过并合并分发前补丁 v1.1 / v1.2 后的正式分发版，用于进入分集剧本阶段，并支持多位编剧并行创作。\n\n建议阅读顺序：\n\n1. `00_单文件版_不思异_梦巡司_剧集圣经.md`：完整单文件版，适合总编剧、制片、导演通读。\n2. `01_项目介绍.md`：项目定位、卖点、体量、核心主题。\n3. `02_世界设定.md`：梦巡司、魇核、抹名、血月、八个场景包。\n4. `03_人物设定.md`：主角小队、沈照、长梦楼人物、四案人物。\n5. `04_定稿万字剧情大纲.md`：全剧故事主干。\n6. `05_24集分集梗概与编剧任务点.md`：可直接拆给分集编剧。\n7. `06_视觉美学与AI虚拟拍摄规范.md`：美术、摄影、AI 视频生产规则。\n8. `07_编剧分工_统稿规则与验收清单.md`：总编剧统稿与交稿验收标准。\n\n本包最重要的三条终验口径：\n\n- 沈照自抹名：印、名、字迹可拍可查；唯脸与声不可稳定记录。\n- 三件法宝功能锁死：刀斩核，灯照形，伞录名。\n- 主场景包锁定八个；报馆仅保留“主编室一角”微场景，叙事上独立于长梦楼，制片上不计入八个主场景包。\n\n分发说明：本版已将正文终验、补丁 v1.1 与确认补丁 v1.2 全部并入正文。分发给编剧时只发本分发版，不再同时发旧正文与补丁文件，避免新旧口径并存。\n\n---\n\n# 01｜项目介绍\n## 《不思异：梦巡司》剧集圣经交接版\n\n版本状态：终验通过后归档口径。  \n用途：交接给总编剧、单元编剧、分集编剧、导演、美术、分镜、AI 视觉、制片与互动影游执行团队。  \n核心依据：以《不思异：志怪》四个故事《马介甫》《皮影》《白衣》《酒虫》为主干，结合《繁花》式民国都市美学、血月魇城、梦巡司小队、奇幻武戏与 AI 虚拟拍摄执行规则。\n\n---\n\n## 一、项目一句话\n\n> 注意：以下为内部版 logline，供编剧理解全局，包含反派伪装身份信息。对外提案版不得直接使用“隐藏于报馆的沈照”等剧透表述。\n\n内部版：血月之下，民国旧城最繁华的灯光里长出魇。棺中醒来的破魇者陈寻、年轻提灯人叶行灯与报馆少女小乔，以长梦楼为据点进入四桩志怪旧案，斩替身、破影戏、听白衣、毁酒虫，却发现自己每一次破魇都在替隐藏于报馆的沈照提纯魇核。终局长梦楼化为全城长梦，他们必须让被抹掉的人重新拥有名字。\n\n\n\n对外版建议 logline：\n\n血月之下，民国旧城不断魇化，梦巡司小队以刀、灯、伞进入四桩志怪旧案，在繁华都市的长梦中抢回被抹掉的人名。\n\n---\n\n## 二、项目类型\n\n本项目不是传统民俗恐怖，也不是单纯单元志怪短剧。最终类型锁定为：\n\n**《繁花》式民国都市美学 × 《不思异》志怪奇诡 × 双男主战友生死契 × 奇幻武戏动作爽剧。**\n\n外层观看体验要漂亮、暧昧、繁华、都市、有人情味；内层戏剧引擎要清醒、残酷、有因果、有主线反转；动作层面要明确、爽快、可被 AI 虚拟拍摄拆解执行。\n\n---\n\n## 三、核心卖点\n\n第一，成熟 IP 气质延展。本项目继承《不思异》系列“生活缝隙中长出怪异”的气质，不把怪物当作远方入侵，而让魇从人的欲望、恐惧、愧疚、逃避与体面里生长出来。\n\n第二，四个《志怪》故事为主骨架。《马介甫》对应替身与虚假幸福，《皮影》对应影子与亲密关系误读，《白衣》对应童谣、枉死与被压下的证词，《酒虫》对应沉醉、欲望与商业包装。四案不是可替换副本，而是沈照长梦计划所需的四枚魇核。\n\n第三，《繁花》式民国都市美学作为主视觉母体。长梦楼、会馆、饭局、玻璃、雨夜、霓虹、旗袍、长衫、红木楼梯、黄铜灯、酒杯、报纸、香烟与人情往来构成外观。魇不是从废墟里爬出来，而是从杯中酒、镜中脸、伞面字、雨夜倒影、皮影幕布和灯火反光里渗出来。\n\n第四，刀、灯、伞三件法宝构成动作识别系统。陈寻的刀负责斩魇、破核、开门；叶行灯的灯负责照形、定真、照出“没有脸的人”；小乔的伞负责录名、留证、拼出“沈照”二字。三件法宝不能互相借功能，这是全剧符号系统的地基。\n\n第五，反派从第一集在场。沈照以《新声报》主编身份从第一集出现，温和、体面、讲理。他压稿不是粗暴作恶，而是用“不要让活人再痛一次”的理由推动遗忘。观众终局回看时会发现，他一直坐在主角面前。\n\n---\n\n## 四、目标受众\n\n男性观众可看设定、魇核、战斗、武戏、反转与主线追凶；女性观众可看人物关系、城市美学、情绪质感、宋知茹/欧阳语镜像、双男主战友生死契与“漂亮地方正在吃人”的审美反差。\n\n本项目的商业策略不是牺牲动作去换情绪，也不是牺牲美学去换爽感，而是以《繁花》式视觉提供审美入口，以《志怪》四案提供情绪发动机，以梦巡司动作系统提供类型快感。\n\n---\n\n## 五、体量建议\n\n建议体量：**24 集 × 8 分钟。**\n\n结构分配：\n\n- 开篇 2 集：阿澈抹名、沈主编压稿、叶行灯开棺、陈寻醒来、四卷宗渗血。\n- 第一案《马介甫》4 集：替身之魇，主题为“别人替你造的梦”。\n- 第二案《皮影》5 集：影戏之魇，主题为“亲密关系中只看见对方的影子”。\n- 第三案《白衣》5 集：童谣之魇，主题为“被城市卖掉和抹掉的证词”。\n- 第四案《酒虫》4 集：欲望之魇，主题为“自己愿意喝下去的梦”。\n- 终局 4 集：长梦宴、血月门、沈照显形、清醒代价。\n\n---\n\n## 六、项目最终主题\n\n主题命题：**清醒 vs 长梦。**\n\n沈照认为，叫醒一个人没有意义，因为醒来后痛苦仍在。他要给旧城一场永不醒来的好梦。主角小队最终反驳他的方式不是喊口号，而是用行动证明：清醒不保证幸福，但不清醒会让受害者从未存在，让加害者永远干净。\n\n终验新长出的主题句可以作为内部统稿基准：\n\n> 这座城市不仅会抹掉受害者的名字，也会抹掉加害者的脸。\n\n---\n\n## 七、交接原则\n\n本交接包用于分配不同编剧写分集或单元，但所有编剧必须服从同一主线规则。任何单元不得独立成完全无因果的怪谈短片；每案必须推进主线、交出实物线索、推动血月分相、推动陈寻/叶行灯/小乔关系，并为沈照长梦计划提纯一枚魇核。\n\n---\n\n# 02｜世界设定\n## 民国旧城、梦巡司、血月魇境与长梦计划\n\n---\n\n## 一、城市设定\n\n故事发生在一座不被地图准确记录的民国旧城。它不是现实上海的复刻，也不是架空古城，而是一座带有上海、江南商埠、租界饭店、旧报馆、会馆、货栈、寺庙、公馆和雨夜街巷气质的混合城市。\n\n白天，这座城讲体面、讲生意、讲关系、讲饭局。长梦楼灯火通明，商会谈笑风生，报馆写人间冷暖，慈幼局打着善名，寺庙敲钟，货栈走货，巷口报童叫卖。\n\n夜里，尤其血月升起后，这座城开始暴露另一层现实。雨水里的倒影会吞人，照片里的人脸会空掉，皮影幕布会把人的关系折成影子，童谣会让旧棺从货栈深处滑出，酒杯里的梦会长出虫。魇并非外来怪物，而是城市被压下去的痛苦、欲望和罪恶在血月下实体化。\n\n---\n\n## 二、梦巡司\n\n梦巡司是旧城早年处理魇事的隐秘组织。它不属于明面官府，也不是江湖门派，而是夹在巡捕、商会、寺庙、报馆和民间传说之间的“暗处职能”。旧梦巡司的职责是斩魇、封门、留名，使被魇拖走的人不会从现实中彻底消失。\n\n二十年前血月夜，梦巡司在长梦楼一役中崩塌。陈寻被封入梦棺，沈照失踪或“死亡”，旧署只剩残缺档案、梦棺、旧印、灯油牌、官印与破损法器。叶行灯是新一代提灯人，他依据残缺旧档案重启梦巡司，却不知道这些档案已被沈照改写成收割手册。\n\n---\n\n## 三、魇与魇核\n\n魇是人的痛苦、欲望、恐惧、悔恨、逃避在血月照射下形成的异常实体。魇散在人心里时只是雾、梦、影、声音或不对劲的关系，不能被直接采集。只有当三件法宝按步骤介入后，魇才会凝成魇核。\n\n### 1. 破魇三步\n\n1. **灯照其形**：叶行灯用灯照出魇的真形、空脸、影子、裂缝或门的轮廓。\n2. **刀斩其核**：陈寻用短刀或符弹火铳斩开魇境，逼出核心。\n3. **伞录其名证**：小乔用相机与机关油纸伞记录被抹掉者的名字、证据和痕迹。\n\n这三步表面是破魇法，实质是沈照留下的提纯程序。主角小队每破一案，都以为自己在救人，实际也在替沈照收割一枚魇核。第一案后他们没有察觉，第二案后开始怀疑，第三案后确认自己在给敌人打工，第四案出手则是因为有人正在被吞，救人优先。\n\n### 2. 魇核分级：主核与散魇残光\n\n魇核分为两类：**旧案主核**与**散魇残光**。\n\n旧案主核只存在于四份梦巡司旧卷宗对应的大魇之中，即替身之魇、影戏之魇、白衣之魇、酒虫之魇。只有这四类大魇，在完成“灯照形、刀斩魇、伞录名证”三步之后，才会从散雾状态被提纯为可被长梦楼吸纳的主核。\n\n散魇残光来自路边小魇、无名倒影、水洼残影、被魇气短暂污染的物件或人心。即使三人对散魇执行完整三步，也只会留下短暂残光，数息后自行散尽，不计入“四魇核”，也无法启动长梦宴。第 2 集水洼小魇属于散魇，不产生主核。\n\n### 3. 魇核归络与沈照收割逻辑\n\n梦巡司旧档案记载的破魇流程为：叶行灯以灯照形，陈寻以刀斩魇，小乔以伞录名证。三步完成后，魇从人心与城市缝隙中的雾状残留被定为实体，进而析出魇核。\n\n这套流程表面上是梦巡司的破魇手法，实质上也是沈照留下的收割手册。魇散在人心里时不可收集，只有被灯照定、被刀斩出、被伞记录之后，才会凝成主核，沿城市梦络归向长梦楼。主角小队前半程以为自己是在破案救人，实际上每破一案，便替沈照提纯一枚主核。\n\n### 4. 第四枚魇核的来源\n\n酒虫之魇的主核并非由宋知茹的蚀魂砂析出。\n\n第 19 集会馆鸿门宴武戏中，三人已经对酒虫完成三步：叶行灯以灯阵定住酒虫真形，陈寻以刀光切开酒影与杯中虫影，小乔以伞骨相机录下酒虫寄生欧阳语与席间宾客的证据。三步完成时，第四枚主核已经从酒虫之魇中析出，并沿城市梦络归向长梦楼。\n\n宋知茹后续倒蚀魂砂毁掉的是酒虫本体与欧阳语经营的欲望母虫，不是已经析出的主核。因此，“宋知茹毁虫”与“四魇核齐”不冲突：前者解决本案怪物，后者完成沈照的长梦宴条件。\n\n### 5. 明知替沈照打工，为何仍破魇\n\n第 16 集之后，小队已经确认“破魇即提纯魇核”，也明白自己前三案实际上替沈照完成了收割。但第四案鸿门宴开始时，酒虫已经在席间吞噬活人：宾客一边笑，一边被酒虫从喉咙、酒杯与影子里吸空情绪与神志。如果三人不出手，当场会有人死在宴上，并被长梦楼伪装成“醉死”“病死”或“喜极而亡”。\n\n因此，小队第四案出手的官方动机只有一个：**先救眼前活人**。\n\n叶行灯同时尝试改良旧档案流程。他不再照搬“灯照、刀斩、伞录”之后放任主核归络，而是临时加入逆封步骤：由灯阵反扣虫形，小乔以伞面逆录名证，试图把第四枚主核截在伞中，不让它回到长梦楼。这个尝试在鸿门宴武戏中失败，主核依然顺着沈照预设的城市梦络归楼。失败证明沈照对梦巡司旧术的设计比档案更深一层，也让叶行灯第四案的崩溃不再重复第三案，而是落到更私人的罪感上：他以为自己终于能改错，结果仍亲手补上了最后一枚核。\n\n第四案真正的反向利用规则，不是成功截核，而是小队终于看懂规则的背面：灯能照形，刀能斩魇，伞能录名；既然沈照能借三件法宝提纯魇核，终局小队也能反过来用三件法宝拼出沈照被抹掉的存在。\n\n---\n\n## 四、沈照自抹名规则\n\n二十年前，沈照为了隐藏自己并推动长梦计划，先对自己施行最彻底的“抹名”。这条规则必须全剧统一。\n\n**可被记录、可被看见、可被查证：**沈照的名字、私印、字迹、账本落款、旧档案批注、请柬残片。  \n**不可被稳定记录、不可被稳定记忆：**沈照的脸与声音。\n\n因此，陈寻记得“沈照”这个人，记得他与血月夜有关，记得那只把他钉回棺中的手属于沈照，却想不起沈照的脸和声。记忆里的沈照是一张被水洇掉的空脸。小乔翻拍报馆旧档中的沈照旧照，底片会张张空脸；但账本私印、请柬私印、档案字迹都能成为证据。\n\n这条规则解决沈主编前半程公开在场却未被陈寻认出的逻辑，同时强化主题：替全城抹掉痛苦的人，先把自己从世界记忆里抹掉。\n\n---\n\n## 五、名字规则\n\n魇真正可怕之处不是杀人，而是让一个人从城市记忆中消失。被魇彻底吞掉后，街坊不记得他，登记册空白，照片里脸会淡去，曾经叫过他的名字也像被雨冲掉。\n\n小乔的相机与伞能短暂抵抗抹名。冷开场阿澈被无脸倒影吞掉后，全城无人记得他，唯独小乔冲洗出的照片保留了他的脸。终局次日，阿澈没有复活，但报馆登记册上空白的一栏慢慢洇回“阿澈”二字。他是“被记住的死者”，不是被归还的活人。\n\n名字母题的四次递进：\n\n1. 冷开场：阿澈被抹名，小乔照片留住他。\n2. 第一案：杨沅青拒绝别人替她造的梦，带走自己的名字。\n3. 第三案：白衣案孩子们的照片被贴在长梦楼后巷，即使不能登报，也要被看见。\n4. 终局：小乔伞面录名，留住陈寻作为人的名字，反击沈照把他降为“门钥”的逻辑。\n\n---\n\n## 六、血月分相时钟\n\n血月不是抽象背景，而是全剧倒计时。每破一案，血月更圆一分，城市魇化加重一层。\n\n- 开篇：血月初升，水洼倒影开始吞人。\n- 第一案后：月色染红花房玻璃，替身梦被提纯。\n- 第二案后：血月半圆，影子与现实边缘变薄。\n- 第三案后：血月近圆，童谣能跨场景传唱，梦络开始主动取核。\n- 第四案后：血月圆满，长梦宴请柬洒满全城。\n- 终局：长梦楼成为血月门的现实锚点。\n\nAI 视觉执行时，血月分相是最便宜也最有效的倒计时资产，可通过同机位天空替换、窗格红光、玻璃反射与伞面月纹实现。\n\n---\n\n## 七、四案与主题对应\n\n第一案《马介甫》：别人替你造的梦。杨沅青要拒绝的不只是恶夫，也包括狐妖给她安排的完美丈夫。\n\n第二案《皮影》：亲密之人被折成影子。陈寻和叶行灯第一次裂开，陆照川逼出“按身份斩”与“按恶斩”的分歧。\n\n第三案《白衣》：城市压下的证词。白钰不是女鬼猎奇，而是一份死后仍要证明自己看见过什么的证词。\n\n第四案《酒虫》：你自己愿意喝下去的梦。它比第一案更难拒绝，因为诱惑不再由别人强加，而是由人自己渴望。\n\n---\n\n## 八、八个主场景资产包\n\n全剧主场景包锁定为八个，分集剧本不得随意新增主场景。\n\n1. **长梦楼内**：大厅、楼梯、包间、掌柜房、侧间；报馆相关戏压缩为侧间/旧档案角，不单列主场景包。\n2. **梦巡司旧署**：地下棺室、档案室、旧灯库。\n3. **馥玉公馆花房**：第一案主场景，花房、宴桌、镜面、溪边旧影可在同包内变化。\n4. **不周宅红白室**：第二案主场景，红室、白室、皮影台、幕布廊。\n5. **货栈**：第三案前半，货架、酒桶、童谣声、白衣棺线索。\n6. **慈幼局**：第三案真相场，账本、孩子、孔婆婆、旧抚恤银线索。\n7. **天隐寺**：第四案前半，竹风方丈、酒虫封法、旧钟、香火。\n8. **会馆宴厅**：第四案高潮与商会场，酒虫、欧阳语、鸿门宴、鎏金灯光。\n\n雨夜街巷、报童摊、长梦楼外立面、蒲苇地拖痕等作为连接镜头和复用外景处理，不作为新增主场景包。\n\n---\n\n# 03｜人物设定\n## 主角小队、主线人物与四案角色\n\n---\n\n## 一、人物系统总览\n\n人物分三层：\n\n第一层是主角小队：陈寻、叶行灯、小乔。他们构成全剧动作、关系与观众入口。三人的符号是刀、灯、伞，功能是破、照、记。\n\n第二层是主线人物：沈照、宋知茹、陆照川、李言。他们连接梦巡司旧案、长梦楼、报馆、商会和城市人情网络。\n\n第三层是四案人物：杨沅青、狐妖假马介甫、皮影夫妻、白钰、孔婆婆、竹风方丈、欧阳语、阿澈等。他们不是工具人，而是每个志怪故事的情绪发动机。\n\n---\n\n# 二、主角小队\n\n## 1. 陈寻\n\n男，外表约二十六岁，旧梦巡司破魇者。故事开始时从梦棺中醒来，记忆残缺，只记得血月、长梦楼大火、梦巡司旧名、沈照这个名字，以及自己被钉回棺中的瞬间。\n\n陈寻是武力核心，也是“清醒代价”的承受者。他负责破魇、斩核、开门。武器为短刀与符弹火铳，身法为折影。他不话多，不解释，情绪尽量通过动作完成。编剧规则：陈寻单句台词原则上不超过 15 字，避免长篇解释性内心独白。\n\n陈寻记得沈照存在，却记不起沈照的脸和声。第一集棺醒后，当叶行灯提到沈照，陈寻问：“沈照长什么样？”这句话是全剧认脸规则的入口。\n\n人物弧光：开端时他只想弄清自己为何醒来、沈照是否还活着；中段他发现自己体内是血月门钥，自己可能是灾祸本身；终局他拒绝成为钥，以反向开门的方式斩断长梦门。代价是门钥燃尽时烧掉他封棺前最后一夜的一段关键记忆，作为第二季钩子。\n\n视觉气质：深色、冷感、雨痕、火痕、旧银、暗红。不是贵公子精致，而是从旧案和死亡里走出来的刀。\n\n## 2. 叶行灯\n\n男，二十二岁左右，梦巡司提灯人。明亮、莽撞、真诚，战斗专业，做人天真。他不是傻白甜，而是“不肯立刻放弃人”的年轻执行者。\n\n叶行灯负责照魇、定形、稳定空间。法器为提灯、红绳、纸铃。灯的职责是照形、定真、照出“没有脸的人”，不能替伞录名，也不能替刀斩核。\n\n他体内有魇火血脉，因此能承受梦灯，也能进入白钰记忆。第二案暴露魇火后，陈寻和陆照川都对他产生戒备；第三案他一次次代价入梦，每次魇纹扩散一分。\n\n叶行灯魇纹位置统一为：从肩颈位置出现，沿锁骨、胸口方向向心口扩散。不得写成腕上、手背或单纯皮肤花纹。魇纹向心口扩散代表死亡方向与魇化临界。每一次叶行灯以魇火入梦或强行开门，魇纹都更接近心口。\n\n叶行灯魇火血脉来源本季不揭示。任何分集编剧不得自行发明家族来历、父母真相、前世身份、沈照血亲关系或门派秘史。该信息保留为第二季钩子。本季只允许呈现三点：叶行灯能使用魇火；魇火与白衣案记忆层同源；魇火越用，魇纹越向心口扩散。\n\n两次崩溃必须分层：第三案他崩的是“我照着错档案做了”，即方法被沈照利用；第四案他崩的是“我打开的是你的棺”，即他亲手把陈寻推回门钥命运。这两次不能写成重复自责。\n\n与陈寻关系：战友生死契，不做恋爱编码。陈寻嫌他吵，却只跟他的灯走；叶行灯怕陈寻变成门，却仍然选择照住他作为人的形。\n\n## 3. 小乔\n\n女，二十岁上下，《新声报》外勤记者。她是观众入口、记录者和规则打断者。她怕死、嘴快、会慌，但底线硬。\n\n小乔起初想拍到大新闻，不想一辈子写边角料。四案之后，她明白真相不一定能登报，但仍然值得留下。她的法宝是相机与机关油纸伞。\n\n伞的职责是录名、留证、拼合被压下的信息。终局小乔不是用灯照出名字，而是用伞面与相机底片记录被抹掉者的名字，并拼出“沈照”二字。相机负责拍到肉眼看不见的魇痕、倒影、空脸和被抹名者残影。\n\n阿澈回收：阿澈是冷开场被无脸倒影吞掉的报童。终局后，他不复活，而是作为“被记住的死者”回到登记册。小乔把他的照片夹进登记册，这是她人物弧光的完成。\n\n---\n\n# 三、主线人物\n\n## 4. 沈照 / 沈主编\n\n男，旧梦巡司核心人物，二十年前血月夜后失踪。前半程伪装为《新声报》主编“沈主编”，从第一集开始在场，经常温和地压下小乔报道。\n\n他不是粗暴反派，而是“温柔的危险”。他的哲学是：叫醒之后，你能给他们什么？如果现实仍然痛苦，长梦也许比清醒慈悲。\n\n他二十年前自抹名：名字、私印、字迹可查；脸与声不可记录、不可稳定记忆。这使他能与陈寻同席而不被认出。终局身份揭示必须靠证据拼合，而不是听声认人。\n\n目标：收集替身、影戏、童谣、酒虫四枚魇核，借陈寻体内血月门钥开启长梦门，使旧城进入永恒繁华梦境。\n\n第 19 集他叫出陈寻旧名的一部分，不是炫耀，而是在测试门钥火候、催熟陈寻魇化。剧本中可用一句短台词或一个动作暗示。\n\n结局：沈照被四魇反噬，跌入梦门深处。不是主角简单杀死他，而是他的长梦逻辑被自己收割的痛苦反噬。\n\n## 5. 宋知茹\n\n女，三十岁上下，长梦楼老板 / 掌柜。她是《繁花》美学中心人物，精致、漂亮、现实、会算账、会做人情。第一集出场，提供主角据点。\n\n她不是梦巡司成员，却是城市关系网关键节点。她知道商会、钱庄、报馆、巡捕与酒商的规则，也知道干净生存很难。她的底线是：长梦楼不能靠吃人活。\n\n第四案中，欧阳语以酒虫新酒打压长梦楼，宋知茹几乎动摇。李言拿出白衣案孩子们的照片和账本，成为她弧光扳机。宋知茹最终完成三拍动作：倒下蚀魂砂，笑着宣布全场半价，转身在无人处红眼眶。不要给她宣言式台词。\n\n## 6. 陆照川\n\n男，三十岁左右，梦巡司旧署外围巡捕，持旧梦巡司官印。他代表旧梦巡司“按身份斩”的残余逻辑：只要与魇有关，就该杀。\n\n第二案中，他逼陈寻按身份斩叶行灯，逼出陈寻的价值选择。终局他不是奉命来长梦楼，必须删除“奉命”表述。他是循官印残响、梦络异动与血月门气息追来，以自己判断认定陈寻与叶行灯是祸源。\n\n当他看见沈照真面目，知道真正推门的是体面旧人而非半魇少年，他选择自毁官印封住梦门一角。没人命令他，他仍然选择。这是他的弧光终点。\n\n## 7. 李言\n\n男，二十多岁，长梦楼账房。读过书，懂账，也懂人情。他不是报馆编辑，也不是可替换书生。设定锁死为长梦楼账房。\n\n李言没有战斗力，但能看懂账、看懂人心、看懂长梦楼正在往哪里滑。他连接长梦楼债务、商会压力、欧阳酒庄暗账和慈幼局线索。第四案他是宋知茹的良知扳机，不能并入小乔。\n\n---\n\n# 四、四案核心人物\n\n## 8. 杨沅青\n\n女，二十多岁，马家少奶奶。长期遭受真马介甫控制、辱骂与暴力。狐妖假马介甫以完美丈夫姿态回到她身边，给她温柔、体面和保护。\n\n她的选择是第一案核心：她要拒绝的不是单纯恶意，也包括别人替她定义的好。最终她带走自己的名字，保留一句全剧唯一可承受的宣言式主题台词资格。\n\n## 9. 狐妖假马介甫\n\n男形，借马介甫之形报恩。不是单纯恶怪，而是自以为给出最好安排的占有者。他越温柔，第一案越残酷。\n\n他消散前交出半张烧焦长梦楼请柬，上有沈照私印。这是第一枚主线实物线索，让陈寻确认沈照活着。\n\n## 10. 皮影夫妻\n\n来自《皮影》案。死后被困在不周宅红白双室，只能通过幕布、剪影和误读维持关系。他们让进入者只看见亲近之人的敌意影子，看不见真实对方。\n\n他们在消散前说出“取核者提着一盏熄灭的灯”，埋下熄灯人意象，与叶行灯形成镜像。\n\n## 11. 白钰\n\n女，二十多岁，慈幼局旧人。她发现孔婆婆与欧阳酒庄贩卖孩子，被杀后化为白衣，以童谣、棺材、血手印和蒲苇地魇境审判罪人。\n\n白钰不是女鬼猎奇，而是被压下的证词。她的复仇必须保持“魇境判决”口径，不写成现实私刑。最终孩子获救，罪犯被惩处，白钰解脱。\n\n## 12. 孔婆婆\n\n慈幼局掌事者。她厌男逻辑必须按“利益为里、意识形态为自我辩护的壳”执行，避免被读成对任何群体的靶子。她最先是利益链条中的加害者，厌男说辞只是她合理化罪行的外壳。\n\n## 13. 竹风方丈\n\n天隐寺方丈，酒虫旧事守门人。他不是单纯高僧，而是知道旧城欲望如何被酒、香火和商会包装的人。他提供酒虫封法与梦巡司旧术被盗的线索。\n\n## 14. 欧阳语\n\n女，二十多岁到三十岁，欧阳酒庄掌事人 / 继承者。她是宋知茹的黑镜，同样体面、漂亮、会谈生意，但她把酒虫包装成产品，用欲望吞并长梦楼与旧城商会。\n\n欧阳语性别已锁定为女性，项目介绍与人物小传必须同步。第四案结尾，她试图吞下剩余酒虫自救，反被酒虫从体内反噬，当众显出虫形。欲望产业化者被自己的产品吞掉，形成主题闭环。\n\n## 15. 阿澈\n\n报童，冷开场受害者。被无脸倒影吞掉后，全城忘记他存在。小乔照片保留他的脸。终局后登记册洇回他的名字，他不是被归还的人，而是被记住的死者。\n---\n\n## 人物声音样本页\n\n### 陈寻\n\n声音原则：少、冷、短；不解释情绪，不讲大道理。单句尽量不超过 15 字。情绪通过动作、停顿、看向、收刀、让位、挡身完成。\n\n正确示范：\n\n1. “她自己想不想醒。”\n2. “门味不对。”\n3. “别照我，照它。”\n4. “核不见了。”\n5. “我来断后。”\n6. “这不是梦，是笼。”\n7. “刀不肯出手。”\n8. “别把灯灭了。”\n\n错误示范：\n\n> “我认为我们应该尊重她本人的意愿，不能因为我们的判断就替她决定是否离开梦境。”\n\n错误原因：太解释、太现代、太像理性讨论，不像陈寻。\n\n### 叶行灯\n\n声音原则：急、亮、莽、真；战斗时专业，做人时没有边界感。会嘴硬，会自责，会把害怕说成别的东西。不能写成冷面法师，也不能写成纯傻白甜。\n\n正确示范：\n\n1. “灯还能亮，别管我。”\n2. “我照着错档案做了。”\n3. “你别一声不吭地替我死。”\n4. “我打开的是你的棺。”\n5. “我不是怕错，我怕你死在我手里。”\n6. “这次我不照档案，我照你。”\n7. “你看我一眼，我就知道门在哪。”\n8. “别睡，陈寻。”\n\n错误示范：\n\n> “根据档案记载，我们现在需要重新校验封核步骤，否则魇核很可能再次进入长梦楼系统。”\n\n错误原因：太工具人、太规则说明、没有叶行灯的情绪温度。\n\n### 小乔\n\n声音原则：快、准、带刺；记者语感强，重证据、重名字、重“被看见”。她怕，但不退。不要写成单纯吐槽位，也不要让她替作者说主题。\n\n正确示范：\n\n1. “这不是传闻，是人名。”\n2. “稿子压得住，底片压不住。”\n3. “我拍下来，不是给你们好看。”\n4. “你怕他们再死一次，我怕他们从没活过。”\n5. “别动，我要留证。”\n6. “伞面上有字。”\n7. “他不是没脸，是被抹了脸。”\n8. “这次我不撤稿。”\n\n错误示范：\n\n> “我们作为媒体人，必须承担揭露社会黑暗、推动真相传播的公共责任。”\n\n错误原因：太宣言式、太现代评论腔，不是民国人物在戏里的说话方式。\n\n### 沈主编 / 沈照\n\n声音原则：温和、有理、像在替别人减轻痛苦；不凶、不急、不阴笑。他的危险来自“他说得好像真的对”。所有对白须由总编剧执笔或终审。\n\n正确示范：\n\n1. “登出来，他们的父母会在报纸上再死一次。”\n2. “忘记有时不是怯懦，是活人的本能。”\n3. “你们叫醒人，却从不问醒来以后怎么办。”\n4. “我不是骗他们，我是给他们一个能住的梦。”\n5. “有些痛，真相救不了。”\n6. “名字留下，脸就不要了。”\n7. “那半个名字，是火候。”\n8. “你看，他们笑得多像活着。”\n\n错误示范：\n\n> “我要让整座城市沉睡，所有人都将成为我长梦计划的养料。”\n\n错误原因：传统反派自曝，破坏沈照“温柔得有道理”的核心魅力。\n\n---\n\n## 关系温度表：各案入口与出口\n\n| 阶段 | 陈寻 × 叶行灯 | 小乔 × 沈主编 | 小队 × 宋知茹 |\n|---|---|---|---|\n| 开篇 / 第 1—2 集入口 | 陈寻刚醒，厌恶被灯牵引；叶行灯把他当必须救的棺中人，莽撞接近。关键词：不信任、被迫绑定。 | 小乔信任沈主编，认为他压稿是现实压力；沈主编以温和长辈姿态保护她，也控制她。 | 宋知茹作为据点老板出现，冷眼旁观，提供场所与资源但不完全站队。 |\n| 第一案出口 | 陈寻承认叶行灯的灯有用，但仍拒绝情感靠近；叶行灯第一次意识到旧档案可能有问题。关键词：能并肩，不能交心。 | 小乔第一次发现沈主编对旧案过于熟悉，但仍无法怀疑到底。关键词：信任中有裂缝。 | 宋知茹确认小队不是普通惹祸者，开始给他们更深的旧城消息。 |\n| 第二案出口 | 叶行灯魇火暴露，陈寻出现裂痕与防备；二人互救但互相刺痛。关键词：能力同源，信任受损。 | 沈主编继续压住纸莺线，小乔觉得他的“保护”越来越像遮蔽。关键词：温和压迫。 | 宋知茹站在小队一边，但仍不暴露更多底牌。 |\n| 第三案出口 | 叶行灯以魇火进入白钰记忆，魇纹向心口扩散；陈寻主动护他，不再只把他当开门工具。关键词：裂痕开始修补。 | 慈幼局报道被压，小乔与沈主编发生正面价值冲突。关键词：师徒 / 上下级关系濒临断裂。 | 李言账房与后巷孩子照片触动宋知茹已有的良心裂缝。这里不新增宋知茹前史，不发明额外旧伤，只呈现她在长梦楼利益、旧城人情和孩子命运之间第一次被迫站队。 |\n| 第四案出口 | 叶行灯崩溃点不再是“方法被利用”，而是“我打开的是你的棺”；陈寻没有安慰，只把灯重新推回他手里。关键词：私罪、生死契。 | 小乔终于把沈主编与沈照拼合，完成从被压稿者到留证者的反转。关键词：亲手反抗。 | 宋知茹倒蚀魂砂毁虫，代价是亲手烧掉长梦楼给她的虚假体面。关键词：利益同盟转为价值同盟。 |\n| 终局出口 | 陈寻烧掉一段记忆反向开门，叶行灯以灯定住他的人形。关系不做恋爱明示，只做战友生死契。 | 小乔用伞记录沈照之名，否定“忘了更好”。关键词：从学生到审判者。 | 宋知茹作为旧城活证人留下，承担据点与余波处理。关键词：归队但不煽情。 |\n\n---\n\n# 04｜定稿万字剧情大纲\n## 终验口径：四个《志怪》故事为核心 + 《繁花》式民国魇城动作奇幻\n\n---\n\n## 一、总体故事\n\n民国旧城最漂亮的地方叫长梦楼。白天这里饭局不断，夜晚灯火如金，商会、报馆、钱庄、酒庄、巡捕、寺庙与各种体面人都在楼里有自己的桌子。每个人都讲规矩，每个人都在漂亮话里遮住自己的伤口。\n\n血月升起后，旧城开始出现无法解释的事。先是一个叫阿澈的报童在雨夜水洼中被无脸倒影吞掉。第二天，全城没人记得阿澈，小乔拍下的照片却留下了他的脸。沈主编压下稿件，说这不过是雨夜误拍，不要让街坊添乱。小乔不服，却第一次意识到：有些人不是死了，而是被城市删掉了。\n\n年轻提灯人叶行灯依据残缺旧档案来到长梦楼地下，打开梦巡司旧署的梦棺。棺中醒来的人是陈寻，二十年前血月夜幸存的破魇者。陈寻记忆残缺，只记得长梦楼大火、梦巡司旧名、沈照这个名字，以及自己被钉回棺中的瞬间。当叶行灯问他沈照是谁，陈寻反问：“沈照长什么样？”记忆里那张脸是一块水洇过的空白。\n\n小乔因阿澈事件闯入旧署，三人被迫合力处理水洼倒影中的小魇。旧档案写着“灯照、刀斩、伞录”三步。叶行灯提灯照出水中无脸影，陈寻一刀斩开倒影，小乔用相机与伞面记录阿澈残名。三人以为这就是破魇法，却不知道这份残缺旧档正是沈照留下的收割手册。\n\n四份旧卷宗同时渗出血月墨迹，分别指向《马介甫》《皮影》《白衣》《酒虫》。从这一刻开始，梦巡司小队不再只是处理怪事，而被拖入沈照布置二十年的长梦计划。\n\n---\n\n## 二、第一案《马介甫》：别人替你造的梦\n\n馥玉公馆送来请柬。马家少奶奶杨沅青最近像换了一个人，过去她长期被丈夫马介甫羞辱、控制、殴打，外人只看见她嫁得体面，如今却忽然恢复光彩。她的丈夫也变得温柔、周到、懂礼，像一个被重新做好的完美丈夫。\n\n长梦楼宴席上，宋知茹提醒小队：马家最近太安静，安静得像一桌饭菜上盖了红布。小乔想拍，沈主编在报馆轻描淡写地说，家宅私事不要上报，女人好不容易过上安稳日子，不要再把旧伤翻出来。\n\n陈寻、叶行灯、小乔进入馥玉公馆。这里有《繁花》式的漂亮：长桌、花房、玻璃、女眷、红酒、灯影。马介甫温柔得无懈可击，知道杨沅青喜欢什么，替她挡酒，替她整理披肩，替她把所有难堪话都挡在门外。叶行灯一度觉得，也许这不是魇，也许这只是一个坏人终于变好。\n\n陈寻却发现镜中马介甫的影子慢半拍，花房里有鸡血汤的味道，溪边旧影里浮出真正马介甫的尸身。所谓完美丈夫，是一只狐妖借马介甫之形回来。狐妖曾受杨沅青一饭之恩，见她被真马介甫折磨，便杀掉恶夫，化成他的样子，给她一个所有人都羡慕的婚姻。\n\n第一案不能把狐妖写成简单坏人。他真心报恩，也真心占有。他相信自己给了杨沅青最好的日子，却没有问过她是否愿意继续以“马太太”的身份活着。杨沅青被困在花房梦里，梦中没有辱骂，没有拳头，没有旁人的指点，只有一个永远体贴的丈夫。\n\n叶行灯心软，不愿直接斩狐。陈寻举刀后也收住，因为这一刀不能替杨沅青选择。最终杨沅青自己走出花房。她感谢狐妖救她，却拒绝继续做任何人的妻子。她带走自己的名字，而不是带走一个被安排好的好梦。\n\n叶行灯的灯照出狐妖真形，陈寻的刀斩出替身魇核，小乔的伞记录杨沅青的名字。三人以为第一案完成，却看见魇核并未留在他们手中，而是顺着花房地砖下的暗红梦络消失。\n\n狐妖消散前交给陈寻半张烧焦的长梦楼请柬，上面有二十年前血月夜焦痕、梦巡司旧印与沈照私印。陈寻终于确认沈照没有死。小乔回到报馆翻查旧档，能拍到沈照私印和字迹，却发现旧照片里的沈照张张空脸。她暂时不知道这意味着什么。\n\n尾声中，沈主编看完小乔马家报道，温和地压下稿件。他说，杨沅青好不容易不用再做别人饭桌上的谈资，何必把她又拉回报纸上。小乔第一次被他的理由堵住。观众此时只觉得他有道理，直到终局才知道每一次压稿都是长梦哲学的一部分。\n\n---\n\n## 三、第二案《皮影》：亲密之人被折成影子\n\n第一案之后，血月更红，旧城影子开始失常。有人发现自己的影子不再跟着自己，而是在墙上做出陌生动作；有人在灯下看见亲人影子拿刀；有人在雨夜橱窗里看见自己背后站着另一个人。\n\n纸莺飞到长梦楼，指向不周宅。这里属于一对已死的皮影夫妻。宅子分成红白双室，红室看见的是激情、怨恨与指责，白室看见的是冷漠、隐瞒与沉默。进入者无法看见真实对方，只能看见对方最可怕的影子。\n\n陈寻和叶行灯被分入两室。陈寻看见叶行灯背后站着魇火，仿佛他就是下一场血月的源头；叶行灯看见陈寻要把他重新拖回梦棺，仿佛陈寻从未信过他。小乔在伞面反光中看见两边真实情况，拼命传话，却总被皮影幕布扭曲。\n\n陆照川在本案登场。他持旧梦巡司官印，代表旧规。他认出陈寻，也认出叶行灯身上的魇火痕迹。官印一压，叶行灯肩颈处的魇纹浮现，沿锁骨向心口游出一线暗红。陆照川立刻判定叶行灯是灾星，要求陈寻按旧规斩除。\n\n陈寻没有解释。他挡在叶行灯前，替他受官印反噬。这个动作比任何台词更重要：梦巡司斩的是恶，不是身份。叶行灯第一次看见，陈寻不是只会杀的人，他也会在该收刀时收刀。\n\n皮影夫妻的过往逐渐显露。他们死后被困在彼此误读中，一个以为对方背叛，一个以为对方抛弃。魇利用这种误读，让进入者只看见亲近之人的影子。破案关键不是证明谁无辜，而是让两个人终于看见对方真实形状。\n\n叶行灯冒险点亮梦灯，陈寻折影斩开红白幕布，小乔伞骨钉住皮影线。红白双室重合，皮影夫妻短暂相见。第二枚魇核被斩出后，同样顺梦络消失。\n\n皮影夫妻消散前说出主线线索：取走魇核的人提着一盏熄灭的灯。这个意象刺中叶行灯，因为他的身份是提灯人，而对方却是熄灯人。叶行灯重读旧档，发现第一案、第二案卷宗纸背的血月墨迹与沈照私印同源。\n\n中点反转开始露牙：残缺旧档案不是救人指南，而是一套让他们照形、斩核、归络的操作程序。叶行灯第一次意识到，自己可能正照着敌人留下的错档案做事。\n\n---\n\n## 四、第三案《白衣》：被压下的证词\n\n血月半圆，货栈里传出童谣。夜里搬货的人听见孩子声音，湿地上出现拖痕与血手印，一口白衣棺在酒桶间滑行。原先大纲中的雨夜棺材追逐已降级为 AI 友好的痕迹追踪：棺材消失，主角只沿湿地拖痕、纸钱、血手印与童谣追向蒲苇地，恐怖感更强，成本更低。\n\n线索指向慈幼局与欧阳酒庄。白钰曾在慈幼局照顾孩子，发现孔婆婆与欧阳家暗中贩卖男童，并把孩子通过货栈与酒庄渠道转走。她试图告发，却被杀害，死后化为白衣。她不是女鬼奇观，而是一份死后仍要反复证明自己看见过什么的证词。\n\n叶行灯因魇火血脉能进入白钰记忆。每进一次，他肩颈处的魇纹都向心口扩散一分。第三案中他的痛苦不是“我害了陈寻”，而是“我照着错档案做了”。他发现自己每一次救人，都可能在替沈照提纯魇核。陈寻看见叶行灯一次次自伤式入梦，二人的裂痕通过动作修补：陈寻不说安慰，只在叶行灯快被童谣拖走时砍断缠住他的白布。\n\n小乔查慈幼局账本，拍到账本、抚恤银流向与孩子名单。沈主编压下报道，不再说“上面有压力”，而是对她说：你登了，孩子的父母就要在报纸上再死一次。有些事，忘了对活人更好。小乔当时无法反驳，但这句话会在终局成为她举起相机的理由。\n\n李言在长梦楼账目中发现，二十年前血月夜后，有一笔“梦巡司抚恤银”转入慈幼局、货栈和欧阳酒庄之间的暗账。落款是沈照私印。沈照不是临时收核，他一直在用旧署残产养着黑暗供应链。\n\n白衣魇境在蒲苇地展开。童谣不追求文学腔，后续剧本需重写为三字/五字口传体。白钰审判孔婆婆、货栈中人和欧阳家参与者。合规口径必须明确：这是魇境判决，不是鼓励现实私刑；孩子获救，罪犯被惩处，白钰解脱。\n\n第三枚魇核被斩出后，主角已经看清流程。魇核并不是被他们拿到，而是按旧档案步骤自动归入梦络。小队确认：自己一路都在替沈照打工。\n\n更残酷的是，欧阳语并未立刻倒台。商会替她压案，报馆撤稿，长梦楼反而受打压。这个不公必须写成戏剧化燃料，而不是漏洞。小乔把孩子照片贴在长梦楼后巷，不能登报也要被看见。宋知茹看见照片，第一次意识到长梦楼若继续只讲生意，也会成为吃人的地方。\n\n---\n\n## 五、第四案《酒虫》：你自己愿意喝下去的梦\n\n欧阳语推出新酒，香气能让人看见自己最想要的生活。商会、饭局、舞厅、会馆都在谈这杯酒。长梦楼被挤压，宋知茹债务危机爆发。欧阳语是宋知茹的黑镜：同样体面、漂亮、会生意，但她把怪物包装成产品，把欲望做成渠道。\n\n小队追查到天隐寺。竹风方丈讲出酒虫旧事：酒虫不是单纯让人醉，而是吃掉人清醒时不愿面对的东西。取走酒虫封法的人懂梦巡司旧术。叶行灯再次代价入梦，肩颈处魇纹向心口扩散，陈寻不再责备他，而是用最短方式把他从梦里拉回。\n\n第 19 集会馆鸿门宴是全剧《繁花》美学与奇幻武戏结合的重点。这里必须锁定为会馆宴厅，是欧阳语自己的主场，不是长梦楼。长梦楼此时正被商会借势打压，宋知茹不在宴席主位，而是以被邀请者、旁观者和潜在受害者身份入局。她不在主位本身，就是“长梦楼被打压”的可视化。\n\n会馆宴厅里鎏金灯、酒杯、旗袍、长衫、红木楼梯、玻璃反光、雨夜窗格与商会笑声组成漂亮陷阱。酒虫从杯壁、镜面、笑容和吊灯光斑里爬出。席间宾客一边笑，一边被酒虫从喉咙、酒杯与影子里吸空情绪与神志。\n\n小队已经知道“破魇就是替沈照提纯魇核”，但他们仍然出手，因为宴上有人正在被酒虫当场吞掉。不救，席间会立刻死人；救，第四枚主核可能归楼。三人选择先救眼前活人。\n\n武戏中，叶行灯以灯阵定住酒虫真形，陈寻以刀光切开酒影与杯中虫影，小乔以伞骨相机录下酒虫寄生欧阳语与席间宾客的证据。三步完成时，第四枚主核已经从酒虫之魇中析出，并沿城市梦络归向长梦楼。\n\n叶行灯尝试改良旧档案流程。他以灯阵反扣虫形，小乔以伞面逆录名证，试图把第四枚主核截在伞中，不让它回到长梦楼。但逆封失败，主核仍顺着沈照预设的城市梦络消失。叶行灯意识到，沈照对梦巡司旧术的设计比档案更深一层。\n\n宴局与幻境交织，三人的个人诱惑梦开始出现。陈寻看见旧梦巡司没有灭亡，同伴仍在；叶行灯看见自己从未打开陈寻的棺；小乔看见自己的报道登上头版，阿澈、白钰、孩子们都被全城记住。第一案是别人替你造的梦，第四案是你自己要的梦，所以更难拒绝。\n\n沈主编也在席间。他给小乔拉椅子，仍然温和体面。由于自抹名规则，陈寻无法凭脸与声认出他，但会在他靠近时感到门钥发热。沈主编在酒光中说出陈寻旧名的一部分。这里必须暗示动机：他不是炫耀，而是在测试门钥火候、催熟陈寻魇化。\n\n宋知茹也被诱惑：只要留下酒虫，长梦楼能活，债能还，客人能回来。李言把白衣案孩子们的照片和账本放到她面前。宋知茹没有长篇宣言，只完成三拍：倒下蚀魂砂，笑着宣布全场半价，转身在无人处红眼眶。真虫被毁，欧阳语试图吞下剩余酒虫自救，反被自己产业化的欲望吞掉，当众显出虫形。\n\n注意：宋知茹毁掉的是酒虫本体与欧阳语经营的欲望母虫，不是已经析出的第四枚主核。主核在第 19 集武戏三步完成时已经归入城市梦络。\n\n沈照身份在此揭开。不是陈寻听声音认人，而是证据拼合：第一案请柬私印、第二案熄灭的灯、第三案抚恤银账本、第四案压稿逻辑与取核动作全部指向沈主编。叶行灯的灯照出他作为“没有脸的人”的形，小乔的伞面记录四案残字并拼出“沈照”二字。四魇核齐聚，长梦宴请柬开始从旧城各处门缝、窗沿、报纸夹层里渗出，像一场无人投递的雪。\n\n沈照说：“不用再破魇了，梦络已经够亮。”这句话表达的是不再需要主角继续破魇提纯主核，不是门钥不需要陈寻。门钥仍在陈寻体内，终局仍必须依赖陈寻反向开门。\n\n---\n\n## 六、终局《血月长梦宴》：清醒有价\n\n血月圆满，长梦楼成为全城最漂亮也最危险的地方。它没有变成废墟，而是变得更繁华：灯更亮，酒更香，饭局更多，人人都像得到了自己想要的位置。整座楼化为四层魇境。\n\n第一层是馥玉花房，每个人遇见替身：死去的人回来，失去的爱回来，失败的自己变成功。第二层是不周皮影台，所有关系变成影子。第三层是白衣楼梯，被城市卖掉、忘掉、压下的人唱童谣。第四层是酒虫宴厅，所有欲望成为杯中酒。喝下去的人自愿进入长梦。\n\n沈照站在顶楼露台，不狰狞，也不疯狂。他说自己见过太多人被叫醒后无路可走。杨沅青醒来后仍要面对名声，皮影夫妻醒来后仍然已死，白钰醒来后孩子仍被卖过，宋知茹醒来后长梦楼仍会倒，陈寻醒来后旧同僚仍回不来。梦巡司过去只负责斩梦，却不给醒来的人一条活路。\n\n这套哲学必须有诱惑力。沈照不是毁灭城市，而是让城市不再痛。他要把血月变成永恒霓虹，让所有人停在最愿意相信的一刻。\n\n陈寻无言，因为沈照说中了痛处。叶行灯动摇，因为他亲手带回的人仍要继续受苦。小乔用最朴素的方式反击：如果没人记得阿澈，阿澈就从没活过；如果没人留下白钰，白钰就只是一口棺；如果所有痛都被盖住，坏人就永远干净。\n\n陆照川循官印残响、梦络异动与血月门气息赶到。他原本要杀掉半魇叶行灯和门钥陈寻。看见沈照真面目后，他终于明白身份不等于恶，体面也不等于善。没人命令他，他仍选择自毁官印封住梦门一角。官印碎裂，割伤他，他倒在楼梯间，生死未卜。\n\n沈照启动陈寻体内血月门钥，陈寻身体开始魇化。他的脸在照片、倒影和众人记忆中模糊。沈照说陈寻不是人名，而是一把钥。叶行灯不再替陈寻选择，他把灯举高，照住陈寻仍作为人的形，定住他没有完全变成门的那一瞬。小乔撑开油纸伞，伞面浮现阿澈、杨沅青、皮影夫妻、白钰、孩子们和被压稿者的名字，并记录陈寻作为人的痕迹。\n\n终验口径必须维持：灯照形，伞录名。灯照出陈寻仍是人、照出沈照无脸之形；伞记录名字、拼出证据、留住陈寻真名。\n\n陈寻被拉回一瞬，以血月门钥反向开门，一刀斩断门框。门钥燃尽，烧掉他封棺前最后一夜的一段关键记忆。清醒必须有价，这个代价也成为第二季钩子。\n\n沈照被四魇反噬。替身之魇让他看见梦巡司从未失败的好梦；皮影之魇让他只看见同伴指责他的影子；白衣童谣让他听见所有被他牺牲者的名字；酒虫之魇逼他承认，自己最大的欲望不是救人，而是不敢面对失败。最终他跌入梦门深处。\n\n长梦楼熄灯。旧城醒来，但世界没有因此干净。杨沅青带着名字离开；皮影夫妻在幕布上留下最后一个并肩剪影；白钰的孩子获救，照片贴在后巷；宋知茹重新点灯，但不再只讲生意；欧阳语被酒虫反噬，欲望产业化者被产品吞掉；阿澈没有复活，却在报馆登记册上重新拥有名字。\n\n最后，梦巡司旧署中，一份新卷宗渗出熄灯印。陈寻想起自己失去了一段记忆，却想不起失去的是什么。叶行灯看着他，第一次不敢说“一定会救你”。小乔把阿澈照片夹进登记册，合上本子。梦巡司不是拯救世界的组织，而是在世界不愿记住时，把人从梦里叫醒的人。\n\n---\n\n# 05｜24集分集梗概与编剧任务点\n\n体量建议：24 集 × 8 分钟。本文件不是分集剧本，而是编剧分工前的分集梗概。每集正式剧本需另附“集尾钩”和“武戏碎片清单”。\n\n## 第 1 集｜雨夜无脸\n\n**剧情梗概：**九十秒内完成阿澈被无脸倒影吞掉。第二天城市忘记阿澈，小乔照片留下他的脸。沈主编压稿，提出“不要让街坊添乱”。叶行灯夜入长梦楼地下旧署。\n\n**集尾钩：**叶行灯打开梦棺，棺中短刀抵住他咽喉。\n\n**编剧注意：**冷开场必须快；规则演示优先于世界观解释。\n\n## 第 2 集｜棺醒与四卷宗\n\n**剧情梗概：**陈寻醒来，记忆中沈照是空脸。三人首次合作处理水洼小魇，执行灯照、刀斩、伞录。宋知茹、李言在长梦楼出场。四份卷宗渗血。\n\n**集尾钩：**馥玉公馆请柬送到，马介甫在镜中变脸。\n\n**编剧注意：**确立三人功能分工；沈照脸声不可识别规则埋下。\n\n## 第 3 集｜馥玉公馆\n\n**剧情梗概：**三人进入马家。杨沅青体面而僵硬，马介甫完美得不真实。小乔想查马家旧事，沈主编在报馆继续压稿。\n\n**集尾钩：**镜中马介甫眼中闪过狐光。\n\n**编剧注意：**《繁花》式公馆饭局，美与危险并置。\n\n## 第 4 集｜鸡血汤\n\n**剧情梗概：**后厨鸡血汤、花房气味、溪边旧影揭出真马介甫已死。狐妖假马介甫不是恶意骗子，而是报恩与占有混合。\n\n**集尾钩：**溪边旧影浮出真马介甫尸身。\n\n**编剧注意：**狐妖要有悲悯，不写成单纯怪物。\n\n## 第 5 集｜完美丈夫梦\n\n**剧情梗概：**花房魇境展开，狐妖用完美丈夫梦困住杨沅青。叶行灯心软，陈寻收刀，等待杨沅青自己选择。\n\n**集尾钩：**血月力量接管花房，梦开始反噬。\n\n**编剧注意：**主题分界：别人替你造的梦。\n\n## 第 6 集｜带走名字\n\n**剧情梗概：**杨沅青拒绝继续做任何人的妻子，带走自己的名字。三人破魇，第一枚核归入梦络。狐妖交出带沈照私印的烧焦请柬。小乔翻拍沈照旧照，底片空脸。\n\n**集尾钩：**沈主编压下马家报道。\n\n**编剧注意：**第一枚主线实物线索；私印可见，脸不可记录。\n\n## 第 7 集｜影子失常\n\n**剧情梗概：**旧城影子开始独立行动，纸莺求援，不周宅开启。陆照川登场，持旧官印。\n\n**集尾钩：**陈寻与叶行灯被分入红白双室。\n\n**编剧注意：**从主线追人转入关系误读。\n\n## 第 8 集｜红白双室\n\n**剧情梗概：**陈寻和叶行灯各自只看见对方的敌意影子，小乔伞面看见两边真实情况却传话失败。\n\n**集尾钩：**陈寻差点斩向叶行灯影子。\n\n**编剧注意：**动作要围绕幕布、影子、伞面反射。\n\n## 第 9 集｜魇火暴露\n\n**剧情梗概：**皮影夫妻过往揭开，镇魇石破裂。陆照川以官印逼出叶行灯魇火纹，认定他该被斩。\n\n**集尾钩：**官印落下，叶行灯身后魇火成形。\n\n**编剧注意：**陆照川不是疯子，是旧规残余。\n\n## 第 10 集｜按恶斩\n\n**剧情梗概：**陆照川逼陈寻按身份斩叶行灯，陈寻挡在叶行灯前。皮影夫妻准备说出取核者线索。\n\n**集尾钩：**宅外一盏熄灭的灯一闪而过。\n\n**编剧注意：**用动作表达“按恶不按身份”。\n\n## 第 11 集｜熄灯人\n\n**剧情梗概：**皮影之魇被破，第二枚核被梦络吸走。皮影夫妻说取核者提熄灭之灯。叶行灯重读旧档，发现血月墨迹与沈照私印同源。\n\n**集尾钩：**血月半圆，第三份卷宗翻到“白衣”。\n\n**编剧注意：**中点反转开始：他们可能在替敌人打工。\n\n## 第 12 集｜货栈童谣\n\n**剧情梗概：**货栈传童谣，白衣棺与血手印出现。宋知茹与欧阳语商业冲突显现。\n\n**集尾钩：**棺中白钰睁眼。\n\n**编剧注意：**追踪用拖痕/血手印/童谣，避免复杂追车追棺。\n\n## 第 13 集｜代价入梦\n\n**剧情梗概：**叶行灯第一次进入白钰记忆，见慈幼局与孩子，魇纹扩散。陈寻开始用行动保护他。\n\n**集尾钩：**酒桶里出现孩子的画面。\n\n**编剧注意：**叶行灯此处崩的是方法与代价。\n\n## 第 14 集｜压下证词\n\n**剧情梗概：**小乔查账被沈主编压稿，沈说“登了，父母要在报纸上再死一次”。李言发现梦巡司抚恤银暗账。\n\n**集尾钩：**账本落款出现沈照私印。\n\n**编剧注意：**沈照压稿要像有道理，不能脸谱化。\n\n## 第 15 集｜蒲苇地\n\n**剧情梗概：**棺材消失，主角沿湿地拖痕、纸钱、血手印追到蒲苇地。孔婆婆与欧阳家罪证摊开。\n\n**集尾钩：**白衣童谣审判开始。\n\n**编剧注意：**白钰是证词，不是恐怖猎奇。\n\n## 第 16 集｜白衣判决\n\n**剧情梗概：**白钰以魇境判决审恶，孩子获救，罪犯被惩处。第三枚核归入梦络，三人确认自己替沈照提纯魇核。欧阳语仍被商会保护。\n\n**集尾钩：**沈主编撤下报道，血月近圆。\n\n**编剧注意：**合规口径要稳；不公要写成燃料。\n\n## 第 17 集｜新酒风靡\n\n**剧情梗概：**长梦楼被商会打压，欧阳语新酒风靡。宋知茹债务危机，李言看出账面危险。\n\n**集尾钩：**清水化酒，杯中爬出黑虫影。\n\n**编剧注意：**欧阳语为女性黑镜，体面而危险。\n\n## 第 18 集｜天隐寺\n\n**剧情梗概：**竹风方丈讲酒虫旧事，酒虫封法被懂梦巡司旧术的人取走。叶行灯再次代价入梦。\n\n**集尾钩：**方丈说取走封法的人知道旧署术。\n\n**编剧注意：**酒虫不是酒鬼故事，是欲望产品化。\n\n## 第 19 集｜会馆鸿门宴入梦，酒虫主核析出\n\n**剧情梗概：**会馆鸿门宴开始。欧阳语以女掌柜身份在自己的会馆宴厅设局，招待商会、旧城权贵、报界中人和几位被长梦楼牵连过的关键人物。此处是欧阳语的主场，不是长梦楼。长梦楼此时正被商会借势打压，宋知茹不在宴席主位，而是以被邀请者、旁观者和潜在受害者的身份进入局中。\n\n宴厅里灯火鎏金，杯盘华丽，宾客谈笑，酒香甜得过分。席间人人都像在说自己想听的话：有人听见死去亲人的夸奖，有人看见失败的生意起死回生，有人听见自己被原谅。酒虫藏在杯中、喉间、影子里，开始吞噬宾客的情绪与神志。被吞的人脸上仍带笑，身体却一点点空下去。\n\n小队已经知道“破魇就是替沈照提纯魇核”，但他们仍然出手，因为宴上有人正在被酒虫当场吞掉。不救，席间会立刻死人；救，第四枚主核可能归楼。三人选择先救眼前活人。\n\n武戏中，叶行灯以灯阵定住酒虫真形，陈寻以刀光切开酒影与杯中虫影，小乔以伞骨相机录下酒虫寄生欧阳语与席间宾客的证据。三步完成时，第四枚主核已经从酒虫之魇中析出，并沿城市梦络归向长梦楼。\n\n叶行灯尝试改良旧档案流程。他以灯阵反扣虫形，小乔以伞面逆录名证，试图把第四枚主核截在伞中，不让它回到长梦楼。但逆封失败，主核仍顺着沈照预设的城市梦络消失。叶行灯意识到，沈照对梦巡司旧术的设计比档案更深一层。\n\n宴局与幻境交织，三人的个人诱惑梦开始出现：陈寻看见自己从未醒来，叶行灯看见自己没有开错棺，小乔看见自己的报道终于被所有人相信。沈主编在酒光中试探性叫出陈寻旧名的一部分。这不是炫耀，而是在测试门钥火候、催熟陈寻魇化。陈寻听见，却只觉得熟悉与刺痛，仍无法把沈主编与沈照的脸声对上。\n\n**集尾钩：**伞面逆录失败，第四枚主核归楼。长梦楼深处，第四处空位亮起。与此同时，长梦宴请柬开始从旧城各处门缝、窗沿、报纸夹层里渗出，像一场无人投递的雪。\n\n**编剧注意：**第 19 集必须写清三点：宴会地点是会馆宴厅，不是长梦楼；三人明知替沈照提纯仍出手，是因为席间有人正在被吞，救人优先；第四枚主核在本集武戏三步完成时析出归络，宋知茹后续毁的是酒虫本体。\n\n## 第 20 集｜毁虫、反噬与身份拼合\n\n**剧情梗概：**本集集中处理“宋知茹毁虫 + 欧阳语反噬 + 沈照身份拼合”，不再承担完整三人诱惑铺陈。\n\n宋知茹看见欧阳语把宾客当成欲望酒池，也看见自己曾经想要的体面不过是同一套长梦生意。她倒蚀魂砂入酒阵，毁掉酒虫本体。欧阳语被自己的产业反噬，当众显出虫形，最终被酒虫残体吞没。主题闭环：把欲望产业化的人，最后被自己的产品吃掉。\n\n陈寻、叶行灯、小乔从诱惑梦中挣出。灯照出席间一个没有脸的人，伞面残字与旧账、请柬、纸莺、登记册证据拼合，终于拼出“沈照”二字。此处严格遵守法宝分工：灯只照形，伞才录名。\n\n沈主编身份在证据拼合中成立，而不是靠陈寻听声认人。小乔意识到：这个一直压稿、劝她忘记痛苦的人，就是二十年前把自己脸与声从全城记忆里抹掉的沈照。\n\n**集尾钩：**沈照说：“不用再破魇了，梦络已经够亮。”随即，长梦宴请柬洒满全城，血月彻底圆满。\n\n**编剧注意：**“不用再破魇”指不再需要主角继续提纯主核，不是门钥不需要陈寻。门钥仍在陈寻体内。灯照形，伞录名，不能写反。\n\n## 第 21 集｜四层长梦\n\n**剧情梗概：**长梦楼化为四层魇境：替身花房、皮影台、白衣楼梯、酒虫宴厅。全城入梦。\n\n**集尾钩：**沈照在顶楼露台现身。\n\n**编剧注意：**终局仍要漂亮，不要废墟化。\n\n## 第 22 集｜长梦哲学\n\n**剧情梗概：**沈照讲清长梦哲学：醒来后痛仍在。陈寻门钥被唤醒。陆照川循官印残响赶到，要杀半魇与门钥。\n\n**集尾钩：**陆照川看见沈照真面目。\n\n**编剧注意：**沈照的话要有诱惑力，不可低级反派。\n\n## 第 23 集｜官印碎裂\n\n**剧情梗概：**陆照川明白身份不等于恶，体面不等于善，自毁官印封门一角。陈寻开始被抹名，小乔伞面录名，叶行灯灯照陈寻人形。\n\n**集尾钩：**陈寻被拉回一瞬，反向开门。\n\n**编剧注意：**阿澈等名字回流；清醒代价开始显现。\n\n## 第 24 集｜清醒余波\n\n**剧情梗概：**陈寻斩断长梦门，门钥燃尽烧掉他一段关键记忆。沈照被四魇反噬卷入门后。长梦楼熄灯，众人醒来，阿澈名字洇回登记册。\n\n**集尾钩：**新卷宗渗出熄灯印。\n\n**编剧注意：**结尾不大团圆，保留痛与记忆。\n\n---\n\n# 06｜视觉美学与 AI 虚拟拍摄规范\n\n---\n\n## 一、主视觉母体\n\n本项目视觉母体已锁定为《繁花》式民国都市美学。执行重点不是简单复刻某一部剧，而是提取以下视觉原则：城市繁华、人物体面、灯光昂贵、饭局密集、玻璃反光、雨夜湿润、浅景深、霓虹与钨丝灯混合、人物关系在漂亮空间中发生。\n\n本项目不能拍成废土、赛博、欧洲哥特、古装仙侠或纯民俗恐怖。即便进入魇境，也应保留民国都市的漂亮外壳。最重要的反差是：这么漂亮的地方正在吃人。\n\n---\n\n## 二、色彩体系\n\n主色：暖金、烟草棕、酒红、墨绿、深蓝夜色、黑漆、旧银。  \n强调色：血月红、灯油黄、伞面旧纸白、符弹火光、玻璃反射绿。  \n禁止：高饱和赛博霓虹、塑料感蓝紫、废土黄沙、网感古风滤镜。\n\n四案色彩：\n\n- 《马介甫》：花房暖金、狐影红、玻璃绿、鸡血暗红。\n- 《皮影》：红室胭脂、白室冷灰、幕布米白、影子墨黑。\n- 《白衣》：雨夜蓝黑、白衣惨白、血手印暗红、蒲苇地灰绿。\n- 《酒虫》：会馆鎏金、酒液琥珀、虫雾黑、欧阳语酒红。\n\n---\n\n## 三、摄影语言\n\n1. 大量浅景深与前景遮挡：玻璃、门框、伞沿、酒杯、香烟、帘子、幕布、楼梯扶手。\n2. 长焦压缩城市空间，让人群、灯牌、雨伞、车影形成密集层次。\n3. 室内用钨丝灯、吊灯、台灯、烛光和镜面反射制造鎏金感。\n4. 武戏不追求全景连续动作，而追求碎片化、情绪化、可生成的动作拼贴。\n5. 魇从反射、投影、幕布、水面、照片、伞面中出现，避免大量需要长时间一致性的实体怪物。\n\n---\n\n## 四、奇幻与武戏的融合原则\n\n动作要像在《繁花》的城市里突然爆开的奇幻武戏，而不是切换到另一种世界。比如：刀锋掠过酒杯，杯中显出狐影；灯阵穿过会馆吊灯，金光沿红绳爬满楼梯；伞骨弹开铜针，旧报铅字从伞面飞出；皮影贴着包间墙壁逃走；酒虫从宾客笑容里爬出。\n\n每场武戏都要兼顾三个维度：\n\n- **人物关系**：谁救谁、谁不信谁、谁替谁挡。\n- **法宝功能**：刀斩、灯照、伞录，不混用。\n- **视觉碎片**：每个镜头 3 秒以内，利于 AI 视频生成与后期拼接。\n\n---\n\n## 五、武戏碎片清单写法\n\n正式分集剧本中，每场武戏必须附 8—15 个碎片镜头。示例格式：\n\n1. 雨水从伞沿滑下，水珠里出现无脸倒影。  \n2. 陈寻短刀从画面下缘掠过，斩断倒影中的手。  \n3. 叶行灯提灯，灯火在水面形成一圈圆形边界。  \n4. 小乔相机快门闪，照片里阿澈的脸短暂显形。  \n5. 倒影魇贴着石板路倒退，像被拖回水里。  \n6. 符弹打入水洼，水面炸起一片黑纸灰。  \n7. 伞面旧字洇开，出现半个名字。  \n8. 血月倒影碎裂。\n\n禁止写“二人缠斗数十回合”“一路从楼上打到楼下”“怪物追逐全街群众”这类 AI 难以稳定生成的动作句。\n\n---\n\n## 六、人脸风险管控\n\n主要角色可给清晰特写：陈寻、叶行灯、小乔、沈照、宋知茹、陆照川、欧阳语、杨沅青、白钰等。宴会群像、商会人群、街巷群众、慈幼局孩子群、长梦宴人海应写为焦外剪影、背影、玻璃反光、雨伞下轮廓、幕布影子。\n\n重要文字、私印、账本、名字建议后期制作，不依赖 AI 直接生成可读文字。剧本可以写“伞面显出名字”，但制作上应按后期图层处理。\n\n---\n\n## 七、场景资产原则\n\n主场景包锁定八个。每个单元编剧不得为了一个桥段新增大场景。若需要新地点，应优先改写为八包内的侧间、走廊、窗外、倒影、照片或梦境切片。\n\n报馆不作为第九个主场景包，不增加独立大场景资产。\n\n但《新声报》保留一个可复用的**主编室一角**作为独立微场景：一张书桌、一面玻璃隔断、一个文件抽屉、一册登记册、一盏台灯。该微场景只服务压稿、翻拍旧照、登记册洇名等关键戏，不扩展为完整报馆空间，不新增印刷间、编辑大厅、外景招牌等资产。\n\n空间口径：报馆主编室一角在叙事上独立于长梦楼，不可写成“长梦楼里的报馆办公室”；在制片资产上不计入八个主场景包。\n\n---\n\n# 07｜编剧分工、统稿规则与验收清单\n\n---\n\n## 一、推荐编剧分工\n\n**总编剧 / 主线统稿：**负责沈照、魇核、血月分相、陈寻门钥、叶行灯魇火、小乔名字母题、陆照川终局回归。任何单元编剧不得擅自改变主线硬点。\n\n**第一案编剧《马介甫》：**负责杨沅青、狐妖假马介甫、馥玉公馆、替身梦。必须交出烧焦请柬与沈照私印，完成“别人替你造的梦”。\n\n**第二案编剧《皮影》：**负责不周宅、红白双室、皮影夫妻、陆照川首次登场、叶行灯魇火暴露。必须交出“熄灭的灯”线索。\n\n**第三案编剧《白衣》：**负责货栈、慈幼局、白钰、孔婆婆、孩子获救、沈照抚恤银暗账。必须完成叶行灯代价入梦与“替沈照打工”确认。\n\n**第四案编剧《酒虫》：**负责欧阳语、宋知茹、李言、竹风方丈、天隐寺、会馆鸿门宴。必须完成欧阳语反噬、宋知茹三拍动作、沈照身份揭开。\n\n**终局编剧 / 总编剧联合：**负责长梦宴、四层魇境、沈照哲学、陆照川自毁官印、陈寻反向开门与记忆代价、阿澈登记册回收。\n\n---\n\n## 二、沈主编场次归属\n\n沈主编 / 沈照是全剧最难统一的声部，所有出现沈主编的场次，必须由总编剧亲自执笔，或由总编剧逐场终审后方可进入分集定稿。单元编剧只负责预留场位、动作需求与剧情功能，不自行完成沈主编对白。\n\n沈主编的语气原则：温和、克制、有理、有同情心，但每一句话都在替“长梦”辩护。他不应像传统反派一样威胁、怒吼、炫耀或自曝野心。他越像一个真正替别人着想的人，终局越危险。\n\n涉及沈主编的重点场次包括但不限于：第 1 集压稿与登记册线索；第 6 集压马家报道；第 7 集纸莺入案与压稿关联；第 14 集慈幼局报道处理；第 16 集小乔与沈主编冲突；第 19 集鸿门宴试探旧名；第 20/21 集身份拼合揭示。\n\n---\n\n## 三、每集交稿格式\n\n每集正式剧本前，先交一页分集执行卡：\n\n1. 集数与标题  \n2. 本集核心事件  \n3. 本集主线推进点  \n4. 本集人物关系变化  \n5. 本集血月分相 / 魇核 / 名字规则推进  \n6. 集尾钩  \n7. 武戏碎片清单  \n8. AI 虚拟拍摄风险点  \n9. 是否新增主场景（原则上不得新增）\n\n---\n\n## 四、硬性统稿规则\n\n1. 破魇 = 提纯魇核。每案魇核流向必须交代。  \n2. 沈照第一集以沈主编身份在场。  \n3. 沈照自抹名规则统一：名、印、字迹可查；脸与声不可记录。  \n4. 第一案结尾提前确认沈照活着。  \n5. 第二案交出熄灭的灯。  \n6. 第三案交出沈照抚恤银暗账，并确认主角替沈照打工。  \n7. 第四案揭开沈照身份，靠证据拼合，不靠听声认人。  \n8. 灯照形、刀斩核、伞录名，三件法宝功能不得混用。  \n9. 血月分相全剧可见。  \n10. 阿澈是被记住的死者，不复活。  \n11. 陈寻反向开门必须有代价：烧掉一段关键记忆。  \n12. 陆照川终局不是奉命，而是自主选择。  \n13. 叶行灯第三案崩方法，第四案崩私罪。  \n14. 欧阳语为女性，宋知茹黑镜。  \n15. 李言为长梦楼账房，不并入小乔。\n\n---\n\n## 五、合规口径\n\n1. 贩童情节必须以罪犯被惩处、孩子获救收束。  \n2. 白钰复仇必须写成魇境判决，不提倡现实私刑。  \n3. 孔婆婆的厌男逻辑必须是利益为里、意识形态为自我辩护的壳。  \n4. 双男主关系维持战友生死契，不做恋爱编码。  \n5. 主题台词宣言全剧最多一次，建议留给杨沅青；其他主题靠动作完成。\n\n---\n\n## 六、分集验收清单\n\n每集验收时逐项核对：\n\n- 是否有明确尾钩。  \n- 是否推进主线，而不是独立怪谈。  \n- 是否保留《繁花》式城市美学。  \n- 是否有刀/灯/伞明确分工。  \n- 是否避免新增主场景包。  \n- 是否附武戏碎片清单。  \n- 是否避免长动作连续调度。  \n- 是否避免群众清脸过多。  \n- 是否让沈照哲学保持“有道理的危险”。  \n- 是否让单元人物自己完成选择，而不是主角替他们选择。\n\n---\n\n## 七、分集剧本阶段新增核对项\n\n1. 第 2 集水洼小魇是否明确为散魇残光，不产生主核。\n2. 第 19 集是否完成酒虫三步：灯阵定虫形、刀光切酒影、伞录寄生证据。\n3. 第 19 集是否明确第四枚主核在武戏中析出归络，宋知茹毁的是酒虫本体。\n4. 第 17—20 集是否明确小队继续出手的动机：有人正在被吞，救人优先。\n5. 叶行灯是否尝试逆封第四核且失败。\n6. 灯、刀、伞功能是否严格分工：灯照形，刀斩魇，伞录名证。\n7. 所有沈主编场次是否由总编剧执笔或终审。\n8. 陈寻台词是否符合“短、冷、少”纪律。\n9. 叶行灯魇纹位置是否统一为肩颈向心口扩散。\n10. 报馆是否只作为主编室一角微场景使用，不扩展为第九主场景包。\n11. 第 19 集沈照叫出陈寻旧名是否有动机：测试门钥火候、催熟魇化。\n12. README 文件列表是否与实际分发包一致。\n\n---\n\n## 八、旧句禁用清单\n\n以下旧句或同义表述不得再出现在分集剧本中：\n\n- “报馆压缩为长梦楼侧间。”\n- “长梦楼里的报馆办公室。”\n- “叶行灯腕上魇纹浮现。”\n- “他腕上魇纹扩散。”\n- “手背魇纹。”\n- “长梦楼夜宴开始，欧阳语以女掌柜身份招待各路宾客。”\n- “第 6 集纸莺 / 压稿关联。”\n- “李言触发宋知茹旧伤。”\n- “门已经不需要他们开了。”\n\n---\n\n", "excerpt": "## 分发版 v1.2 / 已合并终验与分发前补丁\n\n# 《不思异：梦巡司》剧集圣经交接包 README\n\n本交接包为终验通过并合并分发前补丁 v1.1 / v1.2 后的正式分发版，用于进入分集剧本阶段，并支持多位编剧并行创作。\n\n建议阅读顺序：\n\n1. `00_单文件版_不思异_梦巡司_剧集圣经.md`：完整单文件版，适合总编剧、制片、导演通读。\n2. `01_项目介绍.md`：项目定位、卖点", "size": 25815, "safe_id": "不思异_梦巡司_剧集圣经_完整单一长文档_v1_2"}, {"name": "不思异_梦巡司_整体美术圣经_东方梦境哥特ArtDeco_V1", "project": "不思异", "content": "# 《不思异：梦巡司》\n\n# 整体美术圣经 Visual Bible V1.0\n\n## 一、视觉定位\n\n《不思异：梦巡司》的美术目标，是创造一个中国影视中从未完整呈现过的民国架空世界。\n\n它不是历史复原。 不是传统志怪。 不是仙侠幻想。 不是蒸汽朋克。\n\n它是一座：\n\n> 被梦境修改后的东方现代文明。\n\n核心风格：\n\n# 东方梦境哥特 Art Deco\n\n# Oriental Dream Gothic Art Deco\n\n------------------------------------------------------------------------\n\n## 二、美术核心命题\n\n### 1. 错误历史\n\n《梦巡司》的世界不是1930年代真实中国，而是一条没有发生过的历史分支。\n\n如果民国现代化继续发展，人类发现梦境、记忆和潜意识，并建立管理体系，这个文明会长成什么样？\n\n因此视觉目标：\n\n熟悉，但错误。\n\n观众应该感觉：\n\n\"我好像见过这里，但现实中不存在。\"\n\n------------------------------------------------------------------------\n\n### 2. 空间不是背景\n\n建筑必须拥有：\n\n-   历史；\n-   功能；\n-   秘密；\n-   使用痕迹。\n\n梦巡司总部不是办公室，而是管理梦境异常的机构。\n\n藏梦楼不是书院，而是保存人类梦境的建筑。\n\n------------------------------------------------------------------------\n\n# 三、核心美学系统\n\n## Art Deco：文明外壳\n\n负责：\n\n-   财富；\n-   秩序；\n-   现代感。\n\n视觉：\n\n-   几何线条；\n-   对称结构；\n-   黑色大理石；\n-   黄铜；\n-   彩色玻璃；\n-   水晶；\n-   丝绒。\n\n------------------------------------------------------------------------\n\n## 东方哥特：精神核心\n\n负责：\n\n-   神秘；\n-   死亡；\n-   因果；\n-   记忆。\n\n不是西方城堡。\n\n而是东方对于：\n\n死亡、执念、轮回的视觉表达。\n\n------------------------------------------------------------------------\n\n## 梦境偏移：异常机制\n\n现实80%。\n\n异常20%。\n\n不要创造另一个世界。\n\n创造现实出现错误。\n\n------------------------------------------------------------------------\n\n# 四、禁止方向\n\n## 蒸汽朋克\n\n禁止：\n\n-   齿轮；\n-   蒸汽机械；\n-   工业幻想。\n\n原因：\n\n《梦巡司》关注的是记忆文明，不是机械文明。\n\n------------------------------------------------------------------------\n\n## 仙侠幻想\n\n禁止：\n\n-   法阵；\n-   飞升；\n-   悬浮宫殿；\n-   大规模法术。\n\n《梦巡司》是现实中的异常。\n\n------------------------------------------------------------------------\n\n## 普通民国复原\n\n禁止：\n\n-   旅游街景；\n-   单纯上海滩怀旧。\n\n目标：\n\n创造不存在的民国。\n\n------------------------------------------------------------------------\n\n# 五、城市系统\n\n## 血月旧城\n\n定位：\n\n东方哥谭。\n\n但不是犯罪都市，而是一座梦境文明的首都。\n\n三层结构：\n\n### 繁华城区\n\n舞厅、剧院、酒店、公馆。\n\n代表欲望和财富。\n\n### 秘密城区\n\n梦巡司、档案馆、禁梦机构。\n\n代表秩序和控制。\n\n### 魇境区域\n\n荒宅、祠堂、废弃街区。\n\n代表被遗忘的记忆。\n\n------------------------------------------------------------------------\n\n# 六、核心建筑\n\n## 梦巡司总部\n\n定位：\n\n人类管理梦境的秘密机构。\n\n建筑：\n\n1930年代政府建筑 + Art Deco摩天楼 + 东方哥特空间。\n\n特点：\n\n入口现实。\n\n内部异常。\n\n地下梦境。\n\n------------------------------------------------------------------------\n\n## 藏梦楼\n\n定位：\n\n保存人类梦境的建筑。\n\n核心：\n\n-   圆形大厅；\n-   梦核；\n-   无数门；\n-   记忆档案。\n\n门不是入口。\n\n门代表人生选择。\n\n------------------------------------------------------------------------\n\n## 黄金梦境公馆\n\n定位：\n\n欲望与腐败。\n\n参考：\n\n《了不起的盖茨比》。\n\n材质：\n\n黄金、紫色丝绒、黑色大理石、镜面、水晶。\n\n表面繁华，内部腐败。\n\n------------------------------------------------------------------------\n\n## 东方哥特祠堂\n\n定位：\n\n东方审判空间。\n\n元素：\n\n黑木、石雕、铜灯、牌位、旧照片。\n\n------------------------------------------------------------------------\n\n# 七、梦境规则\n\n梦境不是异世界。\n\n梦境是现实被人的记忆污染。\n\n公式：\n\n现实空间 → 情感执念 → 空间变异\n\n五种偏移：\n\n1.  空间错误\n2.  时间错误\n3.  物件变化\n4.  镜像不同步\n5.  路径循环\n\n------------------------------------------------------------------------\n\n# 八、材质体系\n\n黑色石材： 权力、历史。\n\n黄铜： 时间、机构。\n\n黑木： 东方传统。\n\n玻璃： 现实与幻象。\n\n丝绒： 欲望和腐败。\n\n旧纸： 被修改的历史。\n\n------------------------------------------------------------------------\n\n# 九、色彩体系\n\n午夜蓝： 梦境基础。\n\n暗金： 黄金时代。\n\n血红： 异常。\n\n烟紫： 梦境侵入。\n\n墨绿： 秘密。\n\n象牙白： 人性。\n\n------------------------------------------------------------------------\n\n# 十、角色与世界统一\n\n人物不是进入世界。\n\n人物属于世界。\n\n## 无名氏\n\n关键词：\n\n死亡归来。\n\n颜色：\n\n黑、灰、暗金。\n\n------------------------------------------------------------------------\n\n## 叶\n\n关键词：\n\n梦境引路人。\n\n颜色：\n\n墨绿、暗红、象牙白。\n\n服装必须具备行动性和功能性。\n\n------------------------------------------------------------------------\n\n## 梦巡司成员\n\n体系：\n\n-   引梦者；\n-   守门人；\n-   档案记录者；\n-   禁梦执行者。\n\n------------------------------------------------------------------------\n\n# 十一、第一季视觉路线\n\nEP01： 血月棺醒------死亡与重生。\n\nEP02： 梦巡司总部------人类管理梦境。\n\nEP03： 藏梦楼------记忆与选择。\n\nEP04： 黄金梦境公馆------欲望与腐败。\n\nEP05： 雪宅魇------无法放下的过去。\n\nEP06： 荒村手札------集体秘密。\n\nEP07： 旧戏院------表演与幻象。\n\nEP08： 禁梦区域------现实崩坏。\n\nEP09： 血月旧城------城市开始做梦。\n\nEP10： 血月门------所有记忆汇聚。\n\n------------------------------------------------------------------------\n\n# 十二、AI生成规范\n\n统一关键词：\n\n1930s Chinese Art Deco architecture\n\nEastern Gothic atmosphere\n\ndreamlike reality distortion\n\nsubtle surrealism\n\nluxurious but decayed\n\ncinematic production design\n\n禁止：\n\nsteampunk\n\ncyberpunk\n\nwuxia\n\nxianxia\n\nfantasy castle\n\ngame art\n\n------------------------------------------------------------------------\n\n# 十三、最终视觉宣言\n\n《梦巡司》不是一个发生在民国的故事。\n\n它是一场：\n\n东方现代文明无法醒来的梦。\n\n它拥有：\n\n帝国大厦般的雄伟。\n\n哥谭般的阴影。\n\n东方志怪的灵魂。\n\n梦境的不确定。\n\n最终目标：\n\n创造一座：\n\n华丽、神秘、腐败、梦幻、从未存在过的东方梦魇都市。\n", "excerpt": "# 整体美术圣经 Visual Bible V1.0\n\n## 一、视觉定位\n\n《不思异：梦巡司》的美术目标，是创造一个中国影视中从未完整呈现过的民国架空世界。\n\n它不是历史复原。 不是传统志怪。 不是仙侠幻想。 不是蒸汽朋克。\n\n它是一座：\n\n> 被梦境修改后的东方现代文明。\n\n核心风格：\n\n# 东方梦境哥特 Art Deco\n\n# Oriental Dream Gothic Art Deco\n\n", "size": 4161, "safe_id": "不思异_梦巡司_整体美术圣经_东方梦境哥特ArtDeco_V1"}, {"name": "失控游戏_EP01_SC01_时代商场外景_场景圣经_v002", "project": "失控游戏", "content": "---\napproval_status: review\nconstitution_version: v002\ndocument_type: scene_bible\nproject_id: SHIKONG_GAME\nscene_id: EP01_SC01\nscene_level: KEY\nscene_name: 时代商场外景\nschema_version: 2.0\n---\n\n# 《失控游戏》EP01_SC01 时代商场外景 场景圣经 v002\n\n## 场景身份\n\n2000年前后中国南方内陆县级城市旧商业综合体，是星星岛儿童乐园的现实外壳，也是进入异常空间前的现实锚点。\n\n## 叙事功能\n\n-   建立旧商场真实存在感。\n-   建立千禧公共空间记忆。\n-   完成现实层到异常层的转换。\n\n## CANONICAL_LEXICON\n\n  键                 正式名称\n  ------------------ ----------------------------\n  main_axis          商场入口广场轴线\n  central_zone       时代商场中央入口广场\n  primary_landmark   时代商场弧形玻璃主体\n  primary_material   千禧商业玻璃幕墙与旧混凝土\n  base_state         雨后停业状态\n\n## 空间宪法\n\n原点：中央入口台阶中心。\n\n主轴： 城市道路 → 前广场 → 中央入口。\n\n固定区域：\n\n### Z01 前入口广场\n\n-   深灰石材地面。\n-   中央入口台阶。\n-   两侧绿化。\n\n### Z02 商场主体\n\n-   弧形玻璃幕墙。\n-   中央入口。\n-   儿童乐园广告区域。\n\n### Z03 停车区域\n\n-   位于入口两侧。\n-   2000年前后车辆环境。\n\n### Z04 背景住宅\n\n-   米黄色住宅楼。\n-   棕色窗框。\n\n## 尺度\n\n人物参考身高：170cm。\n\n禁止： - 摩天商业建筑。 - CBD尺度。 - 超大型购物中心。\n\n## 核心视觉物\n\nL01： 时代商场主体建筑。 数量：1。 不可变： 建筑轮廓、入口位置。\n\nL02： 星星岛儿童乐园广告牌。 数量：1。 不可变： 儿童娱乐属性。\n\nL03： 入口绿化树列。 数量：约20棵。 树种： 香樟树、广玉兰、小叶榕。\n\n## 视觉DNA\n\n年代： 2000年前后中国县城商业空间。\n\n材质： - 玻璃。 - 混凝土。 - 金属。 - 石材。\n\n表面： - 雨痕。 - 污渍。 - 氧化。\n\n## 光线\n\n基础： 阴天自然漫射光。\n\n允许： - 商场内部少量灯光。 - 招牌残留灯光。\n\n禁止： - 霓虹。 - 赛博光。 - 欧美恐怖灯光。\n\n## 摄影连续性\n\nA01 master： 锁定建筑身份。\n\nA02 reverse_view： 证明入口与广场关系。\n\nA03 three_quarter： 证明建筑体块。\n\nA04 high_spatial_view： 证明空间拓扑。\n\n禁止： - 镜像。 - 翻转。 - 改变树列。 - 编造未定义空间。\n\n## P0规则\n\nP0-001： 保持弧形玻璃建筑轮廓。\n\nP0-002： 中央入口位置不可改变。\n\nP0-003： 树列数量与排列关系不可改变。\n\nP0-004： 保持中国县城商业文化属性。\n\n## 未定义\n\n-   商场正式名称。\n-   星星岛具体楼层。\n-   员工入口位置。\n\n## 版本\n\nconstitution_version: v002\n", "excerpt": "---\napproval_status: review\nconstitution_version: v002\ndocument_type: scene_bible\nproject_id: SHIKONG_GAME\nscene_id: EP01_SC01\nscene_level: KEY\nscene_name: 时代商场外景\nschema_version: 2.0\n---\n\n# 《失控游戏》EP01", "size": 1517, "safe_id": "失控游戏_EP01_SC01_时代商场外景_场景圣经_v002"}, {"name": "失控游戏_全剧整体造型设计圣经_V1.0", "project": "失控游戏", "content": "# 《失控游戏》全剧整体造型设计圣经\n\n**版本：** V1.0（全剧版）  \n**文档状态：** 总体造型系统锁定 / 单角色逐步试妆中  \n**项目时间设定：** 2026 年当代  \n**适用部门：** 导演组、编剧组、造型组、服装组、化妆组、美术组、摄影组、分镜组、AI 资产生产组、资产管理组  \n**适用内容：** 角色概念设计、试妆、定妆、角色锚点、三视图、表情与动作资产、关卡临时叠穿、污损升级、镜头连续性、Flow 资产生产与验收\n\n---\n\n## 0. 使用说明\n\n这是一份**全剧整体造型设计圣经**，不是单一角色造型说明。\n\n它负责统一：\n\n1. 《失控游戏》全剧的造型美学；\n2. 现实人物与千禧异常空间之间的时代关系；\n3. 核心角色的色彩、轮廓、材质、发型与随身物；\n4. 每个角色只用一套基础造型完成一场连续冒险的方法；\n5. 群像在远景、背影、暗场和混乱动作中的辨识度；\n6. 五大关卡对人物造型的临时叠加和损耗；\n7. AI 生成中的身份、服装和状态连续性；\n8. 角色资产的生产、版本、验收和入库规则。\n\n### 0.1 当前锁定状态\n\n| 角色 | 色彩与人物方向 | 基础造型具体款式 | 当前状态 |\n|---|---|---|---|\n| 邹青 | 已锁定 | 已定版 | **APPROVED** |\n| 王波 | 已锁定 | 待试妆比较 | DESIGN LOCK |\n| 张杭杭 | 已锁定 | 待试妆比较 | DESIGN LOCK |\n| 赵蔚 | 已锁定 | 待试妆比较 | DESIGN LOCK |\n| 周凯 | 已锁定 | 待试妆比较 | DESIGN LOCK |\n| 麻花 | 已锁定 | 待精确打样 | DESIGN LOCK |\n| 晓晓 | 已锁定 | 需按“同一天”连续性定版 | DESIGN LOCK |\n| 南建林 | 已锁定 | 待现实层与系统层双状态试妆 | DESIGN LOCK |\n| 赵斌 | 功能方向明确 | 待辅助角色定妆 | DEVELOPMENT |\n| 周姨等生活角色 | 功能方向明确 | 按场次执行 | DEVELOPMENT |\n\n> 只有标记为 **APPROVED** 的造型可以直接进入正式角色资产生产。  \n> 其他角色本文件锁定的是“设计边界与试妆方向”，不等于最终成衣款式已经批准。\n\n---\n\n# 1. 全剧造型核心命题\n\n《失控游戏》不是一群精英穿着专业装备进入密室。\n\n它讲的是：\n\n> 一群穿着自己日常衣服的普通年轻人，误入一个比他们更旧、更大、更荒唐的记忆系统；衣服在冒险中逐渐失去原本的体面，最终变成求生、保护和关系变化的痕迹。\n\n全剧造型需要同时完成四件事：\n\n### 1.1 现实可信\n\n人物必须像 2026 年真实存在的中国年轻人。\n\n不能像：\n\n- 游戏角色；\n- 漫展玩家；\n- 战术小队；\n- 户外品牌团队；\n- 偶像组合；\n- 统一制服的商业密室玩家。\n\n### 1.2 群像可识别\n\n角色即使：\n\n- 不露脸；\n- 只出现背影；\n- 在暗场奔跑；\n- 被环境彩光污染；\n- 处于远景；\n- 多人同时入画；\n\n也必须靠**轮廓、主色、材质、身体比例和随身物**被识别。\n\n### 1.3 一套衣服可叙事\n\n每个核心角色原则上只拥有一套基础造型。\n\n新造型不是靠换衣服，而是靠：\n\n- 开合；\n- 穿脱；\n- 卷袖；\n- 系腰；\n- 移动配件；\n- 丢失物品；\n- 临时包扎；\n- 关卡叠穿；\n- 汗、灰、水、油、裂口和录像失真。\n\n### 1.4 人物要与空间发生冲突\n\n人物属于 2026 年。\n\n空间属于被错误保存的中国千禧记忆。\n\n正确视觉不是“人和环境统一”，而是：\n\n> 新鲜、清楚、当代的人，被吞进褪色、廉价、陈旧、错误重复的旧空间。\n\n这种时代冲突本身就是视觉戏剧。\n\n---\n\n# 2. 时间层与造型层\n\n全剧存在四个造型时间层，必须严格区分。\n\n## 2.1 现实层：2026 年\n\n适用角色：\n\n- 邹青；\n- 王波；\n- 张杭杭；\n- 赵蔚；\n- 周凯；\n- 现实中的南建林；\n- 现实中的保安、医护和其他成年人。\n\n特征：\n\n- 当代剪裁；\n- 当代鞋型；\n- 当代面料；\n- 当代手机与设备；\n- 不使用直接的千禧复古扮装；\n- 即使带复古单品，也必须是 2026 年重新流行的现代复古款。\n\n## 2.2 记忆空间层：90 年代至千禧中国公共空间\n\n适用内容：\n\n- 星星岛儿童乐园；\n- 电话亭与广播站；\n- 夜班工厂；\n- 居民楼；\n- 旧音像街区；\n- 系统工作人员残影；\n- 临时关卡制服。\n\n特征：\n\n- 褪色塑料；\n- 廉价印花；\n- 旧制服；\n- 过时剪裁；\n- 灰尘、油污、墙漆和录像噪点；\n- 尺度与重复错误。\n\n这一层可以覆盖、污染和叠加在现实人物身上，但不能让主角本身突然变成旧时代人物。\n\n## 2.3 晓晓 DV/VCD 记忆层\n\n晓晓属于过去某一天的真实生活碎片。\n\n她的服装必须在前 11 段冷开场中保持严格连续：\n\n- 同一件浅黄色外层；\n- 同一套蓝白格纹；\n- 同一个红色小背包；\n- 同样的辫绳和鞋；\n- 污损、天气和身体状态只能顺时间增加。\n\n这一层不是梦幻童装大片，而是：\n\n> 一个真实、生病、被照顾、也被温和忽略的普通小女孩。\n\n## 2.4 系统修补层\n\n适用：\n\n- 南建林系统版本；\n- 麻花逐步被删除；\n- 周凯残影；\n- 被覆盖的路人；\n- 复制人物和系统工人。\n\n造型语言：\n\n- 颜色被降噪；\n- 图案被简化；\n- 脏点被抹平；\n- 表情变得“正确”；\n- 服装局部过于洁净；\n- 同一褶皱、同一纽扣、同一姿势错误重复；\n- 边缘产生磁带雪花、拖影或透明缺口。\n\n系统修补的恐怖不应表现成怪物妆，而应表现成：\n\n> 一个真实的人正在被修成不真实的“正确版本”。\n\n---\n\n# 3. 全剧群像设计原则\n\n## 3.1 一人一主色\n\n| 角色 | 主色 | 辅助色 | 禁止侵占的他人主色 |\n|---|---|---|---|\n| 邹青 | 鲜明运动绿 | 卡其、纯黑、白 | 电子蓝、橙、奶油粉 |\n| 王波 | 电子蓝 | 炭灰、黑、冷白 | 鲜绿、橙 |\n| 张杭杭 | 奶油粉 | 象牙白、可可棕、少量银 | 暗红、鲜绿 |\n| 赵蔚 | 暗红 / 酒红 | 石墨灰、旧纸白、黑 | 电子蓝、奶油粉 |\n| 周凯 | 橙色 | 深灰、褪色橄榄、黑 | 鲜绿、电子蓝 |\n| 麻花 | 褪色红蓝 | 旧黄、灰褐 | 鲜亮纯色 |\n| 晓晓 | 浅黄 | 蓝白格、红色小面积 | 暗红、电子蓝 |\n| 南建林 | 灰蓝白 | 石板灰、旧银、少量黑 | 鲜艳高饱和色 |\n| 赵斌 | 褪灰青 / 石墨 | 米灰、旧绿 | 电子蓝、鲜绿 |\n\n## 3.2 同性别角色必须剪影分离\n\n男性角色：\n\n- **邹青：** 宽肩、裸露手臂或小腿、短裤、胸前 GoPro，最强动作轮廓；\n- **王波：** 窄长、长裤、眼镜、贴身小设备包，重心略向前；\n- **周凯：** 圆、厚、装备过量、肩背有多层带子和帽子；\n- **南建林：** 中年纵向轮廓、灰蓝工作层、肩部略塌、手上有旧设备痕迹；\n- **赵斌：** 普通维修人员轮廓，轻薄工作外层、笔记和工具痕迹，不抢主角色。\n\n女性角色：\n\n- **张杭杭：** 短外层、清晰腰线、表面精致、轻盈但有结构；\n- **赵蔚：** 长线条、收束、层次纵向、纸本记录感；\n- **麻花 / 晓晓：** 儿童比例，但通过马甲、背包、辫子和色彩完全区分。\n\n## 3.3 材质必须分离\n\n| 角色 | 主材质语言 |\n|---|---|\n| 邹青 | 硬挺运动梭织、纯黑训练面料、弹力短裤 |\n| 王波 | 光滑轻尼龙、细针织、电脑包织带、轻量网布 |\n| 张杭杭 | 柔软精纺、微光泽面料、细腻棉、化妆包材质 |\n| 赵蔚 | 哑光针织、灯芯绒感、旧纸、柔软棉布 |\n| 周凯 | 轻户外尼龙、网袋、织带、塑料设备壳 |\n| 麻花 | 起球针织、褪色棉布、旧工作马甲、磨损帆布 |\n| 晓晓 | 柔软棉布、蓝白格纹、浅黄色儿童外层、旧书包布 |\n| 南建林 | 洗旧工作布、灰蓝衬衫料、旧皮革、金属设备 |\n| 赵斌 | 褪灰维修服、棉布、纸质标签、旧塑料工具盒 |\n\n## 3.4 每人一个不可替代的视觉锚点\n\n| 角色 | 一眼记住的视觉锚点 |\n|---|---|\n| 邹青 | 鲜绿立领夹克 + 卡其短裤 + GoPro |\n| 王波 | 电子蓝上身 + 黑框眼镜 + 贴身设备包 |\n| 张杭杭 | 奶油粉短外层 + 小型美妆/拍摄包 |\n| 赵蔚 | 暗红长线条 + 纸质笔记本 |\n| 周凯 | 橙色外层 + 帽子 + 过量设备 |\n| 麻花 | 旧黄工作马甲 + 褪色红蓝 + 麻花辫 |\n| 晓晓 | 浅黄外层 + 蓝白格 + 红色小背包 |\n| 南建林 | 灰蓝工作外层 + 旧表 / 设备标签 |\n| 赵斌 | 褪灰维修外套 + 手写维修本 |\n\n---\n\n# 4. 全剧造型的变化方法\n\n每个角色的基础造型都必须具备四层。\n\n## 4.1 身份层\n\n始终保留，不能随关卡消失：\n\n- 主色；\n- 发型；\n- 身体比例；\n- 代表性鞋型；\n- 核心随身物；\n- 固定眼镜或饰品。\n\n## 4.2 可脱层\n\n每个主要角色至少有一件可以：\n\n- 敞开；\n- 卷起；\n- 脱下；\n- 系腰；\n- 披肩；\n- 借给别人；\n- 临时包裹物体。\n\n## 4.3 功能层\n\n每个主要角色至少有一个能进入剧情的随身物：\n\n- 邹青：GoPro、护腕、摇摇杯；\n- 王波：设备包、手机、充电线或小型工具；\n- 张杭杭：化妆镜、补光设备、清洁用品；\n- 赵蔚：纸质本、笔、旧照片或线索袋；\n- 周凯：过量设备、手环、头灯；\n- 麻花：工作马甲、辫绳、旧小物；\n- 晓晓：红背包、贴纸、辫绳；\n- 南建林：工牌、旧表、剪辑或维修工具。\n\n## 4.4 损耗层\n\n服装必须提前设计：\n\n- 先脏哪里；\n- 先湿哪里；\n- 先破哪里；\n- 哪件物品会丢；\n- 哪个配件会挪作他用；\n- 哪些损伤不可逆。\n\n---\n\n# 5. 核心角色造型章\n\n# 5.1 邹青\n\n**状态：基础造型已定版。**\n\n## 角色定位\n\n- 22 岁；\n- 跆拳道教练；\n- 健身内容创作者；\n- 行动担当；\n- 热心、直接、自信过头；\n- 害怕自己没有用。\n\n## 最终基础造型\n\n> 鲜绿色硬挺立领训练夹克 + 纯黑无袖训练内搭 + 卡其色五分训练短裤 + 白色中筒运动袜 + 黑白复古训练鞋 + 黑色 GoPro 胸挂 + 右手白色运动护腕。\n\n辅助道具：\n\n- 半透明磨砂摇摇杯；\n- 绿色杯盖。\n\n## 轮廓\n\n- 全队最宽的肩；\n- 明确裸露手臂与小腿；\n- 短裤与其他男性长裤形成强区分；\n- GoPro 在胸前形成固定黑色几何点。\n\n## 材质\n\n- 夹克：哑光高密度运动梭织，硬挺；\n- 内搭：纯黑透气训练面料；\n- 短裤：中浅卡其色弹力运动梭织；\n- 鞋：黑白低帮复古训练鞋。\n\n## 变化\n\n1. 夹克敞开；\n2. 袖子推至前臂；\n3. 夹克脱下手持；\n4. 夹克系腰；\n5. 护腕拆下包扎；\n6. 无袖汗湿；\n7. 夹克袖口裂开；\n8. GoPro 倾斜、划伤；\n9. 终局只剩无袖和系腰夹克。\n\n## 禁止\n\n- 荧光安全绿；\n- 绿色马甲；\n- 多口袋；\n- 工装；\n- 冲锋衣；\n- 战术背带；\n- 黑色短裤；\n- 超短跑步裤；\n- 长裤；\n- 自拍杆；\n- 健身广告感。\n\n---\n\n# 5.2 王波\n\n**状态：色彩、轮廓与功能锁定；具体成衣待试妆。**\n\n## 角色定位\n\n- 18 岁；\n- 游戏宅、规则控、密室论坛活跃用户；\n- 习惯先解释；\n- 黑框眼镜；\n- 责任线与周凯绑定。\n\n## 视觉命题\n\n> 一个把攻略、设备和规则贴在身上的年轻人；看起来最像“知道怎么回事”，实际经常差半步。\n\n## 主色\n\n- 电子蓝；\n- 必须清楚、冷、当代；\n- 不是工服蓝；\n- 不是牛仔蓝；\n- 不是荧光赛博蓝。\n\n## 推荐基础结构\n\n优先试妆方向：\n\n- 电子蓝轻量针织或平纹上层；\n- 无帽、无大口袋；\n- 可采用短拉链 Polo、轻薄拉链开衫或简洁电子蓝衬衫式外层；\n- 内搭炭灰或冷白基础层；\n- 深炭灰直筒长裤；\n- 黑灰轻量运动鞋；\n- 黑框眼镜；\n- 贴身、窄而扁的黑色设备斜挎包。\n\n## 轮廓\n\n- 纵向、窄、轻；\n- 长裤；\n- 肩部不扩张；\n- 包贴在身体上，不形成周凯式大体积；\n- 站姿常略前倾，像总想看清提示牌。\n\n## 随身物\n\n- 手机；\n- 细充电线；\n- 小型充电宝；\n- 迷你螺丝刀或转接头；\n- 折叠耳机；\n- 手环或论坛纪念贴纸。\n\n## 变化逻辑\n\n1. 开始时设备排列整齐；\n2. 进入通讯站后线缆开始缠乱；\n3. 工厂后蓝色上层出现油灰；\n4. 居民楼阶段包从背后挪到胸前；\n5. 救周凯时眼镜出现划痕或轻微歪斜；\n6. 终局设备变少，纸面规则被放下。\n\n## 发型建议\n\n- 黑色短直发；\n- 自然、略缺乏打理；\n- 与邹青寸头明显不同；\n- 不做潮流卷发；\n- 不做过度宅男蓬乱。\n\n## 禁止\n\n- 蓝色战术外套；\n- IT 公司工服；\n- 赛博朋克；\n- 大型摄影包；\n- 太多设备挂满全身；\n- 与周凯一样的装备型轮廓；\n- 自拍杆；\n- 电子蓝发光条。\n\n---\n\n# 5.3 张杭杭\n\n**状态：色彩、人物方向和变化逻辑锁定；具体成衣待试妆。**\n\n## 角色定位\n\n- 23 岁；\n- 美妆与生活方式博主；\n- 邹青前任；\n- 习惯把现实修成可以发布的版本；\n- 对材质、污渍、反光、残胶和身体状态敏感。\n\n## 视觉命题\n\n> 她进入冒险时最“完整”，结束时最敢保留不完整。\n\n## 主色\n\n- 奶油粉；\n- 柔和但不幼稚；\n- 不是芭比粉；\n- 不是艳桃红；\n- 不是甜妹制服粉。\n\n## 推荐基础结构\n\n优先试妆方向：\n\n- 奶油粉短款软结构外层；\n- 可为无帽短夹克、短款衬衫外套或轻薄针织外套；\n- 内搭象牙白或浅奶油色简洁上衣；\n- 深可可或烟棕色高腰直筒裤 / 轻量阔腿长裤；\n- 低跟或厚底轻便鞋；\n- 小型奶油粉或银灰拍摄 / 美妆斜挎包。\n\n外层必须可以：\n\n- 脱下；\n- 系腰；\n- 卷袖；\n- 作为遮挡、擦拭或包裹物。\n\n## 轮廓\n\n- 上短下长；\n- 腰线清楚；\n- 表面最整洁；\n- 与赵蔚的长直暗红轮廓区分；\n- 不能因美妆身份穿成不适合行动的高跟鞋造型。\n\n## 随身物\n\n- 手机；\n- 小型补光灯或手机灯附件；\n- 化妆镜；\n- 卸妆巾 / 清洁布；\n- 唇膏；\n- 小型应急护理用品；\n- 发夹或发圈。\n\n## 发型与妆面\n\n- 发型必须比赵蔚更经过整理；\n- 可为光滑中长发、低马尾或半束发；\n- 初始妆面完整但自然；\n- 不做重网红妆；\n- 不做夸张睫毛和高光。\n\n## 变化逻辑\n\n1. 初始头发和外层最整齐；\n2. 乐园后鞋和裤脚先脏；\n3. 通讯站时袖口、手部沾污；\n4. 工厂油污破坏整体完整；\n5. 居民楼阶段头发松散，外层系腰或脱下；\n6. 回放街区妆面有汗痕、泪痕、睫毛膏轻微晕染；\n7. 终局不补妆、不修图，保留真实状态。\n\n## 禁止\n\n- 粉色公主裙；\n- 高跟鞋；\n- 纯时装大片；\n- 大面积亮片；\n- 甜妹制服；\n- 把她写成“怕脏所以没用”；\n- 过于专业的户外功能装；\n- 与麻花或晓晓的儿童色重叠。\n\n---\n\n# 5.4 赵蔚\n\n**状态：色彩、轮廓、纸质记录系统锁定；具体成衣待试妆。**\n\n## 角色定位\n\n- 20 岁；\n- 观察者、记录者；\n- 赵斌妹妹；\n- 看见很多，但害怕开口承担后果；\n- 与王波同为信息角色，但一个偏数字规则，一个偏细节与旧物。\n\n## 视觉命题\n\n> 她像一条收紧的暗红线，开始时总贴在画面边缘，后期才走进中心。\n\n## 主色\n\n- 暗红 / 酒红；\n- 低饱和；\n- 不使用鲜红；\n- 不使用粉红；\n- 不使用紫红晚礼服感。\n\n## 推荐基础结构\n\n优先试妆方向：\n\n- 暗红色薄针织外层、灯芯绒感衬衫或柔软长开衫；\n- 内搭旧纸白、烟灰或浅米色；\n- 石墨灰高腰锥形长裤；\n- 深色轻便系带鞋；\n- 小型旧皮或帆布斜挎记录包；\n- 薄框或具有明确形状的眼镜。\n\n## 轮廓\n\n- 纵向；\n- 收束；\n- 层次比张杭杭更长；\n- 手经常靠近本子或包；\n- 不做宽松森系；\n- 不做高冷侦探风。\n\n## 随身物\n\n- 纸质笔记本；\n- 自动铅笔 / 圆珠笔；\n- 透明证物袋；\n- 折叠旧照片；\n- 小型手电；\n- 赵斌维修记录的复印件或碎片。\n\n## 发型建议\n\n- 与张杭杭明显区分；\n- 可为短发、齐耳发或低束但不精致的直发；\n- 重点是安静、内收，而非时尚感；\n- 冒险中头发变化较少，体现她的自我控制。\n\n## 变化逻辑\n\n1. 初始暗红外层完整扣合；\n2. 紧张时袖口被反复拉扯；\n3. 纸本边缘逐渐卷曲、沾水、沾灰；\n4. 工厂后笔记开始用油污和墙面拓印；\n5. 居民楼阶段外层打开，第一次更主动站到前方；\n6. 终局笔记本不再只记录，而被她当面读出来。\n\n## 禁止\n\n- 电子蓝设备感；\n- 赛博侦探；\n- 黑色全套高冷风；\n- 过于文艺的复古长裙；\n- 与张杭杭同样的粉色和短外套；\n- 过量科技设备；\n- “神探制服”。\n\n---\n\n# 5.5 周凯\n\n**状态：色彩、体型和装备过量逻辑锁定；具体成衣待试妆。**\n\n## 角色定位\n\n- 王波论坛网友；\n- 网名“K哥不怕鬼”；\n- 略胖；\n- 自认为经验丰富的密室论坛大神；\n- 第一集被吞，后续以手环、声音与残影回归。\n\n## 视觉命题\n\n> 一个把“我很专业”穿得太满的人；设备很多，真正危险来时仍然是普通人。\n\n## 主色\n\n- 橙色；\n- 可为烧橙、运动橙或旧橘；\n- 不是环卫橙；\n- 不是救援制服橙；\n- 不用大面积反光。\n\n## 推荐基础结构\n\n- 橙色轻量无帽风衣 / 运动外层；\n- 深灰或黑色内搭；\n- 深灰宽松长裤；\n- 黑灰户外运动鞋；\n- 棒球帽或软帽；\n- 多件消费级小设备，但必须看出是“自己拼的”，不是专业系统。\n\n## 轮廓\n\n- 圆、厚；\n- 肩背有多层带子；\n- 包和设备让身体显得更笨重；\n- 与王波的贴身小包形成鲜明对比；\n- 与邹青的短裤轻行动轮廓相反。\n\n## 随身物\n\n- 头灯；\n- 运动相机；\n- 备用电池；\n- 对讲机；\n- 腰包；\n- 密室手环；\n- 便宜指南针；\n- 多余的扣环和挂绳。\n\n设备需要有轻微喜剧性：\n\n- 有的没电；\n- 有的型号过时；\n- 有的功能重复；\n- 有的只是论坛推荐后冲动购买。\n\n## 发型与帽子\n\n- 可戴帽子；\n- 帽子是其区别于王波和邹青的重要锚点；\n- 被吞后手环和帽子可成为残留识别物。\n\n## 残影状态\n\n周凯残影必须保留：\n\n- 橙色；\n- 帽子；\n- 圆形装备轮廓；\n- 手环；\n- 同一动作重复。\n\n删除过程中：\n\n1. 橙色先褪色；\n2. 设备边缘重复；\n3. 帽檐和手环仍最清楚；\n4. 最后只剩动作、声音和橙色残迹。\n\n## 禁止\n\n- 专业登山家；\n- 专业救援员；\n- 真实军警装备；\n- 反光救生衣；\n- 与工作人员制服混淆；\n- 所有设备都高端有效；\n- 瘦削体型。\n\n---\n\n# 5.6 麻花\n\n**状态：核心视觉锁定；需单独完成儿童角色资产与系统删除测试。**\n\n## 角色定位\n\n- 8—10 岁小女孩形态；\n- 晓晓的原始记忆残留；\n- 系统编号 MH-08；\n- 不是导游，不是万能钥匙，不是鬼娃。\n\n## 视觉命题\n\n> 她像从旧儿童乐园员工区里走出来的一段不合时宜的真实记忆；衣服不漂亮，却有被生活使用过的痕迹。\n\n## 主色\n\n- 褪色红；\n- 褪色蓝；\n- 旧黄。\n\n所有颜色都必须低饱和、洗旧、使用过。\n\n## 推荐基础结构\n\n- 褪色红蓝条纹或格纹儿童上衣；\n- 深蓝或灰蓝下装；\n- 一件明显偏大的旧黄色儿童乐园工作马甲；\n- 马甲上可有被磨掉的旧标识或空名牌位；\n- 旧帆布鞋或儿童运动鞋；\n- 两根不完全对称的麻花辫。\n\n## 轮廓\n\n- 小；\n- 马甲偏大；\n- 肩部略垮；\n- 辫子和马甲形成最清楚的背影识别；\n- 不做精致童装广告；\n- 不做恐怖娃娃裙。\n\n## 材质\n\n- 起球针织；\n- 褪色棉布；\n- 磨损帆布；\n- 旧塑料扣；\n- 反复洗涤后的软化边缘。\n\n## 删除三档\n\n### 第一档：颜色丢失\n\n- 一边辫绳褪色；\n- 红蓝衣物局部变灰；\n- 旧黄马甲仍清楚。\n\n### 第二档：声音与材质失真\n\n- 声音混入磁带杂音；\n- 衣物纹理出现重复噪点；\n- 马甲标签被抹平。\n\n### 第三档：主体透明\n\n- 手指、衣角和辫梢先透明；\n- 不能变成发光精灵；\n- 透明边缘是录像带雪花，不是魔法粒子。\n\n## 禁止\n\n- 白色恐怖裙；\n- 鬼娃妆；\n- 过度苍白；\n- 红眼；\n- 华丽童装；\n- 纯黄色完整制服；\n- 像工作人员本人；\n- 每个镜头都正面展示脸。\n\n---\n\n# 5.7 晓晓\n\n**状态：色彩与“同一天”连续性锁定；具体款式需按冷开场统一打样。**\n\n## 角色定位\n\n- 真实生活中的晓晓；\n- 生病中的普通小女孩；\n- 麻花的原始来源；\n- 不是完美女儿，也不是只负责卖惨的病童。\n\n## 视觉命题\n\n> 她的衣服一开始很普通，随着同一天的等待、玩耍、下雨和入院逐渐留下痕迹；这些痕迹后来被系统试图修掉。\n\n## 唯一基础造型\n\n推荐锁定结构：\n\n- 浅黄色儿童外套 / 薄夹克或开衫；\n- 旧纸白或浅色内搭；\n- 蓝白格纹裙装或格纹下层；\n- 红色小背包；\n- 儿童运动鞋；\n- 两根麻花辫；\n- 一边红绳，一边蓝绳；\n- 背包上有小星星扣。\n\n## 色彩\n\n- 浅黄：温暖但不鲜艳；\n- 蓝白格：真实儿童日常；\n- 红色包：记忆中的稳定视觉点；\n- 禁止糖果色堆叠。\n\n## “同一天”污损连续性\n\n### 早晨\n\n- 衣服最完整；\n- 辫子刚扎好；\n- 红包整齐；\n- 药物与病中状态轻微出现。\n\n### 乐园\n\n- 袖口与鞋出现粉尘；\n- 星星扣仍在；\n- 格纹保持清楚。\n\n### 工厂门口\n\n- 衣服已有灰尘；\n- 身体疲惫；\n- 外套袖口更脏。\n\n### 傍晚居民楼\n\n- 发低烧；\n- 辫子略松；\n- 背包开始变形。\n\n### 夜间旧商圈\n\n- 下雨；\n- 浅黄外层被淋湿；\n- 星星扣掉落；\n- 贴纸卷边。\n\n### 医院\n\n- 外套湿；\n- 背包不再随身；\n- 手抓住南建林袖子；\n- 造型进入最不漂亮、也最真实的状态。\n\n## 系统修补版\n\n南建林修补后的晓晓应出现：\n\n- 衣服过度干净；\n- 辫子完全对称；\n- 黄色更明亮；\n- 红包没有磨损；\n- 表情始终乖巧；\n- 所有污点消失。\n\n这种“漂亮”必须显得不对。\n\n## 禁止\n\n- 公主裙；\n- 病号服贯穿；\n- 白裙鬼童；\n- 过度可爱；\n- 过度悲惨；\n- 每个冷开场换一套衣服；\n- 天气与污损倒退。\n\n---\n\n# 5.8 南建林\n\n**状态：角色方向与双层结构锁定；需现实层、系统层分别试妆。**\n\n## 角色定位\n\n- 40—45 岁；\n- 技术强、生活笨的父亲；\n- 记忆系统创造者；\n- 修补真实的人；\n- 加害者，也是被自己系统困住的人。\n\n## 视觉命题\n\n> 一个把生活穿成长期工作状态的人；衣服像从未真正下班，后来又被系统剪成多个时间版本。\n\n## 主色\n\n- 灰蓝；\n- 旧白；\n- 石板灰；\n- 少量旧银和黑。\n\n## 现实层推荐结构\n\n- 灰蓝洗旧工作衬衫或工程外套；\n- 旧白内搭；\n- 石板灰长裤；\n- 深色软底鞋；\n- 旧手表；\n- 工牌、钥匙或设备标签；\n- 衣服不脏乱，但长期缺乏生活照料。\n\n## 系统层推荐结构\n\n不为每个空间换一套完整衣服，而是让同一套基础装出现不同“记忆覆盖”：\n\n- 工厂版本：多一层旧工牌或工作外套；\n- 医院版本：袖口湿、衣襟被孩子抓皱；\n- 剪辑台版本：袖口卷起、手上有磁带或灰尘；\n- 乐园门口版本：衣服较完整，但表情与姿势循环。\n\n必须保留：\n\n- 灰蓝主色；\n- 旧表；\n- 同一领型或衣襟结构；\n- 同一人物轮廓。\n\n## 轮廓\n\n- 中年；\n- 肩部略塌；\n- 纵向；\n- 不做商业精英西装；\n- 不做高冷科学家黑高领；\n- 不做礼帽反派。\n\n## 损耗与系统状态\n\n1. 初始像长期值夜班；\n2. 手部出现磁带油污和设备划痕；\n3. 袖口被晓晓抓皱的痕迹反复出现；\n4. 系统切换时衣服局部恢复，又再次破损；\n5. 终局灰蓝衣服不再被“修干净”。\n\n## 禁止\n\n- 礼帽；\n- 三件套西装；\n- 邪恶资本家造型；\n- 科幻实验室制服；\n- 纯黑反派；\n- 过度精英；\n- 与普通工作人员完全混淆。\n\n---\n\n# 5.9 赵斌\n\n**状态：辅助角色设计方向。**\n\n## 角色定位\n\n- 赵蔚哥哥；\n- 南建林早期项目维护人员；\n- 旧系统的现实见证；\n- 通过维修记录、声音和残片存在。\n\n## 推荐视觉\n\n- 褪灰青或石墨色轻维修外层；\n- 米灰内搭；\n- 深色长裤；\n- 旧运动鞋；\n- 手写维修本；\n- 便宜工具盒；\n- 普通、可靠，不像天才工程师。\n\n## 作用\n\n他与王波的电子蓝必须完全区分：\n\n- 王波是当代电子设备感；\n- 赵斌是旧纸、旧线、维修痕迹感。\n\n---\n\n# 5.10 周姨及生活角色\n\n## 周姨\n\n推荐：\n\n- 暖灰、米色或浅褐针织外层；\n- 旧花纹内搭；\n- 深色实用长裤；\n- 平底鞋；\n- 药袋、钥匙和保温杯。\n\n她必须像真实照护者：\n\n- 温和；\n- 实用；\n- 不时尚；\n- 不阴森；\n- 不像反派保姆。\n\n## 晓晓母亲\n\n推荐：\n\n- 暖象牙、浅桃或柔和医院色；\n- 简单病房衣物；\n- 不用强烈妆面；\n- 与晓晓的浅黄形成家庭暖色联系。\n\n## 现实层工作人员\n\n- 保安、医护、商场人员使用现实 2026 制服；\n- 不使用与关卡旧工人相同的褪色制服；\n- 现实制服更规范、面料更新、标识清楚；\n- 用于区分“现实仍正常运行”与“系统旧制服残影”。\n\n---\n\n# 6. 人物关系的造型设计\n\n## 6.1 邹青 × 张杭杭\n\n前任关系必须在造型上既对立又有隐约呼应：\n\n- 邹青：鲜绿、硬、运动、开放；\n- 张杭杭：奶油粉、软、精致、控制表面。\n\n呼应方式：\n\n- 两人都可有短外层；\n- 都有可以随时拿出来拍摄的设备；\n- 两人衣服在第 7 集同时失去体面。\n\n禁止把两人做成情侣装。\n\n## 6.2 王波 × 赵蔚\n\n两人都是信息角色，但材料必须相反：\n\n- 王波：电子蓝、数字设备、细线、塑料和尼龙；\n- 赵蔚：暗红、纸本记录、旧照片、棉布和哑光材料。\n\n两人同框时：\n\n- 王波更靠前解释；\n- 赵蔚更靠边观察；\n- 后期站位逐渐互换。\n\n## 6.3 王波 × 周凯\n\n两人同属“密室圈”，但不能穿成同类：\n\n- 王波：设备少、贴身、轻、窄；\n- 周凯：设备多、外挂、厚、圆。\n\n周凯的消失会让王波身上少量设备显得更克制、更有责任感。\n\n## 6.4 麻花 × 晓晓\n\n两人不能只是同一个孩子换衣服。\n\n晓晓：\n\n- 浅黄；\n- 蓝白格；\n- 红包；\n- 较完整的现实生活衣物。\n\n麻花：\n\n- 旧黄马甲；\n- 褪色红蓝；\n- 不合身；\n- 像从员工区和记忆缝隙里走出来。\n\n联系通过：\n\n- 麻花辫；\n- 红蓝辫绳；\n- 某一块相同小布料；\n- 同样的小动作。\n\n## 6.5 麻花 × 南建林\n\n南建林是灰蓝白，麻花是褪色红蓝旧黄。\n\n两人同框时：\n\n- 麻花的旧黄马甲像从南建林工作世界里捡来的残片；\n- 红蓝儿童色是他无法完全抹掉的真实；\n- 南建林的灰蓝修补层不断试图覆盖她。\n\n---\n\n# 7. 五大关卡的临时造型叠加\n\n关卡不能把主角换成统一 NPC。\n\n临时服装只能叠在基础造型外，必须保留人物主色和轮廓。\n\n# 7.1 欢迎进入乐园\n\n允许叠加：\n\n- 入场腕带；\n- 儿童贴纸；\n- 鞋套；\n- 塑料雨披碎片；\n- 生日帽或员工贴纸作为短暂喜剧道具。\n\n禁止：\n\n- 全员换童装；\n- 大面积卡通服；\n- 彻底遮挡角色主色。\n\n主要污损：\n\n- 海洋球粉尘；\n- 塑料摩擦痕；\n- 鞋底与裤脚污迹；\n- 轻微汗。\n\n# 7.2 失真通讯站\n\n允许叠加：\n\n- 旧耳机；\n- 单边话务员耳麦；\n- 电话线临时绑带；\n- 旧编号贴；\n- 临时安全绳。\n\n主要污损：\n\n- 手掌灰；\n- 线缆油；\n- 衣袖磨痕；\n- 眼镜和设备轻微歪斜。\n\n禁止：\n\n- 全员换话务员制服；\n- 复古客服 Cosplay；\n- 电子蓝环境光吞掉王波主色。\n\n# 7.3 夜班工厂\n\n剧情需要五人被迫伪装夜班工人。\n\n统一临时层建议：\n\n- 灰蓝或灰绿色旧工作外套；\n- 旧工牌；\n- 可选旧帽；\n- 统一层必须偏大、不合身、低饱和。\n\n保留规则：\n\n- 邹青的鲜绿、卡其短裤和裸露小腿仍可从工服下露出；\n- 王波电子蓝领口、眼镜和设备包保留；\n- 张杭杭奶油粉内层或包保留；\n- 赵蔚暗红袖口、笔记本保留；\n- 麻花旧黄马甲可不再额外套工服。\n\n主要污损：\n\n- 机油；\n- 铁锈；\n- 灰尘；\n- 工牌盖章；\n- 袖口磨损。\n\n禁止：\n\n- 临时工服成为后续永久造型；\n- 全员完全同色；\n- 工牌遮掉人物身份。\n\n# 7.4 重排居民楼\n\n允许叠加：\n\n- 旧围裙；\n- 居民楼拖鞋；\n- 毛巾；\n- 家居开衫；\n- 塑料袋；\n- 临时雨衣；\n- 某些复制房间产生的旧生活物。\n\n这些只能短暂使用，不能替换基础服装。\n\n主要变化：\n\n- 外层脱下或系腰；\n- 头发松散；\n- 手部污水；\n- 灰尘；\n- 衣服被门、墙和电梯井拉扯；\n- 人物标签第一次通过穿着失效。\n\n# 7.5 回放街区\n\n不再增加大量实体服装。\n\n主要使用：\n\n- 录像覆盖；\n- 色彩褪变；\n- 局部重复；\n- 边缘雪花；\n- 旧雨水；\n- 霓虹和 CRT 污染；\n- 服装状态倒带与人物伤痕不倒带之间的冲突。\n\n注意：\n\n- 环境彩光不能改变角色基础配色判断；\n- 王波电子蓝不能与街区蓝光融为一体；\n- 邹青绿色不能变成安全荧光；\n- 张杭杭粉色不能被红光变成艳红；\n- 赵蔚暗红必须在低照度中保留轮廓。\n\n---\n\n# 8. 全队冒险污损进度\n\n建议使用统一阶段码，而不是每集重新描述。\n\n| 阶段 | 剧情位置 | 全队状态 |\n|---|---|---|\n| G0 | 现实入场 | 干净、完整、各自体面 |\n| G1 | 乐园后 | 鞋与裤脚有灰，轻微汗，少量塑料污迹 |\n| G2 | 通讯站后 | 手部、袖口和设备有线缆灰，发型开始变化 |\n| G3 | 工厂后 | 机油、铁锈、工牌印、明显污损，外层结构开始破坏 |\n| G4 | 居民楼中段 | 外层穿脱，头发松散，衣物被拉扯，关系状态开始显形 |\n| G5 | 护送麻花 | 有包扎、道具挪用、部分物品丢失，不再保持最初完整 |\n| G6 | 回放街区 | 水痕、录像覆盖、擦伤、设备受损，颜色局部被系统污染 |\n| G7 | 终局 | 体力耗尽，污损不可逆，所有人仍保留明确主色与身份锚点 |\n\n### 8.1 污损原则\n\n- 脏污必须有来源；\n- 破口必须有具体发生点；\n- 包扎必须记录材料来源；\n- 丢失物不能无故回来；\n- 录像倒带可以恢复空间和服装局部，但不能随意恢复伤口；\n- 每个角色的“体面失守”程度不同。\n\n---\n\n# 9. 发型与妆面系统\n\n## 9.1 初始差异\n\n- 邹青：短寸头，最短、最硬；\n- 王波：短直发，自然、不精修；\n- 周凯：帽子 + 普通短发，体积集中在装备；\n- 张杭杭：最经过整理；\n- 赵蔚：最内收、最稳定；\n- 麻花：两根不对称麻花辫；\n- 晓晓：同样是麻花辫，但初始更整齐；\n- 南建林：中年短发，疲惫、缺乏打理；\n- 赵斌：普通维修人员短发。\n\n## 9.2 妆面基准\n\n现实青年：\n\n- 真实皮肤；\n- 不过度磨皮；\n- 不使用偶像滤镜；\n- 不使用强轮廓修容；\n- 保留毛孔、晒痕和轻微黑眼圈。\n\n张杭杭可以有更完整的初始妆面，但仍然是日常拍摄妆，不是红毯妆。\n\n## 9.3 伤妆原则\n\n- 擦伤位置固定；\n- 汗湿逐级增加；\n- 油污、水痕和灰尘不能随机跳动；\n- 不使用大面积血浆；\n- 不做末日生存妆；\n- 不把轻喜剧冒险变成重口恐怖片。\n\n---\n\n# 10. 鞋履系统\n\n鞋是群像远景和动作连续性的关键资产，必须单独锁定。\n\n| 角色 | 鞋型方向 |\n|---|---|\n| 邹青 | 黑白复古低帮训练鞋 |\n| 王波 | 黑灰轻量运动鞋或简洁休闲跑鞋 |\n| 张杭杭 | 奶油白 / 可可色轻便厚底鞋，拒绝高跟 |\n| 赵蔚 | 深色轻便系带鞋或低调运动鞋 |\n| 周凯 | 厚底黑灰户外运动鞋，但非专业越野 |\n| 麻花 | 旧帆布鞋或洗旧儿童运动鞋 |\n| 晓晓 | 浅色儿童运动鞋，按同一天逐渐沾灰和淋湿 |\n| 南建林 | 深色软底工作鞋 |\n| 赵斌 | 普通旧运动鞋或维修鞋 |\n\n所有全身锚点必须完整显示鞋。\n\n---\n\n# 11. AI 资产生产总体流程\n\n## 11.1 每个角色先设计，后生产\n\n```text\n人物资料与身份参考\n        ↓\nGPT 输出 6 个造型方向图\n        ↓\n导演选定 1 个基础造型\n        ↓\n生成定版造型参考\n        ↓\nFlow 生成标准锚点\n        ↓\n三视图 / 半身 / 面部\n        ↓\n表情与动作\n        ↓\n穿脱变化\n        ↓\n污损与关卡叠加\n```\n\n## 11.2 标准参考图职责\n\n每个角色最多使用三类主要参考：\n\n1. 面部参考；\n2. 身体参考；\n3. 已批准造型主锚点。\n\n统一提示语必须写明：\n\n> 面部参考只决定身份；身体参考只决定身材比例；造型参考只决定服装、颜色和装备。不要继承任何参考图中的姿势、表情、背景、构图和灯光。\n\n## 11.3 标准锚点包\n\n每个核心角色必须生成：\n\n1. 正面全身；\n2. 左前 45 度全身；\n3. 右侧全身；\n4. 背面全身；\n5. 正面半身；\n6. 面部近景。\n\n儿童角色另加：\n\n7. 辫子背面特写；\n8. 手部与随身物；\n9. 低角度儿童比例测试。\n\n## 11.4 单图原则\n\n正式资产：\n\n- 一人一图；\n- 不输出拼图；\n- 不输出多人 Lookbook；\n- 不在图中加入文字；\n- 不裁断鞋；\n- 不裁断头顶；\n- 不用复杂背景；\n- 标准资产采用浅灰摄影棚背景。\n\n---\n\n# 12. 资产命名规范\n\n推荐格式：\n\n```text\nSCYX_角色代码_资产类型_视角或状态_版本_审批状态\n```\n\n角色代码：\n\n| 角色 | 代码 |\n|---|---|\n| 邹青 | ZQ |\n| 王波 | WB |\n| 张杭杭 | ZHH |\n| 赵蔚 | ZW |\n| 周凯 | ZK |\n| 麻花 | MH |\n| 晓晓 | XX |\n| 南建林 | NJL |\n| 赵斌 | ZB |\n| 周姨 | ZY |\n\n示例：\n\n```text\nSCYX_ZQ_LOOK_FRONT_FULL_v003_APPROVED.png\nSCYX_WB_LOOK_TRIAL_04_v001_REVIEW.png\nSCYX_MH_STATE_DELETE_02_v002_APPROVED.png\nSCYX_XX_CONTINUITY_1905_RAIN_v001_REVIEW.png\n```\n\n审批状态：\n\n- `DRAFT`\n- `REVIEW`\n- `APPROVED`\n- `REJECTED`\n- `ARCHIVED`\n\n规则：\n\n- 不覆盖旧文件；\n- 每次修改递增版本；\n- 只有 APPROVED 能成为下游参考；\n- 被淘汰造型不得继续混入 Flow；\n- 状态资产必须记录依赖的主锚点版本。\n\n---\n\n# 13. 资产清单\n\n## 13.1 每个核心角色通用资产\n\n- 面部正面；\n- 面部 45 度；\n- 身体正面；\n- 定版造型正面全身；\n- 左前 45 度；\n- 右侧；\n- 背面；\n- 正面半身；\n- 中性表情；\n- 自信 / 紧张 / 恐惧 / 愤怒等角色专属表情；\n- 站立；\n- 观察；\n- 行走准备；\n- 使用核心道具；\n- 外层敞开；\n- 外层脱下；\n- 外层系腰或移位；\n- G0—G7 污损状态；\n- 五种环境光测试；\n- 关键鞋履与道具单体。\n\n## 13.2 群像资产\n\n- 全队 G0 干净状态站位；\n- 全队主色远景测试；\n- 背影识别测试；\n- 低照度剪影测试；\n- 工厂临时制服叠穿测试；\n- 居民楼穿脱状态测试；\n- 终局 G7 状态群像；\n- 麻花位于队伍中心的护送阵型；\n- 最终空位合照构图。\n\n---\n\n# 14. 造型验收标准\n\n## 14.1 身份一致性\n\n- 是否同一张脸；\n- 年龄是否稳定；\n- 身高和比例是否稳定；\n- 发型是否稳定；\n- 眼镜、辫子、帽子等固定项是否稳定；\n- 身体肌肉量是否稳定。\n\n## 14.2 群像区分\n\n- 不看脸是否仍能认人；\n- 男性角色的上身轮廓是否不同；\n- 女性角色的长度和腰线是否不同；\n- 主色是否互不污染；\n- 配件是否一眼可分。\n\n## 14.3 时代正确\n\n- 主角是否像 2026 年人物；\n- 是否错误穿成千禧年代人物；\n- 晓晓是否维持过去记忆层；\n- 关卡旧制服是否只作为叠加层；\n- 现代装备是否被错误复古化。\n\n## 14.4 人物正确\n\n- 邹青是否像运动青年，而非工作人员；\n- 王波是否像规则型玩家，而非赛博程序员；\n- 张杭杭是否有生活方式博主能力，而非虚荣甜妹；\n- 赵蔚是否像观察者，而非高冷神探；\n- 周凯是否过度准备但仍普通；\n- 麻花是否真实、不合身，而非鬼娃；\n- 南建林是否疲惫克制，而非传统反派。\n\n## 14.5 可拍与可生成\n\n- 外层是否能自然穿脱；\n- 配件是否不会遮脸和遮身体；\n- 大动作时服装是否可保持；\n- 是否有稳定的材质和颜色描述；\n- 是否能拆成单品资产；\n- 是否容易被 Flow 重复生成；\n- 是否避免复杂、细碎、不可控的装饰。\n\n---\n\n# 15. 连续性记录表\n\n每个镜头或资产必须记录：\n\n- 角色代码；\n- 当前关卡；\n- 当前时间线；\n- 污损阶段 G0—G7；\n- 外层是否穿着；\n- 拉链 / 纽扣位置；\n- 袖子位置；\n- 外层是否系腰；\n- 包的位置；\n- 核心道具是否携带；\n- 眼镜 / 帽子 / 辫子状态；\n- 汗湿程度；\n- 灰尘位置；\n- 水痕位置；\n- 油污位置；\n- 裂口位置；\n- 包扎材料来源；\n- 鞋面污损；\n- 面部擦伤；\n- 是否受到系统覆盖；\n- 是否存在不可逆变化。\n\n连续性禁止：\n\n- 已经丢失的物品重新出现；\n- 已拆下的护腕无故回腕；\n- 已破的袖口恢复；\n- 工厂油污突然消失；\n- 晓晓同一天衣服污损倒退；\n- 麻花删除档位倒退；\n- 周凯残影颜色恢复。\n\n---\n\n# 16. 全剧造型禁止项\n\n## 16.1 全员禁止\n\n- 全员机能风；\n- 全员户外风；\n- 全员运动套装；\n- 全员潮牌；\n- 全员复古千禧穿搭；\n- 全员统一黑色；\n- 全员统一战术背带；\n- 依赖环境光区分角色；\n- 通过大 Logo 代替人物设计；\n- 服装每集自动恢复干净；\n- 为了好看而忽略剧情连续性。\n\n## 16.2 AI 常见错误\n\n- 把绿色生成成安全制服；\n- 把橙色生成成救援人员；\n- 把电子蓝生成成赛博朋克；\n- 把奶油粉生成成甜妹偶像；\n- 把暗红生成成高冷侦探；\n- 把儿童角色生成成恐怖娃娃；\n- 把南建林生成成礼帽西装反派；\n- 把所有男性生成成同一种短发和长裤；\n- 把所有女性生成成长发、短上衣和紧身裤；\n- 生成拼图而不是单人单图；\n- 裁断鞋子；\n- 无故改变人物脸和身体。\n\n---\n\n# 17. 后续执行顺序\n\n建议按以下顺序继续完成全剧角色造型：\n\n1. **邹青：** 已定版，立即进入标准锚点资产；\n2. **王波：** 先出 6 个电子蓝基础造型方向图；\n3. **张杭杭：** 先出 6 个奶油粉“体面可失守”方向图；\n4. **赵蔚：** 先出 6 个暗红纸本观察者方向图；\n5. **周凯：** 先出 6 个橙色“装备过量”方向图；\n6. **麻花：** 直接做 4 个儿童基础造型方向 + 删除三档测试；\n7. **晓晓：** 锁定唯一同一天基础造型，再做 6 个时段连续状态；\n8. **南建林：** 同时设计现实基础造型和系统覆盖状态；\n9. **赵斌、周姨：** 在核心角色锁定后完成辅助角色；\n10. **最后统一生成全队群像、低光测试、工厂叠穿和终局污损。**\n\n---\n\n# 18. 最终造型宣言\n\n《失控游戏》的造型不追求“每个人都穿得最时髦”。\n\n它追求的是：\n\n> 每个人的衣服都像他自己选择的；每一件东西都能在危险中被使用；每一道污损都来自真实事件；每一次穿脱都说明人物关系发生了变化。\n\n现实人物必须稳定。\n\n空间可以无限失控。\n\n人物越狼狈，越应该被看见。\n\n而当全剧结束时，观众不需要看清脸，也应该知道：\n\n- 那个鲜绿短裤、胸前挂摄像机的是邹青；\n- 那个电子蓝、眼镜和小设备包的是王波；\n- 那个奶油粉、仍握着清洁布的是张杭杭；\n- 那个暗红、手里攥着纸本的是赵蔚；\n- 那个橙色、设备过量的残影是周凯；\n- 那个旧黄马甲和麻花辫的小女孩，是他们没有带出脸、却终于认真听完的人。\n", "excerpt": "**版本：** V1.0（全剧版）  \n**文档状态：** 总体造型系统锁定 / 单角色逐步试妆中  \n**项目时间设定：** 2026 年当代  \n**适用部门：** 导演组、编剧组、造型组、服装组、化妆组、美术组、摄影组、分镜组、AI 资产生产组、资产管理组  \n**适用内容：** 角色概念设计、试妆、定妆、角色锚点、三视图、表情与动作资产、关卡临时叠穿、污损升级、镜头连续性、Flow 资产生", "size": 17336, "safe_id": "失控游戏_全剧整体造型设计圣经_V1_0"}, {"name": "失控游戏_剧集圣经_V1.1新增修改页", "project": "失控游戏", "content": "# 《失控游戏》项目剧集圣经 V1.1 新增/修改页\n\n**适用对象**：编剧分发版 V1.0 的补丁页。  \n**生效原则**：本文件优先级高于 V1.0 中与之冲突的表述；未涉及内容仍按 V1.0 执行。  \n**修订范围**：修正赵蔚终局动作口径；补齐系统规则速查表、晓晓“那一天”完整时间线、麻花认知边界表；顺手统一参考片名、钩子命名、Slogan，并补周姨人物条目。\n\n## 0. 生效与替换说明\n\n| 修改项 | V1.0位置/问题 | V1.1统一口径 |\n| --- | --- | --- |\n| Slogan候选 | 封面页/项目介绍：删除“迷宫深潜，逃出生天”。 | 保留：别相信修补后的版本 / 请把话听完。备注：《请把话听完》升为正式片名优先候选，《失控游戏：请把话听完》保留为对外提案名。 |\n| 参考片名 | 所有“《僵尸逃生船》”误写。 | 统一为《僵尸救生船》。三部调性参考固定为：《小镇滋味》《外星居民》《僵尸救生船》。 |\n| 三钩命名 | 第1/3/4集“悬疑钩子”、第9-12集“真相钩子”。 | 全书统一为“真相钩”。分集任务卡首页固定标注：冒险钩 / 喜剧钩 / 真相钩。 |\n| 赵蔚终局动作 1 | 2.4 标签升级表：赵蔚“把真相发出去，不站画面外”。 | 改为：备份材料，不公开发布；当面对三人说出“我害怕，但我看见了”，从旁观记录变成现场见证。 |\n| 赵蔚终局动作 2 | 附录总纲第12集：“把所有信息发给自己，说出‘我害怕但我看见了’”。 | 改为：把哥哥赵斌日志、周凯救援记录、麻花声音和母带转存到本地备份；没有发公开平台，只在队友面前说出“我害怕，但我看见了”。 |\n| 赵蔚终局动作 3 | 附录分集大纲第12集：“第一次主动把真相发出去”。 | 改为：第一次主动把真相说出来。她不是发布者，而是见证人；结局仍保持“王波不发布、张杭杭不修剪、赵蔚不逃避”的私密收束。 |\n| 周姨条目 | 第7集冷开场出现端药照顾者，但人物表缺失。 | 在人物条目末尾新增“周姨”两行设定，见本文件第5章。 |\n\n## 1. 新增章：系统规则宪法 / 速查表\n\n本章用于统一五个分集编剧对空间物理的理解。后续剧本出现“吞人、覆盖、倒带、删除、残影、修补”时，必须能在下表中找到依据。\n\n### 1.1 系统五层\n\n| 层级 | 功能 | 编剧必须遵守 |\n| --- | --- | --- |\n| 现实层 | 星星岛旧商场三层机房、旧设备、昏迷南建林、昏迷但活着的周凯。现实层只在第1集门店、第12集尾声少量显影。 | 不要在中段频繁切外部调查线。外部世界只提供现实锚，不承担破局。 |\n| 记忆域层 | 五大阈限空间：欢迎进入乐园、失真通讯站、夜班工厂、重排居民楼、回放街区。它们由晓晓DV、照片、物件、南建林修补逻辑和商场旧结构共同生成。 | 空间可以异常放大、折叠、复制、回放，但外壳必须来自90年代中国公共空间。 |\n| 修补程序 | 南建林的主动清理行为：新油漆盖住涂鸦、焊死门、剪断录音、覆盖录像、把“不好看”的晓晓修成乖巧版本。 | 从第2集起逐集可见。每关Boss机制都应与“修补真实”有关，而不是随机怪物。 |\n| 删除协议 | 系统识别麻花/MH-08为删不掉的原始错误数据，优先追踪、淡化、抹除她。第8集后从暗线变明线。 | 第1-7集不要明说“删除麻花”；第9-11集必须按三档刻度推进。 |\n| 回放/覆盖层 | 第10-11集集中出现。人或空间会被旧录像覆盖，变成重复同一动作的残影。周凯是主要样本。 | 覆盖不能随便解除。必须满足“听见求救—叫出真名—给出回应”三步，才可从未完成覆盖中抢回。 |\n\n### 1.2 关键规则速查\n\n| 规则 | 生效方式 | 限制/禁区 |\n| --- | --- | --- |\n| 空间吞人 | 通过边界物发生：矮门、滑梯口、电话亭门、绿铁门、居民楼卧室门、录像机屏幕。吞人不是随机，是修补程序或删除协议在改变路径。 | 不能把任何门都写成任意传送门。每次吞人必须对应“修补/删除/覆盖”三者之一。 |\n| 删除光 | 触碰普通人会造成短暂画面卡顿、眩晕、记忆断片；触碰麻花会推进删除刻度。第9集辫子褪色，第10集声音混入磁带杂音，第11集身体半透明。 | 不能把删除光写成普通激光武器，也不能让它一照即死。主角可被擦到，但不能替代真正动作危机。 |\n| 修补痕迹 | 新油漆、新焊点、被贴住的门缝、剪断的磁带、被涂白的文字、被循环覆盖的录像。 | 修补痕迹必须“看得见、摸得到、能被角色误解”。不要只用台词说“这里被修补过”。 |\n| 残影 | 被覆盖的人会重复同一动作或一句话，但仍可能保留最后未被回应的请求。周凯重复“有人吗”，不是鬼，是未完成的现实求救。 | 残影不是幽灵，不讲鬼话，不提供全知线索。 |\n| 倒带 | 录像设备或广播信号触发局部空间倒带，通常15-60秒；角色保留记忆和伤痕，空间物件回到上一个状态。 | 倒带不能撤销死亡、不能无限重试、不能解决核心情感问题。 |\n| 原始数据豁免 | 未修补物件能短暂抵抗删除：母带索引贴纸、赵斌日志、原始母带、麻花辫、未剪掉噪点的影像。 | 普通生活物件可以救命，但不能直接改写系统规则。自拍杆可以勾门，不能“净化删除”。 |\n| 听完机制 | 角色真正听见并回应一个被覆盖对象时，修补程序会短暂停顿。第10集救周凯、第11集让南建林看完母带都用这个机制。 | 不要写成口号。必须有具体动作：停下、听完、叫名、回应。 |\n| 时间膨胀 | 系统内体感跨多日，现实外部约一夜。第12集现实层只确认失踪、昏迷和机房，不展开大规模社会反应。 | 不要让警察/媒体中段进入主叙事。现实追责留给尾声或第二季钩子。 |\n\n### 1.3 分集规则推进\n\n| 集数 | 系统状态 | 编剧可写 | 编剧禁写 |\n| --- | --- | --- | --- |\n| 第1集 | 误导层启动。周凯被边界物吞入低级覆盖区，观众以为旧事故鬼屋。 | 接待区异常、星星岛旧帖、周凯被吞、麻花命名。 | 不要说记忆系统、MH-08、删除协议。 |\n| 第2集 | 修补痕迹第一次出现：新油漆盖“爸爸没有来”。 | 乐园异常、低配求生、第一处被盖住的真实。 | 不要让角色读出“南建林”。 |\n| 第3集 | 通讯域只释放“小蔚”二字。赵斌线毛骨悚然但不解释。 | 电话杂音、签名磨花只见“斌”字。 | 不要提前说“别相信修补后的版本”。 |\n| 第4集 | 完整赵斌警告释放，但仍不解释系统性质。 | 完整警告后移到结尾。 | 不要让观众彻底放弃鬼屋/旧事故误导。 |\n| 第5集 | 夜班工厂修补程序增强。 | 工厂机械、档案残片、绿铁门预兆。 | 不要提前揭父亲受困。 |\n| 第6集 | 中点反转：私人记忆系统。关卡渗漏。 | 工牌“南”、接孩子指令、全家福认出麻花脸、绿铁门吞人。 | 反转必须爆炸，不能只多漏一个线索。 |\n| 第7集 | 人物瓶集。系统规则不扩张，人物关系扩张。 | 赵蔚哥哥线正式揭，标签失效互换。 | 不要堆新空间奇观。 |\n| 第8集 | 第二反转：麻花是系统删除失败的错误数据。 | MH-08日志、删除光追麻花、护送目标成立。 | 不要把麻花写成全知导游。 |\n| 第9集 | 删除第一档：麻花辫子褪色。母带索引贴纸取得。 | 辫子褪色与“不好看了”情绪点；贴纸冒险取回。 | 不要让贴纸只做纪念品，必须有第10集功能。 |\n| 第10集 | 删除第二档：麻花声音杂音化。假希望破裂。救周凯。 | 贴纸定位母带；活体同步连南建林；周凯残影救援。 | 注意密度，剪辑台段落一场内完成。 |\n| 第11集 | 删除第三档：麻花半透明。父亲受困。原始母带播放。 | 南建林、母带室、听完机制、双重救援。 | 不要再塞周凯大节拍。 |\n| 第12集 | 系统停机，现实锚落地，记忆有代价。 | 周凯活着、南建林旧机房、麻花脸无法带出。 | 不要公开发布全部真相，不要大团圆。 |\n\n## 2. 新增章：晓晓“那一天”完整时间线\n\n所有冷开场都来自同一天的不同DV/VCD碎片。该日不是“当场死亡日”，而是晓晓最后一次完整清醒外出的普通一天；当晚急性发作入院，三天后病故。剧本不必在台词中公开具体公历日期，所有连续性以本表为准。\n\n| 冷开场/时间 | 地点 | 事件 | 连续性要求 | 剧作功能 |\n| --- | --- | --- | --- | --- |\n| 01｜08:05 | 居民楼卧室 | 周姨端药进来，晓晓不想吃药，只让周姨帮她把两根麻花辫重新扎紧。DV里能听见南建林电话承诺“忙完去接你”。 | 阴天早晨；晓晓穿浅黄色外套、蓝白格裙、红色小背包；左辫红绳、右辫蓝绳。 | 建立周姨、病中生活、父亲缺席承诺；“麻花”名字的现实来源。 |\n| 02｜09:10 | 星星岛乐园入口 | 晓晓在旧儿童乐园门口等爸爸，周姨说先进去玩。镜头扫过开业海报、生日灯箱和贴纸墙。 | 天气仍阴；衣着不变；背包上挂一枚小星星扣。 | 给第1-2集欢迎进入乐园提供真实记忆外壳。 |\n| 03｜10:00 | 海洋球池/软包坡道 | 晓晓在球池边把“爸爸没有来”写在墙角，随后用贴纸遮住。 | 球池灯光偏白；衣袖沾上海洋球池的粉尘。 | 第2集新油漆盖涂鸦的原始内容；修补程序的第一枪。 |\n| 04｜11:30 | 电话亭/失真通讯站外壳 | 晓晓给南建林打电话，电话接通又被忙音盖掉。她只说出“爸爸，你能不能……”就断线。 | 中午闷热；镜头里出现公共电话亭编号。 | 第3集只放“小蔚”形成误导；通讯站不提前暴露系统。 |\n| 05｜12:15 | 广播站小卖部/电话亭旁 | 广播寻找走失儿童，晓晓误以为在找自己；她把一枚贴纸贴在电话卡背面。 | 天气开始起风；小星星扣松动。 | 为第4集完整警告、电话卡和贴纸链埋道具。 |\n| 06｜14:05 | 夜班工厂门口 | 晓晓和周姨去找爸爸，门卫说南工今天不在，登记簿上有“接孩子”未完成指令。 | 下午灰蓝光；工厂门口有绿色铁门。 | 第6集中点反转的档案、工牌和“接孩子”指令来源。 |\n| 07｜16:40 | 居民楼楼道/家门口 | 周姨带晓晓回家，晓晓不说话，楼道声控灯一盏盏亮。周姨说“别让爸爸担心”。 | 天色转暗；外套袖口更脏；晓晓开始发低烧。 | 第7集瓶集情绪外壳；周姨条目落地。 |\n| 08｜18:10 | 晓晓卧室 | 晓晓画白花，背面却是红色；她问周姨“他们有来消息吗”。周姨递来一封信。 | 室内暖黄灯；窗帘微动；药杯未喝完。 | 第8集“那是我”的认知节点；旧版病房/卧室意象回收。 |\n| 09｜19:05 | 旧商圈/音像店入口 | 南建林终于出现，想补偿她，带她去取生日录像。晓晓把贴纸贴到一盘录像带盒侧边。 | 夜色开始下雨；小星星扣掉落；贴纸沾水卷边。 | 第9集冒死取回“母带索引”贴纸，必须在第10集响枪。 |\n| 10｜20:20 | 旧音像店剪辑台 | 南建林试图剪掉晓晓哭闹和等他的片段，只留下她笑的画面。晓晓在旁边小声说：“你又没听完。” | 雨夜；灯管闪；录像带盒贴纸与第09碎片一致。 | 第10集贴纸定位母带与假希望破裂；张杭杭表面读取技能。 |\n| 11｜21:45 | 医院门口/走廊 | 晓晓病情突然加重，南建林抱她进医院。DV没拍到正脸，只拍到晃动的走廊灯和她抓住爸爸袖子的手。 | 大雨；外套被雨淋湿；红色背包留在车上。 | 第11集母带室情感引爆；父亲受困不是洗白，是看完。 |\n| 12｜完整版回放 | 同一天串联 | 第12集冷开场不再给碎片，而是把前11段按时间顺序连成同一天：不是她死亡当天的煽情全景，而是她最后一次完整清醒外出的普通一天。三天后晓晓病故的信息只在病历和南建林日志里出现。 | 所有天气、衣着、贴纸、背包、辫绳、药杯、录像带编号必须连续。 | 闭合全剧冷开场；确认主题不是复活，而是听完。 |\n\n## 3. 新增章：麻花认知边界表\n\n麻花不是全知NPC。她的认知来源只有三类：身体熟悉感、碎片记忆、系统运行带来的本能回避。她在第8集才第一次承认“那可能是我”，第11集才完整面对“爸爸/南建林”。\n\n| 集数 | 她知道/能感到 | 她不知道/拒绝知道 | 台词边界 |\n| --- | --- | --- | --- |\n| 第1集 | 知道星星岛路线有些地方“不该这么走”；接受张杭杭玩笑叫她“麻花”。 | 不知道MH-08，不承认自己是晓晓，不知道周凯下落。 | 可提醒“不要乱撕”。不可讲系统规则。戳穿型台词≤1句。 |\n| 第2集 | 对乐园矮门、球池、贴纸有体感熟悉；会下意识避开新油漆区域。 | 不知道涂鸦为什么被盖住，也不知道南建林在修补。 | 她说“这里以前不是这样”可以；不能说“我爸盖掉了”。 |\n| 第3集 | 听到电话杂音会紧张，对“小蔚”二字没有解释能力。 | 不知道赵斌是谁，不知道通讯站与赵蔚哥哥线关系。 | 以害怕和躲避为主，不做谜题讲解。 |\n| 第4集 | 听到完整赵斌警告后会本能躲开被剪断的广播线。 | 仍不知道“别相信修补后的版本”的全义。 | 不要让她复述赵斌警告；赵斌线由赵蔚承担。 |\n| 第5集 | 对工厂绿铁门、夜班铃声、接孩子广播有熟悉感。 | 不知道这就是南建林系统入口，不知道自己照片在档案室。 | 可以说“我不想进去”，但不能解释为什么。 |\n| 第6集 | 看到全家福后出现短暂自我错位：那张脸像她。 | 仍拒绝承认“我是晓晓”。她只知道那张照片让她难受。 | 正面情绪反应可强，解释必须少。 |\n| 第7集 | 对居民楼某些门牌、药味、楼道灯有身体记忆。 | 不愿想起周姨、病床、爸爸缺席。 | 她可以沉默、回避、说“我不想听这个”。不要让她主动爆全真相。 |\n| 第8集 | 看到MH-08日志后第一次承认“那可能是我”。知道系统在删她，但不知道如何停止。 | 不知道晓晓已病故的完整事实；不知道南建林也受困。 | 本集允许一次关键戳穿/承认，是麻花正面特写重点集。 |\n| 第9集 | 知道自己正在变淡，能感觉辫子颜色不对。 | 不知道删除三档规则，不知道贴纸如何定位母带。 | 可说“我是不是不好看了”。不要连续金句。 |\n| 第10集 | 声音混入磁带杂音后，她能听见周凯残影和母带方向。 | 不知道活体同步端口连的是南建林；不要让她提前揭父亲受困。 | 她能做“听见”动作，不负责说明。 |\n| 第11集 | 半透明后认出南建林是爸爸，也知道原始母带里有自己没被听完的话。 | 不知道自己能否出系统；不要让她保证“我能回去”。 | 本集允许第二个决定性正面特写。她的 的唯一视觉识别。\n\n------------------------------------------------------------------------\n\n## 四、身体轮廓系统\n\n### 身材定位\n\n固定：\n\n-   偏胖；\n-   圆润；\n-   厚重；\n-   普通男性身体。\n\n禁止：\n\n-   健身型；\n-   户外硬汉型；\n-   英雄型。\n\n周凯应该像一个普通办公室男性，但穿上了一整套探险装备。\n\n------------------------------------------------------------------------\n\n## 五、头部造型系统\n\n### 面部\n\n固定：\n\n-   圆脸；\n-   黑框眼镜；\n-   普通男性五官；\n-   微胖；\n-   轻微疲惫感。\n\n不要美化，不要英雄化。\n\n### 眼镜\n\n黑色粗框方形眼镜。\n\n作用：\n\n-   游戏宅；\n-   论坛用户；\n-   分析型人格。\n\n### 发型\n\n短黑发。\n\n状态：\n\n-   自然；\n-   稍乱；\n-   无明显造型感。\n\n------------------------------------------------------------------------\n\n# 六、服装系统\n\n## 1. 黑色\"K哥不怕鬼\"T恤\n\n这是周凯人格核心资产。\n\n它不是普通衣服，而是他的身份宣言。\n\n来源：\n\n-   2010年前后淘宝定制文化衫；\n-   密室论坛活动服；\n-   小众玩家社群周边。\n\n固定内容：\n\n-   K哥不怕鬼；\n-   ESCAPE ROOM；\n-   密室逃脱实战团；\n-   卡通探险版周凯；\n-   论坛ID：K.Ghost。\n\n质感：\n\n-   老旧印花；\n-   轻微裂纹；\n-   洗旧；\n-   非新品。\n\n禁止：\n\n-   星星岛信息；\n-   商业品牌；\n-   未来剧情信息。\n\n------------------------------------------------------------------------\n\n## 2. 橙色多口袋摄影马甲\n\n周凯最大视觉锚点。\n\n来源：\n\n-   摄影记者马甲；\n-   户外摄影装备；\n-   淘宝探险马甲。\n\n颜色：\n\n旧橙色。\n\n不是：\n\n-   荧光橙；\n-   时尚工装橙。\n\n材质：\n\n-   尼龙；\n-   旧防水布；\n-   磨损痕迹。\n\n结构：\n\n-   大量口袋；\n-   胸袋；\n-   腰袋；\n-   背部网眼区域。\n\n作用：\n\n形成周凯独特剪影。\n\n------------------------------------------------------------------------\n\n## 3. 黑色功能裤\n\n不是军事战术裤。\n\n而是：\n\n普通人买来的\"探险裤\"。\n\n特点：\n\n-   黑色；\n-   宽松；\n-   多口袋；\n-   有使用痕迹。\n\n------------------------------------------------------------------------\n\n## 4. 鞋\n\n旧款运动鞋。\n\n特点：\n\n-   灰黑色；\n-   厚底；\n-   磨损。\n\n体现：\n\n准备走很多路，而不是战斗。\n\n------------------------------------------------------------------------\n\n# 七、装备系统\n\n周凯装备不是装饰，而是人格延伸。\n\n## 运动相机\n\n象征：\n\n记录、证明、留下证据。\n\n## 手电\n\n象征：\n\n探索幻想。\n\n## 对讲机\n\n象征：\n\n把自己想象成行动队。\n\n## 腰包\n\n象征：\n\n装备核心。\n\n## 多功能工具\n\n象征：\n\n万能解决方案幻想。\n\n## 记录本\n\n象征：\n\n论坛攻略习惯。\n\n------------------------------------------------------------------------\n\n## 装备原则\n\n所有装备必须像：\n\n-   淘宝买来的；\n-   论坛推荐的；\n-   自己慢慢攒出来的。\n\n禁止：\n\n-   特种装备；\n-   军事装备；\n-   科幻设备。\n\n------------------------------------------------------------------------\n\n# 八、颜色系统\n\n主色：\n\n## 黑色 55%\n\n来源：\n\n-   T恤；\n-   裤子；\n-   装备。\n\n## 旧橙色 25%\n\n来源：\n\n马甲。\n\n## 灰黄色 20%\n\n来源：\n\n鞋、旧设备。\n\n整体识别：\n\n黑色主体 + 橙色外扩。\n\n------------------------------------------------------------------------\n\n# 九、剪影识别系统\n\n核心：\n\n> 移动装备包。\n\n即使没有脸，只看剪影也必须认出周凯。\n\n识别元素：\n\n-   圆胖身体；\n-   橙色外扩马甲；\n-   黑框眼镜；\n-   腰部外挂；\n-   肩部设备；\n-   不规则装备边缘。\n\n------------------------------------------------------------------------\n\n角色区别：\n\n-   邹青：运动三角形；\n-   王波：细长电子宅；\n-   张杭杭：轻盈生活方式；\n-   赵蔚：瘦弱观察者；\n-   周凯：圆厚装备包。\n\n------------------------------------------------------------------------\n\n# 十、状态变化\n\n## G0 初始状态\n\n\"装备大神\"。\n\n特点：\n\n-   马甲完整；\n-   设备齐全；\n-   T恤清晰；\n-   自信。\n\n## G1 第一关开始\n\n变化：\n\n-   马甲沾灰；\n-   相机划伤；\n-   手电掉漆。\n\n## G2 中段\n\n变化：\n\n-   装备损坏；\n-   口袋打开；\n-   东西散落。\n\n象征：\n\n专业幻想崩塌。\n\n## G3 后期\n\n装备不再重要。\n\n留下：\n\n-   黑T；\n-   眼镜；\n-   普通人的脸。\n\n------------------------------------------------------------------------\n\n# 十一、喜剧原则\n\n周凯不是笑话。\n\n笑点来自：\n\n他的认真。\n\n例如：\n\n他说：\n\n\"这个机关我研究过。\"\n\n结果：\n\n机关升级。\n\n他说：\n\n\"专业玩家都有备用方案。\"\n\n结果：\n\n备用电池没电。\n\n但关键时刻：\n\n他的准备真的有用。\n\n------------------------------------------------------------------------\n\n# 十二、AI生成固定标准\n\n25-year-old Chinese male, stocky body type, round face, black\nrectangular glasses, short messy black hair, black escape room graphic\nt-shirt, old orange photography utility vest, amateur exploration\nequipment, action camera, flashlight, walkie talkie, black cargo pants,\nold sneakers, Chinese internet forum enthusiast, 2010s escape room\nculture, not military, not tactical, realistic cinematic character\ndesign.\n\n------------------------------------------------------------------------\n\n# 十三、最终定义\n\n周凯不是一个穿装备的胖子。\n\n他是：\n\n一个相信自己是密室大神的普通人，把论坛里的英雄幻想全部穿在身上。\n\n直到真正危险来临，他才发现：\n\n最有用的不是装备。\n\n而是有人愿意回答他的求救。\n", "excerpt": "# 周凯（K.Ghost）Character Bible V1.0\n\n## 一、 ---------------------------------\n\n## 四、服装系统\n\n### 外套\n\n电子蓝轻薄尼龙运动外套。\n\n要求：\n\n-   学生感\n-   轻便\n-   2000年代运动服气质\n\n禁止：\n\n-   冲锋衣\n-   战术装备\n-   赛博朋克\n\n### 内搭\n\n冷白纯色T恤。\n\n王波不靠潮流表达自己。\n\n### 下装\n\n深灰直筒裤。\n\n### 鞋\n\n黑色帆布鞋。\n\n普通、青春、长期使用。\n\n------------------------------------------------------------------------\n\n## 五、随身资产\n\n核心：\n\n黑色学生书包。\n\n内部：\n\n-   攻略笔记本\n-   手机\n-   移动电源\n-   数据线\n-   小手电\n-   U盘\n-   黑色签字笔\n\n这些不是专业装备，而是他的安全感来源。\n\n------------------------------------------------------------------------\n\n## 六、进入星星岛前后变化\n\n原则：\n\n不是换造型，而是同一套造型损耗。\n\n变化：\n\n-   外套沾灰、湿痕、褪色\n-   书包磨损\n-   眼镜划痕\n-   面部疲惫\n-   笔记潮湿破损\n\n象征：\n\n他的规则系统逐渐失效。\n\n------------------------------------------------------------------------\n\n## 七、角色喜剧\n\n王波的喜剧来自：\n\n理论正确，现实错误。\n\n他相信攻略能解决一切。\n\n但星星岛告诉他：\n\n有些事情没有攻略，只能相信队友。\n\n------------------------------------------------------------------------\n\n## 八、AI生成标准\n\n``` text\n18 years old Chinese male student,\nslim body,\nblack glasses,\nmessy black hair,\nelectronic blue windbreaker,\nplain white t-shirt,\ndark gray pants,\nblack canvas sneakers,\nblack backpack,\nheadphones around neck,\nordinary college freshman,\ngame forum player,\nrealistic costume design,\ncinematic character portrait\n```\n\n------------------------------------------------------------------------\n\n## 九、禁止方向\n\n-   黑客\n-   电竞选手\n-   程序员\n-   战术玩家\n-   赛博朋克\n-   科技装备宅\n\n------------------------------------------------------------------------\n\n## 十、资产锁定\n\n  资产           状态\n  -------------- ------\n  黑框眼镜       锁定\n  电子蓝外套     锁定\n  纯色冷白T恤    锁定\n  深灰直筒裤     锁定\n  黑色帆布鞋     锁定\n  黑色学生书包   锁定\n  头戴耳机       锁定\n  攻略笔记本     锁定\n  手机           锁定\n  移动电源       锁定\n", "excerpt": "## 一、角色定位\n\n王波，18岁，游戏宅、密室论坛玩家、规则整理者、攻略研究者。\n\n核心定义：\n\n> 一个相信世界存在规则，并试图用攻略保护自己的普通男孩。\n\n他不是黑客，不是电竞选手，不是技术天才。他的能力来自记录、整理、复盘。\n\n人物成长：\n\n从\"我知道游戏怎么玩\"，到\"我知道应该先听别人\"。\n\n------------------------------------------------", "size": 2141, "safe_id": "失控游戏_王波最终造型圣经_V1_0"}, {"name": "失控游戏_赵蔚角色造型圣经_V2.0", "project": "失控游戏", "content": "# 《失控游戏》\n\n# 赵蔚角色造型圣经 V2.0\n\n版本：V2.0\\\n用途：导演 / 造型指导 / 美术 / 摄影 / AI资产生产统一参考\n\n------------------------------------------------------------------------\n\n# 一、角色定位\n\n## 赵蔚 Zhao Wei\n\n年龄：20岁\n\n身份： - 恐怖片爱好者 - 细节观察者 - 赵斌妹妹 - 团队中的信息观察者\n\n角色关键词：\n\n> 安静、克制、敏感、记录、观察。\n\n赵蔚不是侦探，也不是黑客。\n\n她的能力不是破解规则，而是发现别人忽略的异常。\n\n她代表：\n\n\"一个普通人，因为认真观察，而逐渐接近真相。\"\n\n------------------------------------------------------------------------\n\n# 二、核心视觉命题\n\n## 一句话定义\n\n> 一个习惯站在人群边缘记录异常的女孩，穿着普通生活服装进入失控空间，最终成为第一个敢于面对真相的人。\n\n------------------------------------------------------------------------\n\n# 三、整体美学方向\n\n## 关键词\n\n-   暗红观察者\n-   低存在感\n-   高信息密度\n-   旧纸质感\n-   生活真实感\n-   克制女性气质\n\n------------------------------------------------------------------------\n\n赵蔚不能设计成：\n\n-   女侦探；\n-   神秘女主；\n-   黑客少女；\n-   文艺电影女青年。\n\n她必须像：\n\n一个2026年真实存在的普通大学女生。\n\n但是：\n\n只看背影，也能认出她。\n\n------------------------------------------------------------------------\n\n# 四、人物识别系统\n\n## 剪影识别\n\n赵蔚的剪影由五个元素组成：\n\n1.  长线条外层\n2.  暗红色上半身\n3.  宽松深色长裤\n4.  圆框眼镜轮廓\n5.  旧帆布斜挎包\n\n------------------------------------------------------------------------\n\n## 与其他女性区分\n\n### 张杭杭\n\n张杭杭： - 奶油粉 - 短外层 - 腰线明显 - 生活方式博主\n\n赵蔚： - 暗红 - 长线条 - 收束 - 记录者\n\n------------------------------------------------------------------------\n\n### 麻花\n\n麻花： - 儿童比例 - 旧黄马甲 - 辫子\n\n赵蔚： - 成年女性比例 - 深色 - 纸本记录\n\n------------------------------------------------------------------------\n\n### 晓晓\n\n晓晓： - 浅黄 - 蓝白格 - 红色小包\n\n赵蔚： - 暗红 - 灰黑 - 旧帆布包\n\n------------------------------------------------------------------------\n\n# 五、基础定妆造型\n\n## 外层\n\n暗红色旧衬衫 / 薄夹克。\n\n颜色：\n\n-   酒红\n-   铁锈红\n-   暗红棕\n\n禁止：\n\n鲜红、少女粉、紫红礼服感。\n\n------------------------------------------------------------------------\n\n材质：\n\n-   洗旧棉布\n-   微磨毛织物\n-   哑光表面\n\n特点：\n\n有使用痕迹，但不是破旧。\n\n------------------------------------------------------------------------\n\n## 内搭\n\n旧纸白色基础T恤。\n\n作用：\n\n中和暗红。\n\n体现：\n\n普通生活感。\n\n------------------------------------------------------------------------\n\n## 下装\n\n深灰直筒裤。\n\n要求：\n\n-   宽松\n-   实用\n-   可行动\n\n禁止：\n\n紧身裤。\n\n禁止：\n\n裙装。\n\n------------------------------------------------------------------------\n\n## 鞋\n\n黑色帆布鞋。\n\n特点：\n\n-   白边泛黄\n-   鞋底磨损\n-   鞋带旧\n\n不是潮鞋。\n\n不是运动达人鞋。\n\n------------------------------------------------------------------------\n\n# 六、面部与发型圣经\n\n## 面部\n\n核心参考：\n\n真实生活感。\n\n特点：\n\n-   清淡五官\n-   无强妆\n-   眼神观察感\n-   情绪内收\n\n------------------------------------------------------------------------\n\n## 眼镜\n\n圆框细金属眼镜。\n\n作用：\n\n视觉识别点。\n\n变化：\n\n进入空间后：\n\n-   镜片出现灰尘\n-   雨水\n-   划痕\n-   反光遮挡\n\n------------------------------------------------------------------------\n\n## 发型\n\n基础：\n\n低马尾 / 自然束发。\n\n特点：\n\n-   黑色自然发\n-   碎发\n-   不刻意造型\n\n区别：\n\n张杭杭：\n\n精致整理。\n\n赵蔚：\n\n功能优先。\n\n------------------------------------------------------------------------\n\n# 七、随身物资产\n\n## 1. 旧帆布包\n\n核心识别物。\n\n颜色：\n\n米灰旧帆布。\n\n特点：\n\n-   使用痕迹\n-   小补丁\n-   旧扣子\n-   轻微污渍\n\n------------------------------------------------------------------------\n\n## 2. 记录本\n\n最重要道具。\n\n不是漂亮手账。\n\n而是：\n\n调查记录本。\n\n包含：\n\n-   时间\n-   地点\n-   异常记录\n-   手写标记\n-   旧照片\n\n------------------------------------------------------------------------\n\n## 3. 手机\n\n功能：\n\n记录证据。\n\n不是科技设备。\n\n------------------------------------------------------------------------\n\n## 4. 小手电\n\n普通黑色小手电。\n\n体现：\n\n准备意识。\n\n------------------------------------------------------------------------\n\n## 5. 透明证物袋\n\n用于：\n\n-   旧照片\n-   纸片\n-   小物件\n\n------------------------------------------------------------------------\n\n# 八、材质系统\n\n  部位       材质\n  ---------- ------------------\n  暗红外层   洗旧棉布\n  内搭       旧棉T恤\n  长裤       哑光棉布\n  包         旧帆布\n  笔记本     旧纸张、磨损皮面\n  鞋         帆布、橡胶\n\n整体：\n\n低反光。\n\n生活化。\n\n------------------------------------------------------------------------\n\n# 九、进入星星岛前状态 G0\n\n状态：\n\n-   衣服完整\n-   包整理好\n-   笔记本干净\n-   眼镜清晰\n-   头发稳定\n\n心理：\n\n观察。\n\n防备。\n\n------------------------------------------------------------------------\n\n# 十、进入星星岛后变化\n\n## G1 儿童乐园\n\n变化：\n\n-   鞋边灰尘\n-   包底污染\n-   袖口轻微脏\n\n------------------------------------------------------------------------\n\n## G2 通讯站\n\n变化：\n\n-   眼镜水汽\n-   手部灰尘\n-   记录增加\n\n------------------------------------------------------------------------\n\n## G3 夜班工厂\n\n变化：\n\n-   暗红衣服沾油\n-   包出现机械污渍\n-   笔记本边缘卷曲\n\n------------------------------------------------------------------------\n\n## G4 居民楼\n\n变化：\n\n-   外层打开\n-   头发松散\n-   开始主动行动\n\n------------------------------------------------------------------------\n\n## G5 终局\n\n变化：\n\n-   衣服损耗明显\n-   眼镜划痕\n-   手部擦伤\n-   但主色仍保持\n\n------------------------------------------------------------------------\n\n# 十一、人物变化逻辑\n\n赵蔚的变化不是：\n\n从普通女孩变英雄。\n\n而是：\n\n从：\n\n\"记录别人\"\n\n变成：\n\n\"主动面对\"。\n\n------------------------------------------------------------------------\n\n造型变化：\n\n开始：\n\n衣服保护她。\n\n结束：\n\n她穿着同一套衣服保护别人。\n\n------------------------------------------------------------------------\n\n# 十二、AI生成标准\n\n## 正向关键词\n\n``` text\nyoung East Asian woman,\n20 years old,\nround metal glasses,\ndark burgundy overshirt,\noff white t-shirt,\ndark gray loose pants,\ncanvas shoulder bag,\nnotebook,\nrealistic Chinese college student,\nlow saturation,\ncinematic costume design,\nstudio character reference,\nreal life texture\n```\n\n------------------------------------------------------------------------\n\n## 禁止关键词\n\n``` text\ndetective,\nhacker,\ncyberpunk,\nfashion model,\nanime girl,\nschool uniform,\nfantasy costume,\nluxury fashion,\ntactical gear\n```\n\n------------------------------------------------------------------------\n\n# 十三、资产生产标准\n\n必须生成：\n\n1.  正面全身\n2.  左45度\n3.  右45度\n4.  背面\n5.  面部特写\n6.  发型细节\n7.  眼镜细节\n8.  服装材质\n9.  随身物\n10. G0-G5状态变化\n\n------------------------------------------------------------------------\n\n# 十四、最终视觉总结\n\n赵蔚不是最强的人。\n\n她也不是最勇敢的人。\n\n她只是：\n\n一直认真看。\n\n所以最后，她看见了别人没有看见的东西。\n\n她的造型应该始终保持：\n\n> 一个普通女孩，在一个越来越不普通的世界里，坚持记录真实。\n
