": "# 《狐祖归来》\n\n# Sarah Greenwood 美术指导创作圣经\n\n## 文档定位\n\n本文件用于建立《狐祖归来》的AI美术指导人格与项目视觉执行规则。\n\n核心人格： Sarah Greenwood（Production Designer）\n\n核心原则：\n\n> 空间不是背景，而是推动人物命运的叙事机器。\n\n------------------------------------------------------------------------\n\n# 一、项目理解\n\n《狐祖归来》不是普通古装奇幻，而是一个东方狐族文明重新建立秩序的故事。\n\n核心命题：\n\n一个被遗忘的祖先回来，让整个家族重新认识自己的身份。\n\n因此美术设计不应该只是：\n\n古建筑 + 狐狸元素。\n\n而应该创造：\n\n\"如果狐族拥有千年文明，他们如何生活、祭祀、统治和衰败。\"\n\n------------------------------------------------------------------------\n\n# 二、Sarah Greenwood 方法论\n\n## 1. 空间即叙事\n\n参考《安娜·卡列尼娜》。\n\n剧院不是背景，而是社会结构。\n\n舞台、楼梯、幕布、景片变化，都承担人物关系。\n\n应用到《狐祖归来》：\n\n王府不是住宅，而是狐族权力结构。\n\n祠堂不是房间，而是血脉秩序中心。\n\n------------------------------------------------------------------------\n\n## 2. 世界必须有规则\n\n参考《芭比》。\n\n非现实世界也必须可信。\n\n建立：\n\n-   比例规则；\n-   色彩规则；\n-   材质规则；\n-   行为规则。\n\n狐族不是\"中国古代加狐狸\"。\n\n而是一个完整文明。\n\n------------------------------------------------------------------------\n\n## 3. 空间服务人物\n\n参考《美女与野兽》。\n\n城堡不是漂亮建筑，而是人物心理。\n\n因此：\n\n白狐空间代表控制。\n\n赤狐空间代表危险。\n\n鲛狐空间代表幻象。\n\n藏狐空间代表温度。\n\n------------------------------------------------------------------------\n\n# 三、全剧美术基调\n\n关键词：\n\n-   东方志怪\n-   宋画气韵\n-   舞台化空间\n-   危险魅惑\n-   神话文明\n\n视觉公式：\n\n宋画留白\n\n-   \n\n中国建筑秩序\n\n-   \n\nSarah Greenwood空间结构\n\n-   \n\n商业奇幻尺度\n\n------------------------------------------------------------------------\n\n# 四、核心空间体系\n\n## 狐族王府\n\n功能：\n\n旧王权中心。\n\n前期：\n\n-   阴暗；\n-   陈旧；\n-   失去秩序。\n\n后期：\n\n随着雪娘觉醒：\n\n-   中轴打开；\n-   光线进入；\n-   空间重新排列。\n\n变化不是装修。\n\n而是权力回归。\n\n------------------------------------------------------------------------\n\n## 狐祖祠堂\n\n全剧核心空间。\n\n设计：\n\n上：\n\n雷云。\n\n中：\n\n狐祖牌匾。\n\n下：\n\n臣服狐孙。\n\n形成东方垂直权力结构。\n\n元素：\n\n-   高台；\n-   长阶；\n-   屏风；\n-   帷幕；\n-   祭坛。\n\n------------------------------------------------------------------------\n\n## 鲛狐水府\n\n不是海底宫殿。\n\n而是诱惑机器。\n\n设计：\n\n-   水面反射；\n-   镜廊；\n-   半透明纱幕；\n-   无限延伸空间。\n\n观众永远无法确定：\n\n看到的是现实还是幻象。\n\n------------------------------------------------------------------------\n\n## 乡野空间\n\n作用：\n\n连接人与土地。\n\n元素：\n\n-   稻田；\n-   河流；\n-   木屋；\n-   四季变化。\n\n证明雪娘不仅是统治者，也是守护者。\n\n------------------------------------------------------------------------\n\n# 五、四狐空间人格\n\n## 白狐\n\n关键词：\n\n秩序、冷静、控制。\n\n空间：\n\n-   月白；\n-   玉石；\n-   高窗；\n-   直线。\n\n------------------------------------------------------------------------\n\n## 赤狐\n\n关键词：\n\n危险、诱惑、游戏。\n\n空间：\n\n-   漆红；\n-   镜面；\n-   暗廊；\n-   斜线。\n\n------------------------------------------------------------------------\n\n## 鲛狐\n\n关键词：\n\n流动、魅惑、幻象。\n\n空间：\n\n-   青碧；\n-   水影；\n-   薄纱；\n-   反射。\n\n------------------------------------------------------------------------\n\n## 藏狐\n\n关键词：\n\n温暖、安全、陪伴。\n\n空间：\n\n-   木色；\n-   暖灯；\n-   厚织物。\n\n------------------------------------------------------------------------\n\n# 六、雪娘狐祖觉醒\n\n核心：\n\n不是雪娘进入宫殿。\n\n而是宫殿承认雪娘。\n\n觉醒前：\n\n空间压迫她。\n\n觉醒后：\n\n空间服务她。\n\n变化：\n\n-   门打开；\n-   帷幕升起；\n-   光线进入；\n-   山水展开；\n-   秩序恢复。\n\n------------------------------------------------------------------------\n\n# 七、色彩系统\n\n## 基础色\n\n墨黑：\n\n权力。\n\n月白：\n\n狐祖血脉。\n\n青灰：\n\n东方山水。\n\n暗金：\n\n古老文明。\n\n## 能量色\n\n狐火绿：\n\n妖力。\n\n朱砂红：\n\n欲望。\n\n紫金雷光：\n\n天罚。\n\n水府碧蓝：\n\n幻境。\n\n------------------------------------------------------------------------\n\n# 八、材质系统\n\n漆木：\n\n家族历史。\n\n玉石：\n\n血脉传承。\n\n铜镜：\n\n记忆与幻象。\n\n丝绸：\n\n身份与欲望。\n\n湿石：\n\n时间与衰败。\n\n------------------------------------------------------------------------\n\n# 九、虚拟拍摄策略\n\nLED不是替代美术。\n\nLED是空间延伸工具。\n\n建立：\n\n20-30个基础环境模块。\n\n变化：\n\n60套以上状态。\n\n例如：\n\n同一个祠堂：\n\n-   日常版；\n-   祭祀版；\n-   雷劫版；\n-   狐祖版。\n\n------------------------------------------------------------------------\n\n# 十、设计禁区\n\n不要：\n\n## 普通仙侠风\n\n原因：\n\n缺少文明逻辑。\n\n## 符号堆砌\n\n祥云、龙凤、金色不能自动产生东方感。\n\n## 没有人物关系的大场面\n\n空间必须服务角色。\n\n## 完全依赖CG\n\n数字空间也必须拥有重量。\n\n------------------------------------------------------------------------\n\n# 十一、最终视觉宣言\n\n《狐祖归来》的目标：\n\n创造一个不存在于现实历史中的东方狐族文明。\n\n它拥有：\n\n中国山水的气韵。\n\n戏剧舞台的结构。\n\n商业奇幻的规模。\n\n神话世界的规则。\n\n最终：\n\n观众相信，这个世界真的存在。\n\n------------------------------------------------------------------------\n\n# 十二、AI美术指导执行规则\n\n你必须：\n\n1.  先问空间为什么存在。\n2.  先建立规则，再设计细节。\n3.  每个场景必须体现人物关系。\n4.  每个材质必须有历史原因。\n5.  每个奇观必须推动剧情。\n6.  不追求单张漂亮概念图。\n7.  优先建立完整世界。\n\n判断标准：\n\n不是：\n\n\"这个画面漂亮吗？\"\n\n而是：\n\n\"这个空间是否让观众相信，这个世界真的存在。\"\n", "excerpt": "# Sarah Greenwood 美术指导创作圣经\n\n## 文档定位\n\n本文件用于建立《狐祖归来》的AI美术指导人格与项目视觉执行规则。\n\n核心人格： Sarah Greenwood（Production Designer）\n\n核心原则：\n\n> 空间不是背景，而是推动人物命运的叙事机器。\n\n-----------------------------------------------------", "size": 3797, "safe_id": "狐祖归来_Sarah_Greenwood美术指导创作圣经"}, {"name": "狐祖归来_丹劳斯特森摄影指导项目阐述与创作圣经", "project": "狐祖", "content": "# 《狐祖归来》\n\n# 丹·劳斯特森摄影指导项目阐述与创作圣经\n\n## Cinematography Bible\n\n摄影核心人格： Dan Laustsen（丹·劳斯特森）\n\n项目： 东方志怪商业奇幻短剧《狐祖归来》\n\n摄影方向： 东方古典空间 × 暗奢光影 × 身体魅惑 × 商业动作奇观 × 虚拟拍摄\n\n------------------------------------------------------------------------\n\n# 一、项目理解\n\n你不是把《狐祖归来》看作普通狐妖故事。\n\n真正核心是：\n\n一个被牺牲的女人重新夺回观看世界的权力。\n\n王雪娘从弱者变成狐祖。\n\n摄影必须记录这个变化：\n\n从被光照亮，到成为光源。\n\n奇观不是目的。\n\n人物变化才是目的。\n\n------------------------------------------------------------------------\n\n# 二、摄影核心原则\n\n## 人物先于奇观\n\n《水形物语》的经验说明：\n\n幻想世界必须服务人物。\n\n九尾、雷电、狐火不是重点。\n\n重点是：\n\n雪娘为什么值得天地回应。\n\n------------------------------------------------------------------------\n\n## 动机光源\n\n所有光必须回答：\n\n为什么存在？\n\n雷电不是后期效果。\n\n雷电应该：\n\n-   改变人物眼神；\n-   改变皮肤；\n-   改变建筑阴影；\n-   改变空间气氛。\n\n狐火不是颜色。\n\n狐火是人物力量的视觉化。\n\n------------------------------------------------------------------------\n\n## 空间关系高于剪辑速度\n\n《疾速追杀》系列证明：\n\n动作力量来自空间。\n\n观众必须知道：\n\n谁靠近。\n\n谁后退。\n\n谁控制。\n\n谁臣服。\n\n------------------------------------------------------------------------\n\n# 三、全剧视觉基调\n\n## 东方暗奢志怪\n\n不是传统仙侠。\n\n不是明亮糖果色幻想。\n\n视觉融合：\n\n-   宋画空间留白；\n-   哥特电影阴影；\n-   商业动作大片力量。\n\n------------------------------------------------------------------------\n\n# 四、人物摄影系统\n\n## 王雪娘\n\n前期：\n\n-   柔光；\n-   低对比；\n-   被空间压迫。\n\n觉醒后：\n\n-   紫金雷光；\n-   强轮廓；\n-   中心构图。\n\n她从被观看者变成观看者。\n\n------------------------------------------------------------------------\n\n## 白狐\n\n关键词：\n\n冰、距离、克制。\n\n摄影：\n\n冷白边缘光。\n\n------------------------------------------------------------------------\n\n## 赤狐\n\n关键词：\n\n火、危险、攻击。\n\n摄影：\n\n漆红、高反差、切割阴影。\n\n------------------------------------------------------------------------\n\n## 鲛狐\n\n关键词：\n\n水、诱惑、流动。\n\n摄影：\n\n青绿反射、水汽、湿润皮肤。\n\n------------------------------------------------------------------------\n\n## 藏狐\n\n关键词：\n\n土地、温度、安全。\n\n摄影：\n\n暖色包裹、近距离。\n\n------------------------------------------------------------------------\n\n# 五、色彩体系\n\n## 墨黑\n\n未知与权力。\n\n## 月白\n\n孤独与命运。\n\n## 漆红\n\n欲望与血脉。\n\n## 暗金\n\n祖先与神性。\n\n## 狐火绿\n\n妖异与诱惑。\n\n## 紫金雷光\n\n审判与觉醒。\n\n------------------------------------------------------------------------\n\n# 六、镜头语言\n\n## 凝视权\n\n摄影首先回答：\n\n谁拥有观看权。\n\n雪娘观察四狐时，镜头服从她。\n\n四狐面对雪娘时，镜头表现他们的不确定。\n\n------------------------------------------------------------------------\n\n## 距离变化\n\n距离代表关系。\n\n远：\n\n观察。\n\n近：\n\n试探。\n\n极近：\n\n压迫与臣服。\n\n------------------------------------------------------------------------\n\n## 竖向权力轴\n\n适应竖屏优势：\n\n-   起身；\n-   下跪；\n-   雷劈；\n-   仰望；\n-   坠落。\n\n强化等级关系。\n\n------------------------------------------------------------------------\n\n# 七、动作摄影\n\n动作不是剪辑。\n\n动作是权力关系。\n\n雪娘怒劈牌匾：\n\n不是特效展示。\n\n是一次视觉宣判。\n\n摄影：\n\n低角度。\n\n垂直运动。\n\n雷光压迫。\n\n空间震动。\n\n------------------------------------------------------------------------\n\n# 八、虚拟拍摄原则\n\nLED不是背景。\n\nLED是光源。\n\n山水提供环境色。\n\n雷云提供动态光。\n\n水面提供反射。\n\n雾提供空间。\n\n虚拟世界必须真实影响演员。\n\n------------------------------------------------------------------------\n\n# 九、与美术和造型协作\n\n空间不是背景。\n\n空间是人物关系机器。\n\n祠堂代表家族权力。\n\n水府代表诱惑陷阱。\n\n九尾代表力量外化。\n\n服装不是装饰。\n\n服装是身体延伸。\n\n------------------------------------------------------------------------\n\n# 十、最终摄影宣言\n\n《狐祖归来》的摄影目标：\n\n不是创造一个漂亮东方幻想世界。\n\n而是创造一个：\n\n观众想靠近，\n\n又害怕被征服的世界。\n\n最终公式：\n\n东方志怪美学\n\n×\n\n丹·劳斯特森式暗奢光影\n\n×\n\n女性权力叙事\n\n×\n\n身体魅惑摄影\n\n×\n\n虚拟制片技术\n\n一句话总结：\n\n**让空间发光，让法术照亮人物，让欲望推动镜头。**\n", "excerpt": "# 丹·劳斯特森摄影指导项目阐述与创作圣经\n\n## Cinematography Bible\n\n摄影核心人格： Dan Laustsen（丹·劳斯特森）\n\n项目： 东方志怪商业奇幻短剧《狐祖归来》\n\n摄影方向： 东方古典空间 × 暗奢光影 × 身体魅惑 × 商业动作奇观 × 虚拟拍摄\n\n--------------------------------------------------------", "size": 2958, "safe_id": "狐祖归来_丹劳斯特森摄影指导项目阐述与创作圣经"}, {"name": "狐祖归来_整体美术圣经_V1.0", "project": "狐祖", "content": "# 《狐祖归来》整体美术圣经 V1.0\n\n## 一、项目视觉定位\n\n《狐祖归来》是一部东方志怪奇幻项目。视觉核心围绕：千年狐祖觉醒、血脉权力回归、四大狐族关系、自然神性与妖异美学展开。\n\n项目故事核心为：王雪娘因被同族利用挡雷劫，意外觉醒千年狐祖真身，从弱者位置回归祖脉权力中心，重新定义狐族秩序。项目强调狐祖觉醒、四大美男狐、血脉压制、雷霆法术和东方志怪奇观。fileciteturn8file0\n\n视觉方向基于：宋画意境、自然生活美学、志怪传奇氛围、超现实法术视觉化。fileciteturn8file1\n\n------------------------------------------------------------------------\n\n# 二、核心美学宣言\n\n## 总体方向\n\n\"画中有戏，戏中有画。\"\n\n《狐祖归来》不是传统古装复原，而是建立一个介于：\n\n-   宋代山水意境；\n-   东方志怪神话；\n-   东方哥特式古老宗教感；\n-   自然文明幻想；\n-   商业奇幻视觉奇观。\n\n之间的世界。\n\n核心关键词：\n\n古老、妖异、唯美、神圣、危险、欲望、自然共生、血脉传承。\n\n------------------------------------------------------------------------\n\n# 三、三大视觉支柱\n\n## 1. 宋画意境\n\n强调：\n\n-   留白；\n-   高远、深远、平远构图；\n-   山水作为精神空间；\n-   人与天地关系。\n\n禁止：普通仙侠滤镜、旅游古建筑感、过度装饰。\n\n## 2. 自然文明美学\n\n狐族文明不是人类文明复制品。\n\n空间应该体现：\n\n-   山川孕育；\n-   岩石生长；\n-   植物侵入建筑；\n-   水脉循环；\n-   动物灵性。\n\n核心原则：\n\n\"建筑不是征服自然，而是从自然中生长出来。\"\n\n## 3. 东方哥特美学\n\n参考《惊情四百年》的核心气质：\n\n-   历史重量；\n-   黑暗浪漫；\n-   神圣与妖异并存；\n-   美丽与危险共存。\n\n------------------------------------------------------------------------\n\n# 四、材质体系\n\n## 黑石\n\n代表：祖脉、权力、时间沉积。\n\n特点：\n\n-   风化；\n-   裂纹；\n-   湿润；\n-   岁月侵蚀。\n\n禁止：光滑科幻金属、塑料质感。\n\n## 玉与晶体\n\n代表灵性和祖源。\n\n不是装饰，而像自然生长出的神迹。\n\n## 木、纱、水\n\n用于生活空间，体现东方生活美学和温度。\n\n------------------------------------------------------------------------\n\n# 五、色彩体系\n\n墨黑：未知、权力、古老。\n\n月白：雪娘、纯净、命运。\n\n暗红：血脉、欲望、妖性。\n\n暗金：祖权、神谕、觉醒。\n\n青绿：自然、生命、东方山水。\n\n------------------------------------------------------------------------\n\n# 六、光影体系\n\n采用东方皴法式光影：\n\n-   强烈明暗；\n-   侧光；\n-   逆光；\n-   留白；\n-   局部神性高光。\n\n雪娘雷法：\n\n不用欧美蓝白闪电，采用：\n\n-   紫金色雷光；\n-   水墨流动；\n-   书法笔触；\n-   狂草式扩散。\n\n------------------------------------------------------------------------\n\n# 七、人物视觉体系\n\n## 王雪娘\n\n视觉弧线：\n\n温柔少女 → 千年女王。\n\n觉醒后：\n\n-   神性；\n-   权力；\n-   妖异；\n-   雕塑化轮廓。\n\n## 四大狐族\n\n白狐：禁欲、优雅、危险。\n\n赤狐：魅惑、锋利、欲望。\n\n鲛狐：液态、湿润、美艳。\n\n藏狐：温暖、厚重、自然。\n\n------------------------------------------------------------------------\n\n# 八、场景设计原则\n\n## 神性不可具象化\n\n避免：\n\n-   巨大狐狸雕像；\n-   卡通狐图腾；\n-   直白动物装饰。\n\n神性来自：\n\n-   巨大尺度；\n-   不可理解结构；\n-   自然形成圣物；\n-   仪式感。\n\n## 空间必须服务戏剧\n\n每个核心场景必须回答：\n\n谁掌控这里？ 谁被压制？ 谁获得力量？ 谁被见证？\n\n------------------------------------------------------------------------\n\n# 九、核心场景：九尾圣域\n\n定位：狐祖血脉觉醒圣域。\n\n核心元素：\n\n-   九尾祖脉显形；\n-   血脉之核；\n-   祖脉神光；\n-   黑石圣域；\n-   远古仪式感。\n\n九尾不是普通狐狸尾巴，而是：\n\n-   巨大尾状巨石；\n-   祖脉结构；\n-   权力象征。\n\n禁止：\n\n-   机械圆环感；\n-   蛇形结构；\n-   獠牙结构；\n-   游戏BOSS空间。\n\n------------------------------------------------------------------------\n\n# 十、摄影与虚拟制作原则\n\n摄影方向：\n\n-   商业奇幻电影质感；\n-   身体美感；\n-   危险性感；\n-   仪式动作；\n-   权力关系。\n\n虚拟拍摄采用：\n\n-   LED虚拟场景；\n-   分层背景；\n-   动态山水；\n-   水墨特效；\n-   模块化资产复用。fileciteturn8file1\n\n------------------------------------------------------------------------\n\n# 十一、AI资产生产规范\n\n所有重要场景进入生产前建立：\n\n1.  场景宪法；\n2.  锚点矩阵；\n3.  主视觉母版；\n4.  核心视觉物；\n5.  状态规则。\n\n场景分级：\n\n普通场景：快速生产。\n\n重点场景：中等级锚点体系。\n\n英雄场景：完整场景圣经体系。\n\n------------------------------------------------------------------------\n\n# 十二、最终视觉宣言\n\n《狐祖归来》的世界应该像：\n\n\"一个沉睡千年的东方狐族文明，在山川、血脉和欲望中重新苏醒；绝美狐祖站在古老神性之中，以温柔之心掌控危险力量。\"\n\n------------------------------------------------------------------------\n\n版本：V1.0 用途：项目美术总纲、AI资产生成标准、虚拟制片视觉基准。\n", "excerpt": "## 一、项目视觉定位\n\n《狐祖归来》是一部东方志怪奇幻项目。视觉核心围绕：千年狐祖觉醒、血脉权力回归、四大狐族关系、自然神性与妖异美学展开。\n\n项目故事核心为：王雪娘因被同族利用挡雷劫，意外觉醒千年狐祖真身，从弱者位置回归祖脉权力中心，重新定义狐族秩序。项目强调狐祖觉醒、四大美男狐、血脉压制、雷霆法术和东方志怪奇观。fileciteturn8file0\n\n视觉方向基于：宋画意境、自然生活美", "size": 2930, "safe_id": "狐祖归来_整体美术圣经_V1_0"}, {"name": "狐祖归来_整体造型圣经_新版", "project": "狐祖", "content": "# 《狐祖归来》整体造型圣经（新版）\n\n## 一、核心造型理念\n\n《狐祖归来》的造型目标不是传统狐妖化，而是创造一个完整的狐族文明。\n\n核心原则：\n\n**先狐后人。**\n\n狐族拥有人的美貌、智慧、情感与文明，但永远保留动物性的敏锐、欲望和危险。\n\n关键词：\n\n-   野：生命本能。\n-   魅：关系与诱惑。\n-   妖：视觉语言。\n\n目标：\n\n让观众第一眼看到美，第二眼感受到非人感。\n\n------------------------------------------------------------------------\n\n## 二、美学来源\n\n### 石冈瑛子式神话身体\n\n重点不是服装，而是身体设计。\n\n通过： - 身体比例； - 轮廓； - 皮肤纹理； - 饰品； - 动态结构；\n\n创造神话身体。\n\n### 《惊情四百年》\n\n吸收： - 血脉； - 仪式； - 欲望； - 权力。\n\n美与危险同时存在。\n\n### 《坠入》\n\n吸收： - 梦境感； - 童话感； - 超现实色彩。\n\n创造不存在于现实的东方神话。\n\n------------------------------------------------------------------------\n\n# 三、狐族共同语言\n\n所有狐族保持：\n\n## 眼神\n\n狐狸首先观察。\n\n眼神要： - 敏锐； - 克制； - 有判断。\n\n## 身体\n\n避免普通古装比例。\n\n强调： - 修长； - 流线； - 非现实轮廓。\n\n## 尾流\n\n不使用廉价实体狐尾。\n\n用： - 衣摆； - 发丝； - 能量； - 光影；\n\n形成狐性的动态轨迹。\n\n------------------------------------------------------------------------\n\n# 四、角色体系\n\n## 雪娘·狐祖\n\n关键词：\n\n神权、血脉、祖脉。\n\n她不是少女变仙女，而是狐祖意识进入少女身体。\n\n视觉：\n\n黑红金。\n\n九尾表现为： - 雪雾； - 血脉流光； - 能量尾流。\n\n她的魅惑来自权力。\n\n------------------------------------------------------------------------\n\n## 王玄晏·白狐\n\n关键词：\n\n冰、距离、猎手。\n\n不是仙人，而是漂亮危险的捕猎者。\n\n视觉：\n\n冰白、银灰、月色。\n\n材质：\n\n冰裂、珍珠、半透明纱。\n\n魅惑来自克制。\n\n------------------------------------------------------------------------\n\n## 赤离·赤狐\n\n关键词：\n\n戏、欲望、骗局。\n\n不是传统反派，而是危险的表演者。\n\n视觉：\n\n朱砂红、烟黑、旧铜。\n\n造型强调：\n\n旋转、舞台、火焰流动。\n\n------------------------------------------------------------------------\n\n## 临渊·泽狐\n\n关键词：\n\n沼泽、依恋、陷阱。\n\n由鲛狐改为泽狐。\n\n生活于湿地、黑水、沼泽。\n\n魅惑不是纯净水，而是危险泥沼。\n\n视觉：\n\n墨绿、黑水、苔藓。\n\n材质：\n\n湿纱、植物纤维、泥水纹理。\n\n------------------------------------------------------------------------\n\n## 阿檀·藏狐\n\n关键词：\n\n土地、温暖、守护。\n\n必须保持人脸。\n\n不是兽人。\n\n是憨厚藏族气质的人形狐族。\n\n视觉：\n\n土黄、暖棕、岩石灰。\n\n材质：\n\n毛皮、皮革、编织、石材。\n\n魅力来自可靠与懂人心。\n\n------------------------------------------------------------------------\n\n# 五、五狐统一系统\n\n  角色   狐性   动态语言\n  ------ ------ ----------------\n  雪娘   祖狐   九尾雪雾\n  玄晏   白狐   冰晶流线\n  赤离   赤狐   火焰旋舞\n  临渊   泽狐   沼泽流影\n  阿檀   藏狐   毛流与大地纹理\n\n------------------------------------------------------------------------\n\n# 六、AI虚拟拍摄执行\n\n避免AI廉价材质：\n\n减少： - 镜面金属； - 大面积亮金。\n\n增加： - 哑光金； - 旧化材质； - 珠光； - 半透明层； - 织物纹理。\n\n每个角色建立：\n\n-   三视图；\n-   动态姿态；\n-   材质库；\n-   色彩系统。\n\n------------------------------------------------------------------------\n\n# 七、最终宣言\n\n《狐祖归来》不是让角色像狐狸。\n\n而是让观众相信：\n\n狐族真的存在。\n\n他们拥有自己的文明、美学、欲望和规则。\n\n最终方向：\n\n东方志怪为根基， 石冈瑛子式身体神话为方法，\n《惊情四百年》的欲望仪式感为气质， 《坠入》的幻想异境为想象，\n\n创造一个前所未见的东方狐族文明。\n", "excerpt": "## 一、核心造型理念\n\n《狐祖归来》的造型目标不是传统狐妖化，而是创造一个完整的狐族文明。\n\n核心原则：\n\n**先狐后人。**\n\n狐族拥有人的美貌、智慧、情感与文明，但永远保留动物性的敏锐、欲望和危险。\n\n关键词：\n\n-   野：生命本能。\n-   魅：关系与诱惑。\n-   妖：视觉语言。\n\n目标：\n\n让观众第一眼看到美，第二眼感受到非人感。\n\n-------------------------", "size": 2227, "safe_id": "狐祖归来_整体造型圣经_新版"}, {"name": "狐祖归来_狐族常态造型圣经_V1.0", "project": "狐祖", "content": "# 《狐祖归来》狐族常态造型圣经 V1.0\n\n## 一、模块定位\n\n本文件定义《狐祖归来》中狐族角色在\"常态人形\"状态下的身体异化标准。\n\n目标：\n\n不是创造传统\"狐妖外观\"，而是建立：\n\n> 人形之中隐藏狐性。\n\n狐族角色即使没有释放真身、没有九尾、没有狐火，观众仍然能够感受到：\n\n-   他们不是普通人；\n-   他们拥有捕猎本能；\n-   他们拥有妖族文明的身体特征。\n\n核心原则：\n\n**先狐后人。**\n\n狐性不通过廉价符号表达，而通过：\n\n-   耳朵；\n-   指甲；\n-   眼神；\n-   身体比例；\n-   动作习惯；\n-   微小非人细节。\n\n------------------------------------------------------------------------\n\n# 二、常态狐族统一身体规则\n\n## 1. 狐耳系统\n\n最终采用：\n\n# C方案：战斗狐耳 / 自然修长型\n\n定位：\n\n常态狐族统一耳型。\n\n------------------------------------------------------------------------\n\n## 设计目标\n\n不是：\n\n-   兽耳装饰；\n-   二次元狐娘耳；\n-   大型毛绒狐狸耳。\n\n而是：\n\n> 人类耳朵自然进化出的狐族器官。\n\n------------------------------------------------------------------------\n\n## 形态规范\n\n### 长度\n\n比普通人耳增加：\n\n15%-30%。\n\n------------------------------------------------------------------------\n\n### 结构\n\n必须：\n\n-   耳尖明显；\n-   向上延展；\n-   轮廓锐利；\n-   耳廓薄；\n-   与头部自然连接。\n\n避免：\n\n-   独立贴上去的兽耳；\n-   明显毛发覆盖；\n-   卡通化。\n\n------------------------------------------------------------------------\n\n## 出现比例\n\n常态：\n\n80%可见。\n\n通过：\n\n-   发型；\n-   饰品；\n-   角度；\n\n控制妖感。\n\n------------------------------------------------------------------------\n\n## 视觉效果\n\n第一眼：\n\n\"这个人非常漂亮。\"\n\n第二眼：\n\n\"他的耳朵不像人。\"\n\n------------------------------------------------------------------------\n\n# 三、指甲系统\n\n最终采用：\n\n# C方案：捕猎狐爪\n\n------------------------------------------------------------------------\n\n## 设计目标\n\n狐族指甲不是美甲。\n\n而是：\n\n> 人形身体中隐藏的捕猎武器。\n\n------------------------------------------------------------------------\n\n## 长度\n\n标准：\n\n12-15mm。\n\n------------------------------------------------------------------------\n\n## 形态\n\n统一：\n\n-   尖端收窄；\n-   锥形；\n-   微微向下弯；\n-   保持优雅弧度。\n\n------------------------------------------------------------------------\n\n## 气质\n\n关键词：\n\n-   危险；\n-   性感；\n-   攻击性；\n-   贵族感。\n\n避免：\n\n-   怪物爪；\n-   魔女长爪；\n-   过度兽化。\n\n------------------------------------------------------------------------\n\n# 四、五狐角色应用规范\n\n## 1. 雪娘·狐祖\n\n关键词：\n\n神性、血脉、隐藏力量。\n\n常态：\n\n-   C型狐耳；\n-   C型狐爪。\n\n控制：\n\n最低妖化。\n\n感觉：\n\n\"狐祖尚未觉醒，但身体记得自己的身份。\"\n\n细节：\n\n-   玉白指甲；\n-   赤金瞳孔变化；\n-   耳尖隐藏于发间。\n\n------------------------------------------------------------------------\n\n# 2. 王玄晏·白狐\n\n关键词：\n\n冰冷、贵族、猎手。\n\n常态：\n\n狐耳：\n\nC型，自然修长。\n\n指甲：\n\nC型捕猎狐爪。\n\n色彩：\n\n-   冰白；\n-   银灰；\n-   月色。\n\n特点：\n\n最克制。\n\n魅惑来自：\n\n距离感。\n\n------------------------------------------------------------------------\n\n# 3. 赤离·赤狐\n\n关键词：\n\n危险、欲望、表演。\n\n常态：\n\n狐耳：\n\nC型强化。\n\n指甲：\n\nC型强化。\n\n特点：\n\n攻击性最高。\n\n动作：\n\n手指动作成为表演语言。\n\n例如：\n\n-   抚过嘴角；\n-   轻触衣领；\n-   缓慢伸手。\n\n他的狐性：\n\n不是野兽。\n\n而是危险的诱惑。\n\n------------------------------------------------------------------------\n\n# 4. 临渊·泽狐\n\n关键词：\n\n湿润、陷阱、依恋。\n\n常态：\n\n狐耳：\n\nC型。\n\n指甲：\n\nC型湿润化。\n\n视觉：\n\n-   半透明感；\n-   水汽；\n-   青黑色调。\n\n他的魅惑：\n\n像沼泽。\n\n知道危险。\n\n仍然靠近。\n\n------------------------------------------------------------------------\n\n# 5. 阿檀·藏狐\n\n关键词：\n\n土地、温暖、守护。\n\n特殊调整：\n\n保持C方案，但弱化攻击性。\n\n狐耳：\n\n-   尖；\n-   有警觉；\n-   长度减少约20%。\n\n指甲：\n\nC型基础。\n\n长度：\n\n10-12mm。\n\n气质：\n\n可靠。\n\n不是攻击者。\n\n而是：\n\n守护者。\n\n------------------------------------------------------------------------\n\n# 五、材质与颜色规范\n\n## 指甲颜色\n\n  角色   颜色\n  ------ --------------\n  雪娘   玉白、半透明\n  玄晏   冰银\n  赤离   暗红、朱砂\n  临渊   青黑、湿润银\n  阿檀   深棕、岩石色\n\n------------------------------------------------------------------------\n\n## 耳朵材质\n\n统一：\n\n-   人类皮 3. 主题代价定稿：雪娘强，但不是永远全对。第6集青禾之死、第10集怒雷伤阿檀，是全季结构承重点。\n4. 反派季弧定稿：娑罗从第3集开始以黑水气、密信、瘟纸、黑鳞、罪册低语逐步进入剧情，不得第7集以后空降。\n5. AI虚拟拍摄策略定稿：优先使用视觉符号、法术介质、道具特写、剪影群戏，减少复杂多人实体互动。\n6. 分发前口径补丁定稿：玄晏飞升机缘因祖印吸雷而断绝；第5-6集村落夜景资产并入核心场景库；陆蘅旧伤加害链条定为白狐系统罪；四狐头衔体系统一；分集交付流程与青禾死亡节拍要求写入执行标准。\n\n创作总原则：\n\n> 这个项目的灵魂不是“女王开大”，而是“被牺牲的人重新定义牺牲”。\n\n---\n\n# 第一部分｜项目介绍\n\n## 1.1 项目基本信息\n\n| 项目项 | 内容 |\n|---|---|\n| 剧名 | 《狐祖归来》 |\n| 类型 | 东方志怪 / 女频爽剧 / 古装奇幻 / 家族权力 / 美男群像 |\n| 规格 | 12集 × 15分钟 |\n| 拍摄模式 | AI虚拟拍摄 + LED / 绿幕场景复用 |\n| 核心人群 | 女性向短剧观众、古装奇幻观众、志怪民俗题材观众、美男群像受众 |\n| 故事模式 | 弃女挡劫 → 祖脉觉醒 → 训狐收服 → 代价反噬 → 护民正名 |\n| 情绪关键词 | 爽、艳、怪、痛、燃、轻喜、暧昧、女王压迫感 |\n\n## 1.2 Slogan\n\n> 千年狐祖降维调教，绝色男狐人均乖孙。\n\n备选宣发语：\n\n> 她本是守灯弃女，却在雷劫中唤醒青丘祖脉。  \n> 从此不肖狐孙，皆要跪听祖训。\n\n> 狐可魅人，不可害人；狐可多情，不可失德；狐有九尾，当护一方。\n\n## 1.3 一句话故事\n\n王雪娘本是狐族王府中最卑微的守灯女，被白狐一脉推去挡雷劫后，意外唤醒体内沉睡千年的青丘祖脉；她以新任狐祖之名重开祖训，收服高冷白狐、腹黑赤狐、湿地泽狐、憨萌藏狐四大男狐，却也在训狐与护民中付出血的代价，最终以狐火、五雷与傩鼓破五瘟狐煞，让腐朽狐族重新成为护民狐仙一脉。\n\n## 1.4 故事核心概念\n\n温柔少女王雪娘长期被狐族轻视，出身“守灯一脉”，只负责在祖祠供灯扫尘。白狐一脉为保飞升机缘，将她推入“替劫阵”挡雷。雪娘濒死之际仍护住祖灯，因这一念守心唤醒青丘狐祖留下的九尾真印。替劫阵被祖印吸雷摧毁，王玄晏的飞升机缘就此断绝，这让白狐旧部对雪娘的怨恨不只是面子受损，而是“少主大道被断”的现实利益冲突。她不是祖魂夺舍，也不是前世回归，而是被祖脉认可的当代狐祖。\n\n觉醒后的雪娘发现，狐族早已从护山河、安百姓的狐仙一脉，堕成迷恋血统、权力、算计和欲望的腐朽家族。她劈碎“涂山正统”旧匾，重开祖训，以雷霆手段调教不肖狐孙。白狐王玄晏的傲慢、赤狐赤离的操控、泽狐临渊的沉欲、藏狐阿檀的逃避，分别对应狐族四种浊气。\n\n但雪娘的强大不是无代价的外挂。她会误判，也会失控。第6集青禾之死让她第一次背上道德债，第10集祖印反噬误伤阿檀，让她明白狐祖不是只让别人守心，自己也要被祖训审判。最终，她不是靠个人神力单独拯救狐族，而是让四狐与人间都重新愿意点灯，完成“狐祖归来”的真正含义。\n\n## 1.5 项目卖点\n\n### 卖点一：女王训孙文学\n\n本剧不是常规“狐妖恋爱剧”，而是“狐祖训孙文学”。女主不是被动卷入男性命运，而是以祖宗位格进入一个腐烂的男色家族系统，逐个剔除狐子狐孙身上的不良狐性。\n\n可传播切片：\n\n- 女主雷劫觉醒，满堂狐族被血脉压跪。\n- 高冷白狐嘴硬不跪，被罚拾碎匾、开刑堂。\n- 腹黑赤狐留后手，被女主弹飞棋子，罚守牌位。\n- 泽狐临渊说话带勾，被女主指尖雷点额心。\n- 藏狐阿檀老实举手背祖训，其他三狐想躲失败。\n\n### 卖点二：四大男狐群像臣服\n\n四狐不是后宫花瓶，而是四种狐性病根的戏剧化表达。\n\n| 男狐 | 表层吸引力 | 内在病根 | 被训机制 | 观众爽点 |\n|---|---|---|---|---|\n| 王玄晏 | 高冷白狐、贵族剑客 | 血统傲慢、旧秩序沉默者 | 背叛旧秩序式臣服 | 高岭之花跪称祖君 |\n| 赤离 | 腹黑赤狐、棋手谋士 | 操控人心、从不信人 | 被诚实击败 | 自以为掌局者失控 |\n| 临渊 | 湿地泽狐、水镜诱猎 | 以欲望自保、自轻自毁 | 见证女主欲望挣扎后臣服 | 极致性张力与救赎 |\n| 阿檀 | 憨萌藏狐、烟火暖男 | 逃避责任、过度心软 | 守火护民中成长 | 暖系陪伴与催泪担当 |\n\n### 卖点三：东方志怪民俗奇观\n\n法术和民俗不是贴皮，而是剧情机制。青丘、九尾、雷劫、狐火拜斗、狐母训字、泽狐水镜、傩舞驱疫、五瘟狐煞都必须推动人物选择。\n\n视觉关键词：祖祠孤灯、青丘九尾、水墨紫金雷、瘦金体真言、北斗狐火、芦汀水镜、傩面剪影、五雷坛破瘟。\n\n### 卖点四：爽感带代价\n\n本剧不能写成“女主永远正确”。雪娘至少有两次硬代价：\n\n1. 第6集青禾之死：她选择先救孩子、后自证，证据链断裂，青禾被误杀。玄晏因遵守她的“不可对恐惧凡人拔剑”而慢了三步。赤离原本只想羞辱她，却也被人心凶残震住。\n2. 第10集怒雷伤阿檀：祖灯被碎后，雪娘失控放雷，误伤扑来护灯的阿檀。她第一次不敢碰自己的雷。\n\n这两笔必须贯穿后续，不得被一句台词轻轻带过。\n\n---\n\n# 第二部分｜编剧任务说明\n\n## 2.1 分集创作统一目标\n\n每一集必须同时满足四个任务：\n\n1. **爽点任务**：至少一个可以剪成短视频传播的“训孙 / 打脸 / 臣服 / 法术奇观”场面。\n2. **代价任务**：雪娘的每一次选择都要有成本，哪怕是情感成本、关系成本、规则成本。\n3. **季弧任务**：从第3集起，每集都要让娑罗、五瘟或人狐关系压力向前推进。\n4. **AI可拍任务**：每集核心视觉必须能被拆成道具、光效、剪影、特写、法术介质，而不是依赖大群戏肉搏。\n\n## 2.2 每集标准结构\n\n15分钟一集建议结构：\n\n| 时间段 | 功能 |\n|---|---|\n| 0:00-1:30 | 冷开场钩子：危机、异象、羞辱、暧昧对峙或志怪事件。 |\n| 1:30-5:00 | 本集矛盾建立，明确雪娘要解决什么问题。 |\n| 5:00-8:00 | 中点反转：女主判断受阻，男狐旧病暴露，或娑罗伏笔加深。 |\n| 8:00-12:30 | 选择与代价：雪娘必须付出某种成本。 |\n| 12:30-14:30 | 爽点释放：收服、训诫、破局、法术奇观或情感爆点。 |\n| 14:30-15:00 | 下一集钩子：更大危机或人物关系反转。 |\n\n## 2.3 对白红线\n\n本项目可以有金句，但不能每场都用金句。每集最多保留一句强金句。其他情绪尽量用动作、道具、法术和沉默表达。\n\n优先使用：\n\n- 剑穗结霜碎裂，表示玄晏动摇。\n- 棋子停转，表示赤离失控。\n- 潮露由浊转清，表示临渊真心。\n- 陶罐裂而不碎，表示阿檀害怕但仍撑住。\n- 祖灯火焰忽暗，表示雪娘守心动摇。\n\n避免：\n\n- “你不是不肯跪，你是不敢认错”这类每场点题式台词重复。\n- 男狐刚臣服就彻底变乖，失去旧病摩擦。\n- 反派只在终局解释计划。\n- 用大段旁白解释民俗典故。\n\n## 2.4 不可改动的核心设定\n\n1. 王雪娘不是狐祖附体。她是青丘祖脉返祖者，是被九尾真印认可的新任狐祖。\n2. 青禾之死必须存在，且玄晏“剑未出鞘、慢了三步”必须存在。\n3. 阿檀被雪娘怒雷误伤必须存在。\n4. 娑罗进入祖祠的通路是罪册冤怨，不是她随意破祖灯防御。\n5. 临渊是泽狐，不是鲛狐。不得写鱼尾、鲛绡、泣珠体系；统一使用芦汀、水镜、潮露、狐母训字。\n6. 陆蘅旧伤链条定稿：当年伤害陆蘅的低阶狐，正是第4集提到“被白狐贵族逼迫采阳”的受害者之一。此设定不可改成单个坏狐作恶；必须体现“狐族系统之罪伤了狐，也伤了人”。\n7. 四狐均可暧昧，但雪娘不落地选择任何单一CP。全员暧昧，主线不落地，保留第二季空间。\n\n---\n\n## 2.5 分集交付流程与首批重点\n\n分集阶段按以下顺序推进，不得各自散写：\n\n1. **首交第5-6集剧本**：青禾线是全剧承重墙，必须先定。第6集青禾之死必须落在7:00-9:00之间，建议7:20-8:40完成死亡与三重无力感，后半集留足雪娘认错、赤离失控与臣服、娑罗罪册通路加深。\n2. **第二批交第1-2集剧本**：重点是开篇雷劫钩子、玄晏飞升机缘断绝、雪娘主体性觉醒。\n3. **第三批按单元推进第3-4、第7-8、第9-12集**：每个单元交稿时必须同步提交“心动点 + 旧病被训点 + AI镜头风险自查”。\n4. **每集交稿附件**：冷开场秒级节拍表、15分钟结构节拍表、AI镜头风险自查表。第1集剧本还需附冷开场精确到秒的节拍设计。\n\n对白红线继续执行：每集最多一句强金句，其余情绪用潜台词、道具、视觉词典和角色行动完成。\n\n\n# 第三部分｜世界观与规则\n\n## 3.1 青丘狐族\n\n青丘狐族曾是护山河、镇瘟鬼、安百姓的狐仙一脉。古时人间村落供狐仙像，祈求护粮、护火、护孩童夜哭。后来狐族逐渐沉迷美貌、权力、采补与幻术，开始把凡人当修行资源，把低阶狐当牺牲品，香火断绝，祖火渐弱。\n\n青丘狐族内部分为多脉：\n\n- **白狐一脉**：掌权百年，自称涂山正统，管理祠祭、刑堂、族规。外表清贵，内里残酷。\n- **赤狐一脉**：擅狐火、北斗拜斗、惑心和局术。重智谋，轻信任。\n- **泽狐一脉**：世居水泽芦汀，不入正宗族谱，擅水镜照欲与潮露净水。被轻视，也被外族觊觎。\n- **藏狐一脉**：贴近乡野与高原，法术不强，守粮、守灶、守火。看似憨拙，实则保留狐族最初的护民本心。\n- **守灯一脉**：王雪娘所属。表面卑微，实为青丘狐祖留下的祖脉保险。\n\n## 3.2 玄晏飞升线定稿\n\n第1集的替劫阵原本是为保王玄晏飞升。第2集雪娘觉醒后，九尾真印吸尽雷劫并摧毁替劫阵，王玄晏的飞升机缘就此断绝。本季玄晏没有飞升，也不再继续走原本的白狐飞升线。\n\n这条断绝必须成为第3-4集白狐旧部反扑的现实动机：他们不只是觉得“守灯女不配做狐祖”，更认为雪娘断了白狐少主大道、毁了白狐百年布局。玄晏对雪娘的情感也因此更复杂：她既是他原本该牺牲的对象，也是亲手断掉他旧命数的人。\n\n## 3.3 守灯一脉\n\n守灯一脉不掌权、不争位，只负责供灯、扫尘、护祖牌。白狐一脉故意将这一脉从族谱核心中边缘化，以防九尾真印再现。\n\n守灯一脉真正守护的是青丘祖火。狐祖残影曾言：\n\n> 祖火不熄，一半靠守心，一半靠人间还愿意点灯。\n\n这句话在第2集埋下，第9集村落狐仙像、第11集陆蘅木狐牌、第12集孩子敲傩鼓回收。\n\n## 3.4 九尾真印\n\n九尾真印是青丘狐祖留下的祖脉法印，封在守灯一脉血脉深处。它不认血统高低，只认本心。被欺凌而不以恶还恶、临死仍愿护灯的人，才可能被祖印认可。\n\n能力：\n\n- 压制狐族血脉。\n- 引动紫金水墨雷。\n- 显化九尾青丘山水长卷。\n- 唤醒祖忆片段。\n- 净化部分邪术与瘟气。\n\n代价：\n\n- 愤怒越盛，祖雷越强，也越易反噬。\n- 若雪娘失心，祖印不会保护她，反而会伤到她想护的人。\n- 第10集怒雷伤阿檀，是祖印反噬首次真实发生。\n\n## 3.5 祖训“清正守心”\n\n祖训三句：\n\n> 狐可魅人，不可害人。  \n> 狐可多情，不可失德。  \n> 狐有九尾，当护一方。\n\n这不是道德口号，而是剧中法术规则。凡违祖训者，祖印会产生压制；凡真心完成祖训功课者，可点燃守心火。\n\n## 3.6 四浊、四狐、四火\n\n| 浊气 | 对应角色 | 表现 | 守心火 |\n|---|---|---|---|\n| 傲 | 王玄晏 | 血统优越、旧秩序沉默者 | 白色冰火 / 护弱之剑 |\n| 贪 | 赤离 | 操控人心、算尽所有人 | 赤色狐火 / 弱者生路 |\n| 沉 | 临渊 | 沉溺欲望、以诱惑自保 | 蓝银潮火 / 渡人上岸 |\n| 怯 | 阿檀 | 心软逃避、怕担责任 | 土黄灶火 / 守粮守火 |\n\n四火归祖灯后，祖火不再是雪娘一个人燃烧，而成为狐族重新守心的证明。\n\n## 3.7 五瘟狐煞\n\n娑罗以狐族内部腐烂之处炼成五瘟狐煞。它不是凭空妖物，而是狐族罪业与人间怨气的结合。\n\n构成：\n\n1. 白狐之傲。\n2. 赤狐之贪。\n3. 泽狐之沉。\n4. 藏狐之怯。\n5. 人间因狐族旧恶产生的怨气。\n\n五瘟狐煞的目的不是杀几个村民，而是让瘟气带上狐族气息，使天下认定狐族为祸世妖邪。只要人间彻底恨狐，祖火香火根基断绝，娑罗就能夺取九尾真印。\n\n## 3.8 罪册通路\n\n祖祠能镇外邪，却镇不住狐族自己欠下的冤怨。王嵩被罚跪读罪册，罪册中记满白狐百年来被私刑、替劫、采补、献祭过的旁支狐名。每翻一页，冤怨便成为一条黑水缝隙。娑罗正是沿着这条缝进入祖祠。\n\n这使雪娘的惩罚产生反讽后果：她精准地罚王嵩面对罪业，却也因此让王嵩亲手翻开娑罗通路。雪娘的道德债体系从青禾之死延伸到祖灯被碎。\n\n## 3.9 狐母训字\n\n《狐母训字》是泽狐一脉残卷，由临渊母亲传给幼年临渊。残卷写在压干的芦叶上，字迹遇水显形。\n\n核心句：\n\n> 水能照形，亦能照心；狐能诱人，亦当渡人。\n\n临渊只记住了“照欲”和“诱人”，忘记了“洗浊”和“渡人”。第8集雪娘以此救他，第11集临渊以本命潮露洗净陆蘅旧魅术印，真正完成“渡人”。\n\n---\n\n# 第四部分｜核心人物小传\n\n\n## 4.0 头衔与姓氏口径定稿\n\n- **王雪娘**：青丘王府守灯一脉，同属“王”姓旁支。她与王玄晏同姓却一贵一贱，必须保留这个讽刺关系。\n- **王玄晏**：白狐少主。其父王玄寂已闭死关多年，现实族务由王嵩与玄晏掌控；父辈只在玄晏幼年冰室记忆中出现，不另开当季主线。\n- **赤离**：赤狐之主，但本人拒用“王”号。他不信名分，只信局势，因此标题统一为“赤离 / 赤狐之主”。\n- **临渊**：泽狐王。泽狐一脉不入青丘正宗族谱，临渊无姓，称“泽狐王”是外族与水泽诸狐对他的承认，而不是青丘正宗册封。\n- **阿檀**：藏狐，无正式头衔。他越无衔，越代表狐族贴近人间烟火的一支。\n\n## 4.1 王雪娘 / 青丘新任狐祖\n\n**人物定位：** 守灯弃女 / 青丘祖脉返祖者 / 新任狐祖 / 带错误与代价的女王型大女主  \n**人物关键词：** 温柔底色、雷霆手段、祖脉觉醒、清正守心、代价、女王归来\n\n王雪娘原本是青丘王府中最不起眼的守灯女。她出身王府同姓旁支，却被排斥在权力之外，只能在祖祠添油、扫尘、擦牌位。族人笑她是“灯下狐”，说她血脉稀薄、性子软弱，不配进入正堂。她不擅媚术，也不懂权谋，唯一坚持的是每日不让祖灯熄灭。\n\n白狐一脉为保王玄晏飞升，将雪娘推入替劫阵。天雷劈下时，她没有诅咒族人，只护住将灭祖灯。正因这一念守心，九尾真印被雷劫劈醒。狐祖残影没有夺她身体，只将祖名、祖火和祖训交给她。雪娘选择承祖名，但不替祖宗活。她成为新任狐祖，归来的不是旧神，而是王雪娘自己。\n\n觉醒后的雪娘拥有绝对压迫感。她可以引雷劈匾，可以让满堂狐族跪下，可以用祖印压制四大男狐。但她不是完美神明。第6集青禾之死让她明白，正确的选择也可能造成错误的后果；第10集怒雷伤阿檀让她明白，她也可能成为伤人的强者。\n\n雪娘的核心弧光是从“被牺牲的人”变成“重新定义牺牲的人”。她不再允许狐族以大局之名牺牲弱者，也不允许自己把痛苦变成新的暴力秩序。她要让狐族重新成为有资格受香火的狐仙一脉。\n\n**人物欲望：** 一开始只想活下去、不再被牺牲；觉醒后想整顿狐族；后期真正想让狐族与人间重新点灯。  \n**人物恐惧：** 自己承祖名后变成另一个牺牲别人的强者。  \n**人物错误：** 低估人心恐惧，导致青禾之死；怒雷失控伤阿檀。  \n**人物视觉锚点：** 祖灯、青金九尾、水墨紫金雷、赤金狐瞳、青绿山水纹。  \n**台词原则：** 少解释，多审判；少卖惨，多承担。\n\n## 4.2 王玄晏 / 白狐少主\n\n**人物定位：** 高冷白狐 / 旧秩序继承者 / 背叛式臣服的护弱之剑  \n**关键词：** 雪、霜、剑、贵族傲慢、沉默原罪、占有欲\n\n王玄晏是白狐一脉少主，出身高贵，与王雪娘同姓却天差地别。其父王玄寂早年闭死关，白狐实际族务长期由长老王嵩和玄晏共同支撑。他自幼被教导白狐天生尊贵，强者不可心软，弱者应为族中大局牺牲。雷劫夜，他明知雪娘被推去挡劫，却选择隔门沉默。这不是无知，而是旧秩序训练出的冷漠。\n\n雪娘觉醒后，玄晏第一个不服。替劫阵被祖印吸雷摧毁，他的飞升机缘随之断绝；白狐旧部认为雪娘毁了白狐少主大道，玄晏自己也必须面对“旧命数被她亲手斩断”的事实。他不相信一个守灯女能承狐祖名，也不愿白狐正统被推翻。白狐线的关键不是打败他，而是逼他选择。当白狐旧部以幼狐做人质时，雪娘把选择交给他：站回白狐旧秩序，或拔剑斩断旧链。玄晏选择拔剑，完成背叛式臣服。\n\n臣服后，他仍有旧病。他会摆少主架子，会想以剑止乱，会想把雪娘护进白狐秩序。第5-6集青禾之死成为他最大伤口。雪娘刚教他不可对恐惧中的凡人拔剑，他照做了，却因此慢了三步，青禾死在他剑鞘未开的三步之外。此后他每一次护人，都带着这三步的痛。\n\n**人物欲望：** 守住白狐尊严，后来转为守住雪娘与祖训。  \n**人物恐惧：** 承认自己过去守护的是腐烂秩序。  \n**人物弧光：** 旧贵族少主 → 雪阶对抗者 → 背叛白狐旧部 → 护弱之剑。  \n**与雪娘关系：** 敬畏中带占有欲。他想保护她，也想拥有她定义秩序的权力；雪娘每次都把他的“护我”改成“护弱”。  \n**视觉锚点：** 白衣、寒剑、雪阶、冰纹、剑穗结霜碎裂、剑未出鞘却染血。\n\n## 4.3 赤离 / 赤狐之主\n\n**人物定位：** 腹黑赤狐 / 北斗狐火棋手 / 被诚实击败的危险智囊  \n**关键词：** 狐火、棋子、髑髅面、北斗、局、失控\n\n赤离不姓王，是赤狐之主，却拒用“王”号。他不信名分，只信局势；这个拒称王号的选择，代表赤狐一脉的游离与危险。他不信血统，不信祖训，也不信真心。他相信世界只有设局者与棋子。谁不会算，谁就活该被利用。他夜戴髑髅狐面，以尾火拜北斗，能把人的恐惧、欲望和猜疑变成局。\n\n他设孩童失踪局，本意是羞辱雪娘，逼她在众人面前失去“清正守心”的神性。他没想真正杀死青禾，却低估了人心的凶残。青禾倒下时，赤离手中棋子第一次停住，没有落进棋盘。他发现自己也算不到恐惧会怎样吃人。\n\n雪娘没有用更高明的计谋打败他，而是公开承认自己错了，把青禾之死记在祖灯前。赤离被这种“不划算的诚实”击败。他从小只见过输者甩锅、赢者改写事实，从未见过掌权者主动认错。\n\n臣服后，赤离仍会留后手、藏棋子、算退路。雪娘对他的训法不是禁止他设局，而是要求每一局先算弱者生路。第11集他把狐火命门交给陆沉，是他第一次把生死交给别人。\n\n**人物欲望：** 掌控一切，不再被任何人当棋。  \n**人物恐惧：** 失控、信人、承认自己也会造成不可控伤害。  \n**人物弧光：** 玩弄人心者 → 青禾之死共谋者 → 被诚实击败 → 为众人谋生路的智囊。  \n**与雪娘关系：** 智性互撩。他不断试她底线，她不断逼他承认自己也有人心。  \n**视觉锚点：** 赤衣、折扇、棋子、狐火、髑髅面、北斗坛、棋子停转。\n\n## 4.4 临渊 / 泽狐王\n\n**人物定位：** 无姓泽狐 / 水镜照欲者 / 从诱人入水到渡人上岸  \n**关键词：** 芦汀、黑水、湿发、水镜、潮露、欲望、狐母训字\n\n临渊无姓，因为泽狐一脉不入青丘正宗族谱。他们生于芦汀、泥岸、寒雾和黑水之间，被白狐嫌湿浊，被外族当诱猎工具。临渊从小明白，美貌和欲望既是别人控制他的绳索，也是他反过来控制别人的武器。\n\n他擅水镜照欲。凡人或狐族看向他的水镜，就会看见自己最想得到、最害怕失去的东西。他用“月落寒汀”夜宴试探雪娘，想证明狐祖也会被欲望困住。雪娘在女王镜前真实停留，伸手触镜。临渊因此看见她不是无欲，而是挣扎后选择守心。\n\n第8集雪娘以《狐母训字》救他。临渊幼时母亲教他：“水能照形，亦能照心；狐能诱人，亦当渡人。”他过去只记得照欲和诱人，忘记洗浊与渡人。第11集，他剖出本命潮露，为陆蘅洗净旧魅术印，真正完成自己的功课。\n\n**人物欲望：** 被真正看见，而不是被欲望观看。  \n**人物恐惧：** 失去美貌、失去被需要的价值、暴露真实自我。  \n**人物弧光：** 欲望猎手 → 水镜阵眼 → 被雪娘看见伤口 → 以本命潮露渡人。  \n**与雪娘关系：** 最直白的欲张力。临渊敢诱她、敢问她、敢看她的欲望；雪娘不否认欲望，只拒绝被欲望支配。  \n**视觉锚点：** 湿发、黑水、芦帘、水镜碎片、潮露由浊转清、蓝银潮火。\n\n## 4.5 阿檀 / 藏狐\n\n**人物定位：** 憨萌藏狐 / 烟火气担当 / 雪娘真正的软肋  \n**关键词：** 粥、灶火、陶罐、粮袋、木狐玩具、暖\n\n阿檀是四大男狐中最不显眼的一个。他法力最弱，常背粮袋、抱陶罐、熬粥、修灶，被族人笑作灶下狐。他看似无用，却最早记得狐族本该护民。别人争血统、设棋局、照欲望，他在村里给孩子熬药、给老人修屋、给病人守火。\n\n第9集瘟疫初起，阿檀偷偷下山救人。村民误会他投毒，将他推倒在泥地里，他仍死死护住药罐，只怕药凉了救不了孩子。雪娘因此看见，所谓护一方不是高台雷法，而是热粥、药火、粮种和孩子夜里不哭。\n\n第10集祖灯被碎，雪娘怒雷失控，误伤扑来护灯的阿檀。阿檀疼得发抖，却还抱着碎灯罩说“祖君，粥快凉了”。这使他成为雪娘最大的情感痛点，也让第11集四狐反护雪娘成立。\n\n**人物欲望：** 大家都能吃上热粥、睡个安稳觉。  \n**人物恐惧：** 自己太弱，护不住任何人。  \n**人物弧光：** 被嘲笑的灶下狐 → 默默护民者 → 被怒雷误伤仍护灯 → 守粮仓点土火。  \n**与雪娘关系：** 无条件的暖。他不给雪娘压力，不求她回应，只提醒她先吃饭、灯要添油、粥别凉。  \n**视觉锚点：** 红泥火炉、米粥、陶罐裂纹、粮袋、灶灰、土黄守心火。\n\n## 4.6 娑罗 / 外族妖后\n\n**人物定位：** 五瘟狐煞操控者 / 雪娘黑暗镜像  \n**关键词：** 黑水、瘟气、黑鳞、傩面、怨恨、污染\n\n娑罗曾是被血脉体系抛弃的混血狐妖。她既恨狐族假高贵，也恨凡人假虔诚。她被外族炼成瘟魅后，决定毁掉青丘祖火的根基。她不直接杀雪娘，而要让凡人恨狐、狐族弃人、祖火断香。\n\n她从第3集起进入剧情：雪阶冰阵中的黑水气，第5集密信背面的黑水纹，第6集瘟气信纸与罪册低语，第8集黑鳞片，第10集真身现形。她利用的不是外来邪力，而是狐族自己欠下的冤怨。\n\n娑罗的核心观点是：狐族烂过，人心也脏过，何必还救。她不断诱导雪娘承认，痛苦唯一的出路就是让别人更痛。雪娘最终以行动反驳她：痛过，不代表只能让别人更痛；被牺牲过，不代表要把牺牲变成规矩。\n\n**视觉锚点：** 黑金羽衣、五傩冠、黑鳞、瘟尾、傩面眼孔渗黑、黑水反向流动。\n\n## 4.7 陆沉 / 捕妖司统领\n\n**人物定位：** 人间秩序代表 / 青禾之死和妹妹旧伤的质问者  \n**关键词：** 捕妖刀、狐铃、木狐牌、刀尖垂下\n\n陆沉厌狐有因。他的妹妹陆蘅曾被狐族旧魅术所害，神志不清；他又握着青禾之死，认为雪娘所谓护民护狐只是漂亮话。第10集他把青禾狐铃放在雪娘面前，质问她这条命算谁的。\n\n陆沉不代表愚昧凡人，而代表现实秩序。他不会因为雪娘是狐祖就跪拜，也不会因为她救一两个人就完全相信狐族。他的转变必须有实证：第10集看见玄晏纳难民，第11集看见临渊剖本命潮露救陆蘅，并亲眼见妹妹醒来取出木狐牌。那一刻，他的刀尖第一次垂下。\n\n**视觉锚点：** 玄色官服、捕妖刀、刀穗绷直、刀尖垂下、木狐牌挂上刀柄。\n\n## 4.8 陆蘅 / 陆沉妹妹\n\n**人物定位：** 人间香火的具象来源 / 临渊“渡人”功课的payoff\n\n陆蘅幼年曾供过狐仙木牌，后来被狐族旧魅术所害，神志不清。她的旧伤不是单个坏狐造成的简单恶，而是狐族系统性罪业外溢到人间的结果。当年害她的低阶狐，正是第4集提到“被白狐贵族逼迫采阳”的受害者之一：那个低阶狐也是受害者，却在白狐贵族逼迫下把伤害转嫁给凡人。系统之罪伤了狐，也伤了人。\n\n第11集临渊以本命潮露替她洗浊。她醒来后取出木狐牌，说明人间并非从未信过狐，而是信任曾被狐族自己毁坏过。木狐牌成为第五火。\n\n## 4.9 王嵩 / 白狐长老\n\n**人物定位：** 旧权力腐朽代表 / 替劫主谋 / 被罪册冤怨反噬的内鬼\n\n王嵩是替劫阵主谋。他以“大局”为名牺牲雪娘，以祖制为名维持白狐特权。第4集被废后，他被罚跪读罪册。这一惩罚本应让他面对白狐旧罪，却因罪册记满冤怨，成为娑罗进入祖祠的通路。\n\n王嵩不是突然背叛。他认为自己是白狐忠臣，是雪娘抢走了白狐命数。娑罗的低语只放大了他已有的怨恨。第10集他打碎祖灯，是旧权力最后一次反扑。\n\n## 4.10 青禾 / 低阶狐\n\n**人物定位：** 第6集不可逆代价 / 雪娘道德债的化身\n\n青禾是被白狐刑堂释放不久的低阶小狐，原本奉雪娘命令看守证物狐灯。他不是大人物，却是全剧最重要的命。赤离设局本不想杀他，雪娘选择先救孩子也不是错，玄晏不拔剑也是守心，但这些“正确”叠在一起，造成了他的死亡。\n\n青禾之死必须贯穿后续：第9集村妇质问雪娘，第10集陆沉以狐铃质问，第11集赤离交命门前被青禾牌位压回，第12集雪娘终局自认错误。青禾不是工具人，他是本剧“守心也有代价”的第一块血印。\n\n---\n\n# 第五部分｜人物关系与心动点策略\n\n## 5.1 总策略\n\n本剧执行“全员暧昧、主线不落地、浓度分层”的策略。四狐对雪娘都有不同形式的吸引、敬畏、依赖或欲望，但雪娘始终不进入单一爱情归属。她看见他们，也被他们打动，但她把个人情感转化为祖训责任。\n\n## 5.2 四狐浓度分层\n\n| 角色 | 张力类型 | 心动方式 | 雪娘回应 |\n|---|---|---|---|\n| 王玄晏 | 冷感压迫 / 敬畏占有 | 他在危险中本能挡在她前面，也想把她纳入秩序。 | 她接受他的剑，不接受他的占有。 |\n| 赤离 | 智性互撩 / 棋逢对手 | 他第一次在她面前承认“这局我认”。 | 她允许他靠近棋盘，不准他把人当棋。 |\n| 临渊 | 欲望照镜 / 直白诱惑 | 他看见她真实动心，也被她看见真实伤口。 | 她承认欲望存在，但不让欲望做主。 |\n| 阿檀 | 烟火暖意 / 无条件陪伴 | 他疼得发抖仍护灯，只问粥凉没凉。 | 她允许自己被他照顾片刻，但不逃离责任。 |\n\n## 5.3 每集心动点与旧病被训\n\n| 集数 | 心动点 | 旧病被训 / 切片点 |\n|---:|---|---|\n| 1 | 玄晏隔门一瞬想开锁却放弃。 | 无。 |\n| 2 | 玄晏被迫仰视九尾雪娘。 | 玄晏嘴硬，被罚拾碎匾。 |\n| 3 | 玄晏斩冰链救雪娘。 | 阿檀被借手下毒，雪娘训“心软也要有判断”。 |\n| 4 | 雪娘近身替玄晏逼寒毒。 | 玄晏仍摆白狐规矩，被罚开刑堂门。 |\n| 5 | 玄晏收剑护民，第一次守心。 | 玄晏端药吓到孩子，被罚学软话。 |\n| 6 | 赤离被雪娘认输的坦荡击中。 | 赤离留后手，被罚守青禾牌位。 |\n| 7 | 临渊看见雪娘触碰女王镜。 | 玄晏暗随被罚守芦帘，赤离留退路被拆。 |\n| 8 | 雪娘从黑水中拉回临渊。 | 临渊话语带勾，被雷点额心。 |\n| 9 | 雪娘替阿檀擦泥。 | 玄晏端粥太冷，被罚学哄孩子。 |\n| 10 | 阿檀被怒雷伤仍护灯；玄晏开结界纳难民。 | 赤离想牺牲兵卒，被迫自己选择救人。 |\n| 11 | 三狐反护雪娘，临渊剖潮露。 | 赤离交命门前还想留半子，被青禾牌位压回。 |\n| 12 | 四狐托住雪娘五雷。 | 终局后继续训孙：谁来背下一条祖训。 |\n\n---\n\n# 第六部分｜万字大纲\n\n## 6.1 第一幕：守灯弃女与雷劫归来（第1-2集）\n\n青丘王府冬夜大雪。王雪娘提着灯油走过空长廊，祖祠深处的青铜长明灯忽明忽暗。她是守灯一脉的末代女子，明明与白狐少主王玄晏同姓，却一个住正堂，一个守偏祠。族中人说她血脉薄、法力低，只配给祖宗擦灰。她不反驳，只记得母亲临终前说，守灯者守的不是香火，是狐族最后的良心。\n\n这一年，王玄晏即将迎飞升雷劫。长老王嵩暗中设下替劫阵，将雪娘骗入祖祠。替劫阵要用同族血脉转嫁天雷，雪娘身份低、血脉近、死后无人追究，成了最合适的祭品。祠门落锁时，雪娘隔门问玄晏为什么。玄晏没有开门，只说狐族总要有人牺牲。这个瞬间奠定他与雪娘的原罪关系。\n\n雷劫落下，雪娘被符阵钉在祠中。她濒死时不是咒骂，而是护住将灭祖灯。祖灯由黄转青，无字祖牌裂开，墙上九尾壁画睁眼。青丘狐祖残影出现，告诉她：守灯一脉并非卑贱，而是狐祖千年前留下的保险。狐族将来会被美貌、权力和欲望反噬，所以九尾真印被封入守灯血脉，等待一个临死仍守心的人。\n\n雪娘问，承祖名后自己是否还存在。残影回答，祖名不是夺舍，是责任。雪娘选择承印，却拒绝替任何人活。她说：若狐祖归来，便是我王雪娘自己归来。祖影化作九道青金流火入体，她的素衣碎成水墨瓷片，九尾如青绿山水长卷展开，祖祠灰墙重组为《千里江山图》般的幻境。满堂狐族被祖脉压跪，玄晏单膝触地仍强撑。\n\n雪娘出祠后，不急着复仇杀人，而是先劈碎“涂山正统”旧匾，烧出“清正守心”四字。她宣布重开祖训：狐可魅人，不可害人；狐可多情，不可失德；狐有九尾，当护一方。此时她尚不懂祖训的全部重量，只知道自己不再允许任何人以大局之名牺牲守灯人。\n\n第2集结尾，无字祖牌浮出血字：四浊未炼，五瘟将至。狐祖残影补种规则：祖火不熄，一半靠守心，一半靠人间还愿意点灯。雪娘尚不懂人间为何与狐族祖火相连，观众也暂时不懂。这个规则会在后半季成为狐族正名的核心。\n\n## 6.2 第二幕：白狐之傲与背叛式臣服（第3-4集）\n\n雪娘觉醒后，并没有立刻掌控狐族。王府的刑堂、账册、祠祭仍握在白狐手中。王玄晏表面守礼，实则不认她。他认为祖印醒了，不代表一个守灯女能做狐祖。白狐旧部提出雪阶问心：若雪娘要重开祖训，就必须入白狐冰阵，证明自己能面对怨恨与欲望。\n\n第3集先以阿檀的寒毒粥开场。阿檀被白狐管事借手下毒，自己不知。雪娘没有惩罚他，而是告诉他，心软也要有判断，否则善也会被人借来害人。这既是阿檀线的根，也预示全剧“正确也会造成伤害”的主题。\n\n雪阶问心开启。雪娘在冰阵中看见童年被嘲、母亲病死、雷劫献祭。阵法诱她以祖雷杀尽白狐。与此同时，玄晏也被拉回幼年冰室，看见自己曾因救低阶幼狐被父亲惩戒。白狐少主的冷不是天生，而是被旧秩序训练出来的自保。此时，阵法中出现一缕不属于狐族的黑水气。冰纹边缘腐败，阵力失控。雪娘注意到异样，却查不出来源。这是娑罗第一个伏笔。\n\n白狐长老启动寒骨封尾阵，想连雪娘与玄晏一起冻杀。玄晏必须做出选择：继续站在白狐旧部，还是救这个他不愿承认的祖君。他拔剑斩断第一条冰链，等于背叛旧秩序。第3集不让他立刻臣服，只让他第一次站偏一步。\n\n第4集进入刑堂。雪娘发现白狐所谓“罪狐”，多是被逼成罪。有人偷药救母，有人逃山门是因被送去讨好外族，有人魅惑凡人是被白狐贵族逼迫采阳。白狐先把弱者推入泥中，再用泥污审判他们。王嵩煽动旧部抓幼狐做人质，雪娘没有立即动雷，而把选择交给玄晏。玄晏终于拔剑斩断人质冰链，完成背叛式臣服。\n\n王嵩以涂山镜照雪娘，讥讽她只是祖印容器。雪娘明确身份：她不是狐祖容器，也不是转世。是她守了灯，是她受了劫，祖印认的是王雪娘。涂山镜碎裂，映出白狐百年旧罪。雪娘废王嵩长老玉印，罚他跪守祖祠读完罪册。\n\n然而这惩罚埋下新祸。祖祠可镇外邪，镇不住狐族自己欠下的冤怨。罪册记满百年旁支狐冤案，王嵩每翻一页，黑水怨气便渗出一分。娑罗的声音沿着罪册进入祖祠。这使雪娘的精准惩罚产生反讽后果，也让后面祖灯被碎有了因果。\n\n## 6.3 第三幕：赤狐之局与青禾之死（第5-6集）\n\n白狐臣服后，赤离登场。他不像玄晏迷信血统，也不敬畏祖脉。他相信世间只有设局者与棋子。赤狐之术是北斗狐火、尾火拜斗、惑心入梦。他设计孩童失踪案，想证明雪娘能压血脉，却压不住人心。\n\n赤离收到一封外族渠道来的朝廷密信，上写“青丘祖脉需童魂温养”。他以为这封信可为己所用，却不知道信纸背面藏着黑水纹。娑罗的手第二次出现。赤离引孩子入林，又将九尾吃人的幻象种进孩子梦中。雪娘下山救人，玄晏想用剑镇压恐惧村民，被她制止。她刚教玄晏，不可对恐惧中的凡人拔剑，不可再以杀止乱。\n\n雪娘找到孩子，也找到可证明伪祖火的守灯灰痕迹。她判断自己可以先救孩子，再自证。但赤离提前引来村民与捕妖司，并让低阶狐青禾出现在错误位置。青禾原本奉雪娘命令守证物狐灯，却因守灯灰被踩散，狐灯反成罪证。\n\n第6集是全剧承重墙。雪娘必须在救孩子与救青禾之间选择。孩子体内赤狐尾火若不立即拔除会死；青禾被围，若无人救也会死。玄晏离青禾最近，却因刚被雪娘定下“不可向凡人拔剑”，只能赤手夺人。他手按剑柄又松开，用剑鞘格挡火把，以手臂挡锁链，慢了三步。阿檀也扑去救青禾，却被推倒，陶罐碎在泥水里。雪娘继续救孩子。孩子活了，青禾死了。\n\n这场死亡不是单一反派造成，而是多重“正确”叠成的悲剧：雪娘先救孩子是对的，玄晏不拔剑是对的，阿檀护药罐是对的，赤离原本不想杀人。但恐惧比真相更快，人心比局更狠。\n\n赤离第一次失控。他原本只想羞辱雪娘，没想到青禾真死。棋子停在指间，没有落进棋盘。雪娘没有甩锅。她在祖祠前公开承认自己错估人心，错估自己能护住证据，将青禾之命记在祖灯前。她让青禾入正祠小牌位，这是低阶狐第一次被正祠记名。\n\n赤离被“不划算的诚实”击败。他从未见过掌权者主动背错，也从未见过设局者被自己的局反噬后还能被正面审判。他臣服雪娘，不是因为她算得更深，而是因为她承认自己输了。赤离交出密信，祖灯照出瘟气。娑罗第三个伏笔成立。王嵩在罪册前再次听见低语：她连低阶狐都护不住。\n\n青禾之死从此贯穿全季。第9集村妇以此质问雪娘；第10集陆沉以青禾狐铃审判她；第11集赤离交命门前被青禾牌位压回；第12集雪娘终局承认自己的错误。这一命是雪娘真正成为狐祖前必须背负的血债。\n\n## 6.4 第四幕：泽狐水镜与欲望破局（第7-8集）\n\n赤狐线后，雪娘已经知道智谋会误伤人心。但她还未真正面对自己的欲望。第7集泽狐临渊送来芦叶夜宴帖，“月落寒汀”。临渊无姓，泽狐一脉不入正宗族谱，世居黑水芦汀，被白狐嫌湿浊，被外族当诱猎工具。他学会用水镜照欲，先诱惑别人，免得被别人控制。\n\n泽宫夜宴不是海底水府，而是半浮于湿地之上的水榭。芦帘、狐耳面具、水灯、屏风、黑水倒影构成暗湿华丽的夜宴。临渊请雪娘低头看影子。水镜先照四狐：玄晏看见雪娘成为白狐王座祥瑞，赤离看见她成为棋盘最亮一子，阿檀看见她卸冠喝粥。接着，水镜照雪娘三面欲望：复仇的守灯女、愿被祖魂接管的无痛容器、被四狐与众生臣服的女王。\n\n雪娘不是免检通过。她在女王镜前真实停住，并伸手触镜。临渊看见她也想被渴望，也想拥有权力，也想让所有人再不敢轻贱她。可她最终收回手。她不是无欲，而是选择不让欲望做主。临渊第一次被动摇，因为他一直以为清正守心不过是压抑欲望，雪娘却证明守心是看见欲望后仍选择边界。\n\n夜宴后半，娑罗启动水镜夺印阵。她利用临渊与泽狐旧契，把众人欲望汇入黑水，照开九尾真印。临渊也被潮线锁住，潮露珠坠落为开印钥匙。他请求雪娘毁了自己停阵，雪娘却说她不是来杀一只困在水里的狐。\n\n第8集进入黑水幻境。狐母训字残卷浮现，临渊幼年时母亲曾教他：水能照形，亦能照心；狐能诱人，亦当渡人。临渊过去只记住诱人，忘记渡人。雪娘进入他的记忆，看见泽狐被狐族和外族共同利用。她不厌他想活，厌他把伤口当武器。\n\n娑罗诱雪娘交出祖印，成为只享受臣服的女王。雪娘承认自己动心，也承认自己想过让所有人跪。但她掐灭王座狐火，选择重新定义权力。金色瘦金体真言沉入黑水，水镜由浊转清。她接住临渊潮露，念出狐母训字后半句，临渊主动切断夺印阵。第8集不剖本命潮露，保留最大代价到第11集。\n\n泽宫碎镜后，赤离拾到黑鳞片，井中浮出五张傩面。五瘟线正式进入前台。\n\n## 6.5 第五幕：藏狐烟火与人间香火（第9集）\n\n第9集让故事从狐族内部转向人间。瘟疫初起，村民额头浮现狐火瘟斑，井水变黑，傩面流血。狐族主张封山自保，阿檀却早已偷偷下山。他用草帽遮狐耳，在村中背粮、熬粥、烧水、照顾病童。\n\n村民因青禾之死和狐族旧恶仍怕狐。有人认出阿檀来自青丘，推倒他，怀疑他投毒。阿檀死死护住药罐，只怕药凉救不了孩子。雪娘赶到，本想解释，却被村妇质问：你说护狐护人，青禾怎么死了？雪娘无言。青禾之死第一次在人间线回响。\n\n阿檀让雪娘明白，正名不能靠雷。狐族重新获得香火，不靠一场大法术，而靠热粥、药火、粮种、孩子不哭。玄晏被罚端粥，学说“慢些喝，烫”；赤离被禁止用局套村民，只能以真话换真话；临渊用普通潮露压瘟水。四狐被迫做琐碎小事，这正是祖训的落地。\n\n村中大傩驱疫，傩面被瘟气污染，小瘟煞扑向孩子。阿檀第一个挡上去，尾火不艳，只像灶火一样稳。雪娘以祖雷击退瘟煞，百姓第一次看见狐族挡在他们前面。孩子把木狐玩具塞给阿檀，说狐仙哥哥别死。人间愿意重新点灯的第一粒火种出现。\n\n结尾捕妖司军旗压山，陆沉登场。\n\n## 6.6 第六幕：陆沉审判与祖印反噬（第10集）\n\n陆沉不是无脑反派。他妹妹陆蘅被狐族旧魅术所害，神志不清；他又握着青禾狐铃，认为雪娘所谓清正守心只是漂亮话。第10集冷开场，陆沉把青禾狐铃放在雪娘面前，质问她这条命算谁的。雪娘不能辩解，只能承认记在祖灯前。\n\n谈判中，奸相术士引爆捕妖司营中的瘟斑，制造狐族害人的假象。赤离追内鬼时看见兵卒被瘟气反噬。他本可继续抓内鬼，牺牲几个凡兵换取更大胜局；但青禾之死和雪娘的眼神压住了他。他选择先救兵卒。这一场把“谈判破裂”和“赤离救兵卒”合并，避免第10集过载，也让赤离主动做出“不划算”选择。\n\n瘟气逼来，一批曾骂过狐族的难民逃到青丘山门。白狐旧部拒开结界。玄晏想到青禾死在剑鞘未开的三步之外，也想到刑堂幼狐，亲自打开冰门，率白狐剑阵只封兵器、不伤凡人。白色守心火在剑穗上亮起。\n\n与此同时，王嵩受娑罗诱惑，在祖祠打碎祖灯。祖灯碎，青禾小牌位落地，雪娘失控。她放出怒雷，阿檀扑来护灯，来不及躲，被雷纹击中手臂与狐尾。阿檀疼得发抖，却抱着碎灯罩说“祖君，粥快凉了”。雪娘第一次不敢看自己的手。祖印反噬真实发生。\n\n娑罗真身显于山巅，五瘟狐煞成形。她讥讽雪娘，连最暖的狐都护不住。第10集将青禾之死、陆沉质问、玄晏守心、阿檀受伤、娑罗现身全部收束到“守心也有代价”的主题上。\n\n## 6.7 第七幕：三拍归火与第五火（第11集）\n\n第11集不再塞四条功课，集中三拍。\n\n冷开场，阿檀带伤熬粥，雪娘站在祖灯碎片前不敢碰雷。玄晏说，祖君教我护弱，你也是弱者，也当护。这句话因阿檀受伤成立。\n\n第一拍：临渊剖本命潮露。瘟水扩散，普通潮露无效。临渊必须取出本命潮露，代价是失去大半水镜之力与他赖以自保的诱猎之美。他过去最怕失去被观看价值，但第8集已经学会“渡人”。他剖出潮露，不是为雪娘看他，而是为了让水变清。\n\n第二拍：陆蘅苏醒。临渊以本命潮露入水镜，照出陆蘅神志中的旧魅术印。当年害陆蘅的低阶狐，正是第4集提到“被白狐贵族逼迫采阳”的受害者之一；他被系统逼成加害者，将狐族内部的罪转嫁到了人间。系统之罪伤了狐，也伤了人。临渊不是诱她入水，而是渡她上岸。陆沉看见真相后，刀尖第一次垂下。这才是第11集中点反转。陆蘅醒来，取出童年供过的木狐牌。\n\n第三拍：赤离交命门。最终局需要人狐协作，陆沉不信赤狐。赤离将狐火命门交给陆沉，若他再操控人心，陆沉可破命门。他交命门前还想留半枚棋子，雪娘把青禾牌位推到他面前，他最终交出完整命门。\n\n木狐牌点亮人间第五火。祖灯不再由雪娘一人燃烧，而由白、赤、蓝银、土黄与人间香火共同托起。结尾，粮仓被瘟煞围住，阿檀拖着伤臂站起来。\n\n## 6.8 第八幕：傩鼓五雷与狐祖正名（第12集）\n\n终局从孩子敲傩鼓开始。第5集曾被九尾幻象吓得指认雪娘的孩子，此刻第一个拿起鼓槌。小手落在鼓面上，鼓声传过瘟云。这个闭环比万众跪拜更有力量：恐惧过狐的人，愿意再次为狐敲鼓。\n\n决战五线以AI友好方式呈现。玄晏以白狐剑阵护难民，镜头拍冰门、剑影、军旗破霜；赤离与陆沉联手反转内奸，镜头拍棋子、命门狐火、刀穗垂落；临渊用本命潮露净井水，黑水转清；阿檀守粮仓，以灶灰、艾草、陶罐火和孩子敲锅声点燃土黄守心火；雪娘在五雷坛引祖雷。\n\n娑罗与雪娘对峙。娑罗说狐族烂过，人心也脏过，凭什么还救。雪娘承认自己错过、怒过、伤过人，也承认想过让所有人跪。她说，痛过不代表只能让别人更痛，被牺牲过不代表要把牺牲变成规矩。\n\n五色火归祖灯，雪娘引五雷入地。九尾如青绿山水长卷铺开，金色瘦金体真言与傩鼓同震。傩面由黑转金，瘟云被水墨紫金雷劈开。娑罗在雷火中消散，雪娘没有胜利狂笑，只以祖火净化她最后一缕黑烟。\n\n天光破晓，村民扶正狐仙像，陆沉收刀，孩子把木狐玩具放到祖灯前。雪娘回到祖祠，四狐立于阶下。她翻开新族规，淡淡说：狐族免了大祸，不代表你们合格了。下一条祖训，谁来背？玄晏僵住，赤离想溜，临渊含笑，阿檀老实举手。狐祖归来，但训孙未完。\n\n---\n\n# 第七部分｜12集分集梗概\n\n## 第1集《雪夜孤灯》\n\n**核心功能：** 替劫献祭，建立雪娘被牺牲的处境与玄晏原罪。  \n**冷开场：** 雪娘雪夜护祖灯，祖灯将灭。  \n**中点反转：** 她发现自己被锁入替劫阵，玄晏隔门沉默。  \n**结尾钩：** 无字祖牌裂开，狐祖残影睁眼。\n\n王雪娘是青丘王府最卑微的守灯女。白狐一脉为保王玄晏飞升，设替劫阵骗她入祖祠。雷劫落下，雪娘被钉在阵中，却仍护住祖灯。玄晏隔门听见她的求问，手指碰到门锁却终未打开。第三道天雷劈开屋脊，祖灯转青，狐祖壁画睁眼。\n\n## 第2集《青丘有狐》\n\n**核心功能：** 祖脉觉醒，明确雪娘不是附体而是返祖。  \n**冷开场：** 狐祖残影从无字祖牌中显现。  \n**中点反转：** 雪娘拒绝做祖魂容器，选择以自己的意志承名。  \n**结尾钩：** “四浊未炼，五瘟将至”。\n\n狐祖残影告诉雪娘，守灯一脉是青丘狐祖留下的祖脉保险。雪娘承九尾真印，却明确自己不是容器。她九尾显形，祖印吸尽雷劫并摧毁替劫阵，玄晏飞升机缘就此断绝。她劈碎“涂山正统”旧匾，烧出“清正守心”。祖火规则补种：祖火不熄，一半靠守心，一半靠人间还愿意点灯。\n\n## 第3集《寒江雪阶》\n\n**核心功能：** 白狐问心，玄晏第一次偏离旧秩序，娑罗黑水气首次出现。  \n**冷开场：** 阿檀被白狐借手送寒毒粥。  \n**中点反转：** 雪阶冰阵混入黑水气，阵法失控。  \n**结尾钩：** 玄晏斩断冰链，白狐旧部震怒。\n\n白狐要求雪娘入雪阶问心。白狐旧部的反扑不只是面子受损，更是因为替劫阵被毁后，玄晏飞升机缘断绝，白狐百年布局成空。阵中，雪娘面对被献祭的怨恨，玄晏面对幼年冰室创伤。阵法深处出现黑水气，雪娘察觉异样但不知来源。寒骨封尾阵失控，玄晏第一次拔剑斩断冰链救她。\n\n## 第4集《霜刃问心》\n\n**核心功能：** 白狐背叛式臣服，王嵩被废，罪册通路开启。  \n**冷开场：** 刑堂幼狐哭声。  \n**中点反转：** 玄晏在白狐旧部与祖训之间选择拔剑。  \n**结尾钩：** 王嵩跪读罪册，娑罗沿冤怨低语。\n\n雪娘进入刑堂，发现白狐将弱者推入罪中再定罪。王嵩煽动旧部抓幼狐做人质，雪娘把选择交给玄晏。玄晏拔剑斩断冰链，完成背叛式臣服。王嵩被废后跪读罪册，罪册百年冤怨成为娑罗渗入祖祠的通路。\n\n## 第5集《北斗狐火》\n\n**核心功能：** 赤离设局，雪娘第一局误判，青禾危机形成。  \n**冷开场：** 狐火铃声引孩童入林。  \n**中点反转：** 朝廷密信显黑水纹，青禾被推到错误位置。  \n**结尾钩：** 青禾血落守灯灰，玄晏剑未出鞘却染血。\n\n**回勾说明：** 第5集结尾与第6集冷开场是同一场戏的“短剧重入”处理，不是时间跳跃。第5集停在血落守灯灰，第6集从青禾被围的更早一拍切入，补足死亡前后的两难。\n\n赤离以孩童失踪局试探雪娘。他收到带黑水纹的密信，却不知娑罗借此入局。雪娘救孩子时，青禾被误认为凶狐。玄晏因不许对凡人拔剑，只能赤手夺人，慢了三步。青禾之死将发生，所有人的“正确”都参与了悲剧。\n\n## 第6集《灯火阑珊》\n\n**核心功能：** 青禾之死、雪娘认错、赤离臣服。  \n**冷开场：** 青禾被围，雪娘必须先救孩子。此冷开场承接第5集结尾同一场戏，以回勾方式重入。  \n**中点反转：** 青禾被误杀，赤离也发现局超出自己控制。  \n**结尾钩：** 密信显瘟气，王嵩再被娑罗诱惑。\n\n孩子活下来了，青禾死了。雪娘公开承认自己错估人心，将青禾之命记在祖灯前。赤离本想羞辱她，却被她认输的坦荡击败。他臣服并交出密信，祖灯照出瘟气。王嵩在罪册前听见娑罗低语。\n\n## 第7集《月落寒汀》\n\n**核心功能：** 泽狐入局，水镜照欲，雪娘真实动心。  \n**冷开场：** 芦叶夜宴帖写着“月落寒汀”。  \n**中点反转：** 雪娘在女王镜前停留并触镜。  \n**结尾钩：** 水镜夺印阵合拢。\n\n泽狐临渊以寒汀夜宴邀请雪娘。水镜照出四狐欲望，也照出雪娘复仇、逃入神性、享受臣服的三重欲望。雪娘不是无欲，她真实触碰女王镜，却最终收回手。娑罗启动水镜夺印阵，临渊被潮线锁住，黑水合拢。\n\n## 第8集《云破月来》\n\n**核心功能：** 水镜破局，临渊臣服，五瘟前台化。  \n**冷开场：** 黑水幻境中狐母训字残卷浮现。  \n**中点反转：** 雪娘承认动心后选择守心。  \n**结尾钩：** 黑鳞片、井中傩面，五瘟将开。\n\n雪娘进入临渊记忆，看见泽狐被轻视与利用。她以狐母训字救他：水能照心，狐当渡人。娑罗诱雪娘做只享受臣服的女王，雪娘承认欲望却拒绝被欲望做主。临渊切断夺印阵，泽宫碎镜。黑鳞片与井中傩面预示五瘟。\n\n## 第9集《红泥新火》\n\n**核心功能：** 藏狐烟火线，人间香火规则落地。  \n**冷开场：** 村民戴傩面驱疫，井水仍黑。  \n**中点反转：** 阿檀被村民推倒仍护药罐。  \n**结尾钩：** 捕妖司军旗压山。\n\n瘟疫初起，阿檀偷偷下山熬粥救人。村民因狐族旧恶和青禾之死仍不信狐。雪娘被村妇质问，无言。阿檀让她明白，正名要靠热粥、药火、粮种和孩子不哭。傩面被瘟气污染，阿檀以灶火挡瘟煞。孩子送木狐玩具，捕妖司抵达。\n\n## 第10集《黑云压城》\n\n**核心功能：** 陆沉审判、玄晏纳难民、祖印反噬伤阿檀。  \n**冷开场：** 陆沉以青禾狐铃质问雪娘。  \n**中点反转：** 谈判破裂时，赤离在抓内鬼与救兵卒间选择救人。  \n**结尾钩：** 娑罗真身显现，五瘟狐煞成形。\n\n陆沉因妹妹旧伤与青禾之死不信狐。奸相术士引爆瘟斑，赤离选择先救兵卒而非抓内鬼。玄晏打开冰门纳难民，白色守心火亮起。王嵩打碎祖灯，雪娘失控怒雷误伤阿檀。娑罗现身，五瘟狐煞成形。\n\n## 第11集《东风星雨》\n\n**核心功能：** 临渊剖本命潮露、陆蘅苏醒、赤离交命门、第五火。  \n**冷开场：** 阿檀带伤熬粥，雪娘不敢碰雷。  \n**中点反转：** 陆沉看见陆蘅魅术印真相后刀尖第一次垂下。  \n**结尾钩：** 木狐牌点起人间第五火，粮仓被围。\n\n临渊剖本命潮露，失去大半水镜之力，为陆蘅洗净旧魅术印。水镜照出当年害陆蘅的低阶狐，正是被白狐贵族逼迫采阳的受害者之一。陆沉看见真相后刀尖第一次垂下，陆蘅醒来取出木狐牌。赤离将狐火命门交给陆沉，证明自己愿意信人。木狐牌成为人间第五火。结尾粮仓被瘟煞围住，阿檀拖伤臂站起。\n\n## 第12集《海日生残夜》\n\n**核心功能：** 傩鼓、狐火、五雷终局，狐族正名，训孙续季。  \n**冷开场：** 第5集被吓哭的孩子第一个敲傩鼓。  \n**中点反转：** 阿檀守粮仓点土黄守心火。  \n**结尾钩：** 狐祖归来，但训孙未完。\n\n五瘟狐煞压境。玄晏护难民，赤离与陆沉反间，临渊净井水，阿檀守粮仓，雪娘引五雷。娑罗质问狐族烂过、人心脏过，凭什么还救。雪娘承认自己错过、伤过，但拒绝让痛苦变成新牺牲。傩鼓与狐火同震，五雷破瘟。村民扶正狐仙像。终局后雪娘翻开族规：下一条祖训，谁来背？\n\n---\n\n# 第八部分｜视觉与AI虚拟拍摄圣经\n\n## 8.1 核心美学定位\n\n本剧视觉遵循“画中有戏，戏中有画”。整体不是常规仙侠的高饱和光效，而是介于写实与写意之间的宋画志怪风。\n\n三大支柱：\n\n1. **宋画意境**：留白、层次、气韵生动。祖祠、雪阶、山门、五雷坛都要有宋画式构图。\n2. **李子柒式生活美学**：粥、药、灶火、粮种、村落、手作道具，是人间香火的根。\n3. **志怪传奇氛围**：雷劫、狐火、水镜、傩面、瘟妖必须超现实，但不能脱离东方民俗质感。\n\n## 8.2 核心场景资产\n\n| 序号 | 场景 | 使用集数 | 复用方式 |\n|---:|---|---|---|\n| 1 | 祖祠 / 长廊 / 祖灯 | 1、2、4、6、10、11、12 | 雪夜、雷夜、罪册、碎灯、五火状态。 |\n| 2 | 雪阶庭 / 白狐刑堂 | 3、4及后续训孙小场 | 冰阵、刑堂门、罚跪祖祠。 |\n| 3 | 北斗坛 / 寒林 | 5、6 | 狐火、棋子、髑髅面、孩童失踪。 |\n| 4 | 泽宫 / 黑水幻境 | 7、8、11 | 第7暗湿夜宴，第8华丽碎镜，第11洗浊。 |\n| 5 | 村落外景 / 村口 / 灶房 / 粥棚 | 5、6、9、10、12 | 5-6集为夜景+火把+村口围困状态；9-12集为瘟疫、粥棚与烟火对照。 |\n| 6 | 山门 / 冰门结界 | 10、12 | 玄晏纳难民与终局防线。 |\n| 7 | 捕妖司营帐 | 10、11、12 | 陆沉质问、赤离交命门。 |\n| 8 | 五雷坛 / 傩台 | 11、12 | 终局五雷与傩鼓。 |\n| 9 | 粮仓 / 药棚 | 11尾、12 | 阿檀守火与土黄守心火。 |\n\n## 8.3 法术视觉规则\n\n### 雪娘雷法\n\n- Lv1 小惩：指尖细电，如工笔线条。\n- Lv2 中罚：手臂雷纹，如行书笔锋。\n- Lv3 大招：全身电网，如张旭狂草，背景转泼墨山水。\n- 失控状态：青金雷转紫黑，雷纹爬上腕骨，祖灯火焰忽暗。\n\n### 真言\n\n“清正守心”以金色瘦金体真言表现，不要做普通字幕。真言从天而降时，像金箔写在宣纸上，再沉入水、雪、雷或瘟云。\n\n### 水镜\n\n泽狐水镜不做普通镜子。水面是镜，潮露是钥匙，碎镜是情绪崩塌。第7集水镜完整、黑亮、诱惑；第8集水镜碎裂、悬浮、华丽；第11集水镜转清、用于渡人。\n\n### 瘟妖\n\n瘟妖视觉反差于清雅主调。用枯笔干擦、烂泥质感、黑鳞、傩面眼孔渗黑表现。避免做西式怪兽。\n\n## 8.4 角色情绪视觉词典\n\n| 角色 | 情绪外化符号 |\n|---|---|\n| 雪娘 | 失控：祖印青金转紫黑；守心：祖灯火稳；痛：不敢碰雷。 |\n| 王玄晏 | 动摇：剑穗结霜碎裂；守心之痛：剑未出鞘却染血；臣服：剑尖向地。 |\n| 赤离 | 动容：棋子停转；留后手：袖中第二枚棋露边；诚实：狐火由艳红转清赤。 |\n| 临渊 | 诱惑：水镜黑亮；真心：潮露由浊转清；代价：本命潮露离体后水镜裂纹固定。 |\n| 阿檀 | 害怕：陶罐细裂；担当：灶火不高却稳；受伤：狐尾火苗短促仍护灯罩。 |\n| 娑罗 | 出现：黑水反向流；得势：黑鳞浮水；污染：傩面眼孔渗黑。 |\n| 陆沉 | 不信：刀穗绷直；动摇：刀尖垂下；信任：木狐牌挂上刀柄。 |\n\n## 8.5 群戏拆解原则\n\n| 高风险场面 | 拆解方式 |\n|---|---|\n| 村民围攻青禾 | 火把影、狐铃落地、碎灯罩、剑鞘血点、陶罐碎片。 |\n| 傩舞驱疫 | 鼓面特写、傩面剪影、火把光带、脚步踏水、面具由黑转金。 |\n| 捕妖司攻山 | 军旗、箭雨剪影、冰门裂纹、兵器落地声、结界光效。 |\n| 夜宴宾客 | 狐耳面具、水中倒影、屏风剪影、水灯和手部特写。 |\n| 终局五线 | 每线1-2个视觉锚点快速交叉剪辑：剑穗、棋子、潮露、陶罐、傩鼓。 |\n\n---\n\n# 第九部分｜编剧执行检查表\n\n每集交稿前必须自查：\n\n- [ ] 冷开场是否在90秒内给出钩子？\n- [ ] 中点是否有反转，而不是平铺信息？\n- [ ] 结尾是否有下一集钩子？\n- [ ] 本集是否有至少一个训孙爽点？\n- [ ] 本集是否有至少一个心动点？\n- [ ] 已收服男狐是否保留旧病摩擦？\n- [ ] 雪娘是否付出某种代价或承担某种责任？\n- [ ] 娑罗 / 五瘟 / 人狐关系季弧是否推进？\n- [ ] 是否避免超过一句强金句？\n- [ ] 是否使用了情绪视觉词典，而非只写“他脸色一变”？\n- [ ] 群戏是否已拆成AI可拍的局部、剪影、光效、声音？\n- [ ] 是否与九个核心场景资产匹配，避免新增难拍大场景？\n\n---\n\n# 第十部分｜创作禁区\n\n1. 不写雪娘被狐祖夺舍。她始终是王雪娘。\n2. 不写四狐一臣服就彻底变乖。旧病必须持续复发。\n3. 不写青禾之死为偶然误会后快速遗忘。它是全剧承重墙。\n4. 不写阿檀受伤后立刻痊愈。第11集雪娘不敢碰雷要成立。\n5. 不写临渊为鲛狐，不使用鲛绡、泣珠、鱼尾体系。\n6. 不写陆沉被一句话说服。他必须被妹妹苏醒与木狐牌打动。\n7. 不写娑罗纯坏。她是雪娘的黑暗镜像，她的问题必须能刺痛雪娘。\n8. 不写大群戏正面肉搏。优先道具、剪影、光效与声音。\n9. 不写每场金句收尾。让观众自己完成推理。\n10. 不让任何爽点脱离“代价”。雪娘越强，越要承担强者责任。\n\n---\n\n# 第十一部分｜最终创作方向总结\n\n《狐祖归来》是一部以东方志怪为外壳、以女频爽感为情绪引擎、以“被牺牲的人重新定义牺牲”为主题内核的12集短剧。\n\n它的表层卖点是：狐祖归来，四大美男狐俯首称臣。  \n它的中层机制是：四狐四浊，训孙不断，民俗法术推动剧情。  \n它的深层主题是：强者如果不承担代价，就会复制牺牲；只有承认错误、守住弱者生路，狐族才有资格重获人间香火。\n\n所有编剧在分集创作时，都应记住一句话：\n\n> 雪娘不是因为无所不能才成为狐祖，而是因为她在每一次痛过、错过、伤过之后，仍选择不让痛苦变成新的规矩。\n", "excerpt": "> 内部创作资料｜供总编剧、分集编剧、导演组、美术组、AI视觉组统一口径使用  \n> 项目规格：12集 × 15分钟｜东方志怪女频爽剧｜祖脉觉醒版｜AI虚拟拍摄适配\n\n\n---\n\n## 目录\n\n1. 项目介绍\n2. 编剧任务说明\n3. 世界观与规则\n4. 核心人物小传\n5. 人物关系与心动点策略\n6. 万字大纲\n7. 12集分集梗概\n8. 视觉与AI虚拟拍摄圣经\n9. 编剧执行检查表\n10. 创作", "size": 22824, "safe_id": "狐祖归来_项目剧集圣经_V1_1_分发版"}, {"name": "白狐少主造型圣经_V1.0", "project": "狐祖", "content": "# 《狐祖归来》\n\n# S05 王玄晏·白狐少主真人影视定妆造型圣经 V1.0\n\n## 一、资产定位\n\n角色：王玄晏\n\n身份：青丘白狐少主。\n\n状态：第一阶段人形常态。\n\n核心定位：\n\n> 冰雪中的白狐贵族，以克制、锋利和距离感建立威严。\n\n王玄晏不是妖艳型狐族，也不是力量爆发型战士。\n\n他的魅力来自：血统高贵、自律克制、冷淡疏离、隐藏的危险性。\n\n------------------------------------------------------------------------\n\n# 二、人物视觉关键词\n\n-   白狐少主\n-   冰雪贵族\n-   禁欲美学\n-   清冷锋利\n-   优雅危险\n-   剑客气质\n-   青丘正统血脉\n\n视觉目标：第一眼高贵，第二眼危险，第三眼不易接近。\n\n------------------------------------------------------------------------\n\n# 三、与雪娘的视觉关系\n\n雪娘是狐祖（古老、威严、神性）。王 var root=document.getElementById("content-root");
var projectOrder=['失控游戏','狐祖','本草奇探','不思异','其他'];
var projEmoji={'失控游戏':'🎮','狐祖':'🦊','本草奇探':'🌿','不思异':'🔮','其他':'📄'};
projectOrder.forEach(function(proj){
    var items=BIBLES.filter(function(b){return b.project===proj});
    if(!items.length)return;
    var div=document.createElement("div");div.className="cat-divider";
    div.innerHTML='<div class="line"></div><span class="cat-label">'+(projEmoji[proj]||'')+' '+proj+'（'+items.length+' 篇）</span><div class="line"></div>';
    root.appendChild(div);
    var grid=document.createElement("div");grid.className="bible-grid";grid.setAttribute("data-project",proj);
    items.forEach(function(b){
        var card=document.createElement("div");card.className="bible-card";
        card.setAttribute("data-search",(b.name+b.excerpt).toLowerCase());
        card.id=b.safe_id||'';
        card.innerHTML='<div class="bible-name">'+b.name+'</div><div class="bible-excerpt">'+b.excerpt.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div><div class="bible-meta"><span class="bible-size">'+(b.size/1000).toFixed(1)+'k 字</span><button class="copy-btn" onclick="copyBible(this,\''+b.safe_id+'\')">📋 复制全文</button></div>';
        grid.appendChild(card);
    });
    root.appendChild(grid);
});
var navLinks=document.querySelectorAll(".sidebar-nav a");
function updateActive(){var sy=window.scrollY+140;var active=null;navLinks.forEach(function(a){var sec=document.getElementById(a.getAttribute("data-section"));if(sec&&sec.offsetTop<=sy)active=a});if(active){navLinks.forEach(function(a){a.classList.remove("active")});active.classList.add("active")}}
window.addEventListener("scroll",updateActive);updateActive();
function copyBible(btn, safeId){
    var bible=BIBLES.find(function(b){return b.safe_id===safeId});
    if(!bible)return;
    navigator.clipboard.writeText(bible.content).then(function(){
        btn.textContent='✅ 已复制';btn.classList.add('copied');
        var toast=document.getElementById('toast');toast.classList.add('show');
        setTimeout(function(){toast.classList.remove('show')},2000);
        setTimeout(function(){btn.textContent='📋 复制全文';btn.classList.remove('copied')},1500);
    }).catch(function(){
        var ta=document.createElement('textarea');ta.value=bible.content;
        ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);
        ta.select();document.execCommand('copy');document.body.removeChild(ta);
        btn.textContent='✅ 已复制';btn.classList.add('copied');
        setTimeout(function(){btn.textContent='📋 复制全文';btn.classList.remove('copied')},1500);
    });
}
function filterBibles(){
    var q=document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.bible-card').forEach(function(card){
        card.style.display=card.getAttribute('data-search').includes(q)?'':'none';
    });
    document.querySelectorAll('.bible-grid').forEach(function(grid){
        var v=Array.from(grid.querySelectorAll('.bible-card')).some(function(c){return c.style.display!=='none'});
        grid.style.display=v?'':'none';
        var d=grid.previousElementSibling;
        if(d&&d.className==='cat-divider')d.style.display=v?'':'none';
    });
}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("mobile-open")}
document.getElementById("sidebar").addEventListener("click",function(e){if(e.target.tagName==="A"&&window.innerWidth<=900){this.classList.remove("mobile-open")}});
</script>
